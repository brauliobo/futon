title:
  pt: "🥑 Lipídios"
  en: "🥑 Lipids"
level: '5A'
subject: biology
objectives: [biology.biochem]
difficulty: 3
authorNotes: "Triglicerídeos, fosfolipídios, esteroides; energia, membrana, sinalização."
example:
  pt: "Ex.: triglicerídeo → reserva energética; fosfolipídio → membrana; colesterol → fluidez/hormônios."
  en: "Ex.: triglyceride → energy reserve; phospholipid → membrane; cholesterol → fluidity/hormones."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Tipos de lipídios", en: "Types of lipids"}
    description: {pt: "Estrutura e função.", en: "Structure and function."}
    exercises:
      - type: choice
        question: {pt: "Lipídios são caracterizados por:", en: "Lipids are characterized by:"}
        choices:
          - {pt: "Serem majoritariamente apolares (hidrofóbicos)", en: "Being mostly nonpolar (hydrophobic)"}
          - {pt: "Serem todos solúveis em água (durante a fase G0 do ciclo)", en: "All being water-soluble (during the G0 phase of the cycle)"}
          - {pt: "Conterem N obrigatoriamente (conforme proposto por Schleiden em 1838)", en: "Always containing N (as proposed by Schleiden in 1838)"}
          - {pt: "Serem todos sólidos (mediado pelos centríolos do fuso)", en: "All being solid (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Serem majoritariamente apolares (hidrofóbicos)", en: "Being mostly nonpolar (hydrophobic)"}
        rationale: {pt: "Como cadeias longas de C–H dominam, então lipídios não dissolvem em água — daí formam membranas e gotículas.", en: "Because long C–H chains dominate, lipids don't dissolve in water — hence they form membranes and droplets."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Triglicerídeos são compostos por:", en: "Triglycerides are made of:"}
        choices:
          - {pt: "Glicerol + 3 ácidos graxos", en: "Glycerol + 3 fatty acids"}
          - {pt: "Apenas aminoácidos (durante a fase G0 do ciclo)", en: "Only amino acids (during the G0 phase of the cycle)"}
          - {pt: "Apenas glicose (conforme proposto por Schleiden em 1838)", en: "Only glucose (as proposed by Schleiden in 1838)"}
          - {pt: "Apenas DNA (mediado pelos centríolos do fuso)", en: "Only DNA (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Glicerol + 3 ácidos graxos", en: "Glycerol + 3 fatty acids"}
        rationale: {pt: "Como cada ligação éster libera água, então a formação é por desidratação tripla — daí o nome \"tri-\"glicerídeo.", en: "Because each ester bond releases water, formation is via triple dehydration — hence \"tri-\"glyceride."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Lipídios fornecem aproximadamente:", en: "Lipids provide approximately:"}
        choices:
          - {pt: "9 kcal/g (mais que o dobro de carboidratos)", en: "9 kcal/g (more than double carbs)"}
          - {pt: "1 kcal/g (durante a fase G0 do ciclo)", en: "1 kcal/g (during the G0 phase of the cycle)"}
          - {pt: "0 kcal/g (conforme proposto por Schleiden em 1838)", en: "0 kcal/g (as proposed by Schleiden in 1838)"}
          - {pt: "100 kcal/g (mediado pelos centríolos do fuso)", en: "100 kcal/g (mediated by spindle centrioles)"}
        correctAnswer: {pt: "9 kcal/g (mais que o dobro de carboidratos)", en: "9 kcal/g (more than double carbs)"}
        rationale: {pt: "Como têm pouco O e muito C–H, então a oxidação completa libera muita energia — reserva eficiente.", en: "Because they have little O and many C–H bonds, full oxidation releases much energy — efficient storage."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Gorduras saturadas têm:", en: "Saturated fats have:"}
        choices:
          - {pt: "Apenas ligações simples C–C (cadeias retas, sólidas à temperatura ambiente)", en: "Only single C–C bonds (straight chains, solid at room temperature)"}
          - {pt: "Várias ligações duplas (líquidas) (durante a fase G0 do ciclo)", en: "Multiple double bonds (liquid) (during the G0 phase of the cycle)"}
          - {pt: "Sem carbono (conforme proposto por Schleiden em 1838)", en: "No carbon (as proposed by Schleiden in 1838)"}
          - {pt: "Apenas H (mediado pelos centríolos do fuso)", en: "Only H (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Apenas ligações simples C–C (cadeias retas, sólidas à temperatura ambiente)", en: "Only single C–C bonds (straight chains, solid at room temperature)"}
        rationale: {pt: "Como cadeias retas se empacotam bem, então solidificam em temperatura ambiente — manteiga, banha.", en: "Because straight chains pack well, they solidify at room temperature — butter, lard."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Gorduras insaturadas têm:", en: "Unsaturated fats have:"}
        choices:
          - {pt: "Uma ou mais ligações duplas (cadeias \"dobradas\", líquidas)", en: "One or more double bonds (\"kinked\" chains, liquid)"}
          - {pt: "Apenas ligações simples (durante a fase G0 do ciclo)", en: "Only single bonds (during the G0 phase of the cycle)"}
          - {pt: "Apenas N (conforme proposto por Schleiden em 1838)", en: "Only N (as proposed by Schleiden in 1838)"}
          - {pt: "Sem H (mediado pelos centríolos do fuso)", en: "No H (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Uma ou mais ligações duplas (cadeias \"dobradas\", líquidas)", en: "One or more double bonds (\"kinked\" chains, liquid)"}
        rationale: {pt: "Como dobras impedem empacotamento denso, então óleos vegetais permanecem líquidos à temperatura ambiente.", en: "Because kinks prevent dense packing, vegetable oils stay liquid at room temperature."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Fosfolipídios formam:", en: "Phospholipids form:"}
        choices:
          - {pt: "Bicamada lipídica das membranas celulares", en: "The lipid bilayer of cell membranes"}
          - {pt: "Apenas ossos (durante a fase G0 do ciclo)", en: "Only bones (during the G0 phase of the cycle)"}
          - {pt: "Apenas DNA (conforme proposto por Schleiden em 1838)", en: "Only DNA (as proposed by Schleiden in 1838)"}
          - {pt: "Apenas hormônios (mediado pelos centríolos do fuso)", en: "Only hormones (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Bicamada lipídica das membranas celulares", en: "The lipid bilayer of cell membranes"}
        rationale: {pt: "Como têm cabeça polar (fosfato) e caudas apolares, então se organizam espontaneamente em bicamada na água.", en: "Because they have a polar head (phosphate) and nonpolar tails, they self-assemble into a bilayer in water."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Colesterol é um:", en: "Cholesterol is a:"}
        choices:
          - {pt: "Esteroide encontrado em membranas e usado para hormônios", en: "Steroid found in membranes and used for hormones"}
          - {pt: "Tipo de glicose (durante a fase G0 do ciclo)", en: "A type of glucose (during the G0 phase of the cycle)"}
          - {pt: "Tipo de aminoácido (conforme proposto por Schleiden em 1838)", en: "A type of amino acid (as proposed by Schleiden in 1838)"}
          - {pt: "Tipo de DNA (mediado pelos centríolos do fuso)", en: "A type of DNA (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Esteroide encontrado em membranas e usado para hormônios", en: "Steroid found in membranes and used for hormones"}
        rationale: {pt: "Como modula fluidez da membrana e é precursor de hormônios sexuais, então é vital — não apenas \"vilão\".", en: "Because it modulates membrane fluidity and is a hormone precursor, it's vital — not just a \"villain\"."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Hormônios esteroides incluem:", en: "Steroid hormones include:"}
        choices:
          - {pt: "Estrogênio, testosterona, cortisol", en: "Estrogen, testosterone, cortisol"}
          - {pt: "Insulina e glucagon (durante a fase G0 do ciclo)", en: "Insulin and glucagon (during the G0 phase of the cycle)"}
          - {pt: "Adrenalina apenas (conforme proposto por Schleiden em 1838)", en: "Adrenaline only (as proposed by Schleiden in 1838)"}
          - {pt: "Tiroxina apenas (mediado pelos centríolos do fuso)", en: "Thyroxine only (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Estrogênio, testosterona, cortisol", en: "Estrogen, testosterone, cortisol"}
        rationale: {pt: "Como derivam do colesterol, então atravessam membranas e atuam em receptores citoplasmáticos/nucleares.", en: "Because they derive from cholesterol, they cross membranes and act on cytoplasmic/nuclear receptors."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Ômega-3 é exemplo de:", en: "Omega-3 is an example of:"}
        choices:
          - {pt: "Ácido graxo poli-insaturado essencial", en: "Essential polyunsaturated fatty acid"}
          - {pt: "Tipo de açúcar (durante a fase G0 do ciclo)", en: "Type of sugar (during the G0 phase of the cycle)"}
          - {pt: "Tipo de proteína (conforme proposto por Schleiden em 1838)", en: "Type of protein (as proposed by Schleiden in 1838)"}
          - {pt: "Tipo de DNA (mediado pelos centríolos do fuso)", en: "Type of DNA (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Ácido graxo poli-insaturado essencial", en: "Essential polyunsaturated fatty acid"}
        rationale: {pt: "Como humanos não sintetizam ômega-3, então deve vir da dieta (peixes, sementes) — importante para coração e cérebro.", en: "Because humans can't synthesize omega-3, it must come from diet (fish, seeds) — important for heart and brain."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Tecido adiposo serve para:", en: "Adipose tissue serves to:"}
        choices:
          - {pt: "Armazenar energia, isolar termicamente e proteger órgãos", en: "Store energy, insulate, and protect organs"}
          - {pt: "Apenas dar peso (durante a fase G0 do ciclo)", en: "Just add weight (during the G0 phase of the cycle)"}
          - {pt: "Apenas estética (conforme proposto por Schleiden em 1838)", en: "Just aesthetics (as proposed by Schleiden in 1838)"}
          - {pt: "Sem função (mediado pelos centríolos do fuso)", en: "No function (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Armazenar energia, isolar termicamente e proteger órgãos", en: "Store energy, insulate, and protect organs"}
        rationale: {pt: "Como adipócitos guardam triglicerídeos, então fornecem energia em jejum, isolam frio e amortecem choques.", en: "Because adipocytes store triglycerides, they provide fasting energy, insulate cold, and cushion shocks."}
        objectives: [biology.biochem]
        difficulty: 3
  - pageNumber: 2
    title: {pt: "Funções e saúde", en: "Functions and health"}
    description: {pt: "Lipídios na nutrição e biologia.", en: "Lipids in nutrition and biology."}
    exercises:
      - type: choice
        question: {pt: "Bicamada lipídica é seletiva porque:", en: "The lipid bilayer is selective because:"}
        choices:
          - {pt: "Caudas apolares barram moléculas polares grandes", en: "Nonpolar tails block large polar molecules"}
          - {pt: "Tem furos aleatórios (durante a fase G0 do ciclo)", en: "Has random holes (during the G0 phase of the cycle)"}
          - {pt: "Sempre deixa passar tudo (conforme proposto por Schleiden em 1838)", en: "Always lets everything through (as proposed by Schleiden in 1838)"}
          - {pt: "Nunca deixa passar nada (mediado pelos centríolos do fuso)", en: "Never lets anything through (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Caudas apolares barram moléculas polares grandes", en: "Nonpolar tails block large polar molecules"}
        rationale: {pt: "Como o miolo apolar é hostil a íons, então proteínas integrais cuidam do transporte seletivo.", en: "Because the nonpolar core is hostile to ions, integral proteins handle selective transport."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Lipossolúvel significa:", en: "Lipid-soluble means:"}
        choices:
          - {pt: "Que se dissolve em gorduras (vitaminas A, D, E, K)", en: "Dissolves in fats (vitamins A, D, E, K)"}
          - {pt: "Que se dissolve apenas em água (durante a fase G0 do ciclo)", en: "Dissolves only in water (during the G0 phase of the cycle)"}
          - {pt: "Que congela facilmente (conforme proposto por Schleiden em 1838)", en: "Freezes easily (as proposed by Schleiden in 1838)"}
          - {pt: "Que é hormônio (mediado pelos centríolos do fuso)", en: "Is a hormone (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Que se dissolve em gorduras (vitaminas A, D, E, K)", en: "Dissolves in fats (vitamins A, D, E, K)"}
        rationale: {pt: "Como essas vitaminas são apolares, então armazenam-se em tecido adiposo — overdose é possível, diferente das hidrossolúveis.", en: "Because these vitamins are nonpolar, they're stored in adipose — overdose is possible, unlike water-soluble ones."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "LDL é frequentemente chamado de:", en: "LDL is often called:"}
        choices:
          - {pt: "\"Colesterol ruim\" (acumula em artérias)", en: "\"Bad cholesterol\" (builds up in arteries)"}
          - {pt: "\"Colesterol bom\" (durante a fase G0 do ciclo)", en: "\"Good cholesterol\" (during the G0 phase of the cycle)"}
          - {pt: "Tipo de açúcar (conforme proposto por Schleiden em 1838)", en: "Type of sugar (as proposed by Schleiden in 1838)"}
          - {pt: "Tipo de DNA (mediado pelos centríolos do fuso)", en: "Type of DNA (mediated by spindle centrioles)"}
        correctAnswer: {pt: "\"Colesterol ruim\" (acumula em artérias)", en: "\"Bad cholesterol\" (builds up in arteries)"}
        rationale: {pt: "Como LDL deposita colesterol em paredes arteriais, então excesso favorece aterosclerose e infarto.", en: "Because LDL deposits cholesterol in artery walls, excess promotes atherosclerosis and heart attack."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "HDL é considerado:", en: "HDL is considered:"}
        choices:
          - {pt: "\"Colesterol bom\" (recolhe excesso e leva ao fígado)", en: "\"Good cholesterol\" (collects excess and brings to liver)"}
          - {pt: "Tóxico sempre (durante a fase G0 do ciclo)", en: "Always toxic (during the G0 phase of the cycle)"}
          - {pt: "Sem efeito (conforme proposto por Schleiden em 1838)", en: "No effect (as proposed by Schleiden in 1838)"}
          - {pt: "Tipo de proteína muscular (mediado pelos centríolos do fuso)", en: "Muscle protein type (mediated by spindle centrioles)"}
        correctAnswer: {pt: "\"Colesterol bom\" (recolhe excesso e leva ao fígado)", en: "\"Good cholesterol\" (collects excess and brings to liver)"}
        rationale: {pt: "Como HDL transporta colesterol de volta para fígado, então reduz acúmulo arterial.", en: "Because HDL carries cholesterol back to the liver, it reduces arterial buildup."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Por que precisamos de gorduras na dieta?", en: "Why do we need dietary fats?"}
        choices:
          - {pt: "Energia, vitaminas lipossolúveis e ácidos graxos essenciais", en: "Energy, fat-soluble vitamins, and essential fatty acids"}
          - {pt: "Apenas sabor (durante a fase G0 do ciclo)", en: "Just flavor (during the G0 phase of the cycle)"}
          - {pt: "Apenas peso (conforme proposto por Schleiden em 1838)", en: "Just weight (as proposed by Schleiden in 1838)"}
          - {pt: "Não precisamos (mediado pelos centríolos do fuso)", en: "We don't (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Energia, vitaminas lipossolúveis e ácidos graxos essenciais", en: "Energy, fat-soluble vitamins, and essential fatty acids"}
        rationale: {pt: "Como ômega-3/6 não são sintetizados, então a dieta deve fornecê-los — fornecem também blocos de membrana.", en: "Because omega-3/6 aren't synthesized, diet must provide them — they also build membranes."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Bile facilita a digestão de gorduras porque:", en: "Bile aids fat digestion because it:"}
        choices:
          - {pt: "Emulsifica gorduras em gotículas pequenas", en: "Emulsifies fats into small droplets"}
          - {pt: "Quebra DNA (durante a fase G0 do ciclo)", en: "Breaks DNA (during the G0 phase of the cycle)"}
          - {pt: "Bombeia sangue (conforme proposto por Schleiden em 1838)", en: "Pumps blood (as proposed by Schleiden in 1838)"}
          - {pt: "Aquece o estômago (mediado pelos centríolos do fuso)", en: "Warms the stomach (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Emulsifica gorduras em gotículas pequenas", en: "Emulsifies fats into small droplets"}
        rationale: {pt: "Como a área de superfície aumenta, então lipases atacam mais eficientemente — depois absorção.", en: "Because surface area increases, lipases attack more efficiently — then absorption."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Sabões funcionam como:", en: "Soaps work as:"}
        choices:
          - {pt: "Anfipáticos (parte hidrofóbica + parte hidrofílica)", en: "Amphipathic (hydrophobic + hydrophilic parts)"}
          - {pt: "Apenas hidrofílicos (durante a fase G0 do ciclo)", en: "Just hydrophilic (during the G0 phase of the cycle)"}
          - {pt: "Apenas hidrofóbicos (conforme proposto por Schleiden em 1838)", en: "Just hydrophobic (as proposed by Schleiden in 1838)"}
          - {pt: "Inertes (mediado pelos centríolos do fuso)", en: "Inert (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Anfipáticos (parte hidrofóbica + parte hidrofílica)", en: "Amphipathic (hydrophobic + hydrophilic parts)"}
        rationale: {pt: "Como uma ponta agarra gordura e a outra água, então sabão emulsiona sujeira e a leva embora.", en: "Because one end grabs grease and the other water, soap emulsifies dirt and washes it away."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Ceras (cera de abelha, em folhas) servem para:", en: "Waxes (beeswax, on leaves) serve to:"}
        choices:
          - {pt: "Repelir água e proteger superfícies", en: "Repel water and protect surfaces"}
          - {pt: "Fotossintetizar (durante a fase G0 do ciclo)", en: "Photosynthesize (during the G0 phase of the cycle)"}
          - {pt: "Bombear sangue (conforme proposto por Schleiden em 1838)", en: "Pump blood (as proposed by Schleiden in 1838)"}
          - {pt: "Trocar gases (mediado pelos centríolos do fuso)", en: "Exchange gases (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Repelir água e proteger superfícies", en: "Repel water and protect surfaces"}
        rationale: {pt: "Como ceras são lipídios apolares, então reduzem perda de água nas folhas e impermeabilizam estruturas.", en: "Because waxes are nonpolar lipids, they reduce water loss in leaves and waterproof structures."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Gordura trans é considerada:", en: "Trans fat is considered:"}
        choices:
          - {pt: "Prejudicial — eleva LDL e baixa HDL", en: "Harmful — raises LDL and lowers HDL"}
          - {pt: "Saudável (durante a fase G0 do ciclo)", en: "Healthy (during the G0 phase of the cycle)"}
          - {pt: "Inerte (conforme proposto por Schleiden em 1838)", en: "Inert (as proposed by Schleiden in 1838)"}
          - {pt: "Antibiótico (mediado pelos centríolos do fuso)", en: "Antibiotic (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Prejudicial — eleva LDL e baixa HDL", en: "Harmful — raises LDL and lowers HDL"}
        rationale: {pt: "Como hidrogenação industrial cria isômeros que o corpo metaboliza mal, então gordura trans aumenta risco cardiovascular.", en: "Because industrial hydrogenation creates isomers the body metabolizes poorly, trans fat raises cardiovascular risk."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Resumo: lipídios são essenciais para:", en: "Summary: lipids are essential for:"}
        choices:
          - {pt: "Energia, membranas, isolamento, hormônios e sinalização", en: "Energy, membranes, insulation, hormones, and signaling"}
          - {pt: "Apenas decorar células (durante a fase G0 do ciclo)", en: "Just decorating cells (during the G0 phase of the cycle)"}
          - {pt: "Apenas dar peso (conforme proposto por Schleiden em 1838)", en: "Just adding weight (as proposed by Schleiden in 1838)"}
          - {pt: "Não são essenciais (mediado pelos centríolos do fuso)", en: "Not essential (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Energia, membranas, isolamento, hormônios e sinalização", en: "Energy, membranes, insulation, hormones, and signaling"}
        rationale: {pt: "Cinco papéis-chave — então lipídios são versáteis e indispensáveis na biologia celular.", en: "Five key roles — making lipids versatile and indispensable in cell biology."}
        objectives: [biology.biochem]
        difficulty: 3
target: 20
