title:
  pt: "🧶 Proteínas"
  en: "🧶 Proteins"
level: '5A'
subject: biology
objectives: [biology.biochem]
difficulty: 3
authorNotes: "Aminoácidos, ligação peptídica, níveis estruturais, função."
example:
  pt: "Ex.: aminoácido (monômero) → peptídeo → proteína; estrutura primária → secundária → terciária → quaternária."
  en: "Ex.: amino acid (monomer) → peptide → protein; primary → secondary → tertiary → quaternary structure."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Estrutura proteica", en: "Protein structure"}
    description: {pt: "Como aminoácidos formam proteínas.", en: "How amino acids form proteins."}
    exercises:
      - type: choice
        question: {pt: "Monômero das proteínas:", en: "Protein monomer:"}
        choices:
          - {pt: "Aminoácido", en: "Amino acid"}
          - {pt: "Glicose", en: "Glucose"}
          - {pt: "Nucleotídeo", en: "Nucleotide"}
          - {pt: "Ácido graxo", en: "Fatty acid"}
        correctAnswer: {pt: "Aminoácido", en: "Amino acid"}
        rationale: {pt: "Como cada aminoácido tem grupo amino e carboxila, então ligam-se via ligação peptídica para formar cadeias.", en: "Because each amino acid has an amino and a carboxyl group, they link via peptide bonds to form chains."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Quantos aminoácidos diferentes existem em proteínas humanas?", en: "How many different amino acids exist in human proteins?"}
        choices:
          - {pt: "20 padrão", en: "20 standard"}
          - {pt: "4", en: "4"}
          - {pt: "100", en: "100"}
          - {pt: "1000", en: "1000"}
        correctAnswer: {pt: "20 padrão", en: "20 standard"}
        rationale: {pt: "Como cada aminoácido tem cadeia lateral única, então 20 combinam-se em milhões de proteínas distintas.", en: "Because each amino acid has a unique side chain, 20 combine into millions of distinct proteins."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Aminoácidos essenciais são:", en: "Essential amino acids are:"}
        choices:
          - {pt: "Os que não sintetizamos — devem vir da dieta", en: "Those we don't synthesize — must come from diet"}
          - {pt: "Apenas os que servem para hormônios", en: "Only those that build hormones"}
          - {pt: "Não existem", en: "Don't exist"}
          - {pt: "Apenas os pequenos", en: "Only small ones"}
        correctAnswer: {pt: "Os que não sintetizamos — devem vir da dieta", en: "Those we don't synthesize — must come from diet"}
        rationale: {pt: "Como humanos não fazem 9 dos 20, então proteínas alimentares fornecem-os — proteína completa contém todos.", en: "Because humans don't make 9 of 20, dietary protein provides them — complete protein has all of them."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Ligação peptídica é formada por:", en: "Peptide bonds form via:"}
        choices:
          - {pt: "Reação de condensação (libera água)", en: "Condensation reaction (releases water)"}
          - {pt: "Reação iônica", en: "Ionic reaction"}
          - {pt: "Adição de água", en: "Adding water"}
          - {pt: "Ligação metálica", en: "Metallic bonding"}
        correctAnswer: {pt: "Reação de condensação (libera água)", en: "Condensation reaction (releases water)"}
        rationale: {pt: "Como o grupo amino de um se liga ao carboxilo do outro, então liberam H₂O — daí o crescimento da cadeia.", en: "Because the amino group of one joins the carboxyl of another, they release H₂O — driving chain growth."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Estrutura primária da proteína é:", en: "Protein primary structure is:"}
        choices:
          - {pt: "Sequência linear de aminoácidos", en: "Linear sequence of amino acids"}
          - {pt: "Forma globular", en: "Globular shape"}
          - {pt: "Múltiplas subunidades", en: "Multiple subunits"}
          - {pt: "Cor da proteína", en: "Protein color"}
        correctAnswer: {pt: "Sequência linear de aminoácidos", en: "Linear sequence of amino acids"}
        rationale: {pt: "Como o DNA codifica a ordem dos aminoácidos, então a primária é determinada geneticamente.", en: "Because DNA encodes amino acid order, the primary structure is genetically determined."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Estrutura secundária inclui:", en: "Secondary structure includes:"}
        choices:
          - {pt: "α-hélice e folhas β", en: "α-helix and β-sheets"}
          - {pt: "Apenas hélice tripla", en: "Only triple helix"}
          - {pt: "Apenas linhas retas", en: "Only straight lines"}
          - {pt: "Apenas círculos", en: "Only circles"}
        correctAnswer: {pt: "α-hélice e folhas β", en: "α-helix and β-sheets"}
        rationale: {pt: "Como pontes de H entre grupos do esqueleto formam padrões, então surgem hélices e folhas locais.", en: "Because backbone H-bonds form patterns, helices and local sheets emerge."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Estrutura terciária é:", en: "Tertiary structure is:"}
        choices:
          - {pt: "Dobramento 3D total da cadeia (interações entre cadeias laterais)", en: "Full 3D folding (interactions among side chains)"}
          - {pt: "Apenas hélice", en: "Just helix"}
          - {pt: "Apenas folha", en: "Just sheet"}
          - {pt: "Apenas linha", en: "Just line"}
        correctAnswer: {pt: "Dobramento 3D total da cadeia (interações entre cadeias laterais)", en: "Full 3D folding (interactions among side chains)"}
        rationale: {pt: "Como interações hidrofóbicas, iônicas e dissulfeto estabilizam o dobramento, então surge a forma funcional única.", en: "Because hydrophobic, ionic, and disulfide interactions stabilize folding, the unique functional shape emerges."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Estrutura quaternária ocorre quando:", en: "Quaternary structure occurs when:"}
        choices:
          - {pt: "Várias cadeias polipeptídicas se associam (ex.: hemoglobina)", en: "Multiple polypeptide chains associate (e.g., hemoglobin)"}
          - {pt: "Há apenas uma cadeia", en: "There's just one chain"}
          - {pt: "Há apenas um aminoácido", en: "There's just one amino acid"}
          - {pt: "Não existe", en: "Doesn't exist"}
        correctAnswer: {pt: "Várias cadeias polipeptídicas se associam (ex.: hemoglobina)", en: "Multiple polypeptide chains associate (e.g., hemoglobin)"}
        rationale: {pt: "Como hemoglobina tem 4 subunidades cooperativas, então sua função (transporte de O₂) é otimizada.", en: "Because hemoglobin has 4 cooperative subunits, its function (O₂ transport) is optimized."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Desnaturação é:", en: "Denaturation is:"}
        choices:
          - {pt: "Perda da estrutura 3D pela ação de calor, pH ou solventes", en: "Loss of 3D structure by heat, pH, or solvents"}
          - {pt: "Síntese da proteína", en: "Protein synthesis"}
          - {pt: "Tipo de reação enzimática", en: "Type of enzyme reaction"}
          - {pt: "Crescimento celular", en: "Cell growth"}
        correctAnswer: {pt: "Perda da estrutura 3D pela ação de calor, pH ou solventes", en: "Loss of 3D structure by heat, pH, or solvents"}
        rationale: {pt: "Como interações que estabilizam o dobramento são rompidas, então a proteína perde função — daí ovo cozido endurecer.", en: "Because folding-stabilizing interactions break, the protein loses function — hence boiled egg hardens."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "A função de uma proteína é determinada por:", en: "Protein function is determined by:"}
        choices:
          - {pt: "Sua forma 3D (estrutura)", en: "Its 3D shape (structure)"}
          - {pt: "Sua cor", en: "Its color"}
          - {pt: "Seu peso apenas", en: "Just its weight"}
          - {pt: "Seu cheiro", en: "Its smell"}
        correctAnswer: {pt: "Sua forma 3D (estrutura)", en: "Its 3D shape (structure)"}
        rationale: {pt: "Como o sítio de ligação encaixa apenas em moléculas específicas, então estrutura ditata função — princípio chave em biologia.", en: "Because the binding site fits only specific molecules, structure dictates function — a key biology principle."}
        objectives: [biology.biochem]
        difficulty: 3
  - pageNumber: 2
    title: {pt: "Funções das proteínas", en: "Protein functions"}
    description: {pt: "O que proteínas fazem na célula.", en: "What proteins do in cells."}
    exercises:
      - type: choice
        question: {pt: "Enzimas são proteínas que:", en: "Enzymes are proteins that:"}
        choices:
          - {pt: "Catalisam reações químicas (aceleram-as)", en: "Catalyze chemical reactions (speed them up)"}
          - {pt: "Apenas decoram a célula", en: "Just decorate the cell"}
          - {pt: "Bombeiam sangue", en: "Pump blood"}
          - {pt: "Filtram urina", en: "Filter urine"}
        correctAnswer: {pt: "Catalisam reações químicas (aceleram-as)", en: "Catalyze chemical reactions (speed them up)"}
        rationale: {pt: "Como reduzem a energia de ativação, então enzimas viabilizam reações que seriam impossíveis na temperatura corporal.", en: "Because they lower activation energy, enzymes enable reactions impossible at body temperature."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Hemoglobina é uma proteína de:", en: "Hemoglobin is a protein for:"}
        choices:
          - {pt: "Transporte de oxigênio", en: "Oxygen transport"}
          - {pt: "Movimento muscular", en: "Muscle movement"}
          - {pt: "Digestão de açúcares", en: "Sugar digestion"}
          - {pt: "Reprodução", en: "Reproduction"}
        correctAnswer: {pt: "Transporte de oxigênio", en: "Oxygen transport"}
        rationale: {pt: "Como cada subunidade tem grupo heme com Fe, então hemoglobina liga reversivelmente até 4 O₂ por molécula.", en: "Because each subunit has a heme group with Fe, hemoglobin reversibly binds up to 4 O₂ per molecule."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Anticorpos são proteínas que:", en: "Antibodies are proteins that:"}
        choices:
          - {pt: "Reconhecem antígenos para defesa imune", en: "Recognize antigens for immune defense"}
          - {pt: "Bombeiam sangue", en: "Pump blood"}
          - {pt: "Trocam gases", en: "Exchange gases"}
          - {pt: "Digerem comida", en: "Digest food"}
        correctAnswer: {pt: "Reconhecem antígenos para defesa imune", en: "Recognize antigens for immune defense"}
        rationale: {pt: "Como têm sítio variável específico, então cada anticorpo se liga a um antígeno único.", en: "Because they have a specific variable site, each antibody binds a unique antigen."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Actina e miosina são proteínas:", en: "Actin and myosin are proteins for:"}
        choices:
          - {pt: "Contráteis (movimento muscular)", en: "Contractile (muscle movement)"}
          - {pt: "Transporte de O₂", en: "O₂ transport"}
          - {pt: "Defesa imune", en: "Immune defense"}
          - {pt: "Digestão", en: "Digestion"}
        correctAnswer: {pt: "Contráteis (movimento muscular)", en: "Contractile (muscle movement)"}
        rationale: {pt: "Como deslizam uma sobre a outra com gasto de ATP, então músculos encurtam — base do movimento animal.", en: "Because they slide past each other using ATP, muscles shorten — basis of animal movement."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Colágeno é uma proteína:", en: "Collagen is a protein for:"}
        choices:
          - {pt: "Estrutural (pele, ossos, tendões)", en: "Structural (skin, bones, tendons)"}
          - {pt: "Catalítica", en: "Catalytic"}
          - {pt: "De transporte de O₂", en: "O₂ transport"}
          - {pt: "Hormonal", en: "Hormonal"}
        correctAnswer: {pt: "Estrutural (pele, ossos, tendões)", en: "Structural (skin, bones, tendons)"}
        rationale: {pt: "Como tripla hélice de colágeno é fortíssima, então é a proteína mais abundante do corpo humano.", en: "Because the collagen triple helix is very strong, it's the most abundant protein in the human body."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Insulina é exemplo de proteína:", en: "Insulin is an example of a protein for:"}
        choices:
          - {pt: "Hormonal (regula glicose)", en: "Hormonal (regulates glucose)"}
          - {pt: "Estrutural", en: "Structural"}
          - {pt: "Contrátil", en: "Contractile"}
          - {pt: "De transporte de O₂", en: "O₂ transport"}
        correctAnswer: {pt: "Hormonal (regula glicose)", en: "Hormonal (regulates glucose)"}
        rationale: {pt: "Como insulina é um peptídeo de duas cadeias, então circula no sangue e ativa receptores celulares.", en: "Because insulin is a two-chain peptide, it circulates in blood and activates cellular receptors."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Receptores de membrana são proteínas que:", en: "Membrane receptors are proteins that:"}
        choices:
          - {pt: "Detectam sinais externos e iniciam respostas internas", en: "Detect outside signals and trigger inside responses"}
          - {pt: "Apenas decoram a membrana", en: "Just decorate the membrane"}
          - {pt: "Apenas dão cor", en: "Just give color"}
          - {pt: "Não funcionam", en: "Don't work"}
        correctAnswer: {pt: "Detectam sinais externos e iniciam respostas internas", en: "Detect outside signals and trigger inside responses"}
        rationale: {pt: "Como ligam ligante específico, então convertem o sinal extracelular em cascata intracelular — sinalização celular.", en: "Because they bind specific ligands, they convert extracellular signal into intracellular cascade — cell signaling."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Proteínas são sintetizadas em:", en: "Proteins are synthesized in:"}
        choices:
          - {pt: "Ribossomos (livres ou no RER)", en: "Ribosomes (free or on RER)"}
          - {pt: "Núcleo apenas", en: "Nucleus only"}
          - {pt: "Mitocôndria apenas", en: "Mitochondria only"}
          - {pt: "Lisossomo", en: "Lysosome"}
        correctAnswer: {pt: "Ribossomos (livres ou no RER)", en: "Ribosomes (free or on RER)"}
        rationale: {pt: "Como ribossomos leem o mRNA e ligam aminoácidos, então a tradução produz a cadeia polipeptídica.", en: "Because ribosomes read mRNA and link amino acids, translation produces the polypeptide chain."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Erros no dobramento das proteínas podem causar:", en: "Misfolding of proteins can cause:"}
        choices:
          - {pt: "Doenças (Alzheimer, Parkinson, príon)", en: "Diseases (Alzheimer's, Parkinson's, prion)"}
          - {pt: "Crescimento ósseo", en: "Bone growth"}
          - {pt: "Aumento de cabelo", en: "Hair growth"}
          - {pt: "Sem efeito", en: "No effect"}
        correctAnswer: {pt: "Doenças (Alzheimer, Parkinson, príon)", en: "Diseases (Alzheimer's, Parkinson's, prion)"}
        rationale: {pt: "Como agregados mal dobrados se acumulam, então prejudicam células — daí doenças neurodegenerativas.", en: "Because misfolded aggregates accumulate, they damage cells — hence neurodegenerative diseases."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Resumo: proteínas são versáteis porque:", en: "Summary: proteins are versatile because:"}
        choices:
          - {pt: "20 aminoácidos combinam-se em formas diversas que executam quase todas as funções celulares", en: "20 amino acids combine into diverse shapes performing nearly all cellular functions"}
          - {pt: "Apenas catalisam reações", en: "Only catalyze reactions"}
          - {pt: "Apenas dão estrutura", en: "Only give structure"}
          - {pt: "Apenas transportam O₂", en: "Only transport O₂"}
        correctAnswer: {pt: "20 aminoácidos combinam-se em formas diversas que executam quase todas as funções celulares", en: "20 amino acids combine into diverse shapes performing nearly all cellular functions"}
        rationale: {pt: "Como sequência → estrutura → função, então proteínas atuam como enzimas, transportadoras, hormônios, anticorpos e estrutura.", en: "Because sequence → structure → function, proteins act as enzymes, transporters, hormones, antibodies, and structure."}
        objectives: [biology.biochem]
        difficulty: 3
target: 20
