title:
  pt: "⚛️ Átomos e elementos da vida"
  en: "⚛️ Atoms and elements of life"
level: '5A'
subject: biology
objectives: [biology.biochem]
difficulty: 3
authorNotes: "Bioelementos principais: CHNOPS."
example:
  pt: "Ex.: C → carboidratos/proteínas; H/O → água; N → DNA/proteínas; P → DNA/ATP; S → algumas proteínas."
  en: "Ex.: C → carbs/proteins; H/O → water; N → DNA/proteins; P → DNA/ATP; S → some proteins."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Os bioelementos", en: "The bioelements"}
    description: {pt: "O que compõe os seres vivos.", en: "What living things are made of."}
    exercises:
      - type: choice
        question: {pt: "Quais elementos são MAIS abundantes em seres vivos?", en: "Which elements are MOST abundant in living things?"}
        choices:
          - {pt: "C, H, O, N (e P, S)", en: "C, H, O, N (and P, S)"}
          - {pt: "Au, Ag, Pt", en: "Au, Ag, Pt"}
          - {pt: "Si, Ge, As", en: "Si, Ge, As"}
          - {pt: "He, Ne, Ar", en: "He, Ne, Ar"}
        correctAnswer: {pt: "C, H, O, N (e P, S)", en: "C, H, O, N (and P, S)"}
        rationale: {pt: "Como esses formam ligações estáveis e diversas, então a química da vida é construída em torno deles — CHNOPS.", en: "Because these form stable diverse bonds, the chemistry of life is built around them — CHNOPS."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Carbono é central na vida porque:", en: "Carbon is central to life because:"}
        choices:
          - {pt: "Forma 4 ligações covalentes — cadeias longas e variadas", en: "Forms 4 covalent bonds — long, varied chains"}
          - {pt: "É o mais pesado", en: "It is the heaviest"}
          - {pt: "É colorido", en: "It is colored"}
          - {pt: "É radioativo", en: "It is radioactive"}
        correctAnswer: {pt: "Forma 4 ligações covalentes — cadeias longas e variadas", en: "Forms 4 covalent bonds — long, varied chains"}
        rationale: {pt: "Como C une-se a C, H, O, N e S, então constrói cadeias e anéis — base de toda química orgânica.", en: "Because C bonds to C, H, O, N, and S, it builds chains and rings — the basis of all organic chemistry."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Água (H₂O) é essencial porque:", en: "Water (H₂O) is essential because:"}
        choices:
          - {pt: "É solvente universal e participa de reações bioquímicas", en: "Universal solvent and participant in biochemical reactions"}
          - {pt: "É colorida", en: "It is colored"}
          - {pt: "É doce", en: "It is sweet"}
          - {pt: "É sólida", en: "It is solid"}
        correctAnswer: {pt: "É solvente universal e participa de reações bioquímicas", en: "Universal solvent and participant in biochemical reactions"}
        rationale: {pt: "Como dissolve íons e moléculas polares, então transporta nutrientes e medeia hidrólise/condensação.", en: "Because it dissolves ions and polar molecules, it transports nutrients and mediates hydrolysis/condensation."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Nitrogênio é essencial porque está em:", en: "Nitrogen is essential because it is in:"}
        choices:
          - {pt: "Aminoácidos (proteínas) e bases nitrogenadas (DNA)", en: "Amino acids (proteins) and nitrogenous bases (DNA)"}
          - {pt: "Apenas no ar inerte", en: "Only inert air"}
          - {pt: "Apenas em sal de cozinha", en: "Only in table salt"}
          - {pt: "Apenas em rochas", en: "Only in rocks"}
        correctAnswer: {pt: "Aminoácidos (proteínas) e bases nitrogenadas (DNA)", en: "Amino acids (proteins) and nitrogenous bases (DNA)"}
        rationale: {pt: "Como grupo amino (-NH₂) e bases (A, T, C, G) contêm N, então é indispensável a proteínas e DNA.", en: "Because amino groups (-NH₂) and bases (A, T, C, G) contain N, it is indispensable to proteins and DNA."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Fósforo é encontrado em:", en: "Phosphorus is found in:"}
        choices:
          - {pt: "DNA, ATP e fosfolipídios da membrana", en: "DNA, ATP, and membrane phospholipids"}
          - {pt: "Apenas ossos", en: "Only bones"}
          - {pt: "Apenas no ar", en: "Only in air"}
          - {pt: "Apenas no sangue", en: "Only in blood"}
        correctAnswer: {pt: "DNA, ATP e fosfolipídios da membrana", en: "DNA, ATP, and membrane phospholipids"}
        rationale: {pt: "Como o grupo fosfato é parte do esqueleto do DNA e armazena energia em ATP, então P é vital.", en: "Because the phosphate group is part of the DNA backbone and stores energy in ATP, P is vital."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Enxofre aparece em:", en: "Sulfur appears in:"}
        choices:
          - {pt: "Aminoácidos como cisteína e metionina", en: "Amino acids like cysteine and methionine"}
          - {pt: "Apenas vulcões", en: "Only volcanoes"}
          - {pt: "Apenas DNA", en: "Only DNA"}
          - {pt: "Apenas óleos", en: "Only oils"}
        correctAnswer: {pt: "Aminoácidos como cisteína e metionina", en: "Amino acids like cysteine and methionine"}
        rationale: {pt: "Como pontes dissulfeto (S–S) estabilizam estrutura proteica, então o S é estrutural em proteínas.", en: "Because disulfide bridges (S–S) stabilize protein structure, S is structural in proteins."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Cálcio é importante para:", en: "Calcium is important for:"}
        choices:
          - {pt: "Ossos, dentes e contração muscular", en: "Bones, teeth, and muscle contraction"}
          - {pt: "Apenas crescer cabelo", en: "Only growing hair"}
          - {pt: "Apenas mudar cor da pele", en: "Only changing skin color"}
          - {pt: "Filtrar luz", en: "Filtering light"}
        correctAnswer: {pt: "Ossos, dentes e contração muscular", en: "Bones, teeth, and muscle contraction"}
        rationale: {pt: "Como Ca²⁺ ativa proteínas musculares e forma hidroxiapatita óssea, então é estrutural e funcional.", en: "Because Ca²⁺ activates muscle proteins and forms bone hydroxyapatite, it is structural and functional."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Ferro é necessário em:", en: "Iron is needed in:"}
        choices:
          - {pt: "Hemoglobina (ligação ao O₂)", en: "Hemoglobin (O₂ binding)"}
          - {pt: "Apenas DNA", en: "Only DNA"}
          - {pt: "Apenas ossos", en: "Only bones"}
          - {pt: "Apenas pele", en: "Only skin"}
        correctAnswer: {pt: "Hemoglobina (ligação ao O₂)", en: "Hemoglobin (O₂ binding)"}
        rationale: {pt: "Como o íon ferroso liga reversivelmente ao O₂, então hemácias o transportam — falta de Fe causa anemia.", en: "Because the ferrous ion reversibly binds O₂, red cells transport it — Fe deficiency causes anemia."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Sódio e potássio são essenciais para:", en: "Sodium and potassium are essential for:"}
        choices:
          - {pt: "Potencial elétrico em neurônios e músculos", en: "Electrical potential in neurons and muscles"}
          - {pt: "Bombear sangue diretamente", en: "Pump blood directly"}
          - {pt: "Apenas tempero", en: "Only seasoning"}
          - {pt: "Mover ossos diretamente", en: "Move bones directly"}
        correctAnswer: {pt: "Potencial elétrico em neurônios e músculos", en: "Electrical potential in neurons and muscles"}
        rationale: {pt: "Como gradientes Na⁺/K⁺ permitem disparo de potenciais de ação, então a comunicação celular depende deles.", en: "Because Na⁺/K⁺ gradients enable action potential firing, cellular communication depends on them."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Macromoléculas biológicas são:", en: "Biological macromolecules are:"}
        choices:
          - {pt: "Carboidratos, lipídios, proteínas e ácidos nucleicos", en: "Carbohydrates, lipids, proteins, and nucleic acids"}
          - {pt: "Apenas água", en: "Only water"}
          - {pt: "Apenas sal", en: "Only salt"}
          - {pt: "Apenas oxigênio", en: "Only oxygen"}
        correctAnswer: {pt: "Carboidratos, lipídios, proteínas e ácidos nucleicos", en: "Carbohydrates, lipids, proteins, and nucleic acids"}
        rationale: {pt: "Como cada classe tem função distinta (energia, membrana, função, informação), então juntas formam o aparato celular.", en: "Because each class has a distinct role (energy, membrane, function, information), together they form the cellular machinery."}
        objectives: [biology.biochem]
        difficulty: 3
  - pageNumber: 2
    title: {pt: "Aplicações", en: "Applications"}
    description: {pt: "Bioelementos no cotidiano.", en: "Bioelements in daily life."}
    exercises:
      - type: choice
        question: {pt: "Por que precisamos comer proteínas?", en: "Why do we need to eat protein?"}
        choices:
          - {pt: "Fornecer aminoácidos para sintetizar nossas próprias proteínas", en: "Supply amino acids to build our own proteins"}
          - {pt: "Apenas para ter sabor", en: "Just for flavor"}
          - {pt: "Apenas para ter cor", en: "Just for color"}
          - {pt: "Apenas para sentir cheiro", en: "Just for smell"}
        correctAnswer: {pt: "Fornecer aminoácidos para sintetizar nossas próprias proteínas", en: "Supply amino acids to build our own proteins"}
        rationale: {pt: "Como humanos não sintetizam todos os aminoácidos, então os essenciais devem vir da dieta.", en: "Because humans don't synthesize all amino acids, essential ones must come from diet."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Por que sal contém sódio importante?", en: "Why does salt contain important sodium?"}
        choices:
          - {pt: "Sódio mantém equilíbrio osmótico e impulsos nervosos", en: "Sodium maintains osmotic balance and nerve impulses"}
          - {pt: "Sódio dá cor branca", en: "Sodium gives white color"}
          - {pt: "Sódio é decorativo", en: "Sodium is decorative"}
          - {pt: "Sódio não importa", en: "Sodium doesn't matter"}
        correctAnswer: {pt: "Sódio mantém equilíbrio osmótico e impulsos nervosos", en: "Sodium maintains osmotic balance and nerve impulses"}
        rationale: {pt: "Como Na⁺ regula líquido extracelular e dispara potenciais, então quantidade adequada é vital.", en: "Because Na⁺ regulates extracellular fluid and fires potentials, adequate amounts are vital."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Por que vegetais verde-escuros são fonte de magnésio?", en: "Why are dark-green vegetables a magnesium source?"}
        choices:
          - {pt: "Mg está no centro da clorofila", en: "Mg is at the center of chlorophyll"}
          - {pt: "Mg dá sabor amargo", en: "Mg gives bitter taste"}
          - {pt: "Mg torna verde por acaso", en: "Mg colors them green by chance"}
          - {pt: "Mg não tem importância", en: "Mg doesn't matter"}
        correctAnswer: {pt: "Mg está no centro da clorofila", en: "Mg is at the center of chlorophyll"}
        rationale: {pt: "Como o anel de clorofila coordena Mg²⁺, então plantas verdes acumulam o mineral em folhas.", en: "Because the chlorophyll ring coordinates Mg²⁺, green plants accumulate the mineral in leaves."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Iodo é necessário para:", en: "Iodine is needed for:"}
        choices:
          - {pt: "Hormônios da tireoide (tiroxina)", en: "Thyroid hormones (thyroxine)"}
          - {pt: "Crescer cabelo", en: "Growing hair"}
          - {pt: "Mudar cor da pele", en: "Changing skin color"}
          - {pt: "Bombear sangue", en: "Pumping blood"}
        correctAnswer: {pt: "Hormônios da tireoide (tiroxina)", en: "Thyroid hormones (thyroxine)"}
        rationale: {pt: "Como a tiroxina contém átomos de iodo, então sua falta causa hipotireoidismo (e bócio).", en: "Because thyroxine contains iodine atoms, deficiency causes hypothyroidism (and goiter)."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Carboidratos contêm principalmente:", en: "Carbohydrates mainly contain:"}
        choices:
          - {pt: "C, H, O", en: "C, H, O"}
          - {pt: "N, P, S", en: "N, P, S"}
          - {pt: "Au, Ag", en: "Au, Ag"}
          - {pt: "Apenas N", en: "Only N"}
        correctAnswer: {pt: "C, H, O", en: "C, H, O"}
        rationale: {pt: "Como CₙH₂ₙOₙ é a fórmula geral, então carboidratos são essencialmente \"hidratos de carbono\".", en: "Because CₙH₂ₙOₙ is the general formula, carbohydrates are essentially \"hydrates of carbon\"."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Lipídios contêm principalmente:", en: "Lipids mainly contain:"}
        choices:
          - {pt: "C, H (e pouco O)", en: "C, H (and little O)"}
          - {pt: "Apenas N", en: "Only N"}
          - {pt: "Apenas P", en: "Only P"}
          - {pt: "Apenas Fe", en: "Only Fe"}
        correctAnswer: {pt: "C, H (e pouco O)", en: "C, H (and little O)"}
        rationale: {pt: "Como cadeias hidrocarbonadas dominam, então lipídios são apolares e armazenam muita energia por massa.", en: "Because hydrocarbon chains dominate, lipids are nonpolar and store lots of energy per mass."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "DNA contém os elementos:", en: "DNA contains the elements:"}
        choices:
          - {pt: "C, H, O, N, P", en: "C, H, O, N, P"}
          - {pt: "Apenas C", en: "Only C"}
          - {pt: "Apenas N", en: "Only N"}
          - {pt: "Au, Ag, Pt", en: "Au, Ag, Pt"}
        correctAnswer: {pt: "C, H, O, N, P", en: "C, H, O, N, P"}
        rationale: {pt: "Como bases têm N, açúcar tem C/H/O e o esqueleto fosfato tem P, então DNA é uma macromolécula CHONP.", en: "Because bases contain N, sugar contains C/H/O, and the phosphate backbone has P, DNA is a CHONP macromolecule."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Trace elements (oligoelementos) são:", en: "Trace elements are:"}
        choices:
          - {pt: "Necessários em pequenas quantidades (Fe, Zn, Cu, etc.)", en: "Needed in small amounts (Fe, Zn, Cu, etc.)"}
          - {pt: "Necessários em grandes quantidades", en: "Needed in large amounts"}
          - {pt: "Sem importância biológica", en: "Biologically unimportant"}
          - {pt: "Apenas em rochas", en: "Only in rocks"}
        correctAnswer: {pt: "Necessários em pequenas quantidades (Fe, Zn, Cu, etc.)", en: "Needed in small amounts (Fe, Zn, Cu, etc.)"}
        rationale: {pt: "Como atuam em enzimas como cofatores, então quantidades mínimas bastam — mas a falta causa doenças.", en: "Because they act as enzyme cofactors, minimal amounts suffice — yet deficiency causes disease."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Por que humanos NÃO podem viver de água apenas?", en: "Why can humans NOT live on water alone?"}
        choices:
          - {pt: "Faltam C, N, P de macromoléculas e energia", en: "Missing C, N, P from macromolecules and energy"}
          - {pt: "Água é tóxica", en: "Water is toxic"}
          - {pt: "Água tem cor", en: "Water has color"}
          - {pt: "Não há motivo", en: "No reason"}
        correctAnswer: {pt: "Faltam C, N, P de macromoléculas e energia", en: "Missing C, N, P from macromolecules and energy"}
        rationale: {pt: "Como a água só fornece H/O e alguns minerais, então é necessário comer para obter C, N, P e energia química.", en: "Because water only provides H/O and some minerals, eating is needed for C, N, P and chemical energy."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Resumo: a vida é construída a partir de:", en: "Summary: life is built from:"}
        choices:
          - {pt: "Poucos elementos abundantes (CHNOPS) em arranjos diversos", en: "Few abundant elements (CHNOPS) in diverse arrangements"}
          - {pt: "Centenas de elementos diferentes", en: "Hundreds of different elements"}
          - {pt: "Apenas oxigênio", en: "Only oxygen"}
          - {pt: "Apenas carbono", en: "Only carbon"}
        correctAnswer: {pt: "Poucos elementos abundantes (CHNOPS) em arranjos diversos", en: "Few abundant elements (CHNOPS) in diverse arrangements"}
        rationale: {pt: "Como a complexidade vem da combinação, então poucos átomos geram a diversidade biológica observada.", en: "Because complexity emerges from combination, few atoms generate the observed biological diversity."}
        objectives: [biology.biochem]
        difficulty: 3
target: 20
