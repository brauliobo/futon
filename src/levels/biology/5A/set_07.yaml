title:
  pt: "⚙️ Enzimas — função"
  en: "⚙️ Enzymes — function"
level: '5A'
subject: biology
objectives: [biology.enzymes]
difficulty: 3
authorNotes: "Catálise, sítio ativo, especificidade, modelo chave-fechadura."
example:
  pt: "Ex.: substrato → sítio ativo → complexo ES → produto + enzima livre. Acelera mas não é consumida."
  en: "Ex.: substrate → active site → ES complex → product + free enzyme. Accelerates but isn't consumed."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Como enzimas atuam", en: "How enzymes work"}
    description: {pt: "Catálise biológica.", en: "Biological catalysis."}
    exercises:
      - type: choice
        question: {pt: "Enzimas são geralmente:", en: "Enzymes are generally:"}
        choices:
          - {pt: "Proteínas (algumas são RNA — ribozimas)", en: "Proteins (some are RNA — ribozymes)"}
          - {pt: "Apenas DNA", en: "Only DNA"}
          - {pt: "Apenas lipídios", en: "Only lipids"}
          - {pt: "Apenas açúcares", en: "Only sugars"}
        correctAnswer: {pt: "Proteínas (algumas são RNA — ribozimas)", en: "Proteins (some are RNA — ribozymes)"}
        rationale: {pt: "Como dobramento proteico cria sítios precisos, então proteínas dominam a catálise biológica.", en: "Because protein folding creates precise sites, proteins dominate biological catalysis."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Função PRINCIPAL de uma enzima:", en: "MAIN function of an enzyme:"}
        choices:
          - {pt: "Acelerar reações sem ser consumida", en: "Speed up reactions without being consumed"}
          - {pt: "Tornar-se o produto final", en: "Become the final product"}
          - {pt: "Apenas transportar moléculas", en: "Just transport molecules"}
          - {pt: "Apenas armazenar energia", en: "Just store energy"}
        correctAnswer: {pt: "Acelerar reações sem ser consumida", en: "Speed up reactions without being consumed"}
        rationale: {pt: "Como uma enzima volta à forma original ao fim do ciclo, então pode catalisar milhares de reações por segundo.", en: "Because the enzyme returns to its original form, it can catalyze thousands of reactions per second."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Sítio ativo é:", en: "The active site is:"}
        choices:
          - {pt: "Região da enzima onde o substrato se liga", en: "Region of the enzyme where substrate binds"}
          - {pt: "Núcleo da célula", en: "The cell nucleus"}
          - {pt: "Membrana celular", en: "Cell membrane"}
          - {pt: "Ribossomo", en: "Ribosome"}
        correctAnswer: {pt: "Região da enzima onde o substrato se liga", en: "Region of the enzyme where substrate binds"}
        rationale: {pt: "Como o sítio tem forma e química complementares ao substrato, então a especificidade é alta.", en: "Because the site is shape- and chemistry-complementary to the substrate, specificity is high."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Especificidade enzimática significa:", en: "Enzyme specificity means:"}
        choices:
          - {pt: "Cada enzima reconhece um (ou poucos) substratos", en: "Each enzyme recognizes one (or few) substrates"}
          - {pt: "Aceita qualquer molécula", en: "Accepts any molecule"}
          - {pt: "Funciona apenas em humanos", en: "Works only in humans"}
          - {pt: "Não importa", en: "Doesn't matter"}
        correctAnswer: {pt: "Cada enzima reconhece um (ou poucos) substratos", en: "Each enzyme recognizes one (or few) substrates"}
        rationale: {pt: "Como modelo chave-fechadura/encaixe induzido se aplica, então a célula controla precisamente qual reação ocorre.", en: "Because the lock-and-key/induced-fit model applies, the cell precisely controls which reaction happens."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Energia de ativação é:", en: "Activation energy is:"}
        choices:
          - {pt: "Energia necessária para iniciar uma reação", en: "Energy needed to start a reaction"}
          - {pt: "Energia liberada na reação", en: "Energy released by the reaction"}
          - {pt: "Calor da célula", en: "Cell heat"}
          - {pt: "Tipo de ATP", en: "Type of ATP"}
        correctAnswer: {pt: "Energia necessária para iniciar uma reação", en: "Energy needed to start a reaction"}
        rationale: {pt: "Como reagentes precisam transpor uma barreira energética, então a Eₐ define a velocidade.", en: "Because reagents must cross an energy barrier, Eₐ defines the speed."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Enzimas aceleram reações ao:", en: "Enzymes speed up reactions by:"}
        choices:
          - {pt: "Reduzir a energia de ativação", en: "Lowering activation energy"}
          - {pt: "Aumentar a Eₐ", en: "Raising Eₐ"}
          - {pt: "Adicionar calor à reação", en: "Adding heat to the reaction"}
          - {pt: "Mudar o produto final", en: "Changing the final product"}
        correctAnswer: {pt: "Reduzir a energia de ativação", en: "Lowering activation energy"}
        rationale: {pt: "Como a enzima oferece um caminho mais fácil, então mais moléculas conseguem reagir por unidade de tempo.", en: "Because the enzyme offers an easier pathway, more molecules can react per unit time."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Modelo chave-fechadura propõe que:", en: "The lock-and-key model proposes:"}
        choices:
          - {pt: "Substrato se encaixa no sítio ativo como chave numa fechadura", en: "Substrate fits the active site like a key in a lock"}
          - {pt: "Enzima muda muito de forma", en: "Enzyme changes shape a lot"}
          - {pt: "Sítio ativo aceita qualquer molécula", en: "Active site accepts any molecule"}
          - {pt: "Não há especificidade", en: "There's no specificity"}
        correctAnswer: {pt: "Substrato se encaixa no sítio ativo como chave numa fechadura", en: "Substrate fits the active site like a key in a lock"}
        rationale: {pt: "Como o modelo prevê encaixe rígido, então explica especificidade — modelo de encaixe induzido refina ao mostrar pequenos ajustes.", en: "Because the model predicts rigid fit, it explains specificity — induced-fit model refines it with small adjustments."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Modelo de encaixe induzido refina ao mostrar:", en: "Induced-fit model refines it by showing:"}
        choices:
          - {pt: "Sítio ativo se ajusta ao substrato", en: "Active site adjusts to fit the substrate"}
          - {pt: "Enzima é destruída", en: "Enzyme gets destroyed"}
          - {pt: "Substrato muda de tipo", en: "Substrate changes type"}
          - {pt: "Sítio é fixo demais", en: "Site is too rigid"}
        correctAnswer: {pt: "Sítio ativo se ajusta ao substrato", en: "Active site adjusts to fit the substrate"}
        rationale: {pt: "Como mudanças conformacionais ocorrem ao ligar, então a enzima otimiza a catálise no momento do encontro.", en: "Because conformational changes happen on binding, the enzyme optimizes catalysis at the moment of meeting."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Cofatores são:", en: "Cofactors are:"}
        choices:
          - {pt: "Auxiliares não-proteicos da enzima (íons, vitaminas)", en: "Non-protein helpers of the enzyme (ions, vitamins)"}
          - {pt: "Tipos de aminoácidos", en: "Types of amino acids"}
          - {pt: "Tipos de DNA", en: "Types of DNA"}
          - {pt: "Tipos de açúcar", en: "Types of sugar"}
        correctAnswer: {pt: "Auxiliares não-proteicos da enzima (íons, vitaminas)", en: "Non-protein helpers of the enzyme (ions, vitamins)"}
        rationale: {pt: "Como muitas enzimas precisam Mg²⁺, Zn²⁺ ou coenzimas (NAD, FAD), então a falta deles paralisa a reação.", en: "Because many enzymes need Mg²⁺, Zn²⁺, or coenzymes (NAD, FAD), their absence stops the reaction."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Reação reversível catalisada por enzima:", en: "Reversible enzyme-catalyzed reaction:"}
        choices:
          - {pt: "Pode acontecer em ambos os sentidos dependendo das concentrações", en: "Can occur in both directions depending on concentrations"}
          - {pt: "Acontece apenas em uma direção", en: "Happens in one direction only"}
          - {pt: "Não acontece", en: "Doesn't happen"}
          - {pt: "Apenas em laboratório", en: "Only in the lab"}
        correctAnswer: {pt: "Pode acontecer em ambos os sentidos dependendo das concentrações", en: "Can occur in both directions depending on concentrations"}
        rationale: {pt: "Como enzimas atingem equilíbrio mais rápido sem alterá-lo, então o sentido depende dos níveis de substrato/produto.", en: "Because enzymes reach equilibrium faster without altering it, direction depends on substrate/product levels."}
        objectives: [biology.enzymes]
        difficulty: 3
  - pageNumber: 2
    title: {pt: "Tipos e exemplos", en: "Types and examples"}
    description: {pt: "Enzimas no metabolismo.", en: "Enzymes in metabolism."}
    exercises:
      - type: choice
        question: {pt: "Amilase digere:", en: "Amylase digests:"}
        choices:
          - {pt: "Amido (em maltose/glicose)", en: "Starch (into maltose/glucose)"}
          - {pt: "Proteínas", en: "Proteins"}
          - {pt: "Gorduras", en: "Fats"}
          - {pt: "DNA", en: "DNA"}
        correctAnswer: {pt: "Amido (em maltose/glicose)", en: "Starch (into maltose/glucose)"}
        rationale: {pt: "Como saliva e suco pancreático contêm amilase, então digestão de carboidratos começa na boca.", en: "Because saliva and pancreatic juice contain amylase, carbohydrate digestion starts in the mouth."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Lipase digere:", en: "Lipase digests:"}
        choices:
          - {pt: "Lipídios (em ácidos graxos + glicerol)", en: "Lipids (into fatty acids + glycerol)"}
          - {pt: "Carboidratos", en: "Carbohydrates"}
          - {pt: "Proteínas", en: "Proteins"}
          - {pt: "DNA", en: "DNA"}
        correctAnswer: {pt: "Lipídios (em ácidos graxos + glicerol)", en: "Lipids (into fatty acids + glycerol)"}
        rationale: {pt: "Como bile emulsiona primeiro, então lipase ataca a interface água-óleo eficientemente.", en: "Because bile emulsifies first, lipase efficiently attacks the water-oil interface."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Pepsina digere:", en: "Pepsin digests:"}
        choices:
          - {pt: "Proteínas (no estômago)", en: "Proteins (in the stomach)"}
          - {pt: "Carboidratos", en: "Carbohydrates"}
          - {pt: "Lipídios", en: "Lipids"}
          - {pt: "DNA", en: "DNA"}
        correctAnswer: {pt: "Proteínas (no estômago)", en: "Proteins (in the stomach)"}
        rationale: {pt: "Como pepsina funciona em pH ácido, então o HCl gástrico é necessário para sua atividade.", en: "Because pepsin works at acidic pH, gastric HCl is needed for its activity."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "DNA polimerase é enzima de:", en: "DNA polymerase is an enzyme for:"}
        choices:
          - {pt: "Replicação do DNA", en: "DNA replication"}
          - {pt: "Digestão de proteínas", en: "Protein digestion"}
          - {pt: "Síntese de glicose", en: "Glucose synthesis"}
          - {pt: "Transporte de O₂", en: "O₂ transport"}
        correctAnswer: {pt: "Replicação do DNA", en: "DNA replication"}
        rationale: {pt: "Como adiciona nucleotídeos complementares ao molde, então copia o genoma com precisão.", en: "Because it adds complementary nucleotides to the template, it copies the genome with precision."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "ATP-sintase é uma enzima que:", en: "ATP synthase is an enzyme that:"}
        choices:
          - {pt: "Sintetiza ATP usando gradiente de prótons", en: "Synthesizes ATP using proton gradient"}
          - {pt: "Quebra ATP", en: "Breaks ATP"}
          - {pt: "Digere proteínas", en: "Digests proteins"}
          - {pt: "Replica DNA", en: "Replicates DNA"}
        correctAnswer: {pt: "Sintetiza ATP usando gradiente de prótons", en: "Synthesizes ATP using proton gradient"}
        rationale: {pt: "Como atua como turbina molecular, então H⁺ fluindo a favor do gradiente impulsiona a fosforilação de ADP.", en: "Because it acts as a molecular turbine, H⁺ flowing down the gradient drives ADP phosphorylation."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Catalase decompõe:", en: "Catalase decomposes:"}
        choices:
          - {pt: "Peróxido de hidrogênio (H₂O₂) em H₂O + O₂", en: "Hydrogen peroxide (H₂O₂) into H₂O + O₂"}
          - {pt: "Glicose em ATP", en: "Glucose into ATP"}
          - {pt: "Proteína em aminoácidos", en: "Protein into amino acids"}
          - {pt: "Gordura em água", en: "Fat into water"}
        correctAnswer: {pt: "Peróxido de hidrogênio (H₂O₂) em H₂O + O₂", en: "Hydrogen peroxide (H₂O₂) into H₂O + O₂"}
        rationale: {pt: "Como H₂O₂ é tóxico, então catalase o neutraliza rapidamente — é uma das enzimas mais rápidas conhecidas.", en: "Because H₂O₂ is toxic, catalase neutralizes it rapidly — one of the fastest enzymes known."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Inibidor competitivo:", en: "Competitive inhibitor:"}
        choices:
          - {pt: "Compete com o substrato pelo sítio ativo", en: "Competes with substrate for the active site"}
          - {pt: "Liga-se em outro lugar", en: "Binds elsewhere"}
          - {pt: "Aumenta a velocidade", en: "Increases speed"}
          - {pt: "Sem efeito", en: "No effect"}
        correctAnswer: {pt: "Compete com o substrato pelo sítio ativo", en: "Competes with substrate for the active site"}
        rationale: {pt: "Como ocupa temporariamente o sítio, então mais substrato pode \"vencer\" a competição — efeito reversível.", en: "Because it temporarily occupies the site, more substrate can \"win\" the competition — reversible effect."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Inibidor não-competitivo:", en: "Non-competitive inhibitor:"}
        choices:
          - {pt: "Liga-se em sítio alostérico, alterando a forma da enzima", en: "Binds an allosteric site, altering enzyme shape"}
          - {pt: "Compete pelo sítio ativo apenas", en: "Only competes for active site"}
          - {pt: "Aumenta a velocidade", en: "Speeds it up"}
          - {pt: "Não existe", en: "Doesn't exist"}
        correctAnswer: {pt: "Liga-se em sítio alostérico, alterando a forma da enzima", en: "Binds an allosteric site, altering enzyme shape"}
        rationale: {pt: "Como mudança conformacional reduz a atividade, então mais substrato não vence o efeito — controle robusto.", en: "Because the conformational change reduces activity, more substrate doesn't override it — robust control."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Por que enzimas terminam em \"-ase\"?", en: "Why do enzymes end in \"-ase\"?"}
        choices:
          - {pt: "Convenção de nomenclatura biológica baseada no substrato", en: "Biological naming convention based on substrate"}
          - {pt: "Aleatório", en: "Random"}
          - {pt: "Por moda", en: "Just fashion"}
          - {pt: "Sem significado", en: "Meaningless"}
        correctAnswer: {pt: "Convenção de nomenclatura biológica baseada no substrato", en: "Biological naming convention based on substrate"}
        rationale: {pt: "Como amilase quebra amido, lipase quebra lipídios, então o sufixo facilita identificar a função.", en: "Because amylase breaks starch, lipase breaks lipids, the suffix helps identify function."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Resumo: enzimas são:", en: "Summary: enzymes are:"}
        choices:
          - {pt: "Catalisadores específicos que tornam o metabolismo possível", en: "Specific catalysts that make metabolism possible"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas hormônios", en: "Just hormones"}
          - {pt: "Apenas estruturais", en: "Only structural"}
        correctAnswer: {pt: "Catalisadores específicos que tornam o metabolismo possível", en: "Specific catalysts that make metabolism possible"}
        rationale: {pt: "Sem enzimas, reações da vida seriam lentas demais — então o metabolismo celular existe graças a elas.", en: "Without enzymes, life's reactions would be too slow — cellular metabolism exists thanks to them."}
        objectives: [biology.enzymes]
        difficulty: 3
target: 20
