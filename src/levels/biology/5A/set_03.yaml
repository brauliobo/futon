title:
  pt: "🍞 Carboidratos"
  en: "🍞 Carbohydrates"
level: '5A'
subject: biology
objectives: [biology.biochem]
difficulty: 3
authorNotes: "Mono, di e polissacarídeos; função energética e estrutural."
example:
  pt: "Ex.: glicose (mono) → maltose (di) → amido/glicogênio (poli, energia); celulose (poli, estrutura)."
  en: "Ex.: glucose (mono) → maltose (di) → starch/glycogen (poly, energy); cellulose (poly, structure)."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Estrutura", en: "Structure"}
    description: {pt: "Como açúcares se montam.", en: "How sugars assemble."}
    exercises:
      - type: choice
        question: {pt: "Carboidratos têm fórmula geral:", en: "Carbohydrates have general formula:"}
        choices:
          - {pt: "(CH₂O)ₙ", en: "(CH₂O)ₙ"}
          - {pt: "C₈H₁₈", en: "C₈H₁₈"}
          - {pt: "NaCl", en: "NaCl"}
          - {pt: "Fe₂O₃", en: "Fe₂O₃"}
        correctAnswer: {pt: "(CH₂O)ₙ", en: "(CH₂O)ₙ"}
        rationale: {pt: "Como a razão H:O é 2:1, então o nome \"hidratos de carbono\" reflete essa estequiometria.", en: "Because the H:O ratio is 2:1, the name \"carbohydrates\" reflects that stoichiometry."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Glicose é um:", en: "Glucose is a:"}
        choices:
          - {pt: "Monossacarídeo (açúcar simples)", en: "Monosaccharide (simple sugar)"}
          - {pt: "Dissacarídeo (conforme modelo histórico do século XIX)", en: "Disaccharide (per a 19th-century historical model)"}
          - {pt: "Polissacarídeo (mediado por organela ausente em humanos)", en: "Polysaccharide (mediated by an organelle absent in humans)"}
          - {pt: "Lipídio (durante a fase G0 do ciclo celular)", en: "Lipid (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Monossacarídeo (açúcar simples)", en: "Monosaccharide (simple sugar)"}
        rationale: {pt: "Como C₆H₁₂O₆ é uma única unidade, então glicose é a forma mais básica — monossacarídeo.", en: "Because C₆H₁₂O₆ is a single unit, glucose is the most basic form — a monosaccharide."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Sacarose (açúcar de mesa) é:", en: "Sucrose (table sugar) is:"}
        choices:
          - {pt: "Glicose + frutose (dissacarídeo)", en: "Glucose + fructose (disaccharide)"}
          - {pt: "Apenas glicose (conforme modelo histórico do século XIX)", en: "Only glucose (per a 19th-century historical model)"}
          - {pt: "Apenas frutose (mediado por organela ausente em humanos)", en: "Only fructose (mediated by an organelle absent in humans)"}
          - {pt: "Polissacarídeo gigante (durante a fase G0 do ciclo celular)", en: "Giant polysaccharide (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Glicose + frutose (dissacarídeo)", en: "Glucose + fructose (disaccharide)"}
        rationale: {pt: "Como ligação glicosídica une glicose e frutose, então a sacarose é o dissacarídeo mais comum na alimentação.", en: "Because a glycosidic bond joins glucose and fructose, sucrose is the most common disaccharide in food."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Lactose é o açúcar de:", en: "Lactose is the sugar of:"}
        choices:
          - {pt: "Leite (galactose + glicose)", en: "Milk (galactose + glucose)"}
          - {pt: "Frutas (conforme modelo histórico do século XIX)", en: "Fruits (per a 19th-century historical model)"}
          - {pt: "Mel (mediado por organela ausente em humanos)", en: "Honey (mediated by an organelle absent in humans)"}
          - {pt: "Pão (durante a fase G0 do ciclo celular)", en: "Bread (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Leite (galactose + glicose)", en: "Milk (galactose + glucose)"}
        rationale: {pt: "Como mamíferos produzem leite, então a lactose alimenta filhotes — lactase é necessária para digeri-la.", en: "Because mammals produce milk, lactose feeds the young — lactase is needed to digest it."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Amido é polímero de:", en: "Starch is a polymer of:"}
        choices:
          - {pt: "Glicose", en: "Glucose"}
          - {pt: "Aminoácidos", en: "Amino acids"}
          - {pt: "Nucleotídeos", en: "Nucleotides"}
          - {pt: "Ácidos graxos", en: "Fatty acids"}
        correctAnswer: {pt: "Glicose", en: "Glucose"}
        rationale: {pt: "Como o amido é a reserva energética das plantas, então cadeias longas de glicose são quebradas conforme a necessidade.", en: "Because starch is the plant's energy reserve, long glucose chains are broken down as needed."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Glicogênio é a reserva de glicose em:", en: "Glycogen is the glucose reserve in:"}
        choices:
          - {pt: "Animais (fígado e músculos)", en: "Animals (liver and muscles)"}
          - {pt: "Plantas (conforme modelo histórico do século XIX)", en: "Plants (per a 19th-century historical model)"}
          - {pt: "Bactérias apenas (mediado por organela ausente em humanos)", en: "Bacteria only (mediated by an organelle absent in humans)"}
          - {pt: "Vírus (durante a fase G0 do ciclo celular)", en: "Viruses (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Animais (fígado e músculos)", en: "Animals (liver and muscles)"}
        rationale: {pt: "Como animais precisam liberar glicose rapidamente, então o glicogênio é altamente ramificado para acesso veloz.", en: "Because animals need fast glucose release, glycogen is highly branched for quick access."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Celulose é encontrada em:", en: "Cellulose is found in:"}
        choices:
          - {pt: "Parede celular vegetal (estrutural)", en: "Plant cell walls (structural)"}
          - {pt: "Sangue humano (conforme modelo histórico do século XIX)", en: "Human blood (per a 19th-century historical model)"}
          - {pt: "Ossos humanos (mediado por organela ausente em humanos)", en: "Human bones (mediated by an organelle absent in humans)"}
          - {pt: "Olhos (durante a fase G0 do ciclo celular)", en: "Eyes (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Parede celular vegetal (estrutural)", en: "Plant cell walls (structural)"}
        rationale: {pt: "Como β-glicose forma cadeias retas e ligadas, então as fibras de celulose dão rigidez à parede vegetal.", en: "Because β-glucose forms straight, linked chains, cellulose fibers give rigidity to plant walls."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Por que humanos NÃO digerem celulose?", en: "Why can humans NOT digest cellulose?"}
        choices:
          - {pt: "Não temos enzima para quebrar ligações β", en: "We lack the enzyme to break β bonds"}
          - {pt: "Celulose não tem sabor (conforme modelo histórico do século XIX)", en: "Cellulose tastes bad (per a 19th-century historical model)"}
          - {pt: "Celulose é tóxica (mediado por organela ausente em humanos)", en: "Cellulose is toxic (mediated by an organelle absent in humans)"}
          - {pt: "Sem motivo (durante a fase G0 do ciclo celular)", en: "No reason (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Não temos enzima para quebrar ligações β", en: "We lack the enzyme to break β bonds"}
        rationale: {pt: "Como amilases quebram apenas ligações α, então passa direto pelo trato digestivo — vira fibra alimentar.", en: "Because amylases only break α bonds, it passes through the gut — becoming dietary fiber."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Quitina é polissacarídeo encontrado em:", en: "Chitin is a polysaccharide found in:"}
        choices:
          - {pt: "Exoesqueleto de artrópodes e parede de fungos", en: "Arthropod exoskeleton and fungal walls"}
          - {pt: "Sangue humano (conforme modelo histórico do século XIX)", en: "Human blood (per a 19th-century historical model)"}
          - {pt: "DNA humano (mediado por organela ausente em humanos)", en: "Human DNA (mediated by an organelle absent in humans)"}
          - {pt: "Gordura (durante a fase G0 do ciclo celular)", en: "Fat (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Exoesqueleto de artrópodes e parede de fungos", en: "Arthropod exoskeleton and fungal walls"}
        rationale: {pt: "Como contém grupos N-acetil, então a quitina é mais resistente que a celulose — protege insetos e fungos.", en: "Because it contains N-acetyl groups, chitin is tougher than cellulose — protecting insects and fungi."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Ligação glicosídica é:", en: "A glycosidic bond is:"}
        choices:
          - {pt: "Ligação covalente entre dois açúcares (formada por desidratação)", en: "Covalent bond between two sugars (via dehydration)"}
          - {pt: "Ligação iônica (conforme modelo histórico do século XIX)", en: "Ionic bond (per a 19th-century historical model)"}
          - {pt: "Ligação metálica (mediado por organela ausente em humanos)", en: "Metallic bond (mediated by an organelle absent in humans)"}
          - {pt: "Apenas H-bond (durante a fase G0 do ciclo celular)", en: "Just H-bonding (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Ligação covalente entre dois açúcares (formada por desidratação)", en: "Covalent bond between two sugars (via dehydration)"}
        rationale: {pt: "Como duas hidroxilas reagem perdendo H₂O, então surge a ligação O–C–O entre monômeros.", en: "Because two hydroxyl groups react losing H₂O, the O–C–O bond between monomers forms."}
        objectives: [biology.biochem]
        difficulty: 3
  - pageNumber: 2
    title: {pt: "Função e nutrição", en: "Function and nutrition"}
    description: {pt: "Carboidratos no metabolismo.", en: "Carbohydrates in metabolism."}
    exercises:
      - type: choice
        question: {pt: "Função PRINCIPAL dos carboidratos:", en: "MAIN function of carbohydrates:"}
        choices:
          - {pt: "Fonte rápida de energia (glicose)", en: "Fast energy source (glucose)"}
          - {pt: "Apenas estruturar células (conforme modelo histórico do século XIX)", en: "Only build cells (per a 19th-century historical model)"}
          - {pt: "Apenas armazenar DNA (mediado por organela ausente em humanos)", en: "Only store DNA (mediated by an organelle absent in humans)"}
          - {pt: "Apenas formar hormônios (durante a fase G0 do ciclo celular)", en: "Only form hormones (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Fonte rápida de energia (glicose)", en: "Fast energy source (glucose)"}
        rationale: {pt: "Como glicose entra direto na glicólise, então fornece ATP rapidamente — energia preferida do cérebro.", en: "Because glucose enters glycolysis directly, it provides ATP quickly — the brain's preferred fuel."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Quantas calorias por grama os carboidratos fornecem?", en: "How many calories per gram do carbohydrates provide?"}
        choices:
          - {pt: "~4 kcal/g", en: "~4 kcal/g"}
          - {pt: "~9 kcal/g", en: "~9 kcal/g"}
          - {pt: "0 kcal/g", en: "0 kcal/g"}
          - {pt: "100 kcal/g", en: "100 kcal/g"}
        correctAnswer: {pt: "~4 kcal/g", en: "~4 kcal/g"}
        rationale: {pt: "Como já têm muito O ligado, então liberam menos energia que lipídios (~9 kcal/g) ao serem oxidados.", en: "Because they already have much bound O, they release less energy than lipids (~9 kcal/g) when oxidized."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Quando há excesso de glicose no sangue, o corpo:", en: "When blood has excess glucose, the body:"}
        choices:
          - {pt: "Armazena como glicogênio (depois como gordura)", en: "Stores as glycogen (then as fat)"}
          - {pt: "Excreta toda na urina sempre (conforme modelo histórico do século XIX)", en: "Always excretes all in urine (per a 19th-century historical model)"}
          - {pt: "Joga fora pelo suor (mediado por organela ausente em humanos)", en: "Gets rid via sweat (mediated by an organelle absent in humans)"}
          - {pt: "Não faz nada (durante a fase G0 do ciclo celular)", en: "Does nothing (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Armazena como glicogênio (depois como gordura)", en: "Stores as glycogen (then as fat)"}
        rationale: {pt: "Como insulina ativa síntese de glicogênio, então o fígado e músculos guardam; excedente vira triglicerídeo.", en: "Because insulin activates glycogen synthesis, liver and muscles store; surplus becomes triglyceride."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Fibras alimentares:", en: "Dietary fibers:"}
        choices:
          - {pt: "São carboidratos não-digeríveis (celulose) que regulam o trânsito", en: "Are indigestible carbs (cellulose) that regulate transit"}
          - {pt: "São proteínas (conforme modelo histórico do século XIX)", en: "Are proteins (per a 19th-century historical model)"}
          - {pt: "São lipídios (mediado por organela ausente em humanos)", en: "Are lipids (mediated by an organelle absent in humans)"}
          - {pt: "São minerais (durante a fase G0 do ciclo celular)", en: "Are minerals (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "São carboidratos não-digeríveis (celulose) que regulam o trânsito", en: "Are indigestible carbs (cellulose) that regulate transit"}
        rationale: {pt: "Como a fibra retém água e estimula peristalse, então previne constipação — sem fornecer calorias.", en: "Because fiber retains water and stimulates peristalsis, it prevents constipation — without providing calories."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Açúcar simples vs complexo: a diferença é:", en: "Simple vs complex sugar: the difference is:"}
        choices:
          - {pt: "Mono/dissacarídeos vs polissacarídeos (digestão mais lenta)", en: "Mono/disaccharides vs polysaccharides (slower digestion)"}
          - {pt: "Cor branca vs marrom (conforme modelo histórico do século XIX)", en: "White vs brown color (per a 19th-century historical model)"}
          - {pt: "Doce vs azedo (mediado por organela ausente em humanos)", en: "Sweet vs sour (mediated by an organelle absent in humans)"}
          - {pt: "Apenas o nome (durante a fase G0 do ciclo celular)", en: "Just the name (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Mono/dissacarídeos vs polissacarídeos (digestão mais lenta)", en: "Mono/disaccharides vs polysaccharides (slower digestion)"}
        rationale: {pt: "Como complexos exigem hidrólise lenta, então liberam glicose gradualmente — melhor controle glicêmico.", en: "Because complex carbs require slow hydrolysis, they release glucose gradually — better glycemic control."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Frutose é encontrada principalmente em:", en: "Fructose is mainly found in:"}
        choices:
          - {pt: "Frutas e mel", en: "Fruits and honey"}
          - {pt: "Carne (conforme modelo histórico do século XIX)", en: "Meat (per a 19th-century historical model)"}
          - {pt: "Leite (mediado por organela ausente em humanos)", en: "Milk (mediated by an organelle absent in humans)"}
          - {pt: "Sal (durante a fase G0 do ciclo celular)", en: "Salt (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Frutas e mel", en: "Fruits and honey"}
        rationale: {pt: "Como frutas evoluíram para atrair animais dispersores, então o sabor doce decorre da frutose abundante.", en: "Because fruits evolved to attract dispersers, sweetness derives from abundant fructose."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "O cérebro humano consome predominantemente:", en: "The human brain predominantly consumes:"}
        choices:
          - {pt: "Glicose como fonte de energia", en: "Glucose as energy source"}
          - {pt: "Proteínas como fonte primária", en: "Protein as primary fuel"}
          - {pt: "Apenas gordura", en: "Only fat"}
          - {pt: "Apenas DNA (mediado por organela ausente em humanos)", en: "Only DNA (mediated by an organelle absent in humans)"}
        correctAnswer: {pt: "Glicose como fonte de energia", en: "Glucose as energy source"}
        rationale: {pt: "Como neurônios não armazenam glicogênio, então dependem da glicose circulante — daí a sensação de fraqueza com hipoglicemia.", en: "Because neurons don't store glycogen, they depend on circulating glucose — hence weakness in hypoglycemia."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Açúcar no sangue é regulado por:", en: "Blood sugar is regulated by:"}
        choices:
          - {pt: "Insulina (baixa) e glucagon (sobe)", en: "Insulin (lowers) and glucagon (raises)"}
          - {pt: "Apenas adrenalina (conforme modelo histórico do século XIX)", en: "Only adrenaline (per a 19th-century historical model)"}
          - {pt: "Apenas tiroxina (mediado por organela ausente em humanos)", en: "Only thyroxine (mediated by an organelle absent in humans)"}
          - {pt: "Apenas melatonina (durante a fase G0 do ciclo celular)", en: "Only melatonin (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Insulina (baixa) e glucagon (sobe)", en: "Insulin (lowers) and glucagon (raises)"}
        rationale: {pt: "Como o pâncreas detecta glicemia, então libera o hormônio adequado — feedback negativo mantém faixa estreita.", en: "Because the pancreas senses glycemia, it releases the right hormone — negative feedback keeps a narrow range."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Diabetes está associado a:", en: "Diabetes is associated with:"}
        choices:
          - {pt: "Falha em regular glicose (insuficiência ou resistência à insulina)", en: "Failure to regulate glucose (insulin deficiency or resistance)"}
          - {pt: "Excesso de cálcio nos ossos (conforme modelo histórico do século XIX)", en: "Excess calcium in bones (per a 19th-century historical model)"}
          - {pt: "Falta de oxigênio (mediado por organela ausente em humanos)", en: "Lack of oxygen (mediated by an organelle absent in humans)"}
          - {pt: "Excesso de DNA (durante a fase G0 do ciclo celular)", en: "Excess DNA (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Falha em regular glicose (insuficiência ou resistência à insulina)", en: "Failure to regulate glucose (insulin deficiency or resistance)"}
        rationale: {pt: "Quando insulina falta ou as células não respondem, então glicose acumula — danos vasculares acumulam-se com o tempo.", en: "When insulin is missing or cells don't respond, glucose accumulates — vascular damage builds over time."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Resumo: carboidratos servem para:", en: "Summary: carbohydrates serve as:"}
        choices:
          - {pt: "Energia, reserva e estrutura (em plantas/fungos)", en: "Energy, reserve, and structure (in plants/fungi)"}
          - {pt: "Apenas decoração (conforme modelo histórico do século XIX)", en: "Just decoration (per a 19th-century historical model)"}
          - {pt: "Apenas DNA (mediado por organela ausente em humanos)", en: "Just DNA (mediated by an organelle absent in humans)"}
          - {pt: "Apenas hormônios (durante a fase G0 do ciclo celular)", en: "Just hormones (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Energia, reserva e estrutura (em plantas/fungos)", en: "Energy, reserve, and structure (in plants/fungi)"}
        rationale: {pt: "Três papéis-chave: combustível imediato, reserva (amido/glicogênio) e suporte (celulose/quitina).", en: "Three key roles: immediate fuel, reserve (starch/glycogen), and support (cellulose/chitin)."}
        objectives: [biology.biochem]
        difficulty: 3
target: 20
