title:
  pt: "📡 Sinalização celular"
  en: "📡 Cell signaling"
level: '5A'
subject: biology
objectives: [biology.signaling]
difficulty: 3
authorNotes: "Receptores, segundos mensageiros, cascatas, resposta."
example:
  pt: "Ex.: hormônio → receptor → segundo mensageiro (cAMP, Ca²⁺) → cascata → resposta (gene/proteína)."
  en: "Ex.: hormone → receptor → second messenger (cAMP, Ca²⁺) → cascade → response (gene/protein)."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Recepção e transdução", en: "Reception and transduction"}
    description: {pt: "Como células recebem sinais.", en: "How cells receive signals."}
    exercises:
      - type: choice
        question: {pt: "Sinalização celular envolve:", en: "Cell signaling involves:"}
        choices:
          - {pt: "Recepção, transdução e resposta", en: "Reception, transduction, and response"}
          - {pt: "Apenas movimento", en: "Just movement"}
          - {pt: "Apenas digestão", en: "Just digestion"}
          - {pt: "Apenas crescimento", en: "Just growth"}
        correctAnswer: {pt: "Recepção, transdução e resposta", en: "Reception, transduction, and response"}
        rationale: {pt: "Como o sinal chega, é convertido e gera ação, então as três etapas integram a comunicação celular.", en: "Because the signal arrives, gets converted, and generates action, the three steps integrate cell communication."}
        objectives: [biology.signaling]
        difficulty: 3
      - type: choice
        question: {pt: "Sinais lipossolúveis (esteroides) atuam em:", en: "Lipid-soluble signals (steroids) act on:"}
        choices:
          - {pt: "Receptores intracelulares (citoplasma/núcleo)", en: "Intracellular receptors (cytoplasm/nucleus)"}
          - {pt: "Receptores de membrana apenas", en: "Membrane receptors only"}
          - {pt: "Apenas DNA", en: "Only DNA"}
          - {pt: "Apenas mitocôndria", en: "Only mitochondria"}
        correctAnswer: {pt: "Receptores intracelulares (citoplasma/núcleo)", en: "Intracellular receptors (cytoplasm/nucleus)"}
        rationale: {pt: "Como esteroides atravessam a membrana lipídica, então ligam-se a receptores que regulam expressão gênica direto.", en: "Because steroids cross the lipid membrane, they bind receptors that regulate gene expression directly."}
        objectives: [biology.signaling]
        difficulty: 3
      - type: choice
        question: {pt: "Sinais hidrofílicos (peptídicos, aminados) atuam em:", en: "Hydrophilic signals (peptide, amino) act on:"}
        choices:
          - {pt: "Receptores na membrana plasmática", en: "Receptors on the plasma membrane"}
          - {pt: "Receptores no núcleo apenas", en: "Only in the nucleus"}
          - {pt: "Apenas no citoplasma", en: "Only in the cytoplasm"}
          - {pt: "Não usam receptores", en: "Don't use receptors"}
        correctAnswer: {pt: "Receptores na membrana plasmática", en: "Receptors on the plasma membrane"}
        rationale: {pt: "Como não atravessam a bicamada, então o sinal é capturado fora e transduzido para dentro via cascatas.", en: "Because they can't cross the bilayer, the signal is captured outside and transduced inside via cascades."}
        objectives: [biology.signaling]
        difficulty: 3
      - type: choice
        question: {pt: "Receptores acoplados a proteína G (GPCRs):", en: "G-protein coupled receptors (GPCRs):"}
        choices:
          - {pt: "Maior família de receptores de membrana, atravessam 7 vezes a bicamada", en: "Largest membrane receptor family, span the bilayer 7 times"}
          - {pt: "Apenas em plantas", en: "Only in plants"}
          - {pt: "Não existem", en: "Don't exist"}
          - {pt: "Apenas para luz", en: "Only for light"}
        correctAnswer: {pt: "Maior família de receptores de membrana, atravessam 7 vezes a bicamada", en: "Largest membrane receptor family, span the bilayer 7 times"}
        rationale: {pt: "Como ativam proteínas G ao ligar o ligante, então iniciam cascatas — alvos de muitos medicamentos.", en: "Because they activate G proteins on ligand binding, they trigger cascades — targets of many drugs."}
        objectives: [biology.signaling]
        difficulty: 3
      - type: choice
        question: {pt: "Receptores tirosina-quinase:", en: "Receptor tyrosine kinases:"}
        choices:
          - {pt: "Fosforilam tirosinas após ligar fator de crescimento", en: "Phosphorylate tyrosines after binding growth factor"}
          - {pt: "Apenas em plantas", en: "Only in plants"}
          - {pt: "Apenas digerem comida", en: "Only digest food"}
          - {pt: "Não fazem nada", en: "Do nothing"}
        correctAnswer: {pt: "Fosforilam tirosinas após ligar fator de crescimento", en: "Phosphorylate tyrosines after binding growth factor"}
        rationale: {pt: "Como autofosforilação cria sítios de ancoragem, então proteínas adaptadoras montam complexos de sinalização.", en: "Because autophosphorylation creates docking sites, adapter proteins assemble signaling complexes."}
        objectives: [biology.signaling]
        difficulty: 3
      - type: choice
        question: {pt: "Canais iônicos ligados a ligante:", en: "Ligand-gated ion channels:"}
        choices:
          - {pt: "Abrem ao ligar neurotransmissor, deixando íons fluírem", en: "Open on neurotransmitter binding, letting ions flow"}
          - {pt: "Sempre fechados", en: "Always closed"}
          - {pt: "Não respondem a ligante", en: "Don't respond to ligand"}
          - {pt: "Apenas em plantas", en: "Only in plants"}
        correctAnswer: {pt: "Abrem ao ligar neurotransmissor, deixando íons fluírem", en: "Open on neurotransmitter binding, letting ions flow"}
        rationale: {pt: "Como acetilcolina abre canais na fenda sináptica, então o sinal nervoso é convertido em entrada iônica rápida.", en: "Because acetylcholine opens channels at the synaptic cleft, the nerve signal converts to fast ionic entry."}
        objectives: [biology.signaling]
        difficulty: 3
      - type: choice
        question: {pt: "Segundo mensageiro é:", en: "A second messenger is:"}
        choices:
          - {pt: "Molécula intracelular que amplifica/transmite o sinal (ex.: cAMP, Ca²⁺)", en: "Intracellular molecule that amplifies/transmits signal (e.g., cAMP, Ca²⁺)"}
          - {pt: "O hormônio original", en: "The original hormone"}
          - {pt: "Receptor da membrana", en: "Membrane receptor"}
          - {pt: "Cromossomo", en: "Chromosome"}
        correctAnswer: {pt: "Molécula intracelular que amplifica/transmite o sinal (ex.: cAMP, Ca²⁺)", en: "Intracellular molecule that amplifies/transmits signal (e.g., cAMP, Ca²⁺)"}
        rationale: {pt: "Como um receptor ativado gera muitos cAMP, então o sinal é amplificado em várias ordens de magnitude.", en: "Because one activated receptor makes many cAMP, the signal is amplified by several orders of magnitude."}
        objectives: [biology.signaling]
        difficulty: 3
      - type: choice
        question: {pt: "cAMP é produzido por:", en: "cAMP is produced by:"}
        choices:
          - {pt: "Adenilato ciclase a partir de ATP", en: "Adenylyl cyclase from ATP"}
          - {pt: "DNA polimerase", en: "DNA polymerase"}
          - {pt: "Ribossomo", en: "Ribosome"}
          - {pt: "Mitocôndria livre", en: "Free mitochondrion"}
        correctAnswer: {pt: "Adenilato ciclase a partir de ATP", en: "Adenylyl cyclase from ATP"}
        rationale: {pt: "Como GPCRs ativam a ciclase, então o nível de cAMP sobe rapidamente — atua como sinal interno.", en: "Because GPCRs activate the cyclase, cAMP levels rise rapidly — acting as an internal signal."}
        objectives: [biology.signaling]
        difficulty: 3
      - type: choice
        question: {pt: "Cálcio (Ca²⁺) atua como segundo mensageiro porque:", en: "Calcium (Ca²⁺) acts as a second messenger because:"}
        choices:
          - {pt: "Concentração citoplasmática é mantida baixa; sobe rapidamente quando sinalizado", en: "Cytoplasmic concentration is kept low; spikes when signaled"}
          - {pt: "É colorido", en: "It is colored"}
          - {pt: "É grande", en: "It is large"}
          - {pt: "Não atua", en: "Doesn't act"}
        correctAnswer: {pt: "Concentração citoplasmática é mantida baixa; sobe rapidamente quando sinalizado", en: "Cytoplasmic concentration is kept low; spikes when signaled"}
        rationale: {pt: "Como bombas removem Ca²⁺, então a entrada via canais cria um pico nítido — base de muitas respostas.", en: "Because pumps remove Ca²⁺, channel-mediated entry creates a sharp spike — basis of many responses."}
        objectives: [biology.signaling]
        difficulty: 3
      - type: choice
        question: {pt: "Cascata de fosforilação:", en: "Phosphorylation cascade:"}
        choices:
          - {pt: "Quinases ativam outras quinases em sequência (amplificação)", en: "Kinases activate other kinases in sequence (amplification)"}
          - {pt: "Apenas uma reação", en: "Only one reaction"}
          - {pt: "Apenas uma proteína", en: "Only one protein"}
          - {pt: "Não amplifica", en: "Doesn't amplify"}
        correctAnswer: {pt: "Quinases ativam outras quinases em sequência (amplificação)", en: "Kinases activate other kinases in sequence (amplification)"}
        rationale: {pt: "Como cada passo multiplica o efeito, então um sinal fraco gera resposta forte e rápida.", en: "Because each step multiplies the effect, a weak signal generates strong, rapid response."}
        objectives: [biology.signaling]
        difficulty: 3
  - pageNumber: 2
    title: {pt: "Resposta e tipos de sinalização", en: "Response and signaling types"}
    description: {pt: "Onde o sinal termina.", en: "Where the signal ends."}
    exercises:
      - type: choice
        question: {pt: "Resposta celular ao sinal pode ser:", en: "Cellular response to signal can be:"}
        choices:
          - {pt: "Mudança em atividade enzimática, expressão gênica ou comportamento", en: "Change in enzyme activity, gene expression, or behavior"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas dor", en: "Just pain"}
          - {pt: "Apenas cor", en: "Just color"}
        correctAnswer: {pt: "Mudança em atividade enzimática, expressão gênica ou comportamento", en: "Change in enzyme activity, gene expression, or behavior"}
        rationale: {pt: "Como o efeito final depende do alvo, então cada cascata tem resposta específica — diversidade biológica.", en: "Because the final effect depends on the target, each cascade has a specific response — biological diversity."}
        objectives: [biology.signaling]
        difficulty: 3
      - type: choice
        question: {pt: "Sinalização autócrina:", en: "Autocrine signaling:"}
        choices:
          - {pt: "Célula sinaliza para si mesma", en: "Cell signals to itself"}
          - {pt: "Célula sinaliza ao vizinho", en: "Cell signals to neighbor"}
          - {pt: "Sinaliza por toda parte", en: "Signals everywhere"}
          - {pt: "Não sinaliza", en: "Doesn't signal"}
        correctAnswer: {pt: "Célula sinaliza para si mesma", en: "Cell signals to itself"}
        rationale: {pt: "Como o ligante se liga ao próprio receptor, então o feedback positivo ou ajuste fino é local.", en: "Because the ligand binds to its own receptor, positive feedback or fine-tuning is local."}
        objectives: [biology.signaling]
        difficulty: 3
      - type: choice
        question: {pt: "Sinalização parácrina:", en: "Paracrine signaling:"}
        choices:
          - {pt: "Atinge células vizinhas próximas", en: "Reaches nearby neighbors"}
          - {pt: "Apenas a própria célula", en: "Only the cell itself"}
          - {pt: "O corpo todo", en: "The whole body"}
          - {pt: "Apenas distantes", en: "Only distant"}
        correctAnswer: {pt: "Atinge células vizinhas próximas", en: "Reaches nearby neighbors"}
        rationale: {pt: "Como o ligante difunde curtas distâncias, então a sinalização atua localmente — ex.: fatores de crescimento.", en: "Because the ligand diffuses short distances, signaling acts locally — e.g., growth factors."}
        objectives: [biology.signaling]
        difficulty: 3
      - type: choice
        question: {pt: "Sinalização endócrina:", en: "Endocrine signaling:"}
        choices:
          - {pt: "Hormônios viajam pelo sangue até alvos distantes", en: "Hormones travel via blood to distant targets"}
          - {pt: "Apenas local", en: "Only local"}
          - {pt: "Não usa sangue", en: "Doesn't use blood"}
          - {pt: "Apenas em plantas", en: "Only in plants"}
        correctAnswer: {pt: "Hormônios viajam pelo sangue até alvos distantes", en: "Hormones travel via blood to distant targets"}
        rationale: {pt: "Como o hormônio atinge muitos órgãos, então a resposta é coordenada e sistêmica — insulina, tiroxina.", en: "Because the hormone reaches many organs, the response is coordinated and systemic — insulin, thyroxine."}
        objectives: [biology.signaling]
        difficulty: 3
      - type: choice
        question: {pt: "Sinapse química usa:", en: "Chemical synapse uses:"}
        choices:
          - {pt: "Neurotransmissores via fenda sináptica", en: "Neurotransmitters via synaptic cleft"}
          - {pt: "Apenas eletricidade direta", en: "Only direct electricity"}
          - {pt: "Apenas hormônios sanguíneos", en: "Only blood hormones"}
          - {pt: "Apenas DNA", en: "Only DNA"}
        correctAnswer: {pt: "Neurotransmissores via fenda sináptica", en: "Neurotransmitters via synaptic cleft"}
        rationale: {pt: "Como vesículas liberam neurotransmissor, então o sinal cruza a fenda em milissegundos — tipo de sinalização parácrina rápida.", en: "Because vesicles release neurotransmitter, the signal crosses the cleft in milliseconds — a fast paracrine signaling."}
        objectives: [biology.signaling]
        difficulty: 3
      - type: choice
        question: {pt: "Adrenalina prepara corpo para luta-ou-fuga ao:", en: "Adrenaline prepares the body for fight-or-flight by:"}
        choices:
          - {pt: "Ativar GPCRs que elevam cAMP em vários tecidos", en: "Activating GPCRs that raise cAMP in many tissues"}
          - {pt: "Apenas mudar cor da pele", en: "Just changing skin color"}
          - {pt: "Apenas dar dor de cabeça", en: "Just giving headache"}
          - {pt: "Sem efeito", en: "No effect"}
        correctAnswer: {pt: "Ativar GPCRs que elevam cAMP em vários tecidos", en: "Activating GPCRs that raise cAMP in many tissues"}
        rationale: {pt: "Como a cascata é amplificada, então um único hormônio acelera coração, dilata vasos e libera glicose.", en: "Because the cascade is amplified, a single hormone speeds the heart, dilates vessels, and releases glucose."}
        objectives: [biology.signaling]
        difficulty: 3
      - type: choice
        question: {pt: "Inibição (terminação) do sinal envolve:", en: "Signal inhibition (termination) involves:"}
        choices:
          - {pt: "Fosfatases, degradação do segundo mensageiro, internalização do receptor", en: "Phosphatases, second-messenger breakdown, receptor internalization"}
          - {pt: "Não acontece", en: "Doesn't happen"}
          - {pt: "Apenas amplificação", en: "Only amplification"}
          - {pt: "Apenas resposta", en: "Only response"}
        correctAnswer: {pt: "Fosfatases, degradação do segundo mensageiro, internalização do receptor", en: "Phosphatases, second-messenger breakdown, receptor internalization"}
        rationale: {pt: "Como o sinal precisa cessar para a célula \"resetar\", então mecanismos de desligamento são tão importantes quanto a ativação.", en: "Because the signal must cease for the cell to \"reset\", shut-off mechanisms are as important as activation."}
        objectives: [biology.signaling]
        difficulty: 3
      - type: choice
        question: {pt: "Apoptose (morte celular programada) pode ser desencadeada por:", en: "Apoptosis (programmed cell death) can be triggered by:"}
        choices:
          - {pt: "Sinais externos (TNF, FasL) ou internos (dano de DNA)", en: "External signals (TNF, FasL) or internal (DNA damage)"}
          - {pt: "Apenas falta de água", en: "Only lack of water"}
          - {pt: "Apenas falta de luz", en: "Only lack of light"}
          - {pt: "Apenas calor extremo", en: "Only extreme heat"}
        correctAnswer: {pt: "Sinais externos (TNF, FasL) ou internos (dano de DNA)", en: "External signals (TNF, FasL) or internal (DNA damage)"}
        rationale: {pt: "Como células danificadas se autodestroem para o bem do organismo, então a sinalização controla quando viver ou morrer.", en: "Because damaged cells self-destruct for the organism's good, signaling controls when to live or die."}
        objectives: [biology.signaling]
        difficulty: 3
      - type: choice
        question: {pt: "Câncer envolve frequentemente:", en: "Cancer often involves:"}
        choices:
          - {pt: "Falhas em vias de sinalização (crescimento descontrolado)", en: "Failures in signaling pathways (uncontrolled growth)"}
          - {pt: "Excesso de cálcio nos ossos", en: "Excess bone calcium"}
          - {pt: "Apenas falta de oxigênio", en: "Only lack of O₂"}
          - {pt: "Apenas falta de DNA", en: "Only lack of DNA"}
        correctAnswer: {pt: "Falhas em vias de sinalização (crescimento descontrolado)", en: "Failures in signaling pathways (uncontrolled growth)"}
        rationale: {pt: "Como mutações em receptores ou cascatas levam à divisão sem controle, então alvos de câncer são frequentemente sinalizadores.", en: "Because mutations in receptors or cascades cause uncontrolled division, cancer targets are often signaling proteins."}
        objectives: [biology.signaling]
        difficulty: 3
      - type: choice
        question: {pt: "Resumo: sinalização celular permite:", en: "Summary: cell signaling enables:"}
        choices:
          - {pt: "Comunicação coordenada entre células de um organismo (e ambiente)", en: "Coordinated communication among cells of an organism (and environment)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas digestão", en: "Just digestion"}
          - {pt: "Apenas movimento", en: "Just movement"}
        correctAnswer: {pt: "Comunicação coordenada entre células de um organismo (e ambiente)", en: "Coordinated communication among cells of an organism (and environment)"}
        rationale: {pt: "Sem sinalização, organismos multicelulares seriam apenas aglomerados — então é o que possibilita complexidade biológica.", en: "Without signaling, multicellular organisms would be mere clumps — it's what makes biological complexity possible."}
        objectives: [biology.signaling]
        difficulty: 3
target: 20
