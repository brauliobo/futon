title:
  pt: "🌡️ Enzimas — fatores que afetam"
  en: "🌡️ Enzymes — factors that affect them"
level: '5A'
subject: biology
objectives: [biology.enzymes]
difficulty: 3
authorNotes: "Temperatura, pH, concentração de substrato, inibidores."
example:
  pt: "Ex.: temperatura ↑ → velocidade ↑ até ótimo, depois enzima desnatura. pH fora do ótimo → atividade cai."
  en: "Ex.: temperature ↑ → rate ↑ until optimum, then enzyme denatures. pH outside optimum → activity drops."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Temperatura e pH", en: "Temperature and pH"}
    description: {pt: "Como condições ambientais afetam.", en: "How environmental conditions affect."}
    exercises:
      - type: choice
        question: {pt: "Aumentar a temperatura geralmente:", en: "Increasing temperature generally:"}
        choices:
          - {pt: "Acelera a reação até a temperatura ótima, depois desnatura a enzima", en: "Speeds up reaction until optimum, then denatures the enzyme"}
          - {pt: "Sempre acelera indefinidamente", en: "Always speeds up indefinitely"}
          - {pt: "Nunca tem efeito", en: "Has no effect"}
          - {pt: "Sempre desnatura", en: "Always denatures"}
        correctAnswer: {pt: "Acelera a reação até a temperatura ótima, depois desnatura a enzima", en: "Speeds up reaction until optimum, then denatures the enzyme"}
        rationale: {pt: "Como mais energia cinética aumenta colisões, então a velocidade sobe; acima do ótimo, ligações se rompem e enzima inativa.", en: "Because more kinetic energy boosts collisions, rate rises; above optimum, bonds break and enzyme inactivates."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Temperatura ótima da maioria das enzimas humanas:", en: "Optimum temperature of most human enzymes:"}
        choices:
          - {pt: "~37 °C (temperatura corporal)", en: "~37 °C (body temperature)"}
          - {pt: "0 °C", en: "0 °C"}
          - {pt: "100 °C", en: "100 °C"}
          - {pt: "-20 °C", en: "-20 °C"}
        correctAnswer: {pt: "~37 °C (temperatura corporal)", en: "~37 °C (body temperature)"}
        rationale: {pt: "Como evoluímos com temperatura interna estável, então enzimas humanas otimizam-se nessa faixa.", en: "Because we evolved with stable internal temperature, human enzymes optimize at that range."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "pH ótimo da pepsina (estômago) é:", en: "Optimum pH of pepsin (stomach) is:"}
        choices:
          - {pt: "~2 (muito ácido)", en: "~2 (very acidic)"}
          - {pt: "~7 (neutro)", en: "~7 (neutral)"}
          - {pt: "~11 (básico)", en: "~11 (basic)"}
          - {pt: "Apenas 14", en: "Only 14"}
        correctAnswer: {pt: "~2 (muito ácido)", en: "~2 (very acidic)"}
        rationale: {pt: "Como o estômago é ácido, então pepsina evoluiu para funcionar em pH baixo — fora dele, é inativa.", en: "Because the stomach is acidic, pepsin evolved to work at low pH — outside it, inactive."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "pH ótimo da maioria das enzimas humanas:", en: "Optimum pH of most human enzymes:"}
        choices:
          - {pt: "~7 (neutro/intracelular)", en: "~7 (neutral/intracellular)"}
          - {pt: "~2", en: "~2"}
          - {pt: "~14", en: "~14"}
          - {pt: "0", en: "0"}
        correctAnswer: {pt: "~7 (neutro/intracelular)", en: "~7 (neutral/intracellular)"}
        rationale: {pt: "Como o citoplasma e o sangue são quase neutros, então a maioria das enzimas humanas opera nessa faixa.", en: "Because cytoplasm and blood are nearly neutral, most human enzymes work in that range."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Por que febre alta é perigosa?", en: "Why is high fever dangerous?"}
        choices:
          - {pt: "Pode desnaturar enzimas e proteínas vitais", en: "Can denature vital enzymes and proteins"}
          - {pt: "Apenas dá calor", en: "Just feels hot"}
          - {pt: "Apenas escurece a pele", en: "Just darkens skin"}
          - {pt: "Não tem efeito", en: "Has no effect"}
        correctAnswer: {pt: "Pode desnaturar enzimas e proteínas vitais", en: "Can denature vital enzymes and proteins"}
        rationale: {pt: "Como acima de ~40 °C proteínas começam a perder forma, então funções celulares falham — risco real à vida.", en: "Because above ~40 °C proteins start losing shape, cellular functions fail — a real life risk."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Refrigeração preserva alimentos porque:", en: "Refrigeration preserves food because:"}
        choices:
          - {pt: "Diminui a atividade enzimática (microbiana e do alimento)", en: "Slows enzyme activity (microbial and food)"}
          - {pt: "Mata todos os micróbios", en: "Kills all microbes"}
          - {pt: "Tira sabor", en: "Removes flavor"}
          - {pt: "Adiciona sal", en: "Adds salt"}
        correctAnswer: {pt: "Diminui a atividade enzimática (microbiana e do alimento)", en: "Slows enzyme activity (microbial and food)"}
        rationale: {pt: "Como baixa temperatura reduz energia cinética, então deterioração e crescimento bacteriano lentificam — mas não param.", en: "Because low temperature reduces kinetic energy, spoilage and bacterial growth slow — but don't stop."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Concentração de substrato e velocidade da reação:", en: "Substrate concentration and reaction rate:"}
        choices:
          - {pt: "Aumenta a velocidade até saturar a enzima (Vmax)", en: "Increases rate until enzyme saturates (Vmax)"}
          - {pt: "Sempre aumenta", en: "Always increases"}
          - {pt: "Sempre diminui", en: "Always decreases"}
          - {pt: "Não tem relação", en: "No relation"}
        correctAnswer: {pt: "Aumenta a velocidade até saturar a enzima (Vmax)", en: "Increases rate until enzyme saturates (Vmax)"}
        rationale: {pt: "Como sítios ativos são limitados, então acima de certa concentração todos estão ocupados — daí o platô.", en: "Because active sites are limited, above some concentration all are occupied — hence the plateau."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Vmax representa:", en: "Vmax represents:"}
        choices:
          - {pt: "Velocidade máxima da reação com enzimas saturadas", en: "Maximum reaction rate with enzymes saturated"}
          - {pt: "Velocidade mínima", en: "Minimum rate"}
          - {pt: "Velocidade aleatória", en: "Random rate"}
          - {pt: "Volume da célula", en: "Cell volume"}
        correctAnswer: {pt: "Velocidade máxima da reação com enzimas saturadas", en: "Maximum reaction rate with enzymes saturated"}
        rationale: {pt: "Como sítios ativos estão 100% ocupados, então só podemos aumentar Vmax adicionando mais enzima.", en: "Because active sites are 100% occupied, we can only increase Vmax by adding more enzyme."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Concentração de enzima e velocidade:", en: "Enzyme concentration and rate:"}
        choices:
          - {pt: "Aumenta proporcionalmente quando há substrato em excesso", en: "Increases proportionally when substrate is in excess"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Diminui sempre", en: "Always decreases"}
          - {pt: "Independente do substrato", en: "Independent of substrate"}
        correctAnswer: {pt: "Aumenta proporcionalmente quando há substrato em excesso", en: "Increases proportionally when substrate is in excess"}
        rationale: {pt: "Como cada enzima processa substratos, então mais enzima = mais reações por segundo (com substrato sobrando).", en: "Because each enzyme processes substrates, more enzyme = more reactions per second (with excess substrate)."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Bactérias termofílicas (em fontes termais) têm enzimas:", en: "Thermophilic bacteria (in hot springs) have enzymes:"}
        choices:
          - {pt: "Estáveis a temperaturas muito altas (até ~100 °C)", en: "Stable at very high temperatures (up to ~100 °C)"}
          - {pt: "Que congelam", en: "That freeze"}
          - {pt: "Idênticas às humanas", en: "Identical to humans'"}
          - {pt: "Que não funcionam", en: "That don't work"}
        correctAnswer: {pt: "Estáveis a temperaturas muito altas (até ~100 °C)", en: "Stable at very high temperatures (up to ~100 °C)"}
        rationale: {pt: "Como evoluíram em ambientes quentes, então sua arquitetura proteica resiste à desnaturação — base da PCR (Taq polimerase).", en: "Because they evolved in hot habitats, their protein architecture resists denaturation — basis of PCR (Taq polymerase)."}
        objectives: [biology.enzymes]
        difficulty: 3
  - pageNumber: 2
    title: {pt: "Inibidores e regulação", en: "Inhibitors and regulation"}
    description: {pt: "Controle fino do metabolismo.", en: "Fine metabolic control."}
    exercises:
      - type: choice
        question: {pt: "Inibidor enzimático:", en: "Enzyme inhibitor:"}
        choices:
          - {pt: "Diminui a atividade da enzima (competitivo ou alostérico)", en: "Reduces enzyme activity (competitive or allosteric)"}
          - {pt: "Sempre aumenta a atividade", en: "Always increases activity"}
          - {pt: "Não tem efeito", en: "Has no effect"}
          - {pt: "Apenas em laboratório", en: "Only in lab"}
        correctAnswer: {pt: "Diminui a atividade da enzima (competitivo ou alostérico)", en: "Reduces enzyme activity (competitive or allosteric)"}
        rationale: {pt: "Como muitos remédios são inibidores enzimáticos, então a regulação química é base da farmacologia.", en: "Because many drugs are enzyme inhibitors, chemical regulation is a foundation of pharmacology."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Aspirina inibe:", en: "Aspirin inhibits:"}
        choices:
          - {pt: "Enzima ciclooxigenase (reduz inflamação e dor)", en: "Cyclooxygenase enzyme (reduces inflammation and pain)"}
          - {pt: "DNA polimerase", en: "DNA polymerase"}
          - {pt: "Amilase", en: "Amylase"}
          - {pt: "Lipase", en: "Lipase"}
        correctAnswer: {pt: "Enzima ciclooxigenase (reduz inflamação e dor)", en: "Cyclooxygenase enzyme (reduces inflammation and pain)"}
        rationale: {pt: "Como COX produz prostaglandinas inflamatórias, então bloqueá-la alivia dor e inflamação.", en: "Because COX makes inflammatory prostaglandins, blocking it relieves pain and inflammation."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Penicilina mata bactérias ao:", en: "Penicillin kills bacteria by:"}
        choices:
          - {pt: "Inibir enzima que constrói a parede celular bacteriana", en: "Inhibiting an enzyme that builds the bacterial cell wall"}
          - {pt: "Bloquear ribossomos humanos", en: "Blocking human ribosomes"}
          - {pt: "Bombear sangue", en: "Pumping blood"}
          - {pt: "Mudar cor da pele", en: "Changing skin color"}
        correctAnswer: {pt: "Inibir enzima que constrói a parede celular bacteriana", en: "Inhibiting an enzyme that builds the bacterial cell wall"}
        rationale: {pt: "Como humanos não têm parede celular, então o medicamento mata bactérias sem afetar nossas células.", en: "Because humans lack cell walls, the drug kills bacteria without harming our cells."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Feedback negativo na regulação enzimática:", en: "Negative feedback in enzyme regulation:"}
        choices:
          - {pt: "Produto final inibe a enzima inicial da via", en: "End product inhibits the early enzyme in the pathway"}
          - {pt: "Sempre acelera", en: "Always speeds up"}
          - {pt: "Não existe", en: "Doesn't exist"}
          - {pt: "Apenas em plantas", en: "Only in plants"}
        correctAnswer: {pt: "Produto final inibe a enzima inicial da via", en: "End product inhibits the early enzyme in the pathway"}
        rationale: {pt: "Como excesso de produto sinaliza saturação, então inibir o início da via economiza energia — homeostase metabólica.", en: "Because excess product signals saturation, inhibiting the start of the pathway saves energy — metabolic homeostasis."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Cofator NAD⁺ atua em:", en: "The cofactor NAD⁺ acts in:"}
        choices:
          - {pt: "Reações de oxidação (carregando elétrons)", en: "Oxidation reactions (carrying electrons)"}
          - {pt: "Síntese de DNA", en: "DNA synthesis"}
          - {pt: "Transporte de O₂", en: "O₂ transport"}
          - {pt: "Defesa imune", en: "Immune defense"}
        correctAnswer: {pt: "Reações de oxidação (carregando elétrons)", en: "Oxidation reactions (carrying electrons)"}
        rationale: {pt: "Como NAD⁺ aceita elétrons (vira NADH), então transporta-os à cadeia respiratória — vital ao metabolismo.", en: "Because NAD⁺ accepts electrons (becoming NADH), it carries them to the respiratory chain — vital to metabolism."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Vitaminas frequentemente atuam como:", en: "Vitamins often act as:"}
        choices:
          - {pt: "Coenzimas (precursoras de cofatores)", en: "Coenzymes (cofactor precursors)"}
          - {pt: "Apenas dão sabor", en: "Just for flavor"}
          - {pt: "Apenas dão cor", en: "Just for color"}
          - {pt: "São tóxicas", en: "Are toxic"}
        correctAnswer: {pt: "Coenzimas (precursoras de cofatores)", en: "Coenzymes (cofactor precursors)"}
        rationale: {pt: "Como muitas vitaminas (B₁, B₂, B₃, B₅, etc.) compõem coenzimas, então deficiência paralisa enzimas dependentes.", en: "Because many vitamins (B₁, B₂, B₃, B₅, etc.) form coenzymes, deficiency stalls dependent enzymes."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Sítio alostérico é:", en: "Allosteric site is:"}
        choices:
          - {pt: "Sítio diferente do ativo onde reguladores se ligam", en: "A site different from the active one where regulators bind"}
          - {pt: "Mesmo que sítio ativo", en: "Same as the active site"}
          - {pt: "Não existe", en: "Doesn't exist"}
          - {pt: "Apenas em tóxicos", en: "Only in toxins"}
        correctAnswer: {pt: "Sítio diferente do ativo onde reguladores se ligam", en: "A site different from the active one where regulators bind"}
        rationale: {pt: "Como ligação alostérica muda a forma da enzima, então pode ativar ou inibir sem competir com o substrato.", en: "Because allosteric binding changes enzyme shape, it can activate or inhibit without competing with substrate."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Enzimas digestivas humanas começam a falhar a qual pH?", en: "Human digestive enzymes start failing at which pH?"}
        choices:
          - {pt: "Bem fora do seu pH ótimo (cada uma tem sua faixa)", en: "Well outside their optimum pH (each has its own range)"}
          - {pt: "Em qualquer pH", en: "At any pH"}
          - {pt: "Apenas em 14", en: "Only at 14"}
          - {pt: "Apenas em 0", en: "Only at 0"}
        correctAnswer: {pt: "Bem fora do seu pH ótimo (cada uma tem sua faixa)", en: "Well outside their optimum pH (each has its own range)"}
        rationale: {pt: "Como cada compartimento digestivo tem pH distinto (estômago ácido, intestino básico), então enzimas locais ajustam-se.", en: "Because each digestive compartment has its own pH (acidic stomach, basic intestine), local enzymes adapt."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Quando enzima desnatura:", en: "When an enzyme denatures:"}
        choices:
          - {pt: "Perde estrutura 3D e função; geralmente irreversível", en: "Loses 3D structure and function; usually irreversible"}
          - {pt: "Sempre se recupera", en: "Always recovers"}
          - {pt: "Vira uma nova enzima", en: "Becomes a new enzyme"}
          - {pt: "Cresce mais", en: "Grows more"}
        correctAnswer: {pt: "Perde estrutura 3D e função; geralmente irreversível", en: "Loses 3D structure and function; usually irreversible"}
        rationale: {pt: "Como pontes que estabilizam o dobramento são quebradas, então a célula precisa sintetizar nova enzima.", en: "Because folding-stabilizing bonds break, the cell must synthesize a new enzyme."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Resumo: a atividade enzimática depende de:", en: "Summary: enzyme activity depends on:"}
        choices:
          - {pt: "Temperatura, pH, concentração de substrato/enzima e inibidores", en: "Temperature, pH, substrate/enzyme concentration, and inhibitors"}
          - {pt: "Apenas cor", en: "Only color"}
          - {pt: "Apenas hora do dia", en: "Only time of day"}
          - {pt: "Apenas humor", en: "Only mood"}
        correctAnswer: {pt: "Temperatura, pH, concentração de substrato/enzima e inibidores", en: "Temperature, pH, substrate/enzyme concentration, and inhibitors"}
        rationale: {pt: "Quatro fatores integrados controlam a velocidade — então o metabolismo é finamente ajustável.", en: "Four integrated factors control rate — making metabolism finely tunable."}
        objectives: [biology.enzymes]
        difficulty: 3
target: 20
