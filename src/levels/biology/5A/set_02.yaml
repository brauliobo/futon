title:
  pt: "💧 Água — molécula da vida"
  en: "💧 Water — the molecule of life"
level: '5A'
subject: biology
objectives: [biology.biochem]
difficulty: 3
authorNotes: "Polaridade, ligações de hidrogênio, propriedades emergentes."
example:
  pt: "Ex.: H–O–H polar → pontes de H → coesão, alto calor específico, capacidade de dissolver íons."
  en: "Ex.: H–O–H polar → H-bonds → cohesion, high specific heat, ability to dissolve ions."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Estrutura e propriedades", en: "Structure and properties"}
    description: {pt: "Por que água é especial.", en: "Why water is special."}
    exercises:
      - type: choice
        question: {pt: "Por que a molécula de água é polar?", en: "Why is the water molecule polar?"}
        choices:
          - {pt: "O atrai elétrons mais que H, gerando cargas parciais", en: "O pulls electrons more than H, creating partial charges"}
          - {pt: "Tem cor azul", en: "It is blue"}
          - {pt: "É uma molécula iônica", en: "It is ionic"}
          - {pt: "Tem mais de dois átomos", en: "It has more than two atoms"}
        correctAnswer: {pt: "O atrai elétrons mais que H, gerando cargas parciais", en: "O pulls electrons more than H, creating partial charges"}
        rationale: {pt: "Como a eletronegatividade do O é maior, então o lado do O fica δ⁻ e o dos H fica δ⁺ — molécula polar.", en: "Because O's electronegativity is greater, the O side is δ⁻ and the H side δ⁺ — a polar molecule."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Pontes de hidrogênio formam-se entre:", en: "Hydrogen bonds form between:"}
        choices:
          - {pt: "H δ⁺ de uma molécula e O δ⁻ de outra", en: "δ⁺ H of one molecule and δ⁻ O of another"}
          - {pt: "Sódio e cloro apenas", en: "Only sodium and chlorine"}
          - {pt: "Apenas dentro de uma molécula", en: "Only within one molecule"}
          - {pt: "Apenas entre íons", en: "Only between ions"}
        correctAnswer: {pt: "H δ⁺ de uma molécula e O δ⁻ de outra", en: "δ⁺ H of one molecule and δ⁻ O of another"}
        rationale: {pt: "Como cada H pode ligar-se a um O vizinho, então cada água conecta-se a até 4 outras — daí a coesão.", en: "Because each H can bond to a neighboring O, each water connects to up to 4 others — hence cohesion."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Por que a água é solvente universal?", en: "Why is water a universal solvent?"}
        choices:
          - {pt: "Polaridade dissolve íons e moléculas polares", en: "Polarity dissolves ions and polar molecules"}
          - {pt: "Sua cor", en: "Its color"}
          - {pt: "Sua temperatura", en: "Its temperature"}
          - {pt: "Sua viscosidade", en: "Its viscosity"}
        correctAnswer: {pt: "Polaridade dissolve íons e moléculas polares", en: "Polarity dissolves ions and polar molecules"}
        rationale: {pt: "Como dipolos cercam íons e neutralizam-os, então a água separa solutos polares — meio biológico funciona.", en: "Because dipoles surround and neutralize ions, water separates polar solutes — making biology work."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Coesão da água permite:", en: "Water cohesion enables:"}
        choices:
          - {pt: "Subida de seiva nas plantas e tensão superficial", en: "Sap rising in plants and surface tension"}
          - {pt: "Bombear sangue", en: "Pumping blood"}
          - {pt: "Trocar gases", en: "Gas exchange"}
          - {pt: "Mover ossos", en: "Moving bones"}
        correctAnswer: {pt: "Subida de seiva nas plantas e tensão superficial", en: "Sap rising in plants and surface tension"}
        rationale: {pt: "Como pontes de H prendem moléculas vizinhas, então a coluna de água sobe sem se romper — efeito coesão+adesão.", en: "Because H-bonds tether neighbors, the water column rises without breaking — cohesion+adhesion effect."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Alto calor específico da água significa que:", en: "Water's high specific heat means it:"}
        choices:
          - {pt: "Precisa muita energia para mudar de temperatura", en: "Needs much energy to change temperature"}
          - {pt: "Esquenta facilmente", en: "Heats up easily"}
          - {pt: "Não absorve calor", en: "Doesn't absorb heat"}
          - {pt: "Sempre é gelada", en: "Is always icy"}
        correctAnswer: {pt: "Precisa muita energia para mudar de temperatura", en: "Needs much energy to change temperature"}
        rationale: {pt: "Como pontes de H absorvem energia ao quebrar, então a água amortece variações térmicas — útil para regulação corporal e clima.", en: "Because H-bonds absorb energy when broken, water buffers thermal swings — helpful for body and climate regulation."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Por que o gelo flutua na água líquida?", en: "Why does ice float on liquid water?"}
        choices:
          - {pt: "Gelo é menos denso (estrutura cristalina aberta)", en: "Ice is less dense (open crystalline lattice)"}
          - {pt: "Gelo é mais denso", en: "Ice is denser"}
          - {pt: "Gelo é magnético", en: "Ice is magnetic"}
          - {pt: "Gelo é quente", en: "Ice is warm"}
        correctAnswer: {pt: "Gelo é menos denso (estrutura cristalina aberta)", en: "Ice is less dense (open crystalline lattice)"}
        rationale: {pt: "Como pontes de H formam uma rede aberta no estado sólido, então o gelo ocupa mais volume e flutua — vital para vida aquática.", en: "Because H-bonds form an open lattice when solid, ice takes more volume and floats — vital for aquatic life."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Sudação resfria o corpo porque:", en: "Sweating cools the body because:"}
        choices:
          - {pt: "Evaporação da água absorve calor (calor latente)", en: "Water evaporation absorbs heat (latent heat)"}
          - {pt: "Suor é frio", en: "Sweat is cold"}
          - {pt: "Suor reflete luz", en: "Sweat reflects light"}
          - {pt: "Suor produz frio", en: "Sweat produces cold"}
        correctAnswer: {pt: "Evaporação da água absorve calor (calor latente)", en: "Water evaporation absorbs heat (latent heat)"}
        rationale: {pt: "Como mudar de líquido para gás precisa quebrar pontes de H, então o suor leva calor embora ao evaporar — termorregulação.", en: "Because going from liquid to gas breaks H-bonds, sweat carries heat away when evaporating — thermoregulation."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "pH da água pura é:", en: "Pure water's pH is:"}
        choices:
          - {pt: "7 (neutro)", en: "7 (neutral)"}
          - {pt: "1 (ácido)", en: "1 (acid)"}
          - {pt: "14 (base)", en: "14 (base)"}
          - {pt: "0", en: "0"}
        correctAnswer: {pt: "7 (neutro)", en: "7 (neutral)"}
        rationale: {pt: "Como [H⁺] = [OH⁻] = 10⁻⁷, então a auto-ionização da água define o ponto neutro da escala.", en: "Because [H⁺] = [OH⁻] = 10⁻⁷, water's self-ionization defines the neutral midpoint."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Hidrofílico significa:", en: "Hydrophilic means:"}
        choices:
          - {pt: "Que se mistura bem com água (polar/iônico)", en: "Mixes well with water (polar/ionic)"}
          - {pt: "Que evita água", en: "Avoids water"}
          - {pt: "Que afunda na água", en: "Sinks in water"}
          - {pt: "Que congela na água", en: "Freezes in water"}
        correctAnswer: {pt: "Que se mistura bem com água (polar/iônico)", en: "Mixes well with water (polar/ionic)"}
        rationale: {pt: "Como o termo vem do grego (hidro = água, fílico = afinidade), então hidrofílicas formam pontes de H com água.", en: "Because the term comes from Greek (hydro = water, philic = affinity), hydrophilic substances H-bond with water."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Hidrofóbico significa:", en: "Hydrophobic means:"}
        choices:
          - {pt: "Que evita água (apolar, como óleos)", en: "Avoids water (nonpolar, like oils)"}
          - {pt: "Que ama água", en: "Loves water"}
          - {pt: "Que dissolve facilmente", en: "Dissolves easily"}
          - {pt: "Que congela água", en: "Freezes water"}
        correctAnswer: {pt: "Que evita água (apolar, como óleos)", en: "Avoids water (nonpolar, like oils)"}
        rationale: {pt: "Como moléculas apolares não fazem pontes de H, então se agrupam separadamente — base da formação de membranas.", en: "Because nonpolar molecules don't H-bond, they cluster separately — basis of membrane formation."}
        objectives: [biology.biochem]
        difficulty: 3
  - pageNumber: 2
    title: {pt: "Água nos sistemas biológicos", en: "Water in biological systems"}
    description: {pt: "Aplicações concretas.", en: "Concrete applications."}
    exercises:
      - type: choice
        question: {pt: "Aproximadamente, qual é a porcentagem de água no corpo humano adulto?", en: "Approximately, what % water is in an adult human body?"}
        choices:
          - {pt: "Cerca de 60%", en: "About 60%"}
          - {pt: "5%", en: "5%"}
          - {pt: "100%", en: "100%"}
          - {pt: "10%", en: "10%"}
        correctAnswer: {pt: "Cerca de 60%", en: "About 60%"}
        rationale: {pt: "Como células, sangue e fluidos são majoritariamente aquosos, então a maior parte da nossa massa é água.", en: "Because cells, blood, and fluids are mostly aqueous, most of our mass is water."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Em reações de hidrólise, a água:", en: "In hydrolysis reactions, water:"}
        choices:
          - {pt: "Quebra ligações ao adicionar -H e -OH", en: "Breaks bonds by adding -H and -OH"}
          - {pt: "Forma novas ligações", en: "Forms new bonds"}
          - {pt: "Não participa", en: "Doesn't participate"}
          - {pt: "Apenas resfria", en: "Just cools"}
        correctAnswer: {pt: "Quebra ligações ao adicionar -H e -OH", en: "Breaks bonds by adding -H and -OH"}
        rationale: {pt: "Como hidrólise (do grego: água + corte) parte uma ligação com um H₂O, então digestão depende dela.", en: "Because hydrolysis (Greek: water + cut) splits a bond with an H₂O, digestion depends on it."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Em reações de condensação (síntese por desidratação):", en: "In condensation (dehydration synthesis) reactions:"}
        choices:
          - {pt: "Une-se duas moléculas removendo uma água", en: "Two molecules join, removing water"}
          - {pt: "Quebra-se ligações com água", en: "Bonds break with water"}
          - {pt: "Nada acontece", en: "Nothing happens"}
          - {pt: "Apenas absorve calor", en: "Just absorbs heat"}
        correctAnswer: {pt: "Une-se duas moléculas removendo uma água", en: "Two molecules join, removing water"}
        rationale: {pt: "Como ligar dois monômeros libera uma molécula de água, então polímeros (proteínas, DNA, amido) crescem por desidratação.", en: "Because joining two monomers releases a water molecule, polymers (proteins, DNA, starch) grow via dehydration."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Solução tampão (buffer) serve para:", en: "A buffer solution serves to:"}
        choices:
          - {pt: "Resistir a mudanças de pH", en: "Resist pH changes"}
          - {pt: "Mudar a cor", en: "Change color"}
          - {pt: "Aumentar a temperatura", en: "Increase temperature"}
          - {pt: "Acelerar reações", en: "Speed up reactions"}
        correctAnswer: {pt: "Resistir a mudanças de pH", en: "Resist pH changes"}
        rationale: {pt: "Como pares ácido-base conjugados absorvem H⁺ ou OH⁻, então o sangue mantém pH ~7.4 apesar de ácidos metabólicos.", en: "Because conjugate acid-base pairs absorb H⁺ or OH⁻, blood maintains pH ~7.4 despite metabolic acids."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Membranas celulares se formam porque:", en: "Cell membranes form because:"}
        choices:
          - {pt: "Caudas hidrofóbicas dos lipídios se afastam da água", en: "Hydrophobic lipid tails avoid water"}
          - {pt: "Água repele todos os lipídios", en: "Water repels all lipids"}
          - {pt: "Lipídios congelam", en: "Lipids freeze"}
          - {pt: "Sem motivo", en: "No reason"}
        correctAnswer: {pt: "Caudas hidrofóbicas dos lipídios se afastam da água", en: "Hydrophobic lipid tails avoid water"}
        rationale: {pt: "Como cabeças polares ficam para fora e caudas para dentro, então surge espontaneamente a bicamada lipídica.", en: "Because polar heads face outward and tails inward, the lipid bilayer self-assembles spontaneously."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Por que peixes podem viver em lagos congelados?", en: "Why can fish live in frozen lakes?"}
        choices:
          - {pt: "Gelo isola superfície e água líquida persiste embaixo", en: "Ice insulates the surface and liquid water remains below"}
          - {pt: "Peixes não precisam água", en: "Fish don't need water"}
          - {pt: "Peixes voam", en: "Fish fly"}
          - {pt: "Gelo é gás", en: "Ice is a gas"}
        correctAnswer: {pt: "Gelo isola superfície e água líquida persiste embaixo", en: "Ice insulates the surface and liquid water remains below"}
        rationale: {pt: "Como o gelo flutua e isola termicamente, então peixes sobrevivem na água líquida — propriedade emergente da ponte H.", en: "Because ice floats and insulates, fish survive in liquid water below — an emergent property of H-bonding."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Capilaridade refere-se a:", en: "Capillarity refers to:"}
        choices:
          - {pt: "Água subindo em tubos finos por adesão e coesão", en: "Water rising in thin tubes by adhesion and cohesion"}
          - {pt: "Água descendo apenas", en: "Water just going down"}
          - {pt: "Água ferver", en: "Water boiling"}
          - {pt: "Água congelar", en: "Water freezing"}
        correctAnswer: {pt: "Água subindo em tubos finos por adesão e coesão", en: "Water rising in thin tubes by adhesion and cohesion"}
        rationale: {pt: "Quando paredes do tubo atraem água (adesão) e coesão segura a coluna, então o líquido sobe contra a gravidade.", en: "When tube walls attract water (adhesion) and cohesion holds the column, liquid rises against gravity."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "pH ácido tem [H⁺]:", en: "Acidic pH has [H⁺]:"}
        choices:
          - {pt: "Maior que 10⁻⁷ M", en: "Greater than 10⁻⁷ M"}
          - {pt: "Menor que 10⁻⁷ M", en: "Less than 10⁻⁷ M"}
          - {pt: "Igual a 0", en: "Equal to 0"}
          - {pt: "Não definido", en: "Undefined"}
        correctAnswer: {pt: "Maior que 10⁻⁷ M", en: "Greater than 10⁻⁷ M"}
        rationale: {pt: "Como pH = -log[H⁺], então pH < 7 corresponde a maior concentração de H⁺ — ácido.", en: "Because pH = -log[H⁺], pH < 7 means higher H⁺ concentration — acidic."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Sangue humano normal tem pH:", en: "Normal human blood pH is:"}
        choices:
          - {pt: "~7.4 (levemente básico)", en: "~7.4 (slightly basic)"}
          - {pt: "1.0", en: "1.0"}
          - {pt: "14", en: "14"}
          - {pt: "0", en: "0"}
        correctAnswer: {pt: "~7.4 (levemente básico)", en: "~7.4 (slightly basic)"}
        rationale: {pt: "Como enzimas funcionam só nessa faixa estreita, então buffers do sangue mantêm pH com tolerância mínima.", en: "Because enzymes only work in that narrow range, blood buffers maintain pH with minimal tolerance."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Resumo: a água é especial porque:", en: "Summary: water is special because:"}
        choices:
          - {pt: "Pontes de hidrogênio geram propriedades únicas (coesão, calor específico, densidade do gelo)", en: "Hydrogen bonds create unique properties (cohesion, specific heat, ice density)"}
          - {pt: "É colorida", en: "It is colored"}
          - {pt: "É magnética", en: "It is magnetic"}
          - {pt: "É radioativa", en: "It is radioactive"}
        correctAnswer: {pt: "Pontes de hidrogênio geram propriedades únicas (coesão, calor específico, densidade do gelo)", en: "Hydrogen bonds create unique properties (cohesion, specific heat, ice density)"}
        rationale: {pt: "Como tudo em biologia depende dessas propriedades, então sem elas a vida como conhecemos não existiria.", en: "Because everything in biology depends on these properties, without them life as we know it wouldn't exist."}
        objectives: [biology.biochem]
        difficulty: 3
target: 20
