title:
  pt: "🧬 Ácidos nucleicos — DNA e RNA"
  en: "🧬 Nucleic acids — DNA and RNA"
level: '5A'
subject: biology
objectives: [biology.biochem]
difficulty: 3
authorNotes: "Estrutura do DNA e RNA, replicação, transcrição."
example:
  pt: "Ex.: nucleotídeo = açúcar + fosfato + base; DNA → mRNA (transcrição) → proteína (tradução)."
  en: "Ex.: nucleotide = sugar + phosphate + base; DNA → mRNA (transcription) → protein (translation)."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Estrutura do DNA", en: "DNA structure"}
    description: {pt: "Os blocos do código genético.", en: "Building blocks of genetic code."}
    exercises:
      - type: choice
        question: {pt: "Um nucleotídeo é composto por:", en: "A nucleotide is made of:"}
        choices:
          - {pt: "Açúcar (pentose) + fosfato + base nitrogenada", en: "Sugar (pentose) + phosphate + nitrogenous base"}
          - {pt: "Apenas açúcar", en: "Only sugar"}
          - {pt: "Apenas aminoácido", en: "Only amino acid"}
          - {pt: "Apenas lipídio", en: "Only lipid"}
        correctAnswer: {pt: "Açúcar (pentose) + fosfato + base nitrogenada", en: "Sugar (pentose) + phosphate + nitrogenous base"}
        rationale: {pt: "Como esses três componentes se ligam covalentemente, então os nucleotídeos polimerizam em DNA/RNA.", en: "Because these three covalently link, nucleotides polymerize into DNA/RNA."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "DNA contém o açúcar:", en: "DNA contains the sugar:"}
        choices:
          - {pt: "Desoxirribose", en: "Deoxyribose"}
          - {pt: "Ribose", en: "Ribose"}
          - {pt: "Glicose", en: "Glucose"}
          - {pt: "Frutose", en: "Fructose"}
        correctAnswer: {pt: "Desoxirribose", en: "Deoxyribose"}
        rationale: {pt: "Como desoxirribose carece do OH no carbono 2', então o DNA é mais estável que o RNA.", en: "Because deoxyribose lacks the 2' OH, DNA is more stable than RNA."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "RNA contém o açúcar:", en: "RNA contains the sugar:"}
        choices:
          - {pt: "Ribose", en: "Ribose"}
          - {pt: "Desoxirribose", en: "Deoxyribose"}
          - {pt: "Glicose", en: "Glucose"}
          - {pt: "Maltose", en: "Maltose"}
        correctAnswer: {pt: "Ribose", en: "Ribose"}
        rationale: {pt: "Como o OH adicional torna ribose mais reativa, então RNA é mais flexível e menos estável que DNA.", en: "Because the extra OH makes ribose more reactive, RNA is more flexible and less stable than DNA."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Bases do DNA:", en: "DNA bases:"}
        choices:
          - {pt: "A, T, C, G", en: "A, T, C, G"}
          - {pt: "A, U, C, G", en: "A, U, C, G"}
          - {pt: "X, Y, Z", en: "X, Y, Z"}
          - {pt: "1, 2, 3, 4", en: "1, 2, 3, 4"}
        correctAnswer: {pt: "A, T, C, G", en: "A, T, C, G"}
        rationale: {pt: "Como adenina, timina, citosina e guanina pareiam-se especificamente, então o código é preciso.", en: "Because adenine, thymine, cytosine, and guanine pair specifically, the code is precise."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "No RNA, T é substituído por:", en: "In RNA, T is replaced by:"}
        choices:
          - {pt: "U (uracila)", en: "U (uracil)"}
          - {pt: "X", en: "X"}
          - {pt: "C extra", en: "Extra C"}
          - {pt: "G extra", en: "Extra G"}
        correctAnswer: {pt: "U (uracila)", en: "U (uracil)"}
        rationale: {pt: "Como uracila é mais simples (sem grupo metila), então RNA usa-a; DNA usa timina mais estável.", en: "Because uracil is simpler (no methyl group), RNA uses it; DNA uses the more stable thymine."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Pareamento de bases no DNA:", en: "DNA base pairing:"}
        choices:
          - {pt: "A–T e C–G", en: "A–T and C–G"}
          - {pt: "A–G e T–C", en: "A–G and T–C"}
          - {pt: "A–C e T–G", en: "A–C and T–G"}
          - {pt: "Aleatório", en: "Random"}
        correctAnswer: {pt: "A–T e C–G", en: "A–T and C–G"}
        rationale: {pt: "Como pontes de hidrogênio se formam entre pares específicos, então a complementaridade é estrita.", en: "Because hydrogen bonds form between specific pairs, complementarity is strict."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Quantas pontes de hidrogênio entre A e T?", en: "How many hydrogen bonds between A and T?"}
        choices:
          - {pt: "Duas", en: "Two"}
          - {pt: "Três", en: "Three"}
          - {pt: "Quatro", en: "Four"}
          - {pt: "Uma", en: "One"}
        correctAnswer: {pt: "Duas", en: "Two"}
        rationale: {pt: "Como A–T tem 2 pontes e G–C tem 3, então sequências ricas em GC são mais estáveis termicamente.", en: "Because A–T has 2 bonds and G–C has 3, GC-rich sequences are thermally more stable."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Estrutura do DNA é:", en: "DNA's structure is:"}
        choices:
          - {pt: "Dupla hélice antiparalela", en: "Antiparallel double helix"}
          - {pt: "Folha plana", en: "Flat sheet"}
          - {pt: "Esfera oca", en: "Hollow sphere"}
          - {pt: "Cubo", en: "Cube"}
        correctAnswer: {pt: "Dupla hélice antiparalela", en: "Antiparallel double helix"}
        rationale: {pt: "Como uma fita corre 5'→3' e a outra 3'→5', então a hélice é estável e replicável.", en: "Because one strand runs 5'→3' and the other 3'→5', the helix is stable and replicable."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Esqueleto do DNA é formado por:", en: "DNA backbone is made of:"}
        choices:
          - {pt: "Açúcar e fosfato alternados", en: "Alternating sugar and phosphate"}
          - {pt: "Apenas bases", en: "Only bases"}
          - {pt: "Apenas proteínas", en: "Only proteins"}
          - {pt: "Apenas lipídios", en: "Only lipids"}
        correctAnswer: {pt: "Açúcar e fosfato alternados", en: "Alternating sugar and phosphate"}
        rationale: {pt: "Como o esqueleto é \"externo\" e as bases ficam \"internas\", então o pareamento ocorre no centro da hélice.", en: "Because the backbone is \"outside\" and bases face \"inward\", pairing happens at the helix center."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Watson, Crick e Franklin descobriram (1953):", en: "Watson, Crick, and Franklin discovered (1953):"}
        choices:
          - {pt: "A estrutura em dupla hélice do DNA", en: "DNA's double helix structure"}
          - {pt: "A teoria celular", en: "Cell theory"}
          - {pt: "A penicilina", en: "Penicillin"}
          - {pt: "A vacina contra varíola", en: "Smallpox vaccine"}
        correctAnswer: {pt: "A estrutura em dupla hélice do DNA", en: "DNA's double helix structure"}
        rationale: {pt: "Como a difração de raios-X de Franklin mostrou padrão helicoidal, então Watson e Crick deduziram o modelo.", en: "Because Franklin's X-ray diffraction showed a helical pattern, Watson and Crick deduced the model."}
        objectives: [biology.biochem]
        difficulty: 3
  - pageNumber: 2
    title: {pt: "Replicação e expressão", en: "Replication and expression"}
    description: {pt: "Como o DNA funciona.", en: "How DNA works."}
    exercises:
      - type: choice
        question: {pt: "Replicação do DNA é:", en: "DNA replication is:"}
        choices:
          - {pt: "Semiconservativa (cada filha tem uma fita antiga + uma nova)", en: "Semiconservative (each daughter has one old + one new strand)"}
          - {pt: "Conservativa", en: "Conservative"}
          - {pt: "Aleatória", en: "Random"}
          - {pt: "Inexistente", en: "Nonexistent"}
        correctAnswer: {pt: "Semiconservativa (cada filha tem uma fita antiga + uma nova)", en: "Semiconservative (each daughter has one old + one new strand)"}
        rationale: {pt: "Como Meselson e Stahl provaram em 1958, então cada nova hélice combina molde antigo e nova fita sintetizada.", en: "Because Meselson and Stahl proved in 1958, each new helix combines old template and newly synthesized strand."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "DNA polimerase faz:", en: "DNA polymerase does:"}
        choices:
          - {pt: "Sintetiza nova fita usando o molde antigo", en: "Synthesizes new strand using the old template"}
          - {pt: "Quebra DNA", en: "Breaks DNA"}
          - {pt: "Une células", en: "Joins cells"}
          - {pt: "Bombeia sangue", en: "Pumps blood"}
        correctAnswer: {pt: "Sintetiza nova fita usando o molde antigo", en: "Synthesizes new strand using the old template"}
        rationale: {pt: "Como segue regra de complementaridade A–T, C–G, então a enzima copia fielmente — taxa de erro é baixíssima.", en: "Because it follows A–T, C–G complementarity, the enzyme copies faithfully — error rate is extremely low."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Transcrição é:", en: "Transcription is:"}
        choices:
          - {pt: "Síntese de mRNA a partir do DNA", en: "mRNA synthesis from DNA"}
          - {pt: "Síntese de proteína", en: "Protein synthesis"}
          - {pt: "Cópia do DNA inteiro", en: "Copy of entire DNA"}
          - {pt: "Quebra do DNA", en: "DNA breakdown"}
        correctAnswer: {pt: "Síntese de mRNA a partir do DNA", en: "mRNA synthesis from DNA"}
        rationale: {pt: "Como RNA polimerase lê uma fita do DNA, então produz um mRNA complementar para levar a mensagem ao ribossomo.", en: "Because RNA polymerase reads one DNA strand, it produces a complementary mRNA to carry the message to the ribosome."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Tradução é:", en: "Translation is:"}
        choices:
          - {pt: "Síntese de proteína a partir do mRNA", en: "Protein synthesis from mRNA"}
          - {pt: "Cópia de DNA", en: "DNA copying"}
          - {pt: "Tipo de mutação", en: "Type of mutation"}
          - {pt: "Tipo de hormônio", en: "Type of hormone"}
        correctAnswer: {pt: "Síntese de proteína a partir do mRNA", en: "Protein synthesis from mRNA"}
        rationale: {pt: "Como ribossomo lê códons (3 bases) e une aminoácidos correspondentes, então a sequência de mRNA vira proteína.", en: "Because the ribosome reads codons (3 bases) and links matching amino acids, the mRNA sequence becomes protein."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Códon é:", en: "A codon is:"}
        choices:
          - {pt: "Sequência de 3 bases que codifica um aminoácido", en: "Sequence of 3 bases coding for one amino acid"}
          - {pt: "Apenas uma base", en: "Just one base"}
          - {pt: "Cadeia inteira", en: "Whole chain"}
          - {pt: "Tipo de proteína", en: "Type of protein"}
        correctAnswer: {pt: "Sequência de 3 bases que codifica um aminoácido", en: "Sequence of 3 bases coding for one amino acid"}
        rationale: {pt: "Como 4³ = 64 códons codificam 20 aminoácidos + sinais (start/stop), então o código é redundante.", en: "Because 4³ = 64 codons encode 20 amino acids + signals (start/stop), the code is redundant."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Tipos principais de RNA:", en: "Main RNA types:"}
        choices:
          - {pt: "mRNA, tRNA, rRNA", en: "mRNA, tRNA, rRNA"}
          - {pt: "Apenas mRNA", en: "Only mRNA"}
          - {pt: "Apenas DNA", en: "Only DNA"}
          - {pt: "Apenas proteínas", en: "Only proteins"}
        correctAnswer: {pt: "mRNA, tRNA, rRNA", en: "mRNA, tRNA, rRNA"}
        rationale: {pt: "Como cada tipo tem papel distinto (mensagem, transferência, ribossomo), então a tradução é coordenada.", en: "Because each type has a distinct role (messenger, transfer, ribosome), translation is coordinated."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Mutações são:", en: "Mutations are:"}
        choices:
          - {pt: "Mudanças na sequência do DNA", en: "Changes in DNA sequence"}
          - {pt: "Tipos de proteínas", en: "Types of proteins"}
          - {pt: "Tipos de açúcares", en: "Types of sugars"}
          - {pt: "Tipos de organela", en: "Types of organelles"}
        correctAnswer: {pt: "Mudanças na sequência do DNA", en: "Changes in DNA sequence"}
        rationale: {pt: "Como podem ser silenciosas, neutras ou prejudiciais, então fornecem matéria-prima para a evolução.", en: "Because they can be silent, neutral, or harmful, they provide raw material for evolution."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Genoma humano contém aproximadamente:", en: "The human genome contains approximately:"}
        choices:
          - {pt: "3 bilhões de pares de bases", en: "3 billion base pairs"}
          - {pt: "1000", en: "1,000"}
          - {pt: "1 milhão", en: "1 million"}
          - {pt: "1 trilhão", en: "1 trillion"}
        correctAnswer: {pt: "3 bilhões de pares de bases", en: "3 billion base pairs"}
        rationale: {pt: "Como apenas ~2% codifica proteínas, então a maior parte é regulatória ou repetitiva.", en: "Because only ~2% codes for proteins, most is regulatory or repetitive."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "ATP, NADH e FADH₂ são derivados de:", en: "ATP, NADH, and FADH₂ are derived from:"}
        choices:
          - {pt: "Nucleotídeos (parentes do RNA)", en: "Nucleotides (RNA relatives)"}
          - {pt: "Proteínas", en: "Proteins"}
          - {pt: "Açúcares", en: "Sugars"}
          - {pt: "Lipídios", en: "Lipids"}
        correctAnswer: {pt: "Nucleotídeos (parentes do RNA)", en: "Nucleotides (RNA relatives)"}
        rationale: {pt: "Como ATP tem adenina + ribose + 3 fosfatos, então é literalmente um nucleotídeo modificado de RNA.", en: "Because ATP has adenine + ribose + 3 phosphates, it's literally a modified RNA nucleotide."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Resumo: ácidos nucleicos:", en: "Summary: nucleic acids:"}
        choices:
          - {pt: "Armazenam (DNA) e expressam (RNA → proteína) a informação genética", en: "Store (DNA) and express (RNA → protein) genetic information"}
          - {pt: "Apenas armazenam energia", en: "Only store energy"}
          - {pt: "Apenas formam membranas", en: "Only form membranes"}
          - {pt: "Apenas estruturam células", en: "Only structure cells"}
        correctAnswer: {pt: "Armazenam (DNA) e expressam (RNA → proteína) a informação genética", en: "Store (DNA) and express (RNA → protein) genetic information"}
        rationale: {pt: "O dogma central — DNA → RNA → proteína — define como a informação biológica flui em todas as células vivas.", en: "The central dogma — DNA → RNA → protein — defines how biological information flows in all living cells."}
        objectives: [biology.biochem]
        difficulty: 3
target: 20
