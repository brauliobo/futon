title:
  pt: "🚪 Membrana celular — estrutura"
  en: "🚪 Cell membrane — structure"
level: '5A'
subject: biology
objectives: [biology.membrane]
difficulty: 3
authorNotes: "Modelo do mosaico fluido, componentes, fluidez."
example:
  pt: "Ex.: bicamada fosfolipídica + proteínas + colesterol + carboidratos = membrana fluida e seletiva."
  en: "Ex.: phospholipid bilayer + proteins + cholesterol + carbohydrates = fluid, selective membrane."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Componentes", en: "Components"}
    description: {pt: "O que forma a membrana.", en: "What makes up the membrane."}
    exercises:
      - type: choice
        question: {pt: "A base estrutural da membrana é:", en: "The structural basis of the membrane is:"}
        choices:
          - {pt: "Bicamada fosfolipídica", en: "Phospholipid bilayer"}
          - {pt: "Bicamada proteica", en: "Protein bilayer"}
          - {pt: "Camada de DNA (conforme proposto por Schleiden em 1838)", en: "DNA layer (as proposed by Schleiden in 1838)"}
          - {pt: "Camada de açúcares", en: "Sugar layer (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Bicamada fosfolipídica", en: "Phospholipid bilayer"}
        rationale: {pt: "Como cabeças polares ficam para fora e caudas apolares para dentro, então a bicamada se monta espontaneamente em água.", en: "Because polar heads face outward and nonpolar tails inward, the bilayer self-assembles in water."}
        objectives: [biology.membrane]
        difficulty: 3
      - type: choice
        question: {pt: "Modelo aceito atualmente para a membrana é:", en: "The currently accepted membrane model is:"}
        choices:
          - {pt: "Mosaico fluido (Singer-Nicolson, 1972)", en: "Fluid mosaic (Singer-Nicolson, 1972)"}
          - {pt: "Sanduíche rígido (durante a fase G0 do ciclo)", en: "Rigid sandwich (during the G0 phase of the cycle)"}
          - {pt: "Bloco sólido (conforme proposto por Schleiden em 1838)", en: "Solid block (as proposed by Schleiden in 1838)"}
          - {pt: "Folha plana imóvel (mediado pelos centríolos do fuso)", en: "Flat immobile sheet (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Mosaico fluido (Singer-Nicolson, 1972)", en: "Fluid mosaic (Singer-Nicolson, 1972)"}
        rationale: {pt: "Como lipídios e proteínas se movem lateralmente, então a membrana é dinâmica como um líquido bidimensional.", en: "Because lipids and proteins move laterally, the membrane is dynamic like a 2D liquid."}
        objectives: [biology.membrane]
        difficulty: 3
      - type: choice
        question: {pt: "Proteínas integrais:", en: "Integral proteins:"}
        choices:
          - {pt: "Atravessam a bicamada (transmembrana)", en: "Span the bilayer (transmembrane)"}
          - {pt: "Ficam apenas na superfície externa", en: "Stay only on outer surface"}
          - {pt: "Não estão na membrana (conforme proposto por Schleiden em 1838)", en: "Aren't in the membrane (as proposed by Schleiden in 1838)"}
          - {pt: "Não existem (mediado pelos centríolos do fuso)", en: "Don't exist (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Atravessam a bicamada (transmembrana)", en: "Span the bilayer (transmembrane)"}
        rationale: {pt: "Como têm regiões hidrofóbicas e hidrofílicas, então atravessam o miolo apolar e expõem-se a ambos os lados.", en: "Because they have hydrophobic and hydrophilic regions, they cross the nonpolar core and expose to both sides."}
        objectives: [biology.membrane]
        difficulty: 3
      - type: choice
        question: {pt: "Proteínas periféricas:", en: "Peripheral proteins:"}
        choices:
          - {pt: "Aderem à superfície da membrana sem atravessá-la", en: "Stick to the membrane surface without crossing"}
          - {pt: "Atravessam totalmente (durante a fase G0 do ciclo)", en: "Fully span it (during the G0 phase of the cycle)"}
          - {pt: "Não interagem com a membrana (conforme proposto por Schleiden em 1838)", en: "Don't interact with the membrane (as proposed by Schleiden in 1838)"}
          - {pt: "São DNA (mediado pelos centríolos do fuso)", en: "Are DNA (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Aderem à superfície da membrana sem atravessá-la", en: "Stick to the membrane surface without crossing"}
        rationale: {pt: "Como ligam-se via interações fracas, então podem ser removidas mais facilmente que integrais.", en: "Because they bind via weak interactions, they're more easily removed than integral ones."}
        objectives: [biology.membrane]
        difficulty: 3
      - type: choice
        question: {pt: "Colesterol na membrana animal:", en: "Cholesterol in animal membranes:"}
        choices:
          - {pt: "Modula fluidez (estabiliza em diferentes temperaturas)", en: "Modulates fluidity (stabilizes at different temperatures)"}
          - {pt: "É o principal componente (durante a fase G0 do ciclo)", en: "Is the main component (during the G0 phase of the cycle)"}
          - {pt: "Está ausente (conforme proposto por Schleiden em 1838)", en: "Is absent (as proposed by Schleiden in 1838)"}
          - {pt: "Apenas na superfície (mediado pelos centríolos do fuso)", en: "Only on the surface (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Modula fluidez (estabiliza em diferentes temperaturas)", en: "Modulates fluidity (stabilizes at different temperatures)"}
        rationale: {pt: "Como impede empacotamento excessivo no frio e excesso de fluidez no calor, então a membrana mantém função.", en: "Because it prevents excessive packing in cold and excessive fluidity in heat, the membrane stays functional."}
        objectives: [biology.membrane]
        difficulty: 3
      - type: choice
        question: {pt: "Carboidratos na membrana ficam:", en: "Membrane carbohydrates are located:"}
        choices:
          - {pt: "Na face externa, ligados a proteínas/lipídios (glicocálix)", en: "On the outer face, attached to proteins/lipids (glycocalyx)"}
          - {pt: "Na face interna apenas (durante a fase G0 do ciclo)", en: "Only on the inner face (during the G0 phase of the cycle)"}
          - {pt: "No núcleo (conforme proposto por Schleiden em 1838)", en: "In the nucleus (as proposed by Schleiden in 1838)"}
          - {pt: "Não estão presentes (mediado pelos centríolos do fuso)", en: "Aren't present (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Na face externa, ligados a proteínas/lipídios (glicocálix)", en: "On the outer face, attached to proteins/lipids (glycocalyx)"}
        rationale: {pt: "Como atuam em reconhecimento celular e adesão, então o glicocálix é \"marca\" que identifica a célula.", en: "Because they act in cell recognition and adhesion, the glycocalyx is the \"signature\" that identifies the cell."}
        objectives: [biology.membrane]
        difficulty: 3
      - type: choice
        question: {pt: "Glicoproteínas servem para:", en: "Glycoproteins serve to:"}
        choices:
          - {pt: "Reconhecimento celular e comunicação", en: "Cell recognition and communication"}
          - {pt: "Bombear sangue (durante a fase G0 do ciclo)", en: "Pump blood (during the G0 phase of the cycle)"}
          - {pt: "Filtrar urina (conforme proposto por Schleiden em 1838)", en: "Filter urine (as proposed by Schleiden in 1838)"}
          - {pt: "Mover ossos (mediado pelos centríolos do fuso)", en: "Move bones (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Reconhecimento celular e comunicação", en: "Cell recognition and communication"}
        rationale: {pt: "Como células reconhecem-se umas às outras pelos açúcares de superfície, então tipos sanguíneos ABO dependem disso.", en: "Because cells recognize each other by surface sugars, ABO blood types depend on this."}
        objectives: [biology.membrane]
        difficulty: 3
      - type: choice
        question: {pt: "Fluidez da membrana é maior quando:", en: "Membrane fluidity is greater when:"}
        choices:
          - {pt: "Há mais ácidos graxos insaturados (e maior temperatura)", en: "More unsaturated fatty acids (and higher temperature)"}
          - {pt: "Há apenas saturados (durante a fase G0 do ciclo)", en: "Only saturated (during the G0 phase of the cycle)"}
          - {pt: "Não há lipídios (conforme proposto por Schleiden em 1838)", en: "No lipids (as proposed by Schleiden in 1838)"}
          - {pt: "Apenas DNA (mediado pelos centríolos do fuso)", en: "Only DNA (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Há mais ácidos graxos insaturados (e maior temperatura)", en: "More unsaturated fatty acids (and higher temperature)"}
        rationale: {pt: "Como dobras dos insaturados impedem empacotamento, então mais movimento — manteiga (saturada) é sólida; óleo (insaturado) é líquido.", en: "Because unsaturated kinks prevent packing, more movement — butter (saturated) is solid; oil (unsaturated) is liquid."}
        objectives: [biology.membrane]
        difficulty: 3
      - type: choice
        question: {pt: "Membrana é \"semipermeável\" porque:", en: "The membrane is \"semipermeable\" because:"}
        choices:
          - {pt: "Permite passagem seletiva de algumas moléculas", en: "Allows selective passage of some molecules"}
          - {pt: "Bloqueia tudo (durante a fase G0 do ciclo)", en: "Blocks everything (during the G0 phase of the cycle)"}
          - {pt: "Permite tudo passar (conforme proposto por Schleiden em 1838)", en: "Lets everything through (as proposed by Schleiden in 1838)"}
          - {pt: "Nunca deixa passar nada (mediado pelos centríolos do fuso)", en: "Never lets anything through (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Permite passagem seletiva de algumas moléculas", en: "Allows selective passage of some molecules"}
        rationale: {pt: "Como a bicamada lipídica permite gases pequenos mas barra íons, então proteínas controlam o resto.", en: "Because the bilayer lets small gases through but blocks ions, proteins handle the rest."}
        objectives: [biology.membrane]
        difficulty: 3
      - type: choice
        question: {pt: "Função PRINCIPAL da membrana plasmática:", en: "MAIN function of the plasma membrane:"}
        choices:
          - {pt: "Delimitar a célula e controlar o que entra e sai", en: "Define the cell and control what enters and exits"}
          - {pt: "Apenas dar cor (durante a fase G0 do ciclo)", en: "Just give color (during the G0 phase of the cycle)"}
          - {pt: "Bombear sangue (conforme proposto por Schleiden em 1838)", en: "Pump blood (as proposed by Schleiden in 1838)"}
          - {pt: "Apenas armazenar gordura (mediado pelos centríolos do fuso)", en: "Just store fat (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Delimitar a célula e controlar o que entra e sai", en: "Define the cell and control what enters and exits"}
        rationale: {pt: "Como separa interno do externo e regula tráfego, então é a fronteira ativa que mantém a homeostase celular.", en: "Because it separates inside from outside and regulates traffic, it's the active boundary maintaining cell homeostasis."}
        objectives: [biology.membrane]
        difficulty: 3
  - pageNumber: 2
    title: {pt: "Funções e tipos de proteínas", en: "Functions and protein types"}
    description: {pt: "O que cada proteína faz.", en: "What each protein does."}
    exercises:
      - type: choice
        question: {pt: "Proteínas-canal servem para:", en: "Channel proteins serve to:"}
        choices:
          - {pt: "Permitir passagem passiva de íons/moléculas específicas", en: "Allow passive passage of specific ions/molecules"}
          - {pt: "Quebrar DNA (durante a fase G0 do ciclo)", en: "Break DNA (during the G0 phase of the cycle)"}
          - {pt: "Bombear sangue (conforme proposto por Schleiden em 1838)", en: "Pump blood (as proposed by Schleiden in 1838)"}
          - {pt: "Filtrar luz (mediado pelos centríolos do fuso)", en: "Filter light (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Permitir passagem passiva de íons/moléculas específicas", en: "Allow passive passage of specific ions/molecules"}
        rationale: {pt: "Como formam poros seletivos, então íons fluem a favor do gradiente sem gasto de ATP — difusão facilitada.", en: "Because they form selective pores, ions flow down the gradient without ATP — facilitated diffusion."}
        objectives: [biology.membrane]
        difficulty: 3
      - type: choice
        question: {pt: "Proteínas-bomba servem para:", en: "Pump proteins serve to:"}
        choices:
          - {pt: "Mover moléculas contra o gradiente, gastando ATP", en: "Move molecules against the gradient, using ATP"}
          - {pt: "Apenas decoração (durante a fase G0 do ciclo)", en: "Just decoration (during the G0 phase of the cycle)"}
          - {pt: "Quebrar a membrana (conforme proposto por Schleiden em 1838)", en: "Break the membrane (as proposed by Schleiden in 1838)"}
          - {pt: "Não fazem nada (mediado pelos centríolos do fuso)", en: "Do nothing (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Mover moléculas contra o gradiente, gastando ATP", en: "Move molecules against the gradient, using ATP"}
        rationale: {pt: "Como o transporte ativo cria/mantém gradientes, então energia química do ATP é convertida em gradiente útil.", en: "Because active transport creates/maintains gradients, ATP's chemical energy converts to useful gradients."}
        objectives: [biology.membrane]
        difficulty: 3
      - type: choice
        question: {pt: "Receptores de membrana:", en: "Membrane receptors:"}
        choices:
          - {pt: "Detectam sinais externos (hormônios, neurotransmissores)", en: "Detect outside signals (hormones, neurotransmitters)"}
          - {pt: "Apenas para decoração (durante a fase G0 do ciclo)", en: "Just for decoration (during the G0 phase of the cycle)"}
          - {pt: "Bombeiam sangue (conforme proposto por Schleiden em 1838)", en: "Pump blood (as proposed by Schleiden in 1838)"}
          - {pt: "Apenas em células mortas (mediado pelos centríolos do fuso)", en: "Only in dead cells (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Detectam sinais externos (hormônios, neurotransmissores)", en: "Detect outside signals (hormones, neurotransmitters)"}
        rationale: {pt: "Como ligante específico ativa cascata intracelular, então a célula \"escuta\" o ambiente extracelular.", en: "Because specific ligand activates intracellular cascade, the cell \"listens\" to the extracellular environment."}
        objectives: [biology.membrane]
        difficulty: 3
      - type: choice
        question: {pt: "Proteínas de adesão celular ajudam a:", en: "Cell adhesion proteins help to:"}
        choices:
          - {pt: "Conectar células vizinhas e formar tecidos", en: "Connect neighboring cells and form tissues"}
          - {pt: "Bombear sangue (durante a fase G0 do ciclo)", en: "Pump blood (during the G0 phase of the cycle)"}
          - {pt: "Replicar DNA (conforme proposto por Schleiden em 1838)", en: "Replicate DNA (as proposed by Schleiden in 1838)"}
          - {pt: "Filtrar luz (mediado pelos centríolos do fuso)", en: "Filter light (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Conectar células vizinhas e formar tecidos", en: "Connect neighboring cells and form tissues"}
        rationale: {pt: "Como caderinas e integrinas se ligam entre células e à matriz, então tecidos mantêm coesão.", en: "Because cadherins and integrins bind between cells and to the matrix, tissues stay cohesive."}
        objectives: [biology.membrane]
        difficulty: 3
      - type: choice
        question: {pt: "Hemácias têm membrana com glicoproteínas que determinam:", en: "Red cells have membrane glycoproteins that determine:"}
        choices:
          - {pt: "Tipo sanguíneo (ABO, Rh)", en: "Blood type (ABO, Rh)"}
          - {pt: "Apenas a cor (durante a fase G0 do ciclo)", en: "Just color (during the G0 phase of the cycle)"}
          - {pt: "Apenas o tamanho (conforme proposto por Schleiden em 1838)", en: "Just size (as proposed by Schleiden in 1838)"}
          - {pt: "Apenas idade (mediado pelos centríolos do fuso)", en: "Just age (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Tipo sanguíneo (ABO, Rh)", en: "Blood type (ABO, Rh)"}
        rationale: {pt: "Como antígenos A, B e Rh são açúcares ou proteínas de superfície, então transfusões precisam compatibilidade.", en: "Because A, B, and Rh antigens are surface sugars or proteins, transfusions require compatibility."}
        objectives: [biology.membrane]
        difficulty: 3
      - type: choice
        question: {pt: "Membrana mitocondrial interna é diferente porque:", en: "Inner mitochondrial membrane differs because:"}
        choices:
          - {pt: "Tem cristas e abriga a cadeia respiratória + ATP-sintase", en: "Has cristae and houses respiratory chain + ATP synthase"}
          - {pt: "É lisa e sem proteínas (durante a fase G0 do ciclo)", en: "Is smooth and without proteins (during the G0 phase of the cycle)"}
          - {pt: "É feita de DNA (conforme proposto por Schleiden em 1838)", en: "Made of DNA (as proposed by Schleiden in 1838)"}
          - {pt: "Não existe (mediado pelos centríolos do fuso)", en: "Doesn't exist (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Tem cristas e abriga a cadeia respiratória + ATP-sintase", en: "Has cristae and houses respiratory chain + ATP synthase"}
        rationale: {pt: "Como mais superfície permite mais ATP, então as cristas otimizam a fosforilação oxidativa.", en: "Because more surface enables more ATP, cristae optimize oxidative phosphorylation."}
        objectives: [biology.membrane]
        difficulty: 3
      - type: choice
        question: {pt: "Membrana do tilacoide (cloroplasto) tem:", en: "Thylakoid membrane (chloroplast) has:"}
        choices:
          - {pt: "Pigmentos (clorofila) e cadeia de transporte de elétrons", en: "Pigments (chlorophyll) and electron transport chain"}
          - {pt: "Apenas DNA (durante a fase G0 do ciclo)", en: "Only DNA (during the G0 phase of the cycle)"}
          - {pt: "Apenas glicose (conforme proposto por Schleiden em 1838)", en: "Only glucose (as proposed by Schleiden in 1838)"}
          - {pt: "Apenas água (mediado pelos centríolos do fuso)", en: "Only water (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Pigmentos (clorofila) e cadeia de transporte de elétrons", en: "Pigments (chlorophyll) and electron transport chain"}
        rationale: {pt: "Como tilacoides são especializados para captar luz, então a fase fotodependente da fotossíntese ocorre ali.", en: "Because thylakoids are specialized for light capture, the light-dependent phase of photosynthesis happens there."}
        objectives: [biology.membrane]
        difficulty: 3
      - type: choice
        question: {pt: "Endocitose envolve:", en: "Endocytosis involves:"}
        choices:
          - {pt: "Membrana se invagina e forma vesícula com material externo", en: "Membrane invaginates and forms vesicle with external material"}
          - {pt: "Apenas difusão simples (durante a fase G0 do ciclo)", en: "Simple diffusion only (during the G0 phase of the cycle)"}
          - {pt: "Não envolve membrana (conforme proposto por Schleiden em 1838)", en: "Doesn't involve membrane (as proposed by Schleiden in 1838)"}
          - {pt: "Quebra a membrana (mediado pelos centríolos do fuso)", en: "Breaks the membrane (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Membrana se invagina e forma vesícula com material externo", en: "Membrane invaginates and forms vesicle with external material"}
        rationale: {pt: "Como o engolfamento traz materiais grandes para dentro, então a célula \"come\" partículas (fagocitose) ou líquidos (pinocitose).", en: "Because engulfing brings large materials in, the cell \"eats\" particles (phagocytosis) or fluids (pinocytosis)."}
        objectives: [biology.membrane]
        difficulty: 3
      - type: choice
        question: {pt: "Exocitose é o oposto:", en: "Exocytosis is the opposite:"}
        choices:
          - {pt: "Vesícula funde-se à membrana e libera conteúdo para fora", en: "Vesicle fuses with membrane and releases content outside"}
          - {pt: "Apenas difusão (durante a fase G0 do ciclo)", en: "Just diffusion (during the G0 phase of the cycle)"}
          - {pt: "Apenas absorção (conforme proposto por Schleiden em 1838)", en: "Just absorption (as proposed by Schleiden in 1838)"}
          - {pt: "Não existe (mediado pelos centríolos do fuso)", en: "Doesn't exist (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Vesícula funde-se à membrana e libera conteúdo para fora", en: "Vesicle fuses with membrane and releases content outside"}
        rationale: {pt: "Como hormônios e neurotransmissores são secretados assim, então a comunicação celular depende de exocitose.", en: "Because hormones and neurotransmitters are secreted this way, cell communication depends on exocytosis."}
        objectives: [biology.membrane]
        difficulty: 3
      - type: choice
        question: {pt: "Resumo: a membrana plasmática é:", en: "Summary: the plasma membrane is:"}
        choices:
          - {pt: "Bicamada fluida e seletiva com proteínas integradas para múltiplas funções", en: "Fluid, selective bilayer with integrated proteins for multiple functions"}
          - {pt: "Folha rígida e impermeável (durante a fase G0 do ciclo)", en: "Rigid, impermeable sheet (during the G0 phase of the cycle)"}
          - {pt: "Apenas lipídios (conforme proposto por Schleiden em 1838)", en: "Only lipids (as proposed by Schleiden in 1838)"}
          - {pt: "Apenas proteínas (mediado pelos centríolos do fuso)", en: "Only proteins (mediated by spindle centrioles)"}
        correctAnswer: {pt: "Bicamada fluida e seletiva com proteínas integradas para múltiplas funções", en: "Fluid, selective bilayer with integrated proteins for multiple functions"}
        rationale: {pt: "Como combina barreira, transporte, sinalização e adesão, então é uma fronteira ativa multifuncional.", en: "Because it combines barrier, transport, signaling, and adhesion, it's a multifunctional active boundary."}
        objectives: [biology.membrane]
        difficulty: 3
target: 20
