title:
  pt: "🎓 Revisão geral — nível 5A"
  en: "🎓 General review — level 5A"
level: '5A'
subject: biology
objectives: [biology.biochem, biology.enzymes, biology.membrane, biology.signaling, biology.cell_cycle, biology.genetics]
difficulty: 3
authorNotes: "Revisão cumulativa: bioquímica, enzimas, membrana/transporte, sinalização, ciclo celular, genética."
example:
  pt: "Ex.: bioelementos → biomoléculas → enzimas → membrana → sinalização → ciclo → herança."
  en: "Ex.: bioelements → biomolecules → enzymes → membrane → signaling → cycle → heredity."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Bioquímica e enzimas", en: "Biochemistry and enzymes"}
    description: {pt: "Reveja as bases.", en: "Review the basics."}
    exercises:
      - type: choice
        question: {pt: "Elementos mais abundantes em seres vivos:", en: "Most abundant elements in living things:"}
        choices:
          - {pt: "C, H, O, N (e P, S)", en: "C, H, O, N (and P, S)"}
          - {pt: "Au, Ag, Pt", en: "Au, Ag, Pt"}
          - {pt: "He, Ne, Ar", en: "He, Ne, Ar"}
          - {pt: "Si, Ge", en: "Si, Ge"}
        correctAnswer: {pt: "C, H, O, N (e P, S)", en: "C, H, O, N (and P, S)"}
        rationale: {pt: "Como CHNOPS forma todas as macromoléculas, então a química da vida orbita esses átomos.", en: "Because CHNOPS forms all macromolecules, life's chemistry orbits these atoms."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Estrutura do DNA:", en: "DNA structure:"}
        choices:
          - {pt: "Dupla hélice antiparalela com pareamento A–T, C–G", en: "Antiparallel double helix with A–T, C–G pairing"}
          - {pt: "Folha plana", en: "Flat sheet"}
          - {pt: "Esfera", en: "Sphere"}
          - {pt: "Linha reta", en: "Straight line"}
        correctAnswer: {pt: "Dupla hélice antiparalela com pareamento A–T, C–G", en: "Antiparallel double helix with A–T, C–G pairing"}
        rationale: {pt: "Como pontes de H entre bases mantêm fitas unidas, então a estrutura é estável e replicável.", en: "Because H-bonds between bases hold strands together, the structure is stable and replicable."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Função PRINCIPAL das enzimas:", en: "MAIN function of enzymes:"}
        choices:
          - {pt: "Catalisar reações reduzindo a energia de ativação", en: "Catalyze reactions by lowering activation energy"}
          - {pt: "Apenas armazenar DNA", en: "Just store DNA"}
          - {pt: "Apenas dar cor", en: "Just give color"}
          - {pt: "Apenas transportar O₂", en: "Just transport O₂"}
        correctAnswer: {pt: "Catalisar reações reduzindo a energia de ativação", en: "Catalyze reactions by lowering activation energy"}
        rationale: {pt: "Como aceleram milhões de vezes sem serem consumidas, então enzimas tornam o metabolismo viável.", en: "Because they speed reactions millions of times without being consumed, enzymes make metabolism feasible."}
        objectives: [biology.enzymes]
        difficulty: 3
      - type: choice
        question: {pt: "Em qual fase ocorre a replicação do DNA?", en: "In which phase does DNA replication occur?"}
        choices:
          - {pt: "Fase S (síntese)", en: "S phase (synthesis)"}
          - {pt: "G1", en: "G1"}
          - {pt: "M", en: "M"}
          - {pt: "G2", en: "G2"}
        correctAnswer: {pt: "Fase S (síntese)", en: "S phase (synthesis)"}
        rationale: {pt: "Como a célula precisa duplicar o genoma antes da divisão, então a replicação ocorre antes da mitose.", en: "Because the cell must duplicate the genome before division, replication occurs before mitosis."}
        objectives: [biology.cell_cycle]
        difficulty: 3
      - type: choice
        question: {pt: "Bicamada lipídica é seletiva porque:", en: "Lipid bilayer is selective because:"}
        choices:
          - {pt: "Caudas apolares barram íons e moléculas polares", en: "Nonpolar tails block ions and polar molecules"}
          - {pt: "Sempre deixa tudo passar", en: "Always lets everything through"}
          - {pt: "Sempre bloqueia tudo", en: "Always blocks everything"}
          - {pt: "Tem furos aleatórios", en: "Has random holes"}
        correctAnswer: {pt: "Caudas apolares barram íons e moléculas polares", en: "Nonpolar tails block ions and polar molecules"}
        rationale: {pt: "Como o miolo é hidrofóbico, então proteínas integrais cuidam do transporte específico de polares e íons.", en: "Because the core is hydrophobic, integral proteins handle specific transport of polar molecules and ions."}
        objectives: [biology.membrane]
        difficulty: 3
      - type: choice
        question: {pt: "Bomba Na⁺/K⁺ é exemplo de:", en: "Na⁺/K⁺ pump is an example of:"}
        choices:
          - {pt: "Transporte ativo primário (gasto direto de ATP)", en: "Primary active transport (direct ATP use)"}
          - {pt: "Difusão simples", en: "Simple diffusion"}
          - {pt: "Difusão facilitada", en: "Facilitated diffusion"}
          - {pt: "Endocitose", en: "Endocytosis"}
        correctAnswer: {pt: "Transporte ativo primário (gasto direto de ATP)", en: "Primary active transport (direct ATP use)"}
        rationale: {pt: "Como move íons contra o gradiente, então mantém potencial de membrana — vital para neurônios e músculos.", en: "Because it moves ions against the gradient, it maintains membrane potential — vital for neurons and muscle."}
        objectives: [biology.membrane]
        difficulty: 3
      - type: choice
        question: {pt: "Em meio hipertônico, a célula animal:", en: "In hypertonic medium, animal cell:"}
        choices:
          - {pt: "Encolhe (água sai)", en: "Shrinks (water exits)"}
          - {pt: "Estoura", en: "Bursts"}
          - {pt: "Cresce muito", en: "Grows a lot"}
          - {pt: "Não muda", en: "Doesn't change"}
        correctAnswer: {pt: "Encolhe (água sai)", en: "Shrinks (water exits)"}
        rationale: {pt: "Como mais soluto fora puxa água por osmose, então a célula perde volume — crenação em hemácias.", en: "Because more outside solute pulls water osmotically, the cell loses volume — crenation in red cells."}
        objectives: [biology.membrane]
        difficulty: 3
      - type: choice
        question: {pt: "Sinal hidrofílico atua em receptores:", en: "Hydrophilic signal acts on receptors:"}
        choices:
          - {pt: "Na membrana plasmática", en: "On the plasma membrane"}
          - {pt: "No núcleo apenas", en: "Only in the nucleus"}
          - {pt: "No citoplasma apenas", en: "Only in the cytoplasm"}
          - {pt: "Não usa receptores", en: "Doesn't use receptors"}
        correctAnswer: {pt: "Na membrana plasmática", en: "On the plasma membrane"}
        rationale: {pt: "Como não atravessa a bicamada, então o sinal precisa receptor de superfície que transduza para dentro.", en: "Because it can't cross the bilayer, the signal needs a surface receptor to transduce inside."}
        objectives: [biology.signaling]
        difficulty: 3
      - type: choice
        question: {pt: "Segundo mensageiro comum:", en: "Common second messenger:"}
        choices:
          - {pt: "cAMP, Ca²⁺, IP₃", en: "cAMP, Ca²⁺, IP₃"}
          - {pt: "Apenas DNA", en: "Only DNA"}
          - {pt: "Apenas glicose", en: "Only glucose"}
          - {pt: "Apenas hormônio", en: "Only hormone"}
        correctAnswer: {pt: "cAMP, Ca²⁺, IP₃", en: "cAMP, Ca²⁺, IP₃"}
        rationale: {pt: "Como amplificam o sinal exterior, então um único hormônio produz cascata interna massiva.", en: "Because they amplify the outside signal, one hormone produces a massive inside cascade."}
        objectives: [biology.signaling]
        difficulty: 3
      - type: choice
        question: {pt: "Ciclo celular tem ordem:", en: "Cell cycle order:"}
        choices:
          - {pt: "G1 → S → G2 → M → (G1 ou G0)", en: "G1 → S → G2 → M → (G1 or G0)"}
          - {pt: "M → G1 → S", en: "M → G1 → S"}
          - {pt: "Aleatório", en: "Random"}
          - {pt: "Apenas G1", en: "Only G1"}
        correctAnswer: {pt: "G1 → S → G2 → M → (G1 ou G0)", en: "G1 → S → G2 → M → (G1 or G0)"}
        rationale: {pt: "Como cada fase prepara a próxima, então a ordem é estritamente regulada por checkpoints.", en: "Because each phase preps the next, the order is strictly regulated by checkpoints."}
        objectives: [biology.cell_cycle]
        difficulty: 3
  - pageNumber: 2
    title: {pt: "Mitose, meiose e genética", en: "Mitosis, meiosis, and genetics"}
    description: {pt: "Mais revisão.", en: "More review."}
    exercises:
      - type: choice
        question: {pt: "Mitose produz:", en: "Mitosis produces:"}
        choices:
          - {pt: "2 células diploides idênticas", en: "2 identical diploid cells"}
          - {pt: "4 células haploides distintas", en: "4 distinct haploid cells"}
          - {pt: "1 célula só", en: "Just 1 cell"}
          - {pt: "Cem células", en: "A hundred cells"}
        correctAnswer: {pt: "2 células diploides idênticas", en: "2 identical diploid cells"}
        rationale: {pt: "Como serve para crescimento e reparo, então o conteúdo genético é preservado entre filhas.", en: "Because it serves growth and repair, genetic content is preserved among daughters."}
        objectives: [biology.cell_cycle]
        difficulty: 3
      - type: choice
        question: {pt: "Meiose produz:", en: "Meiosis produces:"}
        choices:
          - {pt: "4 células haploides geneticamente distintas (gametas)", en: "4 genetically distinct haploid cells (gametes)"}
          - {pt: "2 idênticas", en: "2 identical"}
          - {pt: "1 só", en: "Just 1"}
          - {pt: "Sempre 6", en: "Always 6"}
        correctAnswer: {pt: "4 células haploides geneticamente distintas (gametas)", en: "4 genetically distinct haploid cells (gametes)"}
        rationale: {pt: "Como reduz cromossomos pela metade e recombina, então gera variabilidade necessária à reprodução sexuada.", en: "Because it halves chromosomes and recombines, it generates variability essential for sexual reproduction."}
        objectives: [biology.cell_cycle]
        difficulty: 3
      - type: choice
        question: {pt: "Crossing-over ocorre em:", en: "Crossing-over occurs in:"}
        choices:
          - {pt: "Prófase I da meiose (entre homólogos)", en: "Prophase I of meiosis (between homologs)"}
          - {pt: "Mitose", en: "Mitosis"}
          - {pt: "G1", en: "G1"}
          - {pt: "Citocinese", en: "Cytokinesis"}
        correctAnswer: {pt: "Prófase I da meiose (entre homólogos)", en: "Prophase I of meiosis (between homologs)"}
        rationale: {pt: "Como segmentos são trocados, então alelos novos aparecem em gametas — fonte de variabilidade.", en: "Because segments are swapped, new alleles appear in gametes — source of variability."}
        objectives: [biology.cell_cycle]
        difficulty: 3
      - type: choice
        question: {pt: "Cruzamento Aa × Aa: proporção fenotípica:", en: "Aa × Aa cross: phenotypic ratio:"}
        choices:
          - {pt: "3:1 (dominante : recessivo)", en: "3:1 (dominant : recessive)"}
          - {pt: "1:1", en: "1:1"}
          - {pt: "9:3:3:1", en: "9:3:3:1"}
          - {pt: "Tudo igual", en: "All equal"}
        correctAnswer: {pt: "3:1 (dominante : recessivo)", en: "3:1 (dominant : recessive)"}
        rationale: {pt: "Como AA, Aa e Aa expressam o dominante e aa o recessivo, então a proporção 3:1 emerge naturalmente.", en: "Because AA, Aa, and Aa express dominant and aa expresses recessive, the 3:1 ratio emerges naturally."}
        objectives: [biology.genetics]
        difficulty: 3
      - type: choice
        question: {pt: "Cruzamento di-híbrido AaBb × AaBb:", en: "Dihybrid cross AaBb × AaBb:"}
        choices:
          - {pt: "9:3:3:1 (proporção fenotípica)", en: "9:3:3:1 (phenotype ratio)"}
          - {pt: "3:1", en: "3:1"}
          - {pt: "1:1", en: "1:1"}
          - {pt: "100% dominante", en: "100% dominant"}
        correctAnswer: {pt: "9:3:3:1 (proporção fenotípica)", en: "9:3:3:1 (phenotype ratio)"}
        rationale: {pt: "Como dois genes independentes combinam suas razões 3:1, então emerge o clássico 9:3:3:1 da 2ª lei de Mendel.", en: "Because two independent genes combine their 3:1 ratios, the classic 9:3:3:1 of Mendel's 2nd law emerges."}
        objectives: [biology.genetics]
        difficulty: 3
      - type: choice
        question: {pt: "Daltonismo é mais comum em:", en: "Color blindness is more common in:"}
        choices:
          - {pt: "Homens (gene X-recessivo, eles têm um só X)", en: "Men (X-recessive gene, they have only one X)"}
          - {pt: "Mulheres", en: "Women"}
          - {pt: "Ambos igualmente", en: "Both equally"}
          - {pt: "Apenas crianças", en: "Only children"}
        correctAnswer: {pt: "Homens (gene X-recessivo, eles têm um só X)", en: "Men (X-recessive gene, they have only one X)"}
        rationale: {pt: "Como mulheres XX podem mascarar com o segundo X, então a herança ligada ao X recessivo afeta mais homens.", en: "Because XX women can mask via the second X, X-linked recessive inheritance hits men more."}
        objectives: [biology.genetics]
        difficulty: 3
      - type: choice
        question: {pt: "ATP fornece energia para:", en: "ATP provides energy for:"}
        choices:
          - {pt: "Praticamente todos os processos celulares ativos", en: "Practically all active cellular processes"}
          - {pt: "Apenas movimento muscular", en: "Just muscle movement"}
          - {pt: "Apenas síntese de DNA", en: "Just DNA synthesis"}
          - {pt: "Apenas digestão", en: "Just digestion"}
        correctAnswer: {pt: "Praticamente todos os processos celulares ativos", en: "Practically all active cellular processes"}
        rationale: {pt: "Como ligações fosfato armazenam energia, então hidrólise libera-a para reações endergônicas.", en: "Because phosphate bonds store energy, hydrolysis releases it for endergonic reactions."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Tradução produz:", en: "Translation produces:"}
        choices:
          - {pt: "Proteína a partir de mRNA (no ribossomo)", en: "Protein from mRNA (at the ribosome)"}
          - {pt: "DNA", en: "DNA"}
          - {pt: "RNA", en: "RNA"}
          - {pt: "Glicose", en: "Glucose"}
        correctAnswer: {pt: "Proteína a partir de mRNA (no ribossomo)", en: "Protein from mRNA (at the ribosome)"}
        rationale: {pt: "Como ribossomo lê códons (3 bases) e une aminoácidos, então a sequência de mRNA vira proteína.", en: "Because the ribosome reads codons (3 bases) and joins amino acids, mRNA sequence becomes protein."}
        objectives: [biology.biochem]
        difficulty: 3
      - type: choice
        question: {pt: "Apoptose é:", en: "Apoptosis is:"}
        choices:
          - {pt: "Morte celular programada (controlada)", en: "Programmed cell death (controlled)"}
          - {pt: "Crescimento descontrolado", en: "Uncontrolled growth"}
          - {pt: "Sem efeito", en: "No effect"}
          - {pt: "Apenas inflamação", en: "Just inflammation"}
        correctAnswer: {pt: "Morte celular programada (controlada)", en: "Programmed cell death (controlled)"}
        rationale: {pt: "Como células danificadas se autodestroem, então o organismo elimina ameaças sem causar inflamação.", en: "Because damaged cells self-destruct, the organism eliminates threats without inflammation."}
        objectives: [biology.cell_cycle]
        difficulty: 3
      - type: choice
        question: {pt: "Resumo final do nível 5A:", en: "Final summary of 5A:"}
        choices:
          - {pt: "Bioquímica fundamenta processos celulares (membrana, enzimas, ciclo, herança)", en: "Biochemistry underlies cellular processes (membrane, enzymes, cycle, heredity)"}
          - {pt: "Apenas genética importa", en: "Only genetics matters"}
          - {pt: "Apenas enzimas importam", en: "Only enzymes matter"}
          - {pt: "Apenas membrana importa", en: "Only membrane matters"}
        correctAnswer: {pt: "Bioquímica fundamenta processos celulares (membrana, enzimas, ciclo, herança)", en: "Biochemistry underlies cellular processes (membrane, enzymes, cycle, heredity)"}
        rationale: {pt: "Tudo conecta-se: átomos → moléculas → enzimas → vias → células → genes — então biologia molecular é o esqueleto da vida.", en: "Everything connects: atoms → molecules → enzymes → pathways → cells → genes — molecular biology is the skeleton of life."}
        objectives: [biology.biochem]
        difficulty: 3
target: 20
