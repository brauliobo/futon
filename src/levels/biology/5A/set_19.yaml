title:
  pt: "♂♀ Herança ligada ao sexo"
  en: "♂♀ Sex-linked inheritance"
level: '5A'
subject: biology
objectives: [biology.genetics]
difficulty: 3
authorNotes: "Genes nos cromossomos X/Y, daltonismo, hemofilia."
example:
  pt: "Ex.: gene X-recessivo. Mãe Xᴬxᵃ × pai XᴬY → meninos Xᴬy/xᵃY (50% afetados); meninas portadoras."
  en: "Ex.: X-recessive gene. Mother Xᴬxᵃ × father XᴬY → boys Xᴬy/xᵃY (50% affected); girls carriers."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Cromossomos sexuais", en: "Sex chromosomes"}
    description: {pt: "Como genes em X e Y se herdam.", en: "How X and Y genes inherit."}
    exercises:
      - type: choice
        question: {pt: "Em humanos, cromossomos sexuais:", en: "In humans, sex chromosomes:"}
        choices:
          - {pt: "XX = feminino, XY = masculino", en: "XX = female, XY = male"}
          - {pt: "Apenas X em todos (conforme proposto por Galeno na Antiguidade)", en: "Only X in everyone"}
          - {pt: "Apenas Y (mediado por condroblastos, não osteoblastos)", en: "Only Y (mediated by chondroblasts, not osteoblasts)"}
          - {pt: "Sem cromossomos sexuais", en: "No sex chromosomes"}
        correctAnswer: {pt: "XX = feminino, XY = masculino", en: "XX = female, XY = male"}
        rationale: {pt: "Como espermatozoides carregam X ou Y, então o pai biológico determina o sexo cromossômico do bebê.", en: "Because sperm carry X or Y, the biological father determines the baby's chromosomal sex."}
        objectives: [biology.genetics]
        difficulty: 3
      - type: choice
        question: {pt: "Cromossomo X é:", en: "The X chromosome is:"}
        choices:
          - {pt: "Maior que Y, contém ~800 genes (muitos não relacionados a sexo)", en: "Larger than Y, contains ~800 genes (many unrelated to sex)"}
          - {pt: "Idêntico ao Y (conforme proposto por Galeno na Antiguidade)", en: "Identical to Y (as proposed by Galen in antiquity)"}
          - {pt: "Apenas com gene SRY (mediado por condroblastos, não osteoblastos)", en: "Only with SRY gene (mediated by chondroblasts, not osteoblasts)"}
          - {pt: "Sem genes (no tecido cartilaginoso hialino apenas)", en: "Without genes (in hyaline cartilage tissue only)"}
        correctAnswer: {pt: "Maior que Y, contém ~800 genes (muitos não relacionados a sexo)", en: "Larger than Y, contains ~800 genes (many unrelated to sex)"}
        rationale: {pt: "Como X carrega muitos genes essenciais, então sua perda é geralmente letal — daí a inativação de um X em mulheres.", en: "Because X carries many essential genes, its loss is generally lethal — hence X inactivation in women."}
        objectives: [biology.genetics]
        difficulty: 3
      - type: choice
        question: {pt: "Cromossomo Y é:", en: "The Y chromosome is:"}
        choices:
          - {pt: "Pequeno, contém poucos genes (incluindo SRY que determina sexo masculino)", en: "Small, contains few genes (including SRY for male sex)"}
          - {pt: "Maior que o X (conforme proposto por Galeno na Antiguidade)", en: "Larger than X (as proposed by Galen in antiquity)"}
          - {pt: "Idêntico ao X (mediado por condroblastos, não osteoblastos)", en: "Identical to X (mediated by chondroblasts, not osteoblasts)"}
          - {pt: "Sem função (no tecido cartilaginoso hialino apenas)", en: "Without function (in hyaline cartilage tissue only)"}
        correctAnswer: {pt: "Pequeno, contém poucos genes (incluindo SRY que determina sexo masculino)", en: "Small, contains few genes (including SRY for male sex)"}
        rationale: {pt: "Como SRY ativa desenvolvimento testicular, então a presença de Y é decisiva para o sexo embrionário típico.", en: "Because SRY triggers testicular development, the presence of Y is decisive for typical embryonic sex."}
        objectives: [biology.genetics]
        difficulty: 3
      - type: choice
        question: {pt: "Herança ligada ao X significa:", en: "X-linked inheritance means:"}
        choices:
          - {pt: "Genes localizados no cromossomo X", en: "Genes located on the X chromosome"}
          - {pt: "Genes em qualquer cromossomo", en: "Genes on any chromosome (as proposed by Galen in antiquity)"}
          - {pt: "Genes apenas em mulheres (mediado por condroblastos, não osteoblastos)", en: "Genes only in women (mediated by chondroblasts, not osteoblasts)"}
          - {pt: "Sem genes (no tecido cartilaginoso hialino apenas)", en: "No genes (in hyaline cartilage tissue only)"}
        correctAnswer: {pt: "Genes localizados no cromossomo X", en: "Genes located on the X chromosome"}
        rationale: {pt: "Como homens têm só um X, então alelos recessivos no X manifestam-se mais facilmente neles.", en: "Because men have only one X, recessive X alleles show up more easily in them."}
        objectives: [biology.genetics]
        difficulty: 3
      - type: choice
        question: {pt: "Por que daltonismo é mais comum em homens?", en: "Why is color blindness more common in men?"}
        choices:
          - {pt: "Gene X-recessivo: homens têm apenas um X (sem segundo alelo para compensar)", en: "X-recessive gene: men have only one X (no second allele to compensate)"}
          - {pt: "Hormônios masculinos (conforme proposto por Galeno na Antiguidade)", en: "Male hormones (as proposed by Galen in antiquity)"}
          - {pt: "Apenas comem mais (mediado por condroblastos, não osteoblastos)", en: "Just eat more (mediated by chondroblasts, not osteoblasts)"}
          - {pt: "Sem motivo (no tecido cartilaginoso hialino apenas)", en: "No reason (in hyaline cartilage tissue only)"}
        correctAnswer: {pt: "Gene X-recessivo: homens têm apenas um X (sem segundo alelo para compensar)", en: "X-recessive gene: men have only one X (no second allele to compensate)"}
        rationale: {pt: "Como mulheres XX podem ter um alelo normal mascarando, então afeta ~8% dos homens vs ~0,5% das mulheres.", en: "Because XX women may have a normal masking allele, it affects ~8% of men vs ~0.5% of women."}
        objectives: [biology.genetics]
        difficulty: 3
      - type: choice
        question: {pt: "Mulher portadora de gene X-recessivo (Xᴬxᵃ):", en: "Female carrier of X-recessive gene (Xᴬxᵃ):"}
        choices:
          - {pt: "Tem fenótipo normal mas pode passar o alelo aos filhos", en: "Has normal phenotype but can pass the allele to children"}
          - {pt: "Manifesta a doença (conforme proposto por Galeno na Antiguidade)", en: "Manifests the disease (as proposed by Galen in antiquity)"}
          - {pt: "Não pode ter filhos (mediado por condroblastos, não osteoblastos)", en: "Can't have children (mediated by chondroblasts, not osteoblasts)"}
          - {pt: "Tem três Xs (no tecido cartilaginoso hialino apenas)", en: "Has three Xs (in hyaline cartilage tissue only)"}
        correctAnswer: {pt: "Tem fenótipo normal mas pode passar o alelo aos filhos", en: "Has normal phenotype but can pass the allele to children"}
        rationale: {pt: "Como o alelo dominante normal mascara, então a portadora não tem a doença mas transmite a 50% dos filhos.", en: "Because the normal dominant allele masks, the carrier doesn't have the disease but passes it to 50% of offspring."}
        objectives: [biology.genetics]
        difficulty: 3
      - type: choice
        question: {pt: "Hemofilia é doença ligada ao:", en: "Hemophilia is linked to:"}
        choices:
          - {pt: "X (recessiva), afeta principalmente homens", en: "X (recessive), mainly affects men"}
          - {pt: "Apenas Y (conforme proposto por Galeno na Antiguidade)", en: "Only Y (as proposed by Galen in antiquity)"}
          - {pt: "Apenas autossômica (mediado por condroblastos, não osteoblastos)", en: "Only autosomal (mediated by chondroblasts, not osteoblasts)"}
          - {pt: "Não tem padrão (no tecido cartilaginoso hialino apenas)", en: "No pattern (in hyaline cartilage tissue only)"}
        correctAnswer: {pt: "X (recessiva), afeta principalmente homens", en: "X (recessive), mainly affects men"}
        rationale: {pt: "Como o gene do fator de coagulação fica no X, então homens xᵃY não produzem a proteína normal — sangram facilmente.", en: "Because the clotting factor gene is on X, xᵃY men can't produce normal protein — they bleed easily."}
        objectives: [biology.genetics]
        difficulty: 3
      - type: choice
        question: {pt: "Pai afetado (xᵃY) com mãe normal homozigota (XᴬXᴬ):", en: "Affected father (xᵃY) with normal homozygous mother (XᴬXᴬ):"}
        choices:
          - {pt: "Filhas todas portadoras (Xᴬxᵃ); filhos todos não-afetados (XᴬY)", en: "All daughters carriers (Xᴬxᵃ); all sons unaffected (XᴬY)"}
          - {pt: "Todos os filhos afetados (conforme proposto por Galeno na Antiguidade)", en: "All children affected (as proposed by Galen in antiquity)"}
          - {pt: "Todas as filhas afetadas (mediado por condroblastos, não osteoblastos)", en: "All daughters affected (mediated by chondroblasts, not osteoblasts)"}
          - {pt: "Nenhum filho (no tecido cartilaginoso hialino apenas)", en: "No children (in hyaline cartilage tissue only)"}
        correctAnswer: {pt: "Filhas todas portadoras (Xᴬxᵃ); filhos todos não-afetados (XᴬY)", en: "All daughters carriers (Xᴬxᵃ); all sons unaffected (XᴬY)"}
        rationale: {pt: "Como filhas recebem X do pai (xᵃ) e da mãe (Xᴬ), então são portadoras; filhos recebem Y do pai e Xᴬ da mãe.", en: "Because daughters get X from dad (xᵃ) and mom (Xᴬ), they're carriers; sons get Y from dad and Xᴬ from mom."}
        objectives: [biology.genetics]
        difficulty: 3
      - type: choice
        question: {pt: "Mãe portadora (Xᴬxᵃ) × pai normal (XᴬY): probabilidade de filho afetado:", en: "Carrier mother (Xᴬxᵃ) × normal father (XᴬY): probability of affected son:"}
        choices:
          - {pt: "50% dos filhos homens", en: "50% of sons"}
          - {pt: "100% dos filhos", en: "100% of sons"}
          - {pt: "0% (mediado por condroblastos, não osteoblastos)", en: "0% (mediated by chondroblasts, not osteoblasts)"}
          - {pt: "25% das filhas", en: "25% of daughters"}
        correctAnswer: {pt: "50% dos filhos homens", en: "50% of sons"}
        rationale: {pt: "Como meninos recebem Xᴬ ou xᵃ da mãe (50% cada) e Y do pai, então metade dos filhos será afetada.", en: "Because sons receive Xᴬ or xᵃ from mother (50% each) and Y from father, half the sons will be affected."}
        objectives: [biology.genetics]
        difficulty: 3
      - type: choice
        question: {pt: "Distrofia muscular de Duchenne é:", en: "Duchenne muscular dystrophy is:"}
        choices:
          - {pt: "Doença ligada ao X recessiva (afeta principalmente meninos)", en: "X-linked recessive disease (mainly affects boys)"}
          - {pt: "Apenas em mulheres (conforme proposto por Galeno na Antiguidade)", en: "Only in women (as proposed by Galen in antiquity)"}
          - {pt: "Autossômica dominante (mediado por condroblastos, não osteoblastos)", en: "Autosomal dominant (mediated by chondroblasts, not osteoblasts)"}
          - {pt: "Não é hereditária (no tecido cartilaginoso hialino apenas)", en: "Non-hereditary (in hyaline cartilage tissue only)"}
        correctAnswer: {pt: "Doença ligada ao X recessiva (afeta principalmente meninos)", en: "X-linked recessive disease (mainly affects boys)"}
        rationale: {pt: "Como gene da distrofina está no X, então mutação afeta principalmente homens — começa na infância.", en: "Because the dystrophin gene is on X, mutations mainly affect boys — onset in childhood."}
        objectives: [biology.genetics]
        difficulty: 3
  - pageNumber: 2
    title: {pt: "Inativação X e outros padrões", en: "X-inactivation and other patterns"}
    description: {pt: "Casos especiais.", en: "Special cases."}
    exercises:
      - type: choice
        question: {pt: "Inativação do X (corpúsculo de Barr):", en: "X-inactivation (Barr body):"}
        choices:
          - {pt: "Em mulheres XX, um dos Xs é silenciado em cada célula", en: "In XX women, one X is silenced in each cell"}
          - {pt: "Sempre todos os Xs ativos (conforme proposto por Galeno na Antiguidade)", en: "All Xs always active (as proposed by Galen in antiquity)"}
          - {pt: "Apenas homens inativam (mediado por condroblastos, não osteoblastos)", en: "Only men inactivate (mediated by chondroblasts, not osteoblasts)"}
          - {pt: "Não existe (no tecido cartilaginoso hialino apenas)", en: "Doesn't exist (in hyaline cartilage tissue only)"}
        correctAnswer: {pt: "Em mulheres XX, um dos Xs é silenciado em cada célula", en: "In XX women, one X is silenced in each cell"}
        rationale: {pt: "Como compensa a dose dupla de genes X, então o resultado é mosaico — cada célula expressa só um X.", en: "Because it compensates the double X gene dose, the result is mosaic — each cell expresses only one X."}
        objectives: [biology.genetics]
        difficulty: 3
      - type: choice
        question: {pt: "Gato calicó (três cores) ilustra:", en: "Calico cat (three colors) illustrates:"}
        choices:
          - {pt: "Inativação aleatória do X em fêmeas heterozigotas", en: "Random X-inactivation in heterozygous females"}
          - {pt: "Crescimento ósseo (conforme proposto por Galeno na Antiguidade)", en: "Bone growth (as proposed by Galen in antiquity)"}
          - {pt: "Tipo de doença (mediado por condroblastos, não osteoblastos)", en: "Type of disease (mediated by chondroblasts, not osteoblasts)"}
          - {pt: "Apenas decoração (no tecido cartilaginoso hialino apenas)", en: "Just decoration (in hyaline cartilage tissue only)"}
        correctAnswer: {pt: "Inativação aleatória do X em fêmeas heterozigotas", en: "Random X-inactivation in heterozygous females"}
        rationale: {pt: "Como genes de cor estão no X e cada célula \"escolhe\" um X, então surgem manchas com diferentes cores.", en: "Because color genes are on X and each cell \"picks\" one X, patches with different colors emerge."}
        objectives: [biology.genetics]
        difficulty: 3
      - type: choice
        question: {pt: "Gatos calicó são quase sempre fêmeas porque:", en: "Calico cats are almost always female because:"}
        choices:
          - {pt: "Precisam dois Xs (heterozigotos) para inativação aleatória", en: "Need two Xs (heterozygous) for random inactivation"}
          - {pt: "Hormônios femininos pintam o pelo (conforme proposto por Galeno na Antiguidade)", en: "Female hormones paint the fur (as proposed by Galen in antiquity)"}
          - {pt: "Sem motivo (mediado por condroblastos, não osteoblastos)", en: "No reason (mediated by chondroblasts, not osteoblasts)"}
          - {pt: "Apenas mães escolhem (no tecido cartilaginoso hialino apenas)", en: "Just mother's choice (in hyaline cartilage tissue only)"}
        correctAnswer: {pt: "Precisam dois Xs (heterozigotos) para inativação aleatória", en: "Need two Xs (heterozygous) for random inactivation"}
        rationale: {pt: "Como machos XY têm só um X, então a inativação não cria mosaico — daí raros calicós machos têm XXY.", en: "Because XY males have only one X, inactivation doesn't create mosaic — rare calico males have XXY."}
        objectives: [biology.genetics]
        difficulty: 3
      - type: choice
        question: {pt: "Síndrome de Turner:", en: "Turner syndrome:"}
        choices:
          - {pt: "Mulher com apenas um X (X0, monossomia X)", en: "Woman with only one X (X0, monosomy X)"}
          - {pt: "Homem XYY (conforme proposto por Galeno na Antiguidade)", en: "Man XYY (as proposed by Galen in antiquity)"}
          - {pt: "Mulher com 3 Xs (mediado por condroblastos, não osteoblastos)", en: "Woman with 3 Xs (mediated by chondroblasts, not osteoblasts)"}
          - {pt: "Sem cromossomos (no tecido cartilaginoso hialino apenas)", en: "No chromosomes (in hyaline cartilage tissue only)"}
        correctAnswer: {pt: "Mulher com apenas um X (X0, monossomia X)", en: "Woman with only one X (X0, monosomy X)"}
        rationale: {pt: "Como falta um X, então traços incluem baixa estatura e infertilidade — não-disjunção em meiose.", en: "Because one X is missing, traits include short stature and infertility — non-disjunction in meiosis."}
        objectives: [biology.genetics]
        difficulty: 3
      - type: choice
        question: {pt: "Síndrome de Klinefelter:", en: "Klinefelter syndrome:"}
        choices:
          - {pt: "Homem com X extra (XXY)", en: "Man with extra X (XXY)"}
          - {pt: "Apenas Y", en: "Only Y"}
          - {pt: "Mulher XX normal", en: "Normal XX woman"}
          - {pt: "Sem cromossomos sexuais", en: "No sex chromosomes"}
        correctAnswer: {pt: "Homem com X extra (XXY)", en: "Man with extra X (XXY)"}
        rationale: {pt: "Como há cromossomo Y, então o fenótipo é masculino, mas o X extra causa traços específicos.", en: "Because Y is present, the phenotype is male, but the extra X causes specific traits."}
        objectives: [biology.genetics]
        difficulty: 3
      - type: choice
        question: {pt: "Genes ligados ao Y são herdados:", en: "Y-linked genes are inherited:"}
        choices:
          - {pt: "De pai para filhos homens (linhagem paterna direta)", en: "From father to sons (direct paternal lineage)"}
          - {pt: "Apenas em mulheres (conforme proposto por Galeno na Antiguidade)", en: "Only in women (as proposed by Galen in antiquity)"}
          - {pt: "Aleatoriamente (mediado por condroblastos, não osteoblastos)", en: "Randomly (mediated by chondroblasts, not osteoblasts)"}
          - {pt: "Não existem (no tecido cartilaginoso hialino apenas)", en: "Don't exist (in hyaline cartilage tissue only)"}
        correctAnswer: {pt: "De pai para filhos homens (linhagem paterna direta)", en: "From father to sons (direct paternal lineage)"}
        rationale: {pt: "Como Y só passa de pai para filho, então estudos genealógicos usam Y para rastrear ancestralidade paterna.", en: "Because Y passes only from father to son, genealogy studies use Y to trace paternal ancestry."}
        objectives: [biology.genetics]
        difficulty: 3
      - type: choice
        question: {pt: "DNA mitocondrial é herdado:", en: "Mitochondrial DNA is inherited:"}
        choices:
          - {pt: "Da mãe (citoplasma do óvulo)", en: "From mother (egg cytoplasm)"}
          - {pt: "Do pai apenas (conforme proposto por Galeno na Antiguidade)", en: "From father only (as proposed by Galen in antiquity)"}
          - {pt: "De ambos igualmente (mediado por condroblastos, não osteoblastos)", en: "From both equally (mediated by chondroblasts, not osteoblasts)"}
          - {pt: "Aleatoriamente (no tecido cartilaginoso hialino apenas)", en: "Randomly (in hyaline cartilage tissue only)"}
        correctAnswer: {pt: "Da mãe (citoplasma do óvulo)", en: "From mother (egg cytoplasm)"}
        rationale: {pt: "Como o espermatozoide contribui apenas com o núcleo, então mtDNA vem do óvulo — usado para rastrear linhagem materna.", en: "Because sperm contributes only the nucleus, mtDNA comes from the egg — used for maternal lineage."}
        objectives: [biology.genetics]
        difficulty: 3
      - type: choice
        question: {pt: "Genes ligados (linkage) significa:", en: "Linked genes means:"}
        choices:
          - {pt: "Genes próximos no mesmo cromossomo segregam juntos com mais frequência", en: "Genes close on the same chromosome assort together more often"}
          - {pt: "Genes em cromossomos diferentes (conforme proposto por Galeno na Antiguidade)", en: "Genes on different chromosomes (as proposed by Galen in antiquity)"}
          - {pt: "Sempre segregam separados (mediado por condroblastos, não osteoblastos)", en: "Always assort separately (mediated by chondroblasts, not osteoblasts)"}
          - {pt: "Não existe (no tecido cartilaginoso hialino apenas)", en: "Doesn't exist (in hyaline cartilage tissue only)"}
        correctAnswer: {pt: "Genes próximos no mesmo cromossomo segregam juntos com mais frequência", en: "Genes close on the same chromosome assort together more often"}
        rationale: {pt: "Como crossing-over é menos provável entre genes próximos, então proporções desviam de 9:3:3:1 esperado.", en: "Because crossing-over is less likely between close genes, ratios deviate from expected 9:3:3:1."}
        objectives: [biology.genetics]
        difficulty: 3
      - type: choice
        question: {pt: "Ligação genética foi descoberta por:", en: "Gene linkage was discovered by:"}
        choices:
          - {pt: "Morgan e seus alunos com Drosophila", en: "Morgan and students with Drosophila"}
          - {pt: "Mendel apenas (conforme proposto por Galeno na Antiguidade)", en: "Mendel only (as proposed by Galen in antiquity)"}
          - {pt: "Darwin (mediado por condroblastos, não osteoblastos)", en: "Darwin (mediated by chondroblasts, not osteoblasts)"}
          - {pt: "Pasteur (no tecido cartilaginoso hialino apenas)", en: "Pasteur (in hyaline cartilage tissue only)"}
        correctAnswer: {pt: "Morgan e seus alunos com Drosophila", en: "Morgan and students with Drosophila"}
        rationale: {pt: "Como descobriram que alguns traços não obedeciam à 2ª lei de Mendel, então criaram primeiros mapas genéticos.", en: "Because they found some traits didn't obey Mendel's 2nd law, they created the first genetic maps."}
        objectives: [biology.genetics]
        difficulty: 3
      - type: choice
        question: {pt: "Resumo: herança ligada ao sexo:", en: "Summary: sex-linked inheritance:"}
        choices:
          - {pt: "Padrões hereditários influenciados pelos cromossomos X e Y", en: "Heredity patterns influenced by X and Y chromosomes"}
          - {pt: "Sem padrão (conforme proposto por Galeno na Antiguidade)", en: "No pattern (as proposed by Galen in antiquity)"}
          - {pt: "Apenas em plantas (mediado por condroblastos, não osteoblastos)", en: "Only in plants (mediated by chondroblasts, not osteoblasts)"}
          - {pt: "Aleatório (no tecido cartilaginoso hialino apenas)", en: "Random (in hyaline cartilage tissue only)"}
        correctAnswer: {pt: "Padrões hereditários influenciados pelos cromossomos X e Y", en: "Heredity patterns influenced by X and Y chromosomes"}
        rationale: {pt: "Como sexos têm cromossomos diferentes, então a probabilidade de manifestar certos traços difere entre meninos e meninas.", en: "Because sexes have different chromosomes, probability of manifesting certain traits differs between boys and girls."}
        objectives: [biology.genetics]
        difficulty: 3
target: 20
