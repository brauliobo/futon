title:
  pt: "🍼 Embriologia humana e reprodução assistida"
  en: "🍼 Human embryology and assisted reproduction"
level: 'A'
subject: biology
objectives: [biology.embryology_advanced]
difficulty: 5
authorNotes: "Desenvolvimento humano precoce, FIV, ICSI, PGT, edição embrionária, ética reprodutiva."
example:
  pt: "Ex.: óvulo + espermatozoide → fertilização → clivagem → blastocisto → implantação → gravidez."
  en: "Ex.: egg + sperm → fertilization → cleavage → blastocyst → implantation → pregnancy."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Desenvolvimento humano precoce", en: "Early human development"}
    description: {pt: "Da fertilização à gastrulação.", en: "From fertilization to gastrulation."}
    exercises:
      - type: choice
        question: {pt: "Fertilização ocorre tipicamente em:", en: "Fertilization typically occurs in:"}
        choices:
          - {pt: "Tuba uterina (ampola), poucas horas após ovulação", en: "Fallopian tube (ampulla), few hours after ovulation"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas no útero profundo", en: "Just deep uterus"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Tuba uterina (ampola), poucas horas após ovulação", en: "Fallopian tube (ampulla), few hours after ovulation"}
        rationale: {pt: "Quando óvulo e espermatozoide se encontram na ampola, então zigoto inicia divisões em movimento ao útero.", en: "When egg and sperm meet in ampulla, zygote begins divisions while moving to uterus."}
        objectives: [biology.embryology_advanced]
        difficulty: 5
      - type: choice
        question: {pt: "Clivagem precoce caracteriza-se por:", en: "Early cleavage is characterized by:"}
        choices:
          - {pt: "Divisões mitóticas sem aumento de volume total — blastômeros menores progressivamente", en: "Mitotic divisions without total volume increase — progressively smaller blastomeres"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas crescimento volumétrico", en: "Just volumetric growth"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Divisões mitóticas sem aumento de volume total — blastômeros menores progressivamente", en: "Mitotic divisions without total volume increase — progressively smaller blastomeres"}
        rationale: {pt: "Quando relação núcleo/citoplasma cresce, então embrião assume controle do próprio genoma (ZGA).", en: "When nucleus/cytoplasm ratio grows, embryo takes control of its own genome (ZGA)."}
        objectives: [biology.embryology_advanced]
        difficulty: 5
      - type: choice
        question: {pt: "Blastocisto humano (D5-6):", en: "Human blastocyst (D5-6):"}
        choices:
          - {pt: "Possui trofoblasto e massa celular interna (ICM), pronto para implantação", en: "Has trophoblast and inner cell mass (ICM), ready for implantation"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas mórula", en: "Just morula"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Possui trofoblasto e massa celular interna (ICM), pronto para implantação", en: "Has trophoblast and inner cell mass (ICM), ready for implantation"}
        rationale: {pt: "Quando especificação trofoblasto-ICM ocorre, então primeiro destino celular emerge no embrião.", en: "When trophoblast-ICM specification occurs, first cell fate emerges in embryo."}
        objectives: [biology.embryology_advanced]
        difficulty: 5
      - type: choice
        question: {pt: "Implantação embrionária requer:", en: "Embryonic implantation requires:"}
        choices:
          - {pt: "Janela receptiva endometrial, sinalização hormonal e invasão trofoblástica controlada", en: "Endometrial receptive window, hormonal signaling and controlled trophoblast invasion"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Janela receptiva endometrial, sinalização hormonal e invasão trofoblástica controlada", en: "Endometrial receptive window, hormonal signaling and controlled trophoblast invasion"}
        rationale: {pt: "Quando timing falha, então embrião não adere e gravidez não vinga.", en: "When timing fails, embryo doesn't adhere and pregnancy doesn't take."}
        objectives: [biology.embryology_advanced]
        difficulty: 5
      - type: choice
        question: {pt: "Gastrulação humana ocorre em:", en: "Human gastrulation occurs at:"}
        choices:
          - {pt: "~14-21 dias, estabelecendo as três camadas germinativas", en: "~14-21 days, establishing the three germ layers"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas no segundo trimestre", en: "Just in second trimester"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "~14-21 dias, estabelecendo as três camadas germinativas", en: "~14-21 days, establishing the three germ layers"}
        rationale: {pt: "Quando ecto-, meso- e endoderme aparecem, então plano corporal começa a se materializar.", en: "When ecto-, meso-, and endoderm appear, body plan starts to materialize."}
        objectives: [biology.embryology_advanced]
        difficulty: 5
      - type: choice
        question: {pt: "Linha primitiva define:", en: "Primitive streak defines:"}
        choices:
          - {pt: "Eixo antero-posterior do embrião e início da gastrulação", en: "Embryo anteroposterior axis and gastrulation onset"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Eixo antero-posterior do embrião e início da gastrulação", en: "Embryo anteroposterior axis and gastrulation onset"}
        rationale: {pt: "Quando linha aparece, então embrião adquire orientação espacial fundamental.", en: "When the streak appears, embryo acquires fundamental spatial orientation."}
        objectives: [biology.embryology_advanced]
        difficulty: 5
      - type: choice
        question: {pt: "Crista neural origina:", en: "Neural crest gives rise to:"}
        choices:
          - {pt: "Diversos tecidos: melanócitos, gânglios sensoriais, parte do crânio facial e mais", en: "Diverse tissues: melanocytes, sensory ganglia, parts of facial skull and more"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas pele simples", en: "Just simple skin"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Diversos tecidos: melanócitos, gânglios sensoriais, parte do crânio facial e mais", en: "Diverse tissues: melanocytes, sensory ganglia, parts of facial skull and more"}
        rationale: {pt: "Quando células delaminam e migram, então originam linhagens diversas — 'quarta camada germinativa'.", en: "When cells delaminate and migrate, they yield diverse lineages — 'fourth germ layer'."}
        objectives: [biology.embryology_advanced]
        difficulty: 5
      - type: choice
        question: {pt: "Embrião regulativo significa:", en: "Regulative embryo means:"}
        choices:
          - {pt: "Pode compensar perda de células iniciais sem comprometer desenvolvimento", en: "Can compensate for early cell loss without compromising development"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas mosaico fixo", en: "Just fixed mosaic"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Pode compensar perda de células iniciais sem comprometer desenvolvimento", en: "Can compensate for early cell loss without compromising development"}
        rationale: {pt: "Quando blastômero é removido, então embrião humano se reorganiza — base segura para PGT.", en: "When blastomere is removed, human embryo reorganizes — safe basis for PGT."}
        objectives: [biology.embryology_advanced]
        difficulty: 5
      - type: choice
        question: {pt: "Placenta humana é classificada como:", en: "Human placenta is classified as:"}
        choices:
          - {pt: "Hemocorial — trofoblasto contata diretamente sangue materno", en: "Hemochorial — trophoblast directly contacts maternal blood"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas epiteliocorial", en: "Just epitheliochorial"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Hemocorial — trofoblasto contata diretamente sangue materno", en: "Hemochorial — trophoblast directly contacts maternal blood"}
        rationale: {pt: "Quando barreiras são finas, então troca gasosa e nutricional é eficiente — mas riscos imunes existem.", en: "When barriers are thin, gas and nutrient exchange is efficient — yet immune risks exist."}
        objectives: [biology.embryology_advanced]
        difficulty: 5
      - type: choice
        question: {pt: "Reprogramação epigenética no embrião precoce:", en: "Epigenetic reprogramming in early embryo:"}
        choices:
          - {pt: "Apaga maioria das marcas parentais e reestabelece pluripotência", en: "Erases most parental marks and re-establishes pluripotency"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas mantém marcas", en: "Just keeps marks"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Apaga maioria das marcas parentais e reestabelece pluripotência", en: "Erases most parental marks and re-establishes pluripotency"}
        rationale: {pt: "Quando 'lousa epigenética' é limpa, então embrião pode formar todos tipos celulares.", en: "When 'epigenetic slate' is wiped, embryo can form all cell types."}
        objectives: [biology.embryology_advanced]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "FIV, PGT e ética reprodutiva", en: "IVF, PGT and reproductive ethics"}
    description: {pt: "Da clínica reprodutiva às fronteiras éticas.", en: "From reproductive clinic to ethical frontiers."}
    exercises:
      - type: choice
        question: {pt: "Fertilização in vitro (FIV) clássica:", en: "Classical in vitro fertilization (IVF):"}
        choices:
          - {pt: "Coleta de óvulos + espermatozoides em laboratório → fertilização espontânea → transferência", en: "Collect eggs + sperm in lab → spontaneous fertilization → transfer"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Coleta de óvulos + espermatozoides em laboratório → fertilização espontânea → transferência", en: "Collect eggs + sperm in lab → spontaneous fertilization → transfer"}
        rationale: {pt: "Quando barreiras tubárias existem, então FIV contorna obstáculo anatômico.", en: "When tubal barriers exist, IVF bypasses anatomical obstacle."}
        objectives: [biology.embryology_advanced]
        difficulty: 5
      - type: choice
        question: {pt: "ICSI (Injeção Intracitoplasmática de Espermatozoide):", en: "ICSI (Intracytoplasmic Sperm Injection):"}
        choices:
          - {pt: "Injeta um espermatozoide diretamente no óvulo — útil em fator masculino grave", en: "Injects single sperm directly into egg — useful in severe male factor"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Injeta um espermatozoide diretamente no óvulo — útil em fator masculino grave", en: "Injects single sperm directly into egg — useful in severe male factor"}
        rationale: {pt: "Quando espermatozoides são poucos ou disfuncionais, então ICSI restaura possibilidade reprodutiva.", en: "When sperm are scarce or dysfunctional, ICSI restores reproductive possibility."}
        objectives: [biology.embryology_advanced]
        difficulty: 5
      - type: choice
        question: {pt: "PGT-A (preimplantation genetic testing for aneuploidies):", en: "PGT-A (preimplantation genetic testing for aneuploidies):"}
        choices:
          - {pt: "Triagem de blastocistos por número de cromossomos antes de transferir", en: "Blastocyst screening by chromosome number before transfer"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Triagem de blastocistos por número de cromossomos antes de transferir", en: "Blastocyst screening by chromosome number before transfer"}
        rationale: {pt: "Quando aneuploidias são excluídas, então taxa de aborto cai em pacientes de risco.", en: "When aneuploidies are excluded, miscarriage rate drops in at-risk patients."}
        objectives: [biology.embryology_advanced]
        difficulty: 5
      - type: choice
        question: {pt: "PGT-M (monogenic) busca:", en: "PGT-M (monogenic) seeks to:"}
        choices:
          - {pt: "Identificar embriões livres de doença monogênica conhecida na família", en: "Identify embryos free of known monogenic disease in family"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Identificar embriões livres de doença monogênica conhecida na família", en: "Identify embryos free of known monogenic disease in family"}
        rationale: {pt: "Quando mutação familiar é conhecida, então casais podem evitar transmissão hereditária.", en: "When familial mutation is known, couples can avoid hereditary transmission."}
        objectives: [biology.embryology_advanced]
        difficulty: 5
      - type: choice
        question: {pt: "Mitochondrial replacement therapy (MRT):", en: "Mitochondrial replacement therapy (MRT):"}
        choices:
          - {pt: "Substitui mitocôndrias defeituosas por saudáveis em óvulos — 'três pais'", en: "Replaces defective mitochondria with healthy in eggs — 'three-parent' technique"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Substitui mitocôndrias defeituosas por saudáveis em óvulos — 'três pais'", en: "Replaces defective mitochondria with healthy in eggs — 'three-parent' technique"}
        rationale: {pt: "Quando doenças mitocondriais maternas são prevenidas, então prole nasce saudável geneticamente.", en: "When maternal mitochondrial diseases are prevented, offspring are born genetically healthy."}
        objectives: [biology.embryology_advanced]
        difficulty: 5
      - type: choice
        question: {pt: "Edição germinativa em humanos é:", en: "Human germline editing is:"}
        choices:
          - {pt: "Eticamente proibida em quase todos os países pelos riscos transgeracionais", en: "Ethically banned in nearly all countries due to transgenerational risks"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Liberada universalmente", en: "Universally allowed"}
        correctAnswer: {pt: "Eticamente proibida em quase todos os países pelos riscos transgeracionais", en: "Ethically banned in nearly all countries due to transgenerational risks"}
        rationale: {pt: "Quando mudanças passam a descendentes, então consenso ético global ainda é cauteloso.", en: "When changes pass to descendants, global ethical consensus is still cautious."}
        objectives: [biology.embryology_advanced]
        difficulty: 5
      - type: choice
        question: {pt: "Modelos embrionários sintéticos (gastruloides, blastoides):", en: "Synthetic embryo models (gastruloids, blastoids):"}
        choices:
          - {pt: "Estruturas auto-organizadas a partir de células-tronco que mimetizam fases iniciais", en: "Self-organized stem-cell structures mimicking early stages"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Estruturas auto-organizadas a partir de células-tronco que mimetizam fases iniciais", en: "Self-organized stem-cell structures mimicking early stages"}
        rationale: {pt: "Quando modelos não usam embrião humano real, então pesquisa avança eticamente.", en: "When models don't use real human embryo, research advances ethically."}
        objectives: [biology.embryology_advanced]
        difficulty: 5
      - type: choice
        question: {pt: "Regra de 14 dias em pesquisa embrionária:", en: "14-day rule in embryo research:"}
        choices:
          - {pt: "Limite ético clássico para cultivo de embriões humanos in vitro, agora em revisão", en: "Classic ethical limit for human embryo culture in vitro, now under review"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Limite ético clássico para cultivo de embriões humanos in vitro, agora em revisão", en: "Classic ethical limit for human embryo culture in vitro, now under review"}
        rationale: {pt: "Quando técnicas avançam, então diálogo social define quando pode ou deve ser estendido.", en: "When techniques advance, social dialog defines whether it may be extended."}
        objectives: [biology.embryology_advanced]
        difficulty: 5
      - type: choice
        question: {pt: "Crioconservação de óvulos e embriões:", en: "Egg and embryo cryopreservation:"}
        choices:
          - {pt: "Vitrificação preserva células reprodutivas para uso futuro", en: "Vitrification preserves reproductive cells for future use"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Vitrificação preserva células reprodutivas para uso futuro", en: "Vitrification preserves reproductive cells for future use"}
        rationale: {pt: "Quando resfriamento ultrarrápido evita cristais, então células sobrevivem com viabilidade alta.", en: "When ultrarapid cooling avoids crystals, cells survive with high viability."}
        objectives: [biology.embryology_advanced]
        difficulty: 5
      - type: choice
        question: {pt: "Próximas fronteiras em reprodução:", en: "Next reproductive frontiers:"}
        choices:
          - {pt: "Gametogênese in vitro (IVG) a partir de iPS, embriologia sintética e útero artificial", en: "In vitro gametogenesis (IVG) from iPS, synthetic embryology and artificial womb"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Gametogênese in vitro (IVG) a partir de iPS, embriologia sintética e útero artificial", en: "In vitro gametogenesis (IVG) from iPS, synthetic embryology and artificial womb"}
        rationale: {pt: "Quando ferramentas avançam, então parentalidade biológica é redefinida com cuidado ético.", en: "When tools advance, biological parenthood is redefined with ethical care."}
        objectives: [biology.embryology_advanced]
        difficulty: 5
target: 20
