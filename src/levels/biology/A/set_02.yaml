title:
  pt: "🧬 Engenharia de proteínas"
  en: "🧬 Protein engineering"
level: 'A'
subject: biology
objectives: [biology.protein_engineering]
difficulty: 5
authorNotes: "Evolução dirigida, design racional, screening de bibliotecas, design computacional, aplicações industriais."
example:
  pt: "Ex.: enzima ineficiente → mutagênese → biblioteca → seleção/triagem → variantes melhores → ciclo iterativo."
  en: "Ex.: inefficient enzyme → mutagenesis → library → selection/screening → better variants → iterative cycle."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Evolução dirigida", en: "Directed evolution"}
    description: {pt: "Imitando seleção natural em laboratório.", en: "Mimicking natural selection in the lab."}
    exercises:
      - type: choice
        question: {pt: "Evolução dirigida combina:", en: "Directed evolution combines:"}
        choices:
          - {pt: "Diversificação aleatória + seleção/triagem para função desejada em ciclos", en: "Random diversification + selection/screening for desired function in cycles"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas design manual", en: "Just manual design"}
          - {pt: "Apenas mutação espontânea isolada", en: "Just isolated spontaneous mutation"}
        correctAnswer: {pt: "Diversificação aleatória + seleção/triagem para função desejada em ciclos", en: "Random diversification + selection/screening for desired function in cycles"}
        rationale: {pt: "Quando ciclos se acumulam, então evolução acelerada gera proteínas com fitness humano-definido.", en: "When cycles stack up, accelerated evolution yields proteins with human-defined fitness."}
        objectives: [biology.protein_engineering]
        difficulty: 5
      - type: choice
        question: {pt: "Frances Arnold ganhou Nobel (2018) por:", en: "Frances Arnold won the Nobel (2018) for:"}
        choices:
          - {pt: "Evolução dirigida de enzimas com aplicações biotecnológicas", en: "Directed evolution of enzymes with biotechnological applications"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas microscopia", en: "Just microscopy"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
