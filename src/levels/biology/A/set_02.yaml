        rationale: {pt: "Quando indústria adota suas técnicas, então enzimas verdes substituem química poluente.", en: "When industry adopts her techniques, green enzymes replace polluting chemistry."}
        objectives: [biology.protein_engineering]
        difficulty: 5
      - type: choice
        question: {pt: "Mutagênese saturada explora:", en: "Saturation mutagenesis explores:"}
        choices:
