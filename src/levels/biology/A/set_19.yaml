        rationale: {pt: "Quando uma fronteira ética se acalma, então outra surge — diálogo permanente.", en: "When one ethical frontier eases, another arises — permanent dialog."}
        objectives: [biology.stem_cells_clinic]
        difficulty: 5
      - type: choice
        question: {pt: "Próximas fronteiras em terapia celular:", en: "Next frontiers in cell therapy:"}
        choices:
          - {pt: "Células universais hipoimune, organoides funcionais transplantáveis e reprogramação in vivo", en: "Universal hypoimmune cells, transplantable functional organoids and in vivo reprogramming"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Células universais hipoimune, organoides funcionais transplantáveis e reprogramação in vivo", en: "Universal hypoimmune cells, transplantable functional organoids and in vivo reprogramming"}
