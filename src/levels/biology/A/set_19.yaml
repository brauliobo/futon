title:
  pt: "🧫 Células-tronco na clínica"
  en: "🧫 Clinical stem cells"
level: 'A'
subject: biology
objectives: [biology.stem_cells_clinic]
difficulty: 5
authorNotes: "iPSC clínicas, terapias celulares, transplante hematopoiético, regenerativa, ética stem cell."
example:
  pt: "Ex.: paciente → fibroblasto reprogramado → iPSC → diferenciação dirigida → célula β → transplante autólogo."
  en: "Ex.: patient → reprogrammed fibroblast → iPSC → directed differentiation → β cell → autologous transplant."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Tipos e fontes celulares", en: "Cell types and sources"}
    description: {pt: "De ESCs a iPSCs em escala clínica.", en: "From ESCs to iPSCs at clinical scale."}
    exercises:
      - type: choice
        question: {pt: "Células-tronco embrionárias (ESC) caracterizam-se por:", en: "Embryonic stem cells (ESCs) are characterized by:"}
        choices:
          - {pt: "Pluripotência (todas as três camadas germinativas) e auto-renovação ilimitada", en: "Pluripotency (all three germ layers) and unlimited self-renewal"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Pluripotência (todas as três camadas germinativas) e auto-renovação ilimitada", en: "Pluripotency (all three germ layers) and unlimited self-renewal"}
        rationale: {pt: "Quando ICM é cultivada, então linhagem mantém potencial e divide indefinidamente.", en: "When ICM is cultured, lineage retains potential and divides indefinitely."}
        objectives: [biology.stem_cells_clinic]
        difficulty: 5
      - type: choice
        question: {pt: "iPSC (induced pluripotent stem cell) provém de:", en: "iPSC (induced pluripotent stem cell) comes from:"}
        choices:
          - {pt: "Reprogramação de células somáticas adultas via fatores Oct4/Sox2/Klf4/c-Myc", en: "Reprogramming adult somatic cells via Oct4/Sox2/Klf4/c-Myc factors"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Reprogramação de células somáticas adultas via fatores Oct4/Sox2/Klf4/c-Myc", en: "Reprogramming adult somatic cells via Oct4/Sox2/Klf4/c-Myc factors"}
        rationale: {pt: "Quando Yamanaka mostrou reprogramação, então fonte personalizada deixou de exigir embriões.", en: "When Yamanaka showed reprogramming, personalized source no longer required embryos."}
        objectives: [biology.stem_cells_clinic]
        difficulty: 5
      - type: choice
        question: {pt: "MSCs (mesenquimais) são úteis em:", en: "MSCs (mesenchymal) are useful in:"}
        choices:
          - {pt: "Imunomodulação, GVHD e regeneração musculoesquelética", en: "Immunomodulation, GVHD and musculoskeletal regeneration"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Imunomodulação, GVHD e regeneração musculoesquelética", en: "Immunomodulation, GVHD and musculoskeletal regeneration"}
        rationale: {pt: "Quando MSCs secretam fatores tróficos, então tecido adjacente repara mais que substitui via diferenciação direta.", en: "When MSCs secrete trophic factors, adjacent tissue repairs more than via direct replacement."}
        objectives: [biology.stem_cells_clinic]
        difficulty: 5
      - type: choice
        question: {pt: "Células-tronco hematopoiéticas (HSC):", en: "Hematopoietic stem cells (HSC):"}
        choices:
          - {pt: "Originam todas linhagens sanguíneas; transplante TMO trata leucemias e doenças genéticas", en: "Give rise to all blood lineages; HSCT treats leukemias and genetic diseases"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Originam todas linhagens sanguíneas; transplante TMO trata leucemias e doenças genéticas", en: "Give rise to all blood lineages; HSCT treats leukemias and genetic diseases"}
        rationale: {pt: "Quando medula é reconstituída, então sistema imune e sanguíneo são reescritos.", en: "When marrow is reconstituted, immune and blood systems are rewritten."}
        objectives: [biology.stem_cells_clinic]
        difficulty: 5
      - type: choice
        question: {pt: "Células-tronco de tecido (adultas):", en: "Tissue (adult) stem cells:"}
        choices:
          - {pt: "Multipotentes, residentes em nichos, repõem células de seu próprio tecido", en: "Multipotent, niche-resident, replenish their tissue's cells"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas pluripotentes", en: "Just pluripotent"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Multipotentes, residentes em nichos, repõem células de seu próprio tecido", en: "Multipotent, niche-resident, replenish their tissue's cells"}
        rationale: {pt: "Quando nicho é mantido, então homeostase tecidual é assegurada por anos.", en: "When niche is maintained, tissue homeostasis is secured for years."}
        objectives: [biology.stem_cells_clinic]
        difficulty: 5
      - type: choice
        question: {pt: "Diferenciação dirigida de iPSC:", en: "Directed differentiation of iPSC:"}
        choices:
          - {pt: "Sequência de fatores de crescimento mimetiza desenvolvimento e produz tipo celular específico", en: "Growth factor sequence mimics development and produces specific cell type"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas acaso", en: "Just chance"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Sequência de fatores de crescimento mimetiza desenvolvimento e produz tipo celular específico", en: "Growth factor sequence mimics development and produces specific cell type"}
        rationale: {pt: "Quando vias embrionárias são recapituladas, então células maduras emergem reproduzivelmente.", en: "When embryonic pathways are recapitulated, mature cells emerge reproducibly."}
        objectives: [biology.stem_cells_clinic]
        difficulty: 5
      - type: choice
        question: {pt: "Reprogramação direta (transdiferenciação):", en: "Direct reprogramming (transdifferentiation):"}
        choices:
          - {pt: "Converte tipo celular A em B sem passar por estado pluripotente", en: "Converts cell type A into B without passing through pluripotent state"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas via iPSC", en: "Only via iPSC"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Converte tipo celular A em B sem passar por estado pluripotente", en: "Converts cell type A into B without passing through pluripotent state"}
        rationale: {pt: "Quando atalho evita pluripotência, então risco tumoral cai e processo é mais rápido.", en: "When shortcut avoids pluripotency, tumor risk drops and process is faster."}
        objectives: [biology.stem_cells_clinic]
        difficulty: 5
      - type: choice
        question: {pt: "Bancos de iPSC compatíveis (haplobancos):", en: "Compatible iPSC banks (haplobanks):"}
        choices:
          - {pt: "Linhagens HLA-homozigotas cobrem ampla população reduzindo rejeição", en: "HLA-homozygous lines cover broad population, reducing rejection"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Linhagens HLA-homozigotas cobrem ampla população reduzindo rejeição", en: "HLA-homozygous lines cover broad population, reducing rejection"}
        rationale: {pt: "Quando poucas linhagens cobrem maioria, então terapias 'off-the-shelf' tornam-se possíveis.", en: "When few lines cover the majority, 'off-the-shelf' therapies become possible."}
        objectives: [biology.stem_cells_clinic]
        difficulty: 5
      - type: choice
        question: {pt: "Hipoimunogenia engenheirada (cloak):", en: "Engineered hypoimmunogenicity (cloaking):"}
        choices:
          - {pt: "Edição de HLA + CD47 produz células universais resistentes a NK e T", en: "HLA + CD47 editing yields universal cells resistant to NK and T attack"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Edição de HLA + CD47 produz células universais resistentes a NK e T", en: "HLA + CD47 editing yields universal cells resistant to NK and T attack"}
        rationale: {pt: "Quando 'invisibilidade' imune é alcançada, então rejeição alogênica é minimizada.", en: "When immune 'invisibility' is achieved, allogeneic rejection is minimized."}
        objectives: [biology.stem_cells_clinic]
        difficulty: 5
      - type: choice
        question: {pt: "Risco tumorigênico de iPSC envolve:", en: "iPSC tumorigenic risk involves:"}
        choices:
          - {pt: "Células indiferenciadas residuais formando teratomas pós-transplante", en: "Residual undifferentiated cells forming post-transplant teratomas"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Células indiferenciadas residuais formando teratomas pós-transplante", en: "Residual undifferentiated cells forming post-transplant teratomas"}
        rationale: {pt: "Quando triagem é rigorosa, então células contaminantes pluripotentes são removidas antes do uso.", en: "When screening is rigorous, contaminating pluripotent cells are removed before use."}
        objectives: [biology.stem_cells_clinic]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Aplicações terapêuticas", en: "Therapeutic applications"}
    description: {pt: "Da bancada à clínica.", en: "From bench to clinic."}
    exercises:
      - type: choice
        question: {pt: "Terapia retiniana com iPSC trata:", en: "Retinal iPSC therapy treats:"}
        choices:
          - {pt: "Degeneração macular reposicionando RPE derivado de iPSC do paciente", en: "Macular degeneration by replacing RPE derived from patient iPSC"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Degeneração macular reposicionando RPE derivado de iPSC do paciente", en: "Macular degeneration by replacing RPE derived from patient iPSC"}
        rationale: {pt: "Quando olho é imunoprivilegiado, então enxertos pequenos preservam visão central.", en: "When eye is immune-privileged, small grafts preserve central vision."}
        objectives: [biology.stem_cells_clinic]
        difficulty: 5
      - type: choice
        question: {pt: "Células β-pancreáticas derivadas de iPSC:", en: "iPSC-derived pancreatic β cells:"}
        choices:
          - {pt: "Restauram secreção de insulina em modelos de diabetes tipo 1", en: "Restore insulin secretion in type 1 diabetes models"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Restauram secreção de insulina em modelos de diabetes tipo 1", en: "Restore insulin secretion in type 1 diabetes models"}
        rationale: {pt: "Quando β diferenciadas são encapsuladas, então autoimunidade é evitada e função é restaurada.", en: "When differentiated β are encapsulated, autoimmunity is avoided and function is restored."}
        objectives: [biology.stem_cells_clinic]
        difficulty: 5
      - type: choice
        question: {pt: "Terapia neural com iPSC para Parkinson:", en: "iPSC neural therapy for Parkinson's:"}
        choices:
          - {pt: "Neurônios dopaminérgicos derivados de iPSC restauram função em ensaios humanos iniciais", en: "iPSC-derived dopaminergic neurons restore function in early human trials"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Neurônios dopaminérgicos derivados de iPSC restauram função em ensaios humanos iniciais", en: "iPSC-derived dopaminergic neurons restore function in early human trials"}
        rationale: {pt: "Quando neurônios são autólogos, então rejeição é mínima e enxerto se integra.", en: "When neurons are autologous, rejection is minimal and graft integrates."}
        objectives: [biology.stem_cells_clinic]
        difficulty: 5
      - type: choice
        question: {pt: "CAR-T derivado de iPSC (iPSC-CAR-T):", en: "iPSC-derived CAR-T (iPSC-CAR-T):"}
        choices:
          - {pt: "Plataforma off-the-shelf alogênica para terapia celular escalável em câncer", en: "Allogeneic off-the-shelf platform for scalable cancer cell therapy"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Plataforma off-the-shelf alogênica para terapia celular escalável em câncer", en: "Allogeneic off-the-shelf platform for scalable cancer cell therapy"}
        rationale: {pt: "Quando manufatura é centralizada, então custo cai e disponibilidade aumenta drasticamente.", en: "When manufacturing is centralized, cost drops and availability rises dramatically."}
        objectives: [biology.stem_cells_clinic]
        difficulty: 5
      - type: choice
        question: {pt: "Edição genômica em HSC ex vivo trata:", en: "Ex vivo HSC genome editing treats:"}
        choices:
          - {pt: "Anemia falciforme e beta-talassemia (Casgevy aprovada via CRISPR)", en: "Sickle cell and beta-thalassemia (CRISPR-based Casgevy approved)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Anemia falciforme e beta-talassemia (Casgevy aprovada via CRISPR)", en: "Sickle cell and beta-thalassemia (CRISPR-based Casgevy approved)"}
        rationale: {pt: "Quando reativamos HbF editando BCL11A, então hemoglobinopatia é mitigada para a vida.", en: "When we reactivate HbF by editing BCL11A, hemoglobinopathy is mitigated for life."}
        objectives: [biology.stem_cells_clinic]
        difficulty: 5
      - type: choice
        question: {pt: "Modelagem de doença com iPSC ('disease in a dish'):", en: "iPSC disease modeling ('disease in a dish'):"}
        choices:
          - {pt: "iPSC do paciente diferenciada permite estudar mecanismo e triar fármacos personalizados", en: "Patient iPSC differentiated enables mechanism study and personalized drug screening"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "iPSC do paciente diferenciada permite estudar mecanismo e triar fármacos personalizados", en: "Patient iPSC differentiated enables mechanism study and personalized drug screening"}
        rationale: {pt: "Quando doença é recapitulada in vitro, então medicamentos são testados antes do paciente.", en: "When disease is recapitulated in vitro, drugs are tested before reaching the patient."}
        objectives: [biology.stem_cells_clinic]
        difficulty: 5
      - type: choice
        question: {pt: "Organoides cerebrais derivados de iPSC:", en: "iPSC-derived brain organoids:"}
        choices:
          - {pt: "Modelam doenças neurológicas humanas com fidelidade superior a modelos murinos", en: "Model human neurological diseases with greater fidelity than murine models"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Modelam doenças neurológicas humanas com fidelidade superior a modelos murinos", en: "Model human neurological diseases with greater fidelity than murine models"}
        rationale: {pt: "Quando neurônios humanos compõem o tecido, então fenótipos específicos da espécie aparecem.", en: "When human neurons compose tissue, species-specific phenotypes emerge."}
        objectives: [biology.stem_cells_clinic]
        difficulty: 5
      - type: choice
        question: {pt: "Manufatura GMP de células-tronco exige:", en: "GMP stem cell manufacturing requires:"}
        choices:
          - {pt: "Salas limpas, controle de qualidade rigoroso e rastreabilidade total do processo", en: "Cleanrooms, rigorous quality control and full process traceability"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Salas limpas, controle de qualidade rigoroso e rastreabilidade total do processo", en: "Cleanrooms, rigorous quality control and full process traceability"}
        rationale: {pt: "Quando produto é célula viva, então cada lote precisa identidade, potência e segurança comprovadas.", en: "When product is living cell, every lot needs proven identity, potency and safety."}
