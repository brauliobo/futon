        difficulty: 5
      - type: choice
        question: {pt: "Ética de células-tronco evoluiu com:", en: "Stem cell ethics evolved with:"}
        choices:
          - {pt: "iPSC reduzindo dilemas de ESC; novos debates em embriões sintéticos surgem", en: "iPSC reducing ESC dilemmas; new debates in synthetic embryos arise"}
