title:
  pt: "💊 Entrega de fármacos e nanomedicina"
  en: "💊 Drug delivery and nanomedicine"
level: 'A'
subject: biology
objectives: [biology.drug_delivery]
difficulty: 5
authorNotes: "Sistemas de entrega, LNPs, nanopartículas, ADCs, controlled release, atravessar barreiras biológicas."
example:
  pt: "Ex.: fármaco encapsulado em LNP → injeção → captação celular → liberação dirigida → efeito terapêutico."
  en: "Ex.: drug encapsulated in LNP → injection → cellular uptake → targeted release → therapeutic effect."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Plataformas de entrega", en: "Delivery platforms"}
    description: {pt: "Como levar moléculas certas ao alvo certo.", en: "How to deliver right molecules to right targets."}
    exercises:
      - type: choice
        question: {pt: "Nanopartículas lipídicas (LNPs) entregam:", en: "Lipid nanoparticles (LNPs) deliver:"}
        choices:
          - {pt: "mRNA, siRNA e cargas hidrofílicas via fusão endossomal mediada por lipídio ionizável", en: "mRNA, siRNA and hydrophilic cargoes via ionizable lipid-mediated endosomal fusion"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "mRNA, siRNA e cargas hidrofílicas via fusão endossomal mediada por lipídio ionizável", en: "mRNA, siRNA and hydrophilic cargoes via ionizable lipid-mediated endosomal fusion"}
        rationale: {pt: "Quando pH endossomal protona o lipídio, então membrana se desestabiliza e carga escapa para o citoplasma.", en: "When endosomal pH protonates the lipid, membrane destabilizes and cargo escapes to cytoplasm."}
        objectives: [biology.drug_delivery]
        difficulty: 5
      - type: choice
        question: {pt: "Lipídio ionizável é central em LNPs porque:", en: "Ionizable lipid is central in LNPs because:"}
        choices:
          - {pt: "Neutro em pH fisiológico (segurança) e protonado em endossomo (eficiência)", en: "Neutral at physiological pH (safety) and protonated in endosome (efficiency)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Neutro em pH fisiológico (segurança) e protonado em endossomo (eficiência)", en: "Neutral at physiological pH (safety) and protonated in endosome (efficiency)"}
        rationale: {pt: "Quando dupla face funciona, então toxicidade cai e entrega aumenta simultaneamente.", en: "When dual face works, toxicity drops and delivery rises simultaneously."}
        objectives: [biology.drug_delivery]
        difficulty: 5
      - type: choice
        question: {pt: "PEGilação em nanomedicina serve para:", en: "PEGylation in nanomedicine serves to:"}
        choices:
          - {pt: "Aumentar meia-vida circulatória escapando de captação por macrófagos", en: "Increase circulatory half-life escaping macrophage uptake"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Aumentar meia-vida circulatória escapando de captação por macrófagos", en: "Increase circulatory half-life escaping macrophage uptake"}
        rationale: {pt: "Quando superfície é hidratada, então sistema reticuloendotelial detecta menos a partícula.", en: "When surface is hydrated, reticuloendothelial system detects the particle less."}
        objectives: [biology.drug_delivery]
        difficulty: 5
      - type: choice
        question: {pt: "AAV (adeno-associated virus) entrega:", en: "AAV (adeno-associated virus) delivers:"}
        choices:
          - {pt: "DNA terapêutico com tropismo tecidual e expressão duradoura", en: "Therapeutic DNA with tissue tropism and lasting expression"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "DNA terapêutico com tropismo tecidual e expressão duradoura", en: "Therapeutic DNA with tissue tropism and lasting expression"}
        rationale: {pt: "Quando capsídeo seleciona órgão, então AAV9 atravessa BHE e entrega a SNC.", en: "When capsid selects organ, AAV9 crosses BBB and delivers to CNS."}
        objectives: [biology.drug_delivery]
        difficulty: 5
      - type: choice
        question: {pt: "Lentivírus em terapia gênica:", en: "Lentivirus in gene therapy:"}
        choices:
          - {pt: "Integra DNA no genoma (incluindo células em repouso) — útil em terapia ex vivo", en: "Integrates DNA into genome (including resting cells) — useful in ex vivo therapy"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Integra DNA no genoma (incluindo células em repouso) — útil em terapia ex vivo", en: "Integrates DNA into genome (including resting cells) — useful in ex vivo therapy"}
        rationale: {pt: "Quando integração é estável, então CAR-T e células-tronco modificadas mantêm transgene.", en: "When integration is stable, CAR-T and modified stem cells retain transgene."}
        objectives: [biology.drug_delivery]
        difficulty: 5
      - type: choice
        question: {pt: "Conjugados anticorpo-fármaco (ADCs):", en: "Antibody-drug conjugates (ADCs):"}
        choices:
          - {pt: "Anticorpo direciona quimioterápico potente ao tumor via linker controlado", en: "Antibody directs potent chemotherapy to tumor via controlled linker"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Anticorpo direciona quimioterápico potente ao tumor via linker controlado", en: "Antibody directs potent chemotherapy to tumor via controlled linker"}
        rationale: {pt: "Quando carga libera no alvo, então tecido sadio é poupado por especificidade.", en: "When payload releases at target, healthy tissue is spared via specificity."}
        objectives: [biology.drug_delivery]
        difficulty: 5
      - type: choice
        question: {pt: "Nanopartículas poliméricas (PLGA) oferecem:", en: "Polymeric nanoparticles (PLGA) offer:"}
        choices:
          - {pt: "Liberação sustentada e biodegradação controlada de fármacos hidrofóbicos", en: "Sustained release and controlled biodegradation of hydrophobic drugs"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Liberação sustentada e biodegradação controlada de fármacos hidrofóbicos", en: "Sustained release and controlled biodegradation of hydrophobic drugs"}
        rationale: {pt: "Quando matriz hidrolisa lentamente, então dose única dura semanas a meses.", en: "When matrix slowly hydrolyzes, single dose lasts weeks to months."}
        objectives: [biology.drug_delivery]
        difficulty: 5
      - type: choice
        question: {pt: "Lipossomas clássicos (Doxil) servem para:", en: "Classic liposomes (Doxil) serve for:"}
        choices:
          - {pt: "Encapsular doxorrubicina, reduzindo cardiotoxicidade e aumentando acúmulo tumoral via EPR", en: "Encapsulate doxorubicin, reducing cardiotoxicity and increasing tumor accumulation via EPR"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Encapsular doxorrubicina, reduzindo cardiotoxicidade e aumentando acúmulo tumoral via EPR", en: "Encapsulate doxorubicin, reducing cardiotoxicity and increasing tumor accumulation via EPR"}
        rationale: {pt: "Quando endotélio tumoral é fenestrado, então EPR favorece nanopartículas concentradas.", en: "When tumor endothelium is leaky, EPR favors concentrated nanoparticles."}
        objectives: [biology.drug_delivery]
        difficulty: 5
      - type: choice
        question: {pt: "Direcionamento ativo de nanopartículas:", en: "Active nanoparticle targeting:"}
        choices:
          - {pt: "Liga peptídeos, anticorpos ou aptâmeros ao receptor-alvo do tecido específico", en: "Conjugates peptides, antibodies or aptamers to specific tissue target receptor"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Liga peptídeos, anticorpos ou aptâmeros ao receptor-alvo do tecido específico", en: "Conjugates peptides, antibodies or aptamers to specific tissue target receptor"}
        rationale: {pt: "Quando ligante específico é exposto, então captação seletiva eleva razão alvo/saudável.", en: "When specific ligand is exposed, selective uptake raises target/healthy ratio."}
        objectives: [biology.drug_delivery]
        difficulty: 5
      - type: choice
        question: {pt: "Hidrogéis injetáveis para depósito local:", en: "Injectable hydrogels for local depot:"}
        choices:
          - {pt: "Forma gel in situ liberando fármaco lentamente em sítio cirúrgico ou tumor", en: "Forms gel in situ slowly releasing drug at surgical site or tumor"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Forma gel in situ liberando fármaco lentamente em sítio cirúrgico ou tumor", en: "Forms gel in situ slowly releasing drug at surgical site or tumor"}
        rationale: {pt: "Quando depósito é local, então toxicidade sistêmica cai sem perder eficácia regional.", en: "When depot is local, systemic toxicity drops without losing regional efficacy."}
        objectives: [biology.drug_delivery]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Barreiras e fronteiras", en: "Barriers and frontiers"}
    description: {pt: "Atravessando obstáculos biológicos.", en: "Crossing biological obstacles."}
    exercises:
      - type: choice
        question: {pt: "Atravessar a BHE em nanomedicina:", en: "Crossing BBB in nanomedicine:"}
        choices:
          - {pt: "Estratégias incluem ligantes a transferrina, IGF, ultrassom focado e ônibus AAV", en: "Strategies include transferrin/IGF ligands, focused ultrasound and AAV vectors"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Estratégias incluem ligantes a transferrina, IGF, ultrassom focado e ônibus AAV", en: "Strategies include transferrin/IGF ligands, focused ultrasound and AAV vectors"}
        rationale: {pt: "Quando entrega ao SNC é dirigida, então neurodegeneração e tumores cerebrais ganham terapias.", en: "When CNS delivery is targeted, neurodegeneration and brain tumors gain therapies."}
        objectives: [biology.drug_delivery]
        difficulty: 5
      - type: choice
        question: {pt: "Ultrassom focado com microbolhas:", en: "Focused ultrasound with microbubbles:"}
        choices:
          - {pt: "Abre BHE temporariamente em região-alvo permitindo entrega aumentada de fármacos", en: "Temporarily opens BBB at target region allowing enhanced drug delivery"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Abre BHE temporariamente em região-alvo permitindo entrega aumentada de fármacos", en: "Temporarily opens BBB at target region allowing enhanced drug delivery"}
        rationale: {pt: "Quando bolhas oscilam, então tight junctions afrouxam por minutos a horas com segurança.", en: "When bubbles oscillate, tight junctions loosen for minutes to hours safely."}
        objectives: [biology.drug_delivery]
        difficulty: 5
      - type: choice
        question: {pt: "Inalação para entrega pulmonar:", en: "Inhalation for pulmonary delivery:"}
        choices:
          - {pt: "Aerossóis ou pó seco atingem alvéolos com diâmetro aerodinâmico de ~1-5 μm", en: "Aerosols or dry powder reach alveoli with aerodynamic diameter ~1-5 μm"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Aerossóis ou pó seco atingem alvéolos com diâmetro aerodinâmico de ~1-5 μm", en: "Aerosols or dry powder reach alveoli with aerodynamic diameter ~1-5 μm"}
        rationale: {pt: "Quando partícula tem tamanho certo, então deposição pulmonar profunda é maximizada.", en: "When particle has correct size, deep lung deposition is maximized."}
        objectives: [biology.drug_delivery]
        difficulty: 5
      - type: choice
        question: {pt: "Microagulhas (microneedle patches) entregam:", en: "Microneedle patches deliver:"}
        choices:
          - {pt: "Vacinas e fármacos pela pele sem dor, com termoestabilidade e auto-aplicação", en: "Vaccines and drugs through skin painlessly, with thermostability and self-administration"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Vacinas e fármacos pela pele sem dor, com termoestabilidade e auto-aplicação", en: "Vaccines and drugs through skin painlessly, with thermostability and self-administration"}
        rationale: {pt: "Quando agulha é micro, então auto-aplicação massiva fica viável globalmente.", en: "When needle is micro, mass self-administration becomes globally feasible."}
        objectives: [biology.drug_delivery]
        difficulty: 5
      - type: choice
        question: {pt: "Stimuli-responsive drug release:", en: "Stimuli-responsive drug release:"}
        choices:
          - {pt: "Carrier libera carga em resposta a pH, temperatura, luz ou enzima específica", en: "Carrier releases cargo in response to pH, temperature, light or specific enzyme"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Carrier libera carga em resposta a pH, temperatura, luz ou enzima específica", en: "Carrier releases cargo in response to pH, temperature, light or specific enzyme"}
        rationale: {pt: "Quando ambiente sinaliza, então dose certa é liberada no momento certo no local certo.", en: "When environment signals, right dose releases at right time and place."}
        objectives: [biology.drug_delivery]
        difficulty: 5
      - type: choice
        question: {pt: "Targeting de fígado em terapias com siRNA:", en: "Liver targeting in siRNA therapies:"}
        choices:
          - {pt: "GalNAc conjugado dirige a hepatócitos via receptor ASGPR — patisiran/inclisirana", en: "GalNAc conjugate directs to hepatocytes via ASGPR receptor — patisiran/inclisiran"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "GalNAc conjugado dirige a hepatócitos via receptor ASGPR — patisiran/inclisirana", en: "GalNAc conjugate directs to hepatocytes via ASGPR receptor — patisiran/inclisiran"}
        rationale: {pt: "Quando ligante explora ASGPR, então siRNA atinge fígado com poucos efeitos sistêmicos.", en: "When ligand exploits ASGPR, siRNA hits liver with few systemic effects."}
        objectives: [biology.drug_delivery]
        difficulty: 5
      - type: choice
        question: {pt: "Vesículas extracelulares (exossomos) como entrega:", en: "Extracellular vesicles (exosomes) as delivery:"}
        choices:
          - {pt: "Carregam RNA/proteína entre células e podem ser engenheiradas como veículos terapêuticos", en: "Carry RNA/protein between cells and can be engineered as therapeutic vehicles"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Carregam RNA/proteína entre células e podem ser engenheiradas como veículos terapêuticos", en: "Carry RNA/protein between cells and can be engineered as therapeutic vehicles"}
        rationale: {pt: "Quando origem é endógena, então imunogenicidade é menor que com lipossomas sintéticos.", en: "When origin is endogenous, immunogenicity is lower than with synthetic liposomes."}
        objectives: [biology.drug_delivery]
        difficulty: 5
      - type: choice
        question: {pt: "PROTACs degradam alvo via:", en: "PROTACs degrade target via:"}
        choices:
          - {pt: "Recrutamento de E3 ligase para ubiquitinar e degradar proteína específica no proteassoma", en: "Recruiting E3 ligase to ubiquitinate and degrade specific protein at the proteasome"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas inibição reversível", en: "Just reversible inhibition"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Recrutamento de E3 ligase para ubiquitinar e degradar proteína específica no proteassoma", en: "Recruiting E3 ligase to ubiquitinate and degrade specific protein at the proteasome"}
        rationale: {pt: "Quando alvo é destruído, então mesmo proteínas 'undruggable' viram tratáveis.", en: "When target is destroyed, even 'undruggable' proteins become treatable."}
        objectives: [biology.drug_delivery]
        difficulty: 5
      - type: choice
        question: {pt: "Bispecíficos engajadores de células T (BiTEs):", en: "T-cell engaging bispecifics (BiTEs):"}
        choices:
          - {pt: "Aproximam linfócito T (CD3) de antígeno tumoral, ativando lise dirigida", en: "Bring T cell (CD3) close to tumor antigen, activating targeted lysis"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Aproximam linfócito T (CD3) de antígeno tumoral, ativando lise dirigida", en: "Bring T cell (CD3) close to tumor antigen, activating targeted lysis"}
        rationale: {pt: "Quando sinapse imunológica é forçada, então tumores são eliminados mesmo sem TCR específico.", en: "When immunological synapse is forced, tumors are eliminated even without specific TCR."}
        objectives: [biology.drug_delivery]
        difficulty: 5
      - type: choice
        question: {pt: "Próximas fronteiras em entrega:", en: "Next frontiers in delivery:"}
        choices:
          - {pt: "LNPs além do fígado, edição genômica in vivo direcionada e nanorrobôs programáveis", en: "Beyond-liver LNPs, targeted in vivo gene editing and programmable nanorobots"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "LNPs além do fígado, edição genômica in vivo direcionada e nanorrobôs programáveis", en: "Beyond-liver LNPs, targeted in vivo gene editing and programmable nanorobots"}
        rationale: {pt: "Quando direcionamento é refinado, então qualquer tecido vira alvo terapêutico molecular.", en: "When targeting is refined, any tissue becomes a molecular therapeutic target."}
        objectives: [biology.drug_delivery]
        difficulty: 5
target: 20
