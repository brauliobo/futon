title:
  pt: "🧴 Lipidômica"
  en: "🧴 Lipidomics"
level: 'A'
subject: biology
objectives: [biology.lipidomics]
difficulty: 5
authorNotes: "Classes lipídicas, vias de síntese, sinalização lipídica, lipidômica em larga escala, doenças metabólicas."
example:
  pt: "Ex.: tecido → extração de lipídios → LC-MS → identificação por massa exata → perfil lipídico → biomarcadores."
  en: "Ex.: tissue → lipid extraction → LC-MS → mass-accurate ID → lipid profile → biomarkers."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
