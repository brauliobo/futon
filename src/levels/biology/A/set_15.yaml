          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Diagnósticos rápidos no local sem laboratório central — cassetes descartáveis", en: "Fast on-site diagnostics without central lab — disposable cassettes"}
        rationale: {pt: "Quando ensaio cabe em chip, então POC democratiza diagnóstico em regiões remotas.", en: "When assay fits on chip, POC democratizes diagnostics in remote regions."}
