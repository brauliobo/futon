        difficulty: 5
      - type: choice
        question: {pt: "Lateral flow vs microfluídica ativa:", en: "Lateral flow vs active microfluidics:"}
        choices:
          - {pt: "Lateral flow é passiva e barata; ativa permite mais controle e quantificação precisa", en: "Lateral flow is passive and cheap; active allows more control and precise quantification"}
