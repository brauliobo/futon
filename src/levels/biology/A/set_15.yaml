title:
  pt: "💧 Microfluídica e laboratório-em-chip"
  en: "💧 Microfluidics and lab-on-chip"
level: 'A'
subject: biology
objectives: [biology.microfluidics]
difficulty: 5
authorNotes: "Manipulação de volumes pequenos, droplets, organ-on-chip, single-cell, point-of-care."
example:
  pt: "Ex.: amostra → chip microfluídico → droplets → encapsulamento de células → leitura paralela → milhares de células analisadas."
  en: "Ex.: sample → microfluidic chip → droplets → cell encapsulation → parallel readout → thousands of cells analyzed."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Princípios microfluídicos", en: "Microfluidic principles"}
    description: {pt: "Como controlamos líquidos em escala micro.", en: "How we control liquids at microscale."}
    exercises:
      - type: choice
        question: {pt: "Microfluídica manipula:", en: "Microfluidics manipulates:"}
        choices:
          - {pt: "Volumes pico- a microlitro em canais com dimensões micrométricas", en: "Pico- to microliter volumes in micrometer-sized channels"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas litros enormes", en: "Just huge liters"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Volumes pico- a microlitro em canais com dimensões micrométricas", en: "Pico- to microliter volumes in micrometer-sized channels"}
        rationale: {pt: "Quando escala diminui, então difusão domina e reagentes economizam-se em massa.", en: "When scale shrinks, diffusion dominates and reagents save en masse."}
        objectives: [biology.microfluidics]
        difficulty: 5
      - type: choice
        question: {pt: "Número de Reynolds em microfluídica é:", en: "Reynolds number in microfluidics is:"}
        choices:
          - {pt: "Muito baixo — fluxo laminar domina sobre turbulência", en: "Very low — laminar flow dominates over turbulence"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas alto", en: "Just high"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Muito baixo — fluxo laminar domina sobre turbulência", en: "Very low — laminar flow dominates over turbulence"}
        rationale: {pt: "Quando viscosidade domina inércia, então mistura é controlada e reações ficam previsíveis.", en: "When viscosity dominates inertia, mixing is controlled and reactions become predictable."}
        objectives: [biology.microfluidics]
        difficulty: 5
      - type: choice
        question: {pt: "PDMS é material popular em microfluídica porque:", en: "PDMS is popular microfluidics material because:"}
        choices:
          - {pt: "Transparente, biocompatível, fácil de moldar e permeável a gases", en: "Transparent, biocompatible, easy to mold and gas-permeable"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas metal", en: "Just metal"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Transparente, biocompatível, fácil de moldar e permeável a gases", en: "Transparent, biocompatible, easy to mold and gas-permeable"}
        rationale: {pt: "Quando propriedades convergem, então prototipagem rápida e cultivo celular são possíveis no mesmo dispositivo.", en: "When properties converge, rapid prototyping and cell culture are possible in the same device."}
        objectives: [biology.microfluidics]
        difficulty: 5
      - type: choice
        question: {pt: "Soft lithography (Whitesides) permite:", en: "Soft lithography (Whitesides) enables:"}
        choices:
          - {pt: "Replicação de canais em PDMS a partir de molde mestre fotolitografado", en: "Replication of channels in PDMS from photolithographed master mold"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Replicação de canais em PDMS a partir de molde mestre fotolitografado", en: "Replication of channels in PDMS from photolithographed master mold"}
        rationale: {pt: "Quando mestre é fabricado uma vez, então cópias baratas escalam a fabricação.", en: "When master is fabricated once, cheap copies scale fabrication."}
        objectives: [biology.microfluidics]
        difficulty: 5
      - type: choice
        question: {pt: "Microfluídica de droplets gera:", en: "Droplet microfluidics generates:"}
        choices:
          - {pt: "Gotículas monodispersas em óleo, cada uma como microreator independente", en: "Monodisperse droplets in oil, each as an independent microreactor"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas grandes volumes", en: "Just large volumes"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Gotículas monodispersas em óleo, cada uma como microreator independente", en: "Monodisperse droplets in oil, each as an independent microreactor"}
        rationale: {pt: "Quando milhões de gotas são geradas, então ensaios paralelos massivos viram realidade.", en: "When millions of droplets are generated, massive parallel assays become reality."}
        objectives: [biology.microfluidics]
        difficulty: 5
      - type: choice
        question: {pt: "Single-cell genômica via droplets (10x):", en: "Droplet-based single-cell genomics (10x):"}
        choices:
          - {pt: "Encapsula uma célula + um bead com barcodes em cada gota — milhares de células por experimento", en: "Encapsulates one cell + one barcoded bead per droplet — thousands of cells per run"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas média populacional", en: "Just population average"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Encapsula uma célula + um bead com barcodes em cada gota — milhares de células por experimento", en: "Encapsulates one cell + one barcoded bead per droplet — thousands of cells per run"}
        rationale: {pt: "Quando barcode é único por bead, então transcriptoma de cada célula fica rastreável.", en: "When barcode is unique per bead, each cell transcriptome stays traceable."}
        objectives: [biology.microfluidics]
        difficulty: 5
      - type: choice
        question: {pt: "Digital PCR usa microfluídica para:", en: "Digital PCR uses microfluidics to:"}
        choices:
          - {pt: "Particionar amostra em milhares de reações para quantificação absoluta sensível", en: "Partition sample into thousands of reactions for sensitive absolute quantification"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Particionar amostra em milhares de reações para quantificação absoluta sensível", en: "Partition sample into thousands of reactions for sensitive absolute quantification"}
        rationale: {pt: "Quando reações isoladas são contadas, então cópias raras são detectadas precisamente.", en: "When isolated reactions are counted, rare copies are precisely detected."}
        objectives: [biology.microfluidics]
        difficulty: 5
      - type: choice
        question: {pt: "Citometria por imageamento microfluídico:", en: "Microfluidic imaging cytometry:"}
        choices:
          - {pt: "Combina fluxo controlado e imagens de alta resolução para classificar células rapidamente", en: "Combines controlled flow and high-resolution imaging to classify cells rapidly"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Combina fluxo controlado e imagens de alta resolução para classificar células rapidamente", en: "Combines controlled flow and high-resolution imaging to classify cells rapidly"}
        rationale: {pt: "Quando IA classifica imagens, então populações raras são separadas em tempo real.", en: "When AI classifies images, rare populations are separated in real time."}
        objectives: [biology.microfluidics]
        difficulty: 5
      - type: choice
        question: {pt: "Captura de células tumorais circulantes (CTCs):", en: "Circulating tumor cell (CTC) capture:"}
        choices:
          - {pt: "Microfluídica com afinidade ou tamanho enriquece CTCs raras do sangue", en: "Affinity or size microfluidics enriches rare CTCs from blood"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Microfluídica com afinidade ou tamanho enriquece CTCs raras do sangue", en: "Affinity or size microfluidics enriches rare CTCs from blood"}
        rationale: {pt: "Quando 1 CTC em 10⁹ é isolada, então biópsia líquida ganha resolução celular.", en: "When 1 CTC in 10⁹ is isolated, liquid biopsy gains cellular resolution."}
        objectives: [biology.microfluidics]
        difficulty: 5
      - type: choice
        question: {pt: "Eletroporação em chip:", en: "On-chip electroporation:"}
        choices:
          - {pt: "Aplica campo elétrico para entrega de DNA/RNA em células com alto rendimento", en: "Applies electric field to deliver DNA/RNA into cells with high throughput"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Aplica campo elétrico para entrega de DNA/RNA em células com alto rendimento", en: "Applies electric field to deliver DNA/RNA into cells with high throughput"}
        rationale: {pt: "Quando poros transitórios abrem, então cargas grandes entram sem vetor viral.", en: "When transient pores open, large cargo enters without viral vector."}
        objectives: [biology.microfluidics]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Organ-on-chip e POC", en: "Organ-on-chip and POC"}
    description: {pt: "Mini-órgãos e diagnósticos no campo.", en: "Mini-organs and field diagnostics."}
    exercises:
      - type: choice
        question: {pt: "Organ-on-chip combina:", en: "Organ-on-chip combines:"}
        choices:
          - {pt: "Microfluídica + cultura celular para emular fisiologia (fluxo, mecânica, multitecidos)", en: "Microfluidics + cell culture to emulate physiology (flow, mechanics, multi-tissue)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Microfluídica + cultura celular para emular fisiologia (fluxo, mecânica, multitecidos)", en: "Microfluidics + cell culture to emulate physiology (flow, mechanics, multi-tissue)"}
        rationale: {pt: "Quando forças mecânicas são aplicadas, então pulmão respira e intestino peristáltica em chip.", en: "When mechanical forces are applied, lung breathes and gut peristalts on chip."}
        objectives: [biology.microfluidics]
        difficulty: 5
      - type: choice
        question: {pt: "Lung-on-chip simula:", en: "Lung-on-chip simulates:"}
        choices:
          - {pt: "Interface alvéolo-capilar com membrana flexível e respiração mecânica controlada", en: "Alveolar-capillary interface with flexible membrane and controlled mechanical breathing"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Interface alvéolo-capilar com membrana flexível e respiração mecânica controlada", en: "Alveolar-capillary interface with flexible membrane and controlled mechanical breathing"}
        rationale: {pt: "Quando respiração é simulada, então testes de toxicidade pulmonar tornam-se preditivos.", en: "When breathing is simulated, pulmonary toxicity tests become predictive."}
        objectives: [biology.microfluidics]
        difficulty: 5
      - type: choice
        question: {pt: "Multi-organ-on-chip ('body-on-chip'):", en: "Multi-organ-on-chip ('body-on-chip'):"}
        choices:
          - {pt: "Conecta vários tecidos por canais para estudar interações sistêmicas e farmacologia", en: "Connects multiple tissues via channels to study systemic interactions and pharmacology"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Conecta vários tecidos por canais para estudar interações sistêmicas e farmacologia", en: "Connects multiple tissues via channels to study systemic interactions and pharmacology"}
        rationale: {pt: "Quando órgãos conversam in vitro, então ADME e toxicidade ficam mais realistas.", en: "When organs talk in vitro, ADME and toxicity become more realistic."}
        objectives: [biology.microfluidics]
        difficulty: 5
      - type: choice
        question: {pt: "POC (point-of-care) microfluídico:", en: "Microfluidic POC (point-of-care):"}
        choices:
          - {pt: "Diagnósticos rápidos no local sem laboratório central — cassetes descartáveis", en: "Fast on-site diagnostics without central lab — disposable cassettes"}
