          - {pt: "Apenas reduz potência", en: "Just reduces potency"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Aumenta ADCC ao fortalecer ligação Fc-FcγRIIIa", en: "Boosts ADCC by strengthening Fc-FcγRIIIa binding"}
        rationale: {pt: "Quando fucose é removida, então NK mata tumor com mais eficiência.", en: "When fucose is removed, NK kills tumor more efficiently."}
        objectives: [biology.antibody_engineering]
        difficulty: 5
      - type: choice
        question: {pt: "Próximas fronteiras em mAbs incluem:", en: "Next frontiers in mAbs include:"}
        choices:
          - {pt: "Anticorpos pH-dependentes, multiespecíficos, conjugados de RNA e design generativo", en: "pH-dependent, multispecific antibodies, RNA-ADCs and generative design"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Anticorpos pH-dependentes, multiespecíficos, conjugados de RNA e design generativo", en: "pH-dependent, multispecific antibodies, RNA-ADCs and generative design"}
        rationale: {pt: "Quando inovações se acumulam, então classe segue como motor central da indústria farmacêutica.", en: "When innovations stack, the class remains a central engine of the pharmaceutical industry."}
        objectives: [biology.antibody_engineering]
        difficulty: 5
target: 20
