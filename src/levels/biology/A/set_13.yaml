title:
  pt: "🫀 Engenharia de órgãos e xenotransplante"
  en: "🫀 Organ engineering and xenotransplantation"
level: 'A'
subject: biology
objectives: [biology.organ_engineering]
difficulty: 5
authorNotes: "Bioimpressão, descelularização, xenotransplante GalSafe, organoides funcionais, perfusão ex vivo."
example:
  pt: "Ex.: porco editado (KO α-Gal) → órgão removido → perfusão → transplante em humano → função inicial."
  en: "Ex.: edited pig (α-Gal KO) → organ removed → perfusion → human transplant → initial function."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Construindo órgãos", en: "Building organs"}
    description: {pt: "Estratégias para criar órgãos transplantáveis.", en: "Strategies for transplantable organs."}
    exercises:
      - type: choice
        question: {pt: "Engenharia tecidual clássica combina:", en: "Classic tissue engineering combines:"}
        choices:
          - {pt: "Células + biomaterial-suporte + sinais bioquímicos para regenerar tecido", en: "Cells + scaffold + biochemical cues to regenerate tissue"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas células isoladas", en: "Just isolated cells"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Células + biomaterial-suporte + sinais bioquímicos para regenerar tecido", en: "Cells + scaffold + biochemical cues to regenerate tissue"}
        rationale: {pt: "Quando trio integra, então tecido reconstruído tem arquitetura e função aproximadas.", en: "When the trio integrates, reconstructed tissue has approximate architecture and function."}
        objectives: [biology.organ_engineering]
        difficulty: 5
      - type: choice
        question: {pt: "Bioimpressão 3D deposita:", en: "3D bioprinting deposits:"}
        choices:
          - {pt: "Células e hidrogéis camada a camada para construir geometria 3D específica", en: "Cells and hydrogels layer-by-layer to build specific 3D geometry"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas plástico inerte", en: "Just inert plastic"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Células e hidrogéis camada a camada para construir geometria 3D específica", en: "Cells and hydrogels layer-by-layer to build specific 3D geometry"}
        rationale: {pt: "Quando posição é controlada, então arquitetura tecidual complexa pode ser fabricada.", en: "When position is controlled, complex tissue architecture can be fabricated."}
        objectives: [biology.organ_engineering]
        difficulty: 5
      - type: choice
        question: {pt: "Descelularização produz:", en: "Decellularization produces:"}
        choices:
          - {pt: "Andaime de matriz extracelular sem células — pronto para recolonização autóloga", en: "Cell-free extracellular matrix scaffold — ready for autologous recolonization"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas plástico", en: "Just plastic"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Andaime de matriz extracelular sem células — pronto para recolonização autóloga", en: "Cell-free extracellular matrix scaffold — ready for autologous recolonization"}
        rationale: {pt: "Quando MEC mantém arquitetura, então células do paciente podem repopular sem rejeição.", en: "When ECM keeps architecture, patient cells can repopulate without rejection."}
        objectives: [biology.organ_engineering]
        difficulty: 5
      - type: choice
        question: {pt: "Limitação principal de organoides para transplante:", en: "Main organoid limitation for transplant:"}
        choices:
          - {pt: "Falta de vascularização funcional limitando tamanho e maturação", en: "Lack of functional vascularization limiting size and maturation"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Falta de vascularização funcional limitando tamanho e maturação", en: "Lack of functional vascularization limiting size and maturation"}
        rationale: {pt: "Quando capilares não chegam ao centro, então hipóxia mata núcleo do organoide.", en: "When capillaries don't reach the core, hypoxia kills organoid center."}
        objectives: [biology.organ_engineering]
        difficulty: 5
      - type: choice
        question: {pt: "Pré-vascularização engenheirada usa:", en: "Engineered pre-vascularization uses:"}
        choices:
          - {pt: "Canais sacrificiais e células endoteliais para criar rede vascular pré-formada", en: "Sacrificial channels and endothelial cells to create pre-formed vascular network"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Canais sacrificiais e células endoteliais para criar rede vascular pré-formada", en: "Sacrificial channels and endothelial cells to create pre-formed vascular network"}
        rationale: {pt: "Quando rede é projetada, então difusão e perfusão sustentam tecido espesso.", en: "When the network is designed, diffusion and perfusion sustain thick tissue."}
        objectives: [biology.organ_engineering]
        difficulty: 5
      - type: choice
        question: {pt: "Pele bioengenheirada (Apligraf, Integra):", en: "Bioengineered skin (Apligraf, Integra):"}
        choices:
          - {pt: "Substitui pele em queimaduras e úlceras crônicas com tecido vivo cultivado", en: "Replaces skin in burns and chronic ulcers with cultivated living tissue"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Substitui pele em queimaduras e úlceras crônicas com tecido vivo cultivado", en: "Replaces skin in burns and chronic ulcers with cultivated living tissue"}
        rationale: {pt: "Quando enxerto é vivo, então integra com leito do paciente acelerando cicatrização.", en: "When graft is alive, it integrates with patient bed accelerating healing."}
        objectives: [biology.organ_engineering]
        difficulty: 5
      - type: choice
        question: {pt: "Cartilagem engenheirada usa:", en: "Engineered cartilage uses:"}
        choices:
          - {pt: "Condrócitos do paciente em scaffold para reparar lesões articulares", en: "Patient chondrocytes on scaffold to repair joint defects"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Condrócitos do paciente em scaffold para reparar lesões articulares", en: "Patient chondrocytes on scaffold to repair joint defects"}
        rationale: {pt: "Quando matriz é correta, então condrócitos depositam matriz nativa funcional.", en: "When matrix is correct, chondrocytes deposit functional native matrix."}
        objectives: [biology.organ_engineering]
        difficulty: 5
      - type: choice
        question: {pt: "Coração descelularizado + recelularização:", en: "Decellularized heart + recellularization:"}
        choices:
          - {pt: "Estratégia experimental para criar enxerto cardíaco compatível com paciente", en: "Experimental strategy to create patient-compatible cardiac graft"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
          - {pt: "Apenas turismo", en: "Just tourism"}
        correctAnswer: {pt: "Estratégia experimental para criar enxerto cardíaco compatível com paciente", en: "Experimental strategy to create patient-compatible cardiac graft"}
        rationale: {pt: "Quando matriz porcina é repopulada, então coração quase humano emerge in vitro.", en: "When porcine matrix is repopulated, near-human heart emerges in vitro."}
        objectives: [biology.organ_engineering]
        difficulty: 5
      - type: choice
        question: {pt: "Bioreatores em engenharia de tecidos:", en: "Bioreactors in tissue engineering:"}
        choices:
          - {pt: "Aplicam estímulos mecânicos, perfusão e oxigenação para maturar tecido", en: "Apply mechanical stimuli, perfusion and oxygenation to mature tissue"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Aplicam estímulos mecânicos, perfusão e oxigenação para maturar tecido", en: "Apply mechanical stimuli, perfusion and oxygenation to mature tissue"}
        rationale: {pt: "Quando ambiente fisiológico é simulado, então tecido amadurece para função real.", en: "When physiological environment is simulated, tissue matures for real function."}
        objectives: [biology.organ_engineering]
        difficulty: 5
      - type: choice
        question: {pt: "Perfusão ex vivo de órgãos doados:", en: "Ex vivo perfusion of donor organs:"}
        choices:
          - {pt: "Mantém órgãos viáveis fora do corpo, permitindo avaliação e reabilitação antes do transplante", en: "Keeps organs viable outside body, allowing pre-transplant assessment and reconditioning"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Mantém órgãos viáveis fora do corpo, permitindo avaliação e reabilitação antes do transplante", en: "Keeps organs viable outside body, allowing pre-transplant assessment and reconditioning"}
        rationale: {pt: "Quando órgão é perfundido morno/normotermicamente, então qualidade pré-implante é otimizada.", en: "When organ is warm/normothermic perfused, pre-implant quality is optimized."}
        objectives: [biology.organ_engineering]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Xenotransplante", en: "Xenotransplantation"}
    description: {pt: "Órgãos animais para humanos.", en: "Animal organs for humans."}
    exercises:
      - type: choice
        question: {pt: "Xenotransplante porco→humano enfrenta:", en: "Pig→human xenotransplant faces:"}
        choices:
          - {pt: "Rejeição hiperaguda, retrovírus endógenos suínos (PERV) e incompatibilidades fisiológicas", en: "Hyperacute rejection, porcine endogenous retroviruses (PERV) and physiological incompatibilities"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Rejeição hiperaguda, retrovírus endógenos suínos (PERV) e incompatibilidades fisiológicas", en: "Hyperacute rejection, porcine endogenous retroviruses (PERV) and physiological incompatibilities"}
        rationale: {pt: "Quando barreiras imunes e infecciosas são endereçadas, então xenotransplante torna-se factível.", en: "When immune and infectious barriers are addressed, xenotransplant becomes feasible."}
        objectives: [biology.organ_engineering]
        difficulty: 5
      - type: choice
        question: {pt: "Antígeno α-Gal causa:", en: "α-Gal antigen causes:"}
        choices:
          - {pt: "Rejeição hiperaguda por anticorpos pré-formados em humanos", en: "Hyperacute rejection by pre-formed human antibodies"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Rejeição hiperaguda por anticorpos pré-formados em humanos", en: "Hyperacute rejection by pre-formed human antibodies"}
        rationale: {pt: "Quando GalSafe (KO α-Gal) é gerado, então primeira barreira é eliminada.", en: "When GalSafe (α-Gal KO) is generated, the first barrier is eliminated."}
        objectives: [biology.organ_engineering]
        difficulty: 5
      - type: choice
        question: {pt: "Porcos editados para xenotransplante carregam:", en: "Pigs edited for xenotransplant carry:"}
        choices:
          - {pt: "Múltiplos KOs (α-Gal, β4GalNT2, CMAH) e KIs humanos (CD46, CD55, trombomodulina)", en: "Multiple KOs (α-Gal, β4GalNT2, CMAH) and human KIs (CD46, CD55, thrombomodulin)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Múltiplos KOs (α-Gal, β4GalNT2, CMAH) e KIs humanos (CD46, CD55, trombomodulina)", en: "Multiple KOs (α-Gal, β4GalNT2, CMAH) and human KIs (CD46, CD55, thrombomodulin)"}
        rationale: {pt: "Quando engenharia genômica é extensiva, então rejeição e coagulopatia são mitigadas.", en: "When genomic engineering is extensive, rejection and coagulopathy are mitigated."}
        objectives: [biology.organ_engineering]
        difficulty: 5
      - type: choice
        question: {pt: "Inativação de PERVs por CRISPR:", en: "PERV inactivation by CRISPR:"}
        choices:
          - {pt: "Reduz risco de transmissão viral via xenotransplante a humanos", en: "Reduces risk of viral transmission via xenotransplant to humans"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Reduz risco de transmissão viral via xenotransplante a humanos", en: "Reduces risk of viral transmission via xenotransplant to humans"}
        rationale: {pt: "Quando retrovírus endógenos são deletados, então segurança epidemiológica aumenta substancialmente.", en: "When endogenous retroviruses are deleted, epidemiological safety substantially rises."}
        objectives: [biology.organ_engineering]
        difficulty: 5
      - type: choice
        question: {pt: "Casos clínicos pioneiros incluem:", en: "Pioneer clinical cases include:"}
        choices:
          - {pt: "Coração e rim de porco editado em humanos com sobrevida limitada inicial", en: "Edited pig heart and kidney in humans with limited initial survival"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Coração e rim de porco editado em humanos com sobrevida limitada inicial", en: "Edited pig heart and kidney in humans with limited initial survival"}
        rationale: {pt: "Quando primeiros pacientes recebem órgãos suínos, então cada caso refina protocolos seguintes.", en: "When first patients receive porcine organs, each case refines subsequent protocols."}
        objectives: [biology.organ_engineering]
        difficulty: 5
      - type: choice
        question: {pt: "Imunossupressão em xenotransplante:", en: "Xenotransplant immunosuppression:"}
        choices:
          - {pt: "Combina anti-CD40, inhibidores de complemento e regimes mais intensos que alotransplante", en: "Combines anti-CD40, complement inhibitors and more intense regimens than allotransplant"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Combina anti-CD40, inhibidores de complemento e regimes mais intensos que alotransplante", en: "Combines anti-CD40, complement inhibitors and more intense regimens than allotransplant"}
        rationale: {pt: "Quando barreira interespécie é maior, então proteção imune deve ser proporcional.", en: "When interspecies barrier is greater, immune protection must be proportional."}
        objectives: [biology.organ_engineering]
        difficulty: 5
      - type: choice
        question: {pt: "Quimeras humano-animais (interespécies):", en: "Human-animal chimeras (interspecies):"}
        choices:
          - {pt: "Estratégia experimental para crescer órgãos humanos em animais via injeção em embriões", en: "Experimental strategy to grow human organs in animals via embryonic injection"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Estratégia experimental para crescer órgãos humanos em animais via injeção em embriões", en: "Experimental strategy to grow human organs in animals via embryonic injection"}
        rationale: {pt: "Quando 'nicho vazio' é criado em animal, então células humanas preenchem órgão completo.", en: "When 'empty niche' is created in animal, human cells fill complete organ."}
        objectives: [biology.organ_engineering]
        difficulty: 5
      - type: choice
        question: {pt: "Aspectos éticos centrais incluem:", en: "Central ethical aspects include:"}
        choices:
          - {pt: "Consentimento, equidade de acesso, bem-estar animal e governança transnacional", en: "Consent, access equity, animal welfare and transnational governance"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Consentimento, equidade de acesso, bem-estar animal e governança transnacional", en: "Consent, access equity, animal welfare and transnational governance"}
        rationale: {pt: "Quando tecnologia transforma transplante, então ética deve preceder e moldar implementação.", en: "When technology transforms transplant, ethics must precede and shape implementation."}
        objectives: [biology.organ_engineering]
        difficulty: 5
      - type: choice
        question: {pt: "Demanda global de transplante vs oferta:", en: "Global transplant demand vs supply:"}
        choices:
          - {pt: "Lista de espera supera disponibilidade — milhares morrem aguardando órgãos", en: "Waiting list exceeds availability — thousands die waiting for organs"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Lista de espera supera disponibilidade — milhares morrem aguardando órgãos", en: "Waiting list exceeds availability — thousands die waiting for organs"}
        rationale: {pt: "Quando demanda explode, então xenotransplante e bioengenharia surgem como soluções complementares.", en: "When demand explodes, xenotransplant and bioengineering emerge as complementary solutions."}
        objectives: [biology.organ_engineering]
        difficulty: 5
      - type: choice
        question: {pt: "Próximas fronteiras em órgãos artificiais:", en: "Next frontiers in artificial organs:"}
        choices:
          - {pt: "Órgãos bioimpressos vascularizados, xenotransplante de longo prazo e quimeras humanas", en: "Vascularized bioprinted organs, long-term xenotransplant and human chimeras"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Órgãos bioimpressos vascularizados, xenotransplante de longo prazo e quimeras humanas", en: "Vascularized bioprinted organs, long-term xenotransplant and human chimeras"}
        rationale: {pt: "Quando convergem técnicas, então fila de transplante pode encolher na próxima década.", en: "When techniques converge, transplant queue may shrink in the next decade."}
        objectives: [biology.organ_engineering]
        difficulty: 5
target: 20
