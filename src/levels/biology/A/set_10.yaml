title:
  pt: "🎯 Evolução clonal do câncer"
  en: "🎯 Cancer clonal evolution"
level: 'A'
subject: biology
objectives: [biology.cancer_evolution]
difficulty: 5
authorNotes: "Heterogeneidade tumoral, evolução clonal, resistência terapêutica, biópsia líquida, oncologia evolutiva."
example:
  pt: "Ex.: tumor inicial → mutações acumulam → subclones competem → terapia → clones resistentes dominam → recidiva."
  en: "Ex.: initial tumor → mutations accumulate → subclones compete → therapy → resistant clones dominate → relapse."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Heterogeneidade e evolução tumoral", en: "Tumor heterogeneity and evolution"}
    description: {pt: "Câncer como sistema evolutivo.", en: "Cancer as evolutionary system."}
    exercises:
      - type: choice
        question: {pt: "Heterogeneidade intratumoral significa:", en: "Intratumor heterogeneity means:"}
        choices:
          - {pt: "Subclones com perfis genéticos distintos coexistem em um mesmo tumor", en: "Subclones with distinct genetic profiles coexist in a single tumor"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas um clone idêntico", en: "Just one identical clone"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Subclones com perfis genéticos distintos coexistem em um mesmo tumor", en: "Subclones with distinct genetic profiles coexist in a single tumor"}
        rationale: {pt: "Quando biópsia única é colhida, então amostra captura só fração da diversidade real do tumor.", en: "When single biopsy is taken, sample captures only a fraction of true tumor diversity."}
        objectives: [biology.cancer_evolution]
        difficulty: 5
      - type: choice
        question: {pt: "Mutações 'driver' vs 'passenger':", en: "Driver vs passenger mutations:"}
        choices:
          - {pt: "Drivers conferem vantagem clonal; passengers acompanham sem efeito direto", en: "Drivers confer clonal advantage; passengers tag along with no direct effect"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "São idênticos", en: "Are identical"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Drivers conferem vantagem clonal; passengers acompanham sem efeito direto", en: "Drivers confer clonal advantage; passengers tag along with no direct effect"}
        rationale: {pt: "Quando driver é alvo terapêutico, então passengers servem para reconstruir filogenia tumoral.", en: "When driver is a therapeutic target, passengers help reconstruct tumor phylogeny."}
        objectives: [biology.cancer_evolution]
        difficulty: 5
      - type: choice
        question: {pt: "Evolução tumoral pode ser:", en: "Tumor evolution can be:"}
        choices:
          - {pt: "Linear, ramificada, neutra ou pontuada conforme dinâmica de subclones", en: "Linear, branched, neutral or punctuated depending on subclone dynamics"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Linear, ramificada, neutra ou pontuada conforme dinâmica de subclones", en: "Linear, branched, neutral or punctuated depending on subclone dynamics"}
        rationale: {pt: "Quando padrão filogenético é reconstruído, então estratégia terapêutica é adaptada à arquitetura.", en: "When phylogenetic pattern is reconstructed, therapeutic strategy adapts to architecture."}
        objectives: [biology.cancer_evolution]
        difficulty: 5
      - type: choice
        question: {pt: "Eventos de catástrofe genômica em câncer:", en: "Genomic catastrophe events in cancer:"}
        choices:
          - {pt: "Cromotripsia e cromoplexia geram rearranjos massivos em uma única crise", en: "Chromothripsis and chromoplexy generate massive rearrangements in a single crisis"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Cromotripsia e cromoplexia geram rearranjos massivos em uma única crise", en: "Chromothripsis and chromoplexy generate massive rearrangements in a single crisis"}
        rationale: {pt: "Quando cromossomo se fragmenta e religa caoticamente, então oncogenes podem ser amplificados de uma vez.", en: "When chromosome fragments and rejoins chaotically, oncogenes may be amplified at once."}
        objectives: [biology.cancer_evolution]
        difficulty: 5
      - type: choice
        question: {pt: "Assinaturas mutacionais (Alexandrov):", en: "Mutational signatures (Alexandrov):"}
        choices:
          - {pt: "Padrões de mutação que apontam etiologia (UV, tabaco, APOBEC, falha de reparo)", en: "Mutation patterns indicating etiology (UV, tobacco, APOBEC, repair failure)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Padrões de mutação que apontam etiologia (UV, tabaco, APOBEC, falha de reparo)", en: "Mutation patterns indicating etiology (UV, tobacco, APOBEC, repair failure)"}
        rationale: {pt: "Quando assinatura é distinguida, então prevenção e terapia ganham contexto causal claro.", en: "When signature is distinguished, prevention and therapy gain clear causal context."}
        objectives: [biology.cancer_evolution]
        difficulty: 5
      - type: choice
        question: {pt: "Carga mutacional tumoral (TMB) alta:", en: "High tumor mutational burden (TMB):"}
        choices:
          - {pt: "Mais neoantígenos → maior chance de resposta a inibidores de checkpoint", en: "More neoantigens → higher chance of checkpoint inhibitor response"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas pior resposta", en: "Just worse response"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Mais neoantígenos → maior chance de resposta a inibidores de checkpoint", en: "More neoantigens → higher chance of checkpoint inhibitor response"}
        rationale: {pt: "Quando T encontra antígenos abundantes, então imunoterapia tem mais alvos e sucesso.", en: "When T finds abundant antigens, immunotherapy has more targets and success."}
        objectives: [biology.cancer_evolution]
        difficulty: 5
      - type: choice
        question: {pt: "Evolução parallela em metástases:", en: "Parallel evolution in metastases:"}
        choices:
          - {pt: "Múltiplos sítios podem evoluir alterações similares de forma independente", en: "Multiple sites may evolve similar alterations independently"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Múltiplos sítios podem evoluir alterações similares de forma independente", en: "Multiple sites may evolve similar alterations independently"}
        rationale: {pt: "Quando seleção converge, então mesmas vias são exploradas em diferentes lesões.", en: "When selection converges, the same pathways are exploited across lesions."}
        objectives: [biology.cancer_evolution]
        difficulty: 5
      - type: choice
        question: {pt: "Sequenciamento multi-região revela:", en: "Multi-region sequencing reveals:"}
        choices:
          - {pt: "Heterogeneidade espacial e ramificações filogenéticas no mesmo tumor", en: "Spatial heterogeneity and phylogenetic branching within the same tumor"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Heterogeneidade espacial e ramificações filogenéticas no mesmo tumor", en: "Spatial heterogeneity and phylogenetic branching within the same tumor"}
        rationale: {pt: "Quando várias amostras são lidas, então arquitetura clonal completa fica visível.", en: "When multiple samples are read, the full clonal architecture becomes visible."}
        objectives: [biology.cancer_evolution]
        difficulty: 5
      - type: choice
        question: {pt: "Single-cell sequencing em câncer:", en: "Single-cell sequencing in cancer:"}
        choices:
          - {pt: "Resolve subclones raros e estados transitórios não detectados em bulk", en: "Resolves rare subclones and transient states undetected in bulk"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Resolve subclones raros e estados transitórios não detectados em bulk", en: "Resolves rare subclones and transient states undetected in bulk"}
        rationale: {pt: "Quando célula a célula é lida, então iceberg clonal completo aparece.", en: "When cell-by-cell is read, the full clonal iceberg appears."}
        objectives: [biology.cancer_evolution]
        difficulty: 5
      - type: choice
        question: {pt: "Modelos de evolução neutra propõem:", en: "Neutral evolution models propose:"}
        choices:
          - {pt: "Mutações acumulam principalmente por deriva, não seleção positiva forte", en: "Mutations accumulate mainly via drift, not strong positive selection"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Mutações acumulam principalmente por deriva, não seleção positiva forte", en: "Mutations accumulate mainly via drift, not strong positive selection"}
        rationale: {pt: "Quando neutralidade prevalece, então previsões clínicas mudam — drivers viram raros.", en: "When neutrality prevails, clinical predictions shift — drivers become rare."}
        objectives: [biology.cancer_evolution]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Resistência e estratégia clínica", en: "Resistance and clinical strategy"}
    description: {pt: "Como tumores escapam e como contra-atacar.", en: "How tumors escape and how we counter."}
    exercises:
      - type: choice
        question: {pt: "Resistência terapêutica adquirida ocorre por:", en: "Acquired therapeutic resistance occurs via:"}
        choices:
          - {pt: "Mutações secundárias, ativação de vias paralelas e seleção de subclones pré-existentes", en: "Secondary mutations, parallel pathway activation and selection of pre-existing subclones"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Mutações secundárias, ativação de vias paralelas e seleção de subclones pré-existentes", en: "Secondary mutations, parallel pathway activation and selection of pre-existing subclones"}
        rationale: {pt: "Quando pressão é aplicada, então variantes resistentes preexistentes ou emergentes dominam.", en: "When pressure is applied, pre-existing or emerging resistant variants dominate."}
        objectives: [biology.cancer_evolution]
        difficulty: 5
      - type: choice
        question: {pt: "Mutações T790M em EGFR (NSCLC):", en: "EGFR T790M mutations (NSCLC):"}
        choices:
          - {pt: "Resistência a inibidores de primeira geração; superada por osimertinibe (3ª geração)", en: "Resistance to first-gen inhibitors; overcome by osimertinib (3rd gen)"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Resistência a inibidores de primeira geração; superada por osimertinibe (3ª geração)", en: "Resistance to first-gen inhibitors; overcome by osimertinib (3rd gen)"}
        rationale: {pt: "Quando segunda mutação é prevista, então fármaco subsequente é desenhado a tempo.", en: "When second mutation is anticipated, subsequent drug is designed in time."}
        objectives: [biology.cancer_evolution]
        difficulty: 5
      - type: choice
        question: {pt: "Biópsia líquida (ctDNA) monitora:", en: "Liquid biopsy (ctDNA) monitors:"}
        choices:
          - {pt: "Doença mínima residual e emergência de mutações de resistência em tempo real", en: "Minimal residual disease and emergence of resistance mutations in real time"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Doença mínima residual e emergência de mutações de resistência em tempo real", en: "Minimal residual disease and emergence of resistance mutations in real time"}
        rationale: {pt: "Quando ctDNA é seguido longitudinalmente, então decisões clínicas antecipam recidiva.", en: "When ctDNA is followed longitudinally, clinical decisions anticipate relapse."}
        objectives: [biology.cancer_evolution]
        difficulty: 5
      - type: choice
        question: {pt: "Terapia adaptativa (Gatenby) propõe:", en: "Adaptive therapy (Gatenby) proposes:"}
        choices:
          - {pt: "Doses ajustadas para manter clones sensíveis vivos e suprimir resistentes", en: "Adjusted doses to keep sensitive clones alive and suppress resistant ones"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Doses ajustadas para manter clones sensíveis vivos e suprimir resistentes", en: "Adjusted doses to keep sensitive clones alive and suppress resistant ones"}
        rationale: {pt: "Quando ecologia clonal é manejada, então remissões duráveis podem ser alongadas.", en: "When clonal ecology is managed, durable remissions can be extended."}
        objectives: [biology.cancer_evolution]
        difficulty: 5
      - type: choice
        question: {pt: "Letalidade sintética explora:", en: "Synthetic lethality exploits:"}
        choices:
          - {pt: "Combinações onde duas vias bloqueadas matam tumor mas poupam células sadias", en: "Combinations where two blocked pathways kill tumor but spare healthy cells"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Combinações onde duas vias bloqueadas matam tumor mas poupam células sadias", en: "Combinations where two blocked pathways kill tumor but spare healthy cells"}
        rationale: {pt: "Quando dependências tumorais são exploradas, então janela terapêutica fica ampla.", en: "When tumor dependencies are exploited, therapeutic window becomes wide."}
        objectives: [biology.cancer_evolution]
        difficulty: 5
      - type: choice
        question: {pt: "PARP-inibidores em tumores BRCA-mutados:", en: "PARP inhibitors in BRCA-mutated tumors:"}
        choices:
          - {pt: "Letalidade sintética: PARP + BRCA mutado → reparo de DNA falha cataclismicamente", en: "Synthetic lethality: PARP + BRCA mutated → DNA repair fails catastrophically"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Letalidade sintética: PARP + BRCA mutado → reparo de DNA falha cataclismicamente", en: "Synthetic lethality: PARP + BRCA mutated → DNA repair fails catastrophically"}
        rationale: {pt: "Quando duas vias de reparo são bloqueadas, então célula tumoral morre seletivamente.", en: "When two repair pathways are blocked, tumor cell selectively dies."}
        objectives: [biology.cancer_evolution]
        difficulty: 5
      - type: choice
        question: {pt: "Combinações terapêuticas racionais:", en: "Rational therapeutic combinations:"}
        choices:
          - {pt: "Atacar diferentes vias simultaneamente para evitar escape evolutivo", en: "Hit different pathways simultaneously to prevent evolutionary escape"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas monoterapia", en: "Just monotherapy"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Atacar diferentes vias simultaneamente para evitar escape evolutivo", en: "Hit different pathways simultaneously to prevent evolutionary escape"}
        rationale: {pt: "Quando dois alvos não compartilham via de escape, então probabilidade de resistência cai exponencialmente.", en: "When two targets share no escape route, resistance probability drops exponentially."}
        objectives: [biology.cancer_evolution]
        difficulty: 5
      - type: choice
        question: {pt: "Detecção precoce com ctDNA (cfDNA):", en: "Early detection with ctDNA (cfDNA):"}
        choices:
          - {pt: "Permite identificar tumores anos antes de imagem ou sintomas", en: "Enables identifying tumors years before imaging or symptoms"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Permite identificar tumores anos antes de imagem ou sintomas", en: "Enables identifying tumors years before imaging or symptoms"}
        rationale: {pt: "Quando massa molecular é detectável, então cura é mais provável que em estágio tardio.", en: "When molecular mass is detectable, cure is more likely than at late stage."}
        objectives: [biology.cancer_evolution]
        difficulty: 5
      - type: choice
        question: {pt: "TRACERx é programa que:", en: "TRACERx is a program that:"}
        choices:
          - {pt: "Sequencia tumores em múltiplos pontos e tempos para mapear evolução clonal", en: "Sequences tumors at multiple sites and times to map clonal evolution"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Sequencia tumores em múltiplos pontos e tempos para mapear evolução clonal", en: "Sequences tumors at multiple sites and times to map clonal evolution"}
        rationale: {pt: "Quando dinâmica é coletada longitudinalmente, então padrões generalizáveis emergem.", en: "When dynamics are collected longitudinally, generalizable patterns emerge."}
        objectives: [biology.cancer_evolution]
        difficulty: 5
      - type: choice
        question: {pt: "Próximas fronteiras em oncologia evolutiva:", en: "Next frontiers in evolutionary oncology:"}
        choices:
          - {pt: "Modelos preditivos de resistência, terapia adaptativa e detecção pan-câncer por cfDNA", en: "Predictive resistance models, adaptive therapy and pan-cancer cfDNA detection"}
          - {pt: "Apenas decoração", en: "Just decoration"}
          - {pt: "Apenas estática", en: "Just static"}
          - {pt: "Apenas estética", en: "Just aesthetics"}
        correctAnswer: {pt: "Modelos preditivos de resistência, terapia adaptativa e detecção pan-câncer por cfDNA", en: "Predictive resistance models, adaptive therapy and pan-cancer cfDNA detection"}
        rationale: {pt: "Quando antecipamos evolução, então tratamento se torna estratégico, não só reativo.", en: "When we anticipate evolution, treatment becomes strategic, not just reactive."}
        objectives: [biology.cancer_evolution]
        difficulty: 5
target: 20
