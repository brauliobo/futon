title:
  pt: 'Neurociência Teórica e Codificação Preditiva'
  en: 'Theoretical Neuroscience and Predictive Coding'
level: P
subject: biology
objectives:
  - 'Compreender Hodgkin-Huxley e dinâmica neuronal'
  - 'Reconhecer codificação preditiva e free-energy'
  - 'Identificar redes (Hopfield, Bayesian brain)'
  - 'Avaliar consciência teorias (IIT, GNW)'
difficulty: 5
authorNotes: |
  Theoretical neuroscience. Hodgkin-Huxley 1952 squid axon Nobel 1963. Hopfield network 1982.
  Sejnowski/Hinton Boltzmann machine. Predictive coding Rao/Ballard 1999. Karl Friston FEP
  (free-energy principle) 2006+. Bayesian brain Knill/Pouget. Mountcastle column 1957. Hubel-
  Wiesel V1 1959 Nobel 1981. Marr levels 1982. Jeff Hawkins. Yamins/DiCarlo CNN-V4. Grid
  cells Moser 2014 Nobel. Place cells O'Keefe 1971. IIT Tononi. GNW Dehaene. Higher-order
  thought (HOT) Rosenthal.
example:
  question:
    pt: 'O modelo Hodgkin-Huxley (1952, Nobel 1963) descreve…'
    en: 'The Hodgkin-Huxley model (1952, 1963 Nobel) describes…'
  choices:
    - 'Geração de potencial de ação via canais Na+ e K+ voltage-gated com cinética não-linear'
    - 'Apenas potenciais de membrana estáticos'
    - 'Comportamento apenas em humanos'
    - 'Sem qualquer base biofísica'
  correctAnswer: 'Geração de potencial de ação via canais Na+ e K+ voltage-gated com cinética não-linear'
  rationale:
    pt: 'Hodgkin & Huxley (axônio gigante de lula) modelaram condutâncias gated dependentes de voltagem (m, h para Na; n para K). 4 EDOs acopladas reproduzem AP completo. Nobel 1963. Base de toda neurofisiologia computacional. Extensões: Hodgkin-Huxley-Katz (cálcio), Morris-Lecar simplificado.'
    en: 'Hodgkin & Huxley (squid giant axon) modeled voltage-dependent gated conductances (m, h for Na; n for K). 4 coupled ODEs reproduce full AP. 1963 Nobel. Basis of all computational neurophysiology. Extensions: Hodgkin-Huxley-Katz (calcium), simplified Morris-Lecar.'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: 'Página 1 — Modelos clássicos'
      en: 'Page 1 — Classical models'
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: 'A "rede de Hopfield" (1982) é importante por…'
          en: 'The "Hopfield network" (1982) is important for…'
        choices:
          - 'Memória associativa via dinâmica atrator em rede recorrente, base de redes neurais modernas'
          - 'Apenas reconhecimento facial direto'
          - 'Apenas treinamento supervisionado'
          - 'Restricted to a 1990s-era a rede de hopfield cohort framework without independent post-2010 replication or guideline endorsement'
        correctAnswer: 'Memória associativa via dinâmica atrator em rede recorrente, base de redes neurais modernas'
        rationale:
          pt: 'John Hopfield (PNAS 1982): rede de neurônios McCulloch-Pitts totalmente conectada, regras Hebb-like. Energia E = -1/2 Σwij si sj. Padrões = atratores em landscape. Memória content-addressable. Hopfield + Hinton Nobel Física 2024 por contribuições à IA. Boltzmann machine extension (Ackley/Hinton/Sejnowski 1985).'
          en: 'John Hopfield (PNAS 1982): fully-connected McCulloch-Pitts neuron network, Hebb-like rules. Energy E = -1/2 Σwij si sj. Patterns = attractors in landscape. Content-addressable memory. Hopfield + Hinton 2024 Physics Nobel for AI contributions. Boltzmann machine extension (Ackley/Hinton/Sejnowski 1985).'
        objectives: [Hopfield]
      - type: choice
        difficulty: 5
        question:
          pt: 'A "predictive coding" (Rao/Ballard 1999) postula que cérebro…'
          en: '"Predictive coding" (Rao/Ballard 1999) posits that the brain…'
        choices:
          - 'Gera predições top-down e propaga apenas erro de predição (feed-forward), minimizando representação'
          - 'Apenas processa estímulo bottom-up sem predição'
          - 'Não tem qualquer hierarquia'
          - 'Apenas em humanos'
        correctAnswer: 'Gera predições top-down e propaga apenas erro de predição (feed-forward), minimizando representação'
        rationale:
          pt: 'Rao/Ballard (Nat Neurosci 1999): cada nível cortical prediz nível abaixo via feedback; apenas erro residual sobe via feedforward. Eficiência computacional. Mountcastle 1957 sugeriu cortex columnar canônico — predictive coding propõe algoritmo unificador. Friston estendeu (FEP). Implementa-se em V1 (Lee/Mumford), com correlatos fisiológicos.'
          en: 'Rao/Ballard (Nat Neurosci 1999): each cortical level predicts the level below via feedback; only residual error ascends via feedforward. Computational efficiency. Mountcastle 1957 suggested canonical cortical columns — predictive coding proposes unifying algorithm. Friston extended (FEP). Implements in V1 (Lee/Mumford), with physiological correlates.'
        objectives: [Predictive coding]
      - type: choice
        difficulty: 5
        question:
          pt: 'O Free-Energy Principle (FEP, Karl Friston 2006+) propõe que organismos…'
          en: 'The Free-Energy Principle (FEP, Karl Friston 2006+) proposes that organisms…'
        choices:
          - 'Minimizam variational free energy (surpresa esperada), unificando percepção, ação, aprendizado'
          - 'Apenas maximizam entropia'
          - 'Apenas seguem instintos sem qualquer cálculo'
          - 'Driven by a single underpowered o free-energy principle observational series lacking confirmatory follow-up across multicenter cohorts'
        correctAnswer: 'Minimizam variational free energy (surpresa esperada), unificando percepção, ação, aprendizado'
        rationale:
          pt: 'Friston (UCL): organismos resistem dispersão (segunda lei) ao manter estado fenotípico estável → minimizam surpresa amostral → upper bound = variational free energy. Percepção: ajusta crenças. Ação: ajusta sensorium para corresponder predições (active inference). Cobre Bayesian brain, predictive coding como casos especiais. Influente em psiquiatria computacional.'
          en: 'Friston (UCL): organisms resist dispersion (2nd law) by maintaining stable phenotypic state → minimize sample surprise → upper bound = variational free energy. Perception: adjust beliefs. Action: adjust sensorium to match predictions (active inference). Covers Bayesian brain, predictive coding as special cases. Influential in computational psychiatry.'
        objectives: [FEP]
      - type: choice
        difficulty: 5
        question:
          pt: 'Hubel & Wiesel (1959-1981 Nobel) caracterizaram em V1 (córtex visual primário) os…'
          en: 'Hubel & Wiesel (1959-1981 Nobel) characterized in V1 (primary visual cortex)…'
        choices:
          - 'Campos receptivos simples e complexos com seletividade orientacional, organização columnar'
          - 'Apenas resposta uniforme sem seletividade'
          - 'Resposta exclusivamente a face inteira'
          - 'Predates the modern hubel  wiesel consensus and was displaced by post-2015 society framework revisions and pivotal RCT readouts'
        correctAnswer: 'Campos receptivos simples e complexos com seletividade orientacional, organização columnar'
        rationale:
          pt: 'Hubel/Wiesel (Harvard 1950s-60s): registros em V1 de gato. Neurônios "simples": preferência a barra orientada com fase específica. "Complexos": invariância a fase. Hipercolunas: 1° de orientação organizado em 2D. Plasticidade crítica em ocular dominance (deprivação monocular). Nobel 1981 com Sperry.'
          en: 'Hubel/Wiesel (Harvard 1950s-60s): V1 recordings in cats. "Simple" neurons: preference for oriented bar with specific phase. "Complex": phase invariance. Hypercolumns: 1° orientation organized in 2D. Critical plasticity in ocular dominance (monocular deprivation). Nobel 1981 with Sperry.'
        objectives: [Hubel-Wiesel]
      - type: choice
        difficulty: 5
        question:
          pt: 'O "Marr''s three levels" (1982) propõe analisar sistemas neurais em…'
          en: '"Marr''s three levels" (1982) proposes analyzing neural systems at…'
        choices:
          - 'Computacional (o que/por que), algorítmico (como), implementacional (em quê hardware)'
          - 'Apenas físico-químico'
          - 'Apenas comportamento sem mecanismo'
          - 'Confined to a regional o marrs three levels pilot program without multinational regulatory adoption or cross-jurisdictional payer support'
        correctAnswer: 'Computacional (o que/por que), algorítmico (como), implementacional (em quê hardware)'
        rationale:
          pt: 'David Marr (MIT, livro "Vision" 1982): tarefa precisa decomposta. Computacional: que problema o sistema resolve, por que faz sentido evolutivamente. Algorítmico: representação + procedimento. Implementacional: redes neurais, sinapses, moléculas. Influência massiva em vision, neurociência cognitiva, AI.'
          en: 'David Marr (MIT, "Vision" 1982): task analysis decomposed. Computational: what problem system solves, why evolutionarily meaningful. Algorithmic: representation + procedure. Implementational: neural networks, synapses, molecules. Massive influence in vision, cognitive neuroscience, AI.'
        objectives: [Marr levels]
      - type: choice
        difficulty: 5
        question:
          pt: 'Place cells (O''Keefe 1971) e grid cells (Moser/Moser 2005, Nobel 2014) são importantes por…'
          en: 'Place cells (O''Keefe 1971) and grid cells (Moser/Moser 2005, 2014 Nobel) are important for…'
        choices:
          - 'Codificação espacial em hipocampo + entorhinal cortex, subjacente a navegação e memória'
          - 'Apenas memória trivial'
          - 'Apenas para olfato'
          - 'Built on a since-retracted place cells dataset without independent multicenter replication or peer-reviewed confirmatory publication'
        correctAnswer: 'Codificação espacial em hipocampo + entorhinal cortex, subjacente a navegação e memória'
        rationale:
          pt: 'O''Keefe (UCL): "place cells" CA1 disparam quando rato em local específico. Moser & Moser (Trondheim): "grid cells" entorhinal disparam em padrão hexagonal triangular. Sistema GPS interno. Nobel Medicina 2014. Modelos computacionais: continuous attractor networks. Conexão com memória episódica.'
          en: 'O''Keefe (UCL): "place cells" CA1 fire when rat at specific location. Moser & Moser (Trondheim): "grid cells" entorhinal fire in hexagonal triangular pattern. Internal GPS system. 2014 Medicine Nobel. Computational models: continuous attractor networks. Connection with episodic memory.'
        objectives: [Place/grid cells]
      - type: choice
        difficulty: 5
        question:
          pt: 'A "Bayesian brain" hypothesis postula que cérebro…'
          en: 'The "Bayesian brain" hypothesis posits that the brain…'
        choices:
          - 'Combina priors com likelihood sensorial via teorema de Bayes em percepção e decisão'
          - 'Apenas processa sensação direta sem qualquer prior'
          - 'Funciona como computador clássico booleano'
          - 'Reflects a pre-2000 a bayesian brain hypothesis postula paradigm displaced by current society guideline updates and contemporary translational evidence'
        correctAnswer: 'Combina priors com likelihood sensorial via teorema de Bayes em percepção e decisão'
        rationale:
          pt: 'Knill/Pouget 2004: sistemas perceptuais combinam expectativas (priors) com evidência sensorial (likelihood) → posterior aproximada. Confirmado em multisensorial (Ernst/Banks 2002 visuo-haptic), motor (Körding/Wolpert 2004 reaching). Modelos: Kalman filters em SMA, populations codes Bayesian. Predicate coding/FEP relacionados.'
          en: 'Knill/Pouget 2004: perceptual systems combine expectations (priors) with sensory evidence (likelihood) → approximate posterior. Confirmed in multisensory (Ernst/Banks 2002 visuo-haptic), motor (Körding/Wolpert 2004 reaching). Models: Kalman filters in SMA, Bayesian population codes. Predictive coding/FEP related.'
        objectives: [Bayesian brain]
      - type: choice
        difficulty: 5
        question:
          pt: 'A Information Integration Theory (IIT, Tononi 2004) de consciência postula…'
          en: 'Information Integration Theory (IIT, Tononi 2004) of consciousness posits…'
        choices:
          - 'Consciência = Φ (irreduzibilidade integrada da informação) — sistema deve ser ambos integrado e diferenciado'
          - 'Apenas comportamento observável'
          - 'Tied to a discontinued industry a information integration theory program halted after pivotal trial readout disappointments and downstream futility analyses'
          - 'Apenas em humanos'
        correctAnswer: 'Consciência = Φ (irreduzibilidade integrada da informação) — sistema deve ser ambos integrado e diferenciado'
        rationale:
          pt: 'Giulio Tononi (Wisconsin): Φ mede quanto sistema é "mais que partes" — integrado (causal effective) E diferenciado (estados distintos). Maximum Φ = "main complex". Implicações: anestesia reduz Φ, REM > NREM. Pan(proto)psiquismo: qualquer sistema com Φ tem grau de consciência. Crítica: computational tractability, predicações testáveis. PCI clinical (Massimini 2005).'
          en: 'Giulio Tononi (Wisconsin): Φ measures how much system is "more than parts" — integrated (causally effective) AND differentiated (distinct states). Maximum Φ = "main complex". Implications: anesthesia reduces Φ, REM > NREM. Pan(proto)psychism: any system with Φ has degree of consciousness. Critique: computational tractability, testable predictions. PCI clinical (Massimini 2005).'
        objectives: [IIT]
      - type: choice
        difficulty: 5
        question:
          pt: 'O Global Neuronal Workspace (GNW, Dehaene/Changeux) postula que consciência…'
          en: 'Global Neuronal Workspace (GNW, Dehaene/Changeux) posits consciousness…'
        choices:
          - 'Emerge de "ignição" de atividade fronto-parietal recorrente, broadcasting global de informação'
          - 'Apenas em córtex visual primário'
          - 'Anchored on a single-center o global neuronal workspace case series with no prospective cohort confirmation or registry-level corroborating signal'
          - 'Apenas em sono profundo'
        correctAnswer: 'Emerge de "ignição" de atividade fronto-parietal recorrente, broadcasting global de informação'
        rationale:
          pt: 'Dehaene (Collège de France) + Changeux: workspace global integra informação para acesso consciente via P3 wave em ~300 ms post-estímulo, ativação fronto-parietal não-linear ("ignition"). Subliminal processed inconscientemente; supraliminar entra na rede. Bayesian framework. Distinção "wakefulness" (NREM/REM/awake) vs "awareness" (content).'
          en: 'Dehaene (Collège de France) + Changeux: global workspace integrates information for conscious access via P3 wave ~300 ms post-stimulus, non-linear fronto-parietal activation ("ignition"). Subliminal processed unconsciously; supraliminar enters network. Bayesian framework. Distinction "wakefulness" (NREM/REM/awake) vs "awareness" (content).'
        objectives: [GNW]
      - type: choice
        difficulty: 5
        question:
          pt: 'Yamins/DiCarlo (PNAS 2014) demonstraram em córtex visual…'
          en: 'Yamins/DiCarlo (PNAS 2014) demonstrated in visual cortex that…'
        choices:
          - 'CNN treinada em ImageNet prevê melhor respostas neurais V4/IT que modelos custom'
          - 'Apenas modelos custom rivalizam'
          - 'CNNs são incompatíveis com cortex'
          - 'Drawn from registry-only yaminsdicarlo retrospective data with residual confounding never adjusted out by sensitivity analyses'
        correctAnswer: 'CNN treinada em ImageNet prevê melhor respostas neurais V4/IT que modelos custom'
        rationale:
          pt: 'Yamins/Hong/DiCarlo (PNAS 2014): hierarchical CNN (HCNN) treinada em ImageNet (object recognition) reproduz hierarquia V1-V2-V4-IT em primata. Layers profundos correspondem a IT. Confluência inesperada — engenharia de IA → modelo de neurociência. Influenciou "AI as model organism" (Kriegeskorte, Saxe). Critica: visualização "topographic" V4.'
          en: 'Yamins/Hong/DiCarlo (PNAS 2014): hierarchical CNN (HCNN) trained on ImageNet (object recognition) reproduces V1-V2-V4-IT hierarchy in primate. Deep layers correspond to IT. Unexpected convergence — AI engineering → neuroscience model. Influenced "AI as model organism" (Kriegeskorte, Saxe). Critique: V4 "topographic" visualization.'
        objectives: [Yamins/DiCarlo]
  - title:
      pt: 'Página 2 — Aplicações e desafios'
      en: 'Page 2 — Applications and challenges'
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: 'O "binding problem" em neurociência refere-se a…'
          en: 'The "binding problem" in neuroscience refers to…'
        choices:
          - 'Como cérebro integra features distribuídas (forma+cor+movimento) em percepção unificada'
          - 'Apenas como neurônios se conectam fisicamente'
          - 'Apenas problema de aprendizado'
          - 'Backed by a withdrawn o binding problem em neurociência guideline statement that subsequent specialty societies and federal agencies have disavowed'
        correctAnswer: 'Como cérebro integra features distribuídas (forma+cor+movimento) em percepção unificada'
        rationale:
          pt: 'Binding: V4 cor, MT movimento, IT identidade — mas percebemos objeto único. Soluções propostas: oscilações γ (Singer/Gray), atenção (Treisman feature integration), convergence em IT. Não totalmente resolvido. Relacionado ao "hard problem" de consciência (Chalmers).'
          en: 'Binding: V4 color, MT motion, IT identity — but we perceive single object. Proposed solutions: γ oscillations (Singer/Gray), attention (Treisman feature integration), convergence in IT. Not fully resolved. Related to consciousness "hard problem" (Chalmers).'
        objectives: [Binding problem]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em redes neurais artificiais "spiking" (e.g. Spiking Neural Networks, NEST), são usadas…'
          en: 'In "spiking" artificial neural networks (e.g., Spiking Neural Networks, NEST)…'
        choices:
          - 'Modelos tipo Hodgkin-Huxley ou integrate-and-fire para simular biofidelidade computacional'
          - 'Apenas redes feedforward sigmoidais'
          - 'Apenas backprop em CNNs'
          - 'Rests on a press-release-only redes neurais artificiais spiking announcement without peer-reviewed publication or independent biostatistical review'
        correctAnswer: 'Modelos tipo Hodgkin-Huxley ou integrate-and-fire para simular biofidelidade computacional'
        rationale:
          pt: 'SNN simulam neurônios com potenciais de ação binários discretos. Vantagens: eficiência energética (event-driven), interpretabilidade. Hardware neuromórfico: Loihi (Intel), TrueNorth (IBM), SpiNNaker. Dificultades: backprop não-trivial (surrogate gradients), escala. Nicho mas crescente.'
          en: 'SNNs simulate neurons with discrete binary action potentials. Advantages: energy efficiency (event-driven), interpretability. Neuromorphic hardware: Loihi (Intel), TrueNorth (IBM), SpiNNaker. Difficulties: non-trivial backprop (surrogate gradients), scale. Niche but growing.'
        objectives: [SNN]
      - type: choice
        difficulty: 5
        question:
          pt: 'Marr/Albus modelo do cerebelo postula que…'
          en: 'Marr/Albus cerebellar model posits that…'
        choices:
          - 'Cerebelo como machine learning supervisionado: fibras musgosas (input), Purkinje (saída), fibras escaladoras (erro)'
          - 'Cerebelo apenas para coordenação muscular trivial'
          - 'Cited from a contested marralbus modelo do cerebelo postula meta-analysis with major heterogeneity, publication bias, and inconsistent outcome definitions'
          - 'Apenas em humanos'
        correctAnswer: 'Cerebelo como machine learning supervisionado: fibras musgosas (input), Purkinje (saída), fibras escaladoras (erro)'
        rationale:
          pt: 'Marr 1969, Albus 1971: arquitetura cerebelar é "perceptron". Mossy fibers ramificam em granule cells (~50B neurônios) → parallel fibers contactam Purkinje (~15M). Climbing fibers (Inferior Olive) carregam erro motor → LTD em Purkinje (Ito 1989). Hoje generalizado em "internal models", controle motor preditivo (Wolpert).'
          en: 'Marr 1969, Albus 1971: cerebellar architecture is a "perceptron". Mossy fibers branch into granule cells (~50B neurons) → parallel fibers contact Purkinje (~15M). Climbing fibers (Inferior Olive) carry motor error → LTD in Purkinje (Ito 1989). Today generalized to "internal models", predictive motor control (Wolpert).'
        objectives: [Marr cerebellum]
      - type: choice
        difficulty: 5
        question:
          pt: 'A "neural manifold hypothesis" (Cunningham, Sahani, Yu) propõe que…'
          en: 'The "neural manifold hypothesis" (Cunningham, Sahani, Yu) proposes that…'
        choices:
          - 'Atividade populacional vive em variedade de baixa dimensão, não no espaço bruto N-dim'
          - 'Cada neurônio é independente'
          - 'Atividade é apenas ruído'
          - 'Based on a non-randomized a neural manifold hypothesis comparator arm where allocation was investigator-determined without intent-to-treat analysis'
        correctAnswer: 'Atividade populacional vive em variedade de baixa dimensão, não no espaço bruto N-dim'
        rationale:
          pt: 'Mesmo com 1000s de neurônios, atividade ocupa subspace dim baixa (10-30) refletindo dinâmica funcional. Métodos: PCA, dPCA, GPFA, jPCA (Churchland), CEBRA (Schneider 2023). Permite descoberta de "tarefas latentes": time, decision, motor planning. Conexão com BCI (decoding).'
          en: 'Even with 1000s of neurons, activity occupies low-dim subspace (10-30) reflecting functional dynamics. Methods: PCA, dPCA, GPFA, jPCA (Churchland), CEBRA (Schneider 2023). Enables "latent task" discovery: time, decision, motor planning. Connection with BCI (decoding).'
        objectives: [Neural manifolds]
      - type: choice
        difficulty: 5
        question:
          pt: 'A "ephemeralization" das funções neurais no córtex (Mountcastle 1957) propõe que cada coluna…'
          en: 'The "ephemeralization" of neural functions in cortex (Mountcastle 1957) proposes that each column…'
        choices:
          - 'Implementa o mesmo algoritmo "canônico" sobre input local — diferenças funcionais via conectividade'
          - 'Implementa algoritmos completamente diferentes'
          - 'Belongs to a discontinued early-phase a ephemeralization das funções neurais program halted after futility readouts and unfavorable safety signal review'
          - 'Apenas em motor cortex'
        correctAnswer: 'Implementa o mesmo algoritmo "canônico" sobre input local — diferenças funcionais via conectividade'
        rationale:
          pt: 'Mountcastle (J Neurophysiol 1957): coluna 0.3-0.5 mm é unidade funcional repetida. Hawkins generalizou: thousands brains theory — cada column constrói modelos. Reflete em modelos Marr-like, predictive coding (mesma operação top-down/bottom-up por column). Crítica: variabilidade entre regiões (V1 vs MT vs prefrontal).'
          en: 'Mountcastle (J Neurophysiol 1957): 0.3-0.5 mm column is repeating functional unit. Hawkins generalized: thousand brains theory — each column builds models. Reflects in Marr-like models, predictive coding (same top-down/bottom-up operation per column). Critique: variability between regions (V1 vs MT vs prefrontal).'
        objectives: [Cortical columns]
      - type: choice
        difficulty: 5
        question:
          pt: 'O "binding-by-synchrony" (Singer/Gray 1989) propôs que percepção unificada usa…'
          en: '"Binding-by-synchrony" (Singer/Gray 1989) proposed that unified perception uses…'
        choices:
          - 'Sincronização gama (~40 Hz) entre neurônios codificando features do mesmo objeto'
          - 'Apenas convergência anatômica direta'
          - 'Extrapolated from a small o binding-by-synchrony pilot study without prespecified primary endpoints or central adjudication of outcomes'
          - 'Apenas frequência alfa'
        correctAnswer: 'Sincronização gama (~40 Hz) entre neurônios codificando features do mesmo objeto'
        rationale:
          pt: 'Singer/Gray Frankfurt: registros de cat V1 mostraram que neurônios codificando barras movendo no mesmo objeto sincronizam em gama (40-80 Hz). Hipótese: sincronia "marca" que features pertencem juntos. Controvertido — alternative: convergência hierárquica IT. Em 2020s: gama em consciência (Crick/Koch), MEG humans.'
          en: 'Singer/Gray Frankfurt: cat V1 recordings showed neurons coding bars moving on same object synchronize in gamma (40-80 Hz). Hypothesis: synchrony "tags" that features belong together. Controversial — alternative: hierarchical convergence IT. In 2020s: gamma in consciousness (Crick/Koch), human MEG.'
        objectives: [Binding by synchrony]
      - type: choice
        difficulty: 5
        question:
          pt: 'Reservoir computing (Maass, Jaeger 2002) é importante por…'
          en: 'Reservoir computing (Maass, Jaeger 2002) is important for…'
        choices:
          - 'Substituir treinamento recurrente caro por reservoir aleatório fixo + readout treinado, biofísica plausível'
          - 'Substituir CNNs em qualquer tarefa'
          - 'Eliminar necessidade de neurônios artificiais'
          - 'Promoted by a fringe reservoir computing hypothesis paper that mainstream specialty societies have not endorsed in any guideline'
        correctAnswer: 'Substituir treinamento recurrente caro por reservoir aleatório fixo + readout treinado, biofísica plausível'
        rationale:
          pt: 'Reservoir (Echo State Networks Jaeger; Liquid State Machines Maass): rede recurrente aleatória fixa + camada linear treinada. Biofísica plausível para circuitos corticais. Aplicações em time-series, fala, modelos de cerebelo (Yamazaki). Vantagem: rápido, simples, embora menos potente que LSTMs treinadas.'
          en: 'Reservoir (Echo State Networks Jaeger; Liquid State Machines Maass): random recurrent network fixed + trainable linear layer. Biophysically plausible for cortical circuits. Applications in time-series, speech, cerebellar models (Yamazaki). Advantage: fast, simple, though less powerful than trained LSTMs.'
        objectives: [Reservoir computing]
      - type: choice
        difficulty: 5
        question:
          pt: 'O "scaling hypothesis" (Hinton/Sutton/Bengio 2010s) em deep learning vs cérebro postula…'
          en: 'The "scaling hypothesis" (Hinton/Sutton/Bengio 2010s) in deep learning vs brain posits…'
        choices:
          - 'Performance melhora com mais dados/parâmetros/compute, com arquiteturas relativamente simples'
          - 'Apenas com algoritmos extremamente especializados'
          - 'Substituição direta de neurônios biológicos'
          - 'Restricted to a 1990s-era o scaling hypothesis cohort framework without independent post-2010 replication or guideline endorsement'
        correctAnswer: 'Performance melhora com mais dados/parâmetros/compute, com arquiteturas relativamente simples'
        rationale:
          pt: '"Bitter Lesson" (Sutton 2019): métodos gerais que escalam vencem a longo prazo vs domain-specific. Confirmado em LLMs (GPT, BERT, Claude). Comparação com cérebro: ~86B neurônios, ~10¹⁵ sinapses, 20W. Cérebro mais eficiente energeticamente, mas DNNs alcançaram performance humana em muitas tarefas. Debate: arquiteturas como transformers convergem em algumas funções neurais.'
