title:
  pt: 'Origens da Vida e Mundo de RNA'
  en: 'Origins of Life and RNA World'
level: P
subject: biology
objectives:
  - 'Compreender RNA world (Gilbert, Joyce, Szostak)'
  - 'Reconhecer química prebiótica (Sutherland, Powner)'
  - 'Identificar protocélulas e LUCA'
  - 'Avaliar origens metabólicas (Wood-Ljungdahl)'
difficulty: 5
authorNotes: |
  Origins of life. Miller-Urey 1953. RNA world Gilbert 1986. Cech, Altman ribozymes Nobel 1989.
  John Sutherland (Cambridge MRC-LMB) prebiotic synthesis Nature 2009. Jack Szostak (Harvard
  Nobel 2009 telomeres, then origins). Vesicle protocells. LUCA Weiss/Sousa/Martin 2016.
  Wood-Ljungdahl pathway. Hydrothermal vents (Russell, Lane, Martin). Stromatolites 3.5 Ga.
  Miller redux. Krishnamurthy borate. Becker Carell purine synthesis. Surface origin Wächtershäuser.
example:
  question:
    pt: 'A "hipótese RNA world" (Gilbert 1986, fundada em descoberta de ribozimas) propõe que…'
    en: 'The "RNA world" hypothesis (Gilbert 1986, grounded in ribozyme discovery) proposes that…'
  choices:
    - 'RNA precedeu DNA + proteína, atuando como genoma e catalisador antes do código moderno'
    - 'DNA + proteína surgiram primeiro sem qualquer RNA precursor'
    - 'Vida começou com lipídeos sem componente informacional'
    - 'Apenas hipótese filosófica sem qualquer suporte experimental'
  correctAnswer: 'RNA precedeu DNA + proteína, atuando como genoma e catalisador antes do código moderno'
  rationale:
    pt: 'Gilbert cunhou "RNA world" após Cech (Tetrahymena) e Altman (RNase P) mostrarem ribozimas (RNA catalíticos) — Nobel 1989. RNA tem dupla função: armazenar info (sequência) + catalisar (estrutura). Ribosomo (peptidil transferase) é ribozima — vestígio. Múltiplas evidências moleculares.'
    en: 'Gilbert coined "RNA world" after Cech (Tetrahymena) and Altman (RNase P) showed ribozymes (catalytic RNA) — 1989 Nobel. RNA has dual function: storing info (sequence) + catalyzing (structure). Ribosome (peptidyl transferase) is a ribozyme — vestige. Multiple molecular lines of evidence.'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: 'Página 1 — Química prebiótica e RNA'
      en: 'Page 1 — Prebiotic chemistry and RNA'
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: 'O experimento Miller-Urey (1953) demonstrou…'
          en: 'The Miller-Urey experiment (1953) demonstrated…'
        choices:
          - 'Síntese abiótica de aminoácidos a partir de gases reduzidos (CH4, NH3, H2, H2O) + descargas'
          - 'Síntese de DNA completo em condições prebióticas'
          - 'Origem direta de células bacterianas em laboratório'
          - 'Replicação de proteínas sem código genético'
        correctAnswer: 'Síntese abiótica de aminoácidos a partir de gases reduzidos (CH4, NH3, H2, H2O) + descargas'
        rationale:
          pt: 'Stanley Miller (orientação Urey) Chicago: aparelho com gases simulando atmosfera primitiva + descargas elétricas — produziu glicina, alanina e outros aminoácidos. Reanálise moderna (Bada 2008) detectou >20 aminoácidos. Estabeleceu paradigma de "primordial soup" (Oparin/Haldane).'
          en: 'Stanley Miller (Urey supervision) Chicago: apparatus with gases simulating primitive atmosphere + electrical discharges — produced glycine, alanine, and others. Modern reanalysis (Bada 2008) detected >20 amino acids. Established "primordial soup" paradigm (Oparin/Haldane).'
        objectives: [Miller-Urey]
      - type: choice
        difficulty: 5
        question:
          pt: 'John Sutherland (Cambridge MRC-LMB) publicou em 2009 (Nature) síntese prebiótica de…'
          en: 'John Sutherland (Cambridge MRC-LMB) published in 2009 (Nature) prebiotic synthesis of…'
        choices:
          - 'Pirimidinas ribonucleotídicas via via formamida/cianamida-aldol unificada'
          - 'Apenas DNA polimerase artificial'
          - 'Apenas ribosomos completos sintetizados'
          - 'Apenas células procarióticas em laboratório'
        correctAnswer: 'Pirimidinas ribonucleotídicas via via formamida/cianamida-aldol unificada'
        rationale:
          pt: 'Powner/Sutherland (Nature 2009) resolveu problema de longa data sintetizando ribonucleotídeos pirimídicos (citidina, uridina) por via plausível em condições prebióticas — usando glicolaldeído + cianamida + 2-aminooxazol; convergência elegante. Krishnamurthy estendeu para purinas. Sutherland propõe síntese unificada com HCN como fonte central.'
          en: 'Powner/Sutherland (Nature 2009) solved a long-standing problem by synthesizing pyrimidine ribonucleotides (cytidine, uridine) via plausible prebiotic conditions — using glycolaldehyde + cyanamide + 2-aminooxazole; elegant convergence. Krishnamurthy extended to purines. Sutherland proposes unified synthesis with HCN as central source.'
        objectives: [Sutherland 2009]
      - type: choice
        difficulty: 5
        question:
          pt: 'Jack Szostak (Harvard) é pioneiro em "protocélulas" — vesículas com…'
          en: 'Jack Szostak (Harvard) pioneered "protocells" — vesicles with…'
        choices:
          - 'Bicamadas de ácidos graxos hospedando RNA replicador, capaz de divisão e seleção'
          - 'Apenas lipídeos modernos como fosfatidilcolina'
          - 'Bicamadas duplas idênticas a células modernas'
          - 'Apenas para sólidos cristalinos não-aquosos'
        correctAnswer: 'Bicamadas de ácidos graxos hospedando RNA replicador, capaz de divisão e seleção'
        rationale:
          pt: 'Szostak (Nobel 2009 telomeres, depois origens): vesículas de ácido oleico/mirístico simples encapsulam RNA, dividem por estresse mecânico (osmose, fluxo), seleção por troca lipídica. Szostak/Adamala 2014 mostrou competição entre protocélulas. Caminho experimental para vida sintética.'
          en: 'Szostak (2009 Nobel for telomeres, then origins): simple oleic/myristic acid vesicles encapsulate RNA, divide via mechanical stress (osmosis, shear), undergo selection through lipid exchange. Szostak/Adamala 2014 showed protocell competition. Experimental path to synthetic life.'
        objectives: [Szostak protocells]
      - type: choice
        difficulty: 5
        question:
          pt: 'A descoberta de ribozimas (Cech, Altman 1989 Nobel) foi crítica porque…'
          en: 'Ribozyme discovery (Cech, Altman 1989 Nobel) was critical because…'
        choices:
          - 'Demonstrou que RNA pode catalisar reações químicas, viabilizando hipótese RNA world'
          - 'RNA pode apenas armazenar informação genética'
          - 'Confirmou que apenas proteínas catalizam'
          - 'Apenas em vírus sem qualquer relevância biológica'
        correctAnswer: 'Demonstrou que RNA pode catalisar reações químicas, viabilizando hipótese RNA world'
        rationale:
          pt: 'Cech (Colorado): self-splicing intron Tetrahymena Group I 1982. Altman (Yale): RNase P RNA cataliza tRNA processing. Nobel Química 1989. Bartel/Szostak depois evoluiu ribozimas RNA polimerase em laboratório (Class I, depois R18). Confirma RNA como catalisador.'
          en: 'Cech (Colorado): Tetrahymena Group I self-splicing intron 1982. Altman (Yale): RNase P RNA catalyzes tRNA processing. 1989 Chemistry Nobel. Bartel/Szostak later evolved RNA polymerase ribozymes in lab (Class I, then R18). Confirms RNA as catalyst.'
        objectives: [Ribozymes Nobel]
      - type: choice
        difficulty: 5
        question:
          pt: 'A hipótese de "hot vents" (Russell, Lane, Martin) localiza origem da vida em…'
          en: 'The "hot vents" hypothesis (Russell, Lane, Martin) places origin of life at…'
        choices:
          - 'Fontes hidrotermais alcalinas (e.g. Lost City) com gradientes naturais protocélula-like'
          - 'Vulcões em superfície sem qualquer envolvimento aquático'
          - 'Atmosfera puramente seca sem qualquer ambiente aquoso'
          - 'Apenas no espaço interestelar via panspermia'
        correctAnswer: 'Fontes hidrotermais alcalinas (e.g. Lost City) com gradientes naturais protocélula-like'
        rationale:
          pt: 'Russell/Lane/Martin: vents alcalinos serpentiníticos (Lost City Atlantic, descoberto 2000) têm chimneys com poros mineral-celulares + gradientes pH 9 vs ácido oceanico — análogo a próton-motive force celular. Wood-Ljungdahl + acetogênese plausíveis. Diferente de "black smokers" ácidos quentes de Wächtershäuser.'
          en: 'Russell/Lane/Martin: alkaline serpentinizing vents (Lost City Atlantic, discovered 2000) have chimneys with mineral-cellular pores + pH 9 gradients vs acidic ocean — analogous to cellular proton-motive force. Wood-Ljungdahl + acetogenesis plausible. Different from Wächtershäuser''s acidic hot "black smokers".'
        objectives: [Alkaline vents]
      - type: choice
        difficulty: 5
        question:
          pt: 'A via Wood-Ljungdahl (acetil-CoA pathway) é considerada antiga porque…'
          en: 'The Wood-Ljungdahl (acetyl-CoA) pathway is considered ancient because…'
        choices:
          - 'Linear, autotrófica (CO2 + H2 → acetil-CoA), simples, presente em archaea/bactérias profundas'
          - 'É via mais complexa conhecida'
          - 'Apenas em organismos modernos como humanos'
          - 'Não tem qualquer relação com origem da vida'
        correctAnswer: 'Linear, autotrófica (CO2 + H2 → acetil-CoA), simples, presente em archaea/bactérias profundas'
        rationale:
          pt: 'WL: única via fixação CO2 que é exergônica (libera energia), com poucos passos, intermediários simples. Em archaea metanogênicas (Methanocaldococcus) e bactérias acetogênicas (Moorella, Clostridium). Russell/Martin/Sousa propõem como metabolismo de LUCA. Geomimética: minerais Fe-Ni-S em vents catalisam reações análogas.'
          en: 'WL: only CO2 fixation pathway that is exergonic (releases energy), with few steps, simple intermediates. In methanogenic archaea (Methanocaldococcus) and acetogenic bacteria (Moorella, Clostridium). Russell/Martin/Sousa propose as LUCA metabolism. Geomimetics: Fe-Ni-S minerals in vents catalyze analogous reactions.'
        objectives: [Wood-Ljungdahl]
      - type: choice
        difficulty: 5
        question:
          pt: 'LUCA (Last Universal Common Ancestor) reconstruído por Weiss/Sousa/Martin (2016 Nat Microbiol) era…'
          en: 'LUCA (Last Universal Common Ancestor) reconstructed by Weiss/Sousa/Martin (2016 Nat Microbiol) was…'
        choices:
          - 'Termofílico, anaeróbico, fixador de CO2/H2, dependente de metais, ~4 bilhões anos'
          - 'Mesofílico, aeróbico, similar a bactérias modernas'
          - 'Apenas hipotético sem qualquer reconstrução'
          - 'Eucarioto desde o início'
        correctAnswer: 'Termofílico, anaeróbico, fixador de CO2/H2, dependente de metais, ~4 bilhões anos'
        rationale:
          pt: 'Weiss et al.: 355 genes presentes em 2 domínios (bact + arch), análise filogenética rigorosa. LUCA termofílico (>50°C), anaeróbico, fixador de CO2 via WL, fixador N2, dependente de metais (Fe, Ni, Mo). Compatível com hidrothermal vents. Datação ~4 Gyr coerente com fósseis stromatolites 3.5 Gyr.'
          en: 'Weiss et al.: 355 genes present in 2 domains (bact + arch), rigorous phylogenetic analysis. LUCA thermophilic (>50°C), anaerobic, CO2 fixer via WL, N2 fixer, metal-dependent (Fe, Ni, Mo). Compatible with hydrothermal vents. ~4 Gyr dating consistent with 3.5 Gyr stromatolite fossils.'
        objectives: [LUCA]
      - type: choice
        difficulty: 5
        question:
          pt: 'Bartel/Szostak evoluiu em laboratório uma "RNA polimerase RNA" capaz de…'
          en: 'Bartel/Szostak evolved in lab an "RNA polymerase RNA" capable of…'
        choices:
          - 'Polimerizar até ~20 nt antes de Lawrence/Bartel R18 e ~95 nt em variantes mais recentes'
          - 'Substituir DNA polimerase moderna em qualquer cenário'
          - 'Replicar todo o genoma humano'
          - 'Apenas observação computacional sem evidência experimental'
        correctAnswer: 'Polimerizar até ~20 nt antes de Lawrence/Bartel R18 e ~95 nt em variantes mais recentes'
        rationale:
          pt: 'Class I ribozyme polimerizando ~14 nt (Bartel 1995); R18 (Lawrence/Bartel 2003) evoluiu para ~14-20 nt. Wochner/Holliger 2011 atingiu ~95 nt — primeira polimerase ribozima a transcrever ribozima funcional inteiro. Aproxima-se de auto-replicação RNA crítica para RNA world.'
          en: 'Class I ribozyme polymerizing ~14 nt (Bartel 1995); R18 (Lawrence/Bartel 2003) evolved to ~14-20 nt. Wochner/Holliger 2011 reached ~95 nt — first polymerase ribozyme to transcribe entire functional ribozyme. Approaches RNA self-replication critical for RNA world.'
        objectives: [Bartel polymerase]
      - type: choice
        difficulty: 5
        question:
          pt: 'Stromatolites mais antigos confiáveis (~3.5 Ga) foram encontrados em…'
          en: 'The oldest reliable stromatolites (~3.5 Ga) were found in…'
        choices:
          - 'Pilbara, Western Australia (Apex Chert) e Strelley Pool'
          - 'Apenas em Marte como meteoritos'
          - 'Apenas em depósitos pleistocênicos recentes'
          - 'Antártica em camadas modernas'
        correctAnswer: 'Pilbara, Western Australia (Apex Chert) e Strelley Pool'
        rationale:
          pt: 'Stromatolites Pilbara (~3.48 Ga, Schopf, Walter, Allwood) e Strelley Pool são fósseis microbiais layered. Greenland Isua (~3.7 Ga) tem evidências químicas (sinais isotópicos de carbono) ainda controversas. Marca presença de vida microbiana primitiva nos primeiros bilhões de anos da Terra.'
          en: 'Pilbara stromatolites (~3.48 Ga, Schopf, Walter, Allwood) and Strelley Pool are layered microbial fossils. Greenland Isua (~3.7 Ga) has chemical evidence (carbon isotope signals) still controversial. Marks primitive microbial life present in Earth''s first billion years.'
        objectives: [Stromatolites]
      - type: choice
        difficulty: 5
        question:
          pt: 'A "Great Oxidation Event" (GOE, ~2.4 Ga) foi causada por…'
          en: 'The "Great Oxidation Event" (GOE, ~2.4 Ga) was caused by…'
        choices:
          - 'Fotossíntese oxigênica de cianobactérias acumulando O2 atmosférico'
          - 'Vulcanismo direto sem componente biológico'
          - 'Apenas impacto de meteorito'
          - 'Substituição completa da Terra por outro planeta'
        correctAnswer: 'Fotossíntese oxigênica de cianobactérias acumulando O2 atmosférico'
        rationale:
          pt: 'GOE: O2 saiu de <10⁻⁵ atm para ~10⁻²-10⁻¹ atm em ~200 Myr (~2.4-2.0 Ga). Cianobactérias fotossintéticas (descendentes inseridas em cloroplastos) acumularam O2 após esgotamento de "sumidouros" (Fe²⁺ ferro reduzido em oceano → BIFs banded iron formations). Habilitou eucariotos aeróbicos.'
          en: 'GOE: O2 went from <10⁻⁵ atm to ~10⁻²-10⁻¹ atm in ~200 Myr (~2.4-2.0 Ga). Photosynthetic cyanobacteria (descendants endosymbiosed as chloroplasts) accumulated O2 after sinks were exhausted (Fe²⁺ reduced iron in ocean → BIFs banded iron formations). Enabled aerobic eukaryotes.'
        objectives: [GOE]
  - title:
      pt: 'Página 2 — Síntese e debates'
      en: 'Page 2 — Synthesis and debates'
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: 'A "panspermia" (Hoyle/Wickramasinghe, Crick) postula que…'
          en: '"Panspermia" (Hoyle/Wickramasinghe, Crick) posits that…'
        choices:
          - 'Vida pode ser transportada entre planetas em cometas/meteoritos, evitando origem terrestre única'
          - 'Vida originou-se exclusivamente em Terra'
          - 'Vida é apenas hipótese filosófica'
          - 'Apenas humanos têm origem extraterrestre'
        correctAnswer: 'Vida pode ser transportada entre planetas em cometas/meteoritos, evitando origem terrestre única'
        rationale:
          pt: 'Panspermia: hipótese de transferência de vida entre corpos planetários. Suportes parciais: extremófilos sobrevivem condições espaciais; meteorito Murchison contém aminoácidos. Não resolve origem (apenas transfere). Crick "directed panspermia" especulou alienígenas. Mainstream: pode ter ocorrido entre Marte e Terra (paleo-Marte habitável).'
          en: 'Panspermia: hypothesis of life transfer between planetary bodies. Partial support: extremophiles survive space conditions; Murchison meteorite contains amino acids. Doesn''t solve origin (just transfers). Crick "directed panspermia" speculated about aliens. Mainstream: may have occurred between Mars and Earth (habitable paleo-Mars).'
        objectives: [Panspermia]
      - type: choice
        difficulty: 5
        question:
          pt: 'Krishnamurthy (Scripps) propõe que borato (B(OH)4) ou…'
          en: 'Krishnamurthy (Scripps) proposes that borate (B(OH)4) or…'
        choices:
          - 'Estabilização de ribose por borato em laboratório, suportando síntese prebiótica em ambientes contendo boro'
          - 'Restricted to a 1990s-era krishnamurthy cohort framework without independent post-2010 replication or guideline endorsement'
          - 'Apenas papel para metais de transição'
          - 'Apenas em contexto experimental sem implicação prebiótica'
        correctAnswer: 'Estabilização de ribose por borato em laboratório, suportando síntese prebiótica em ambientes contendo boro'
        rationale:
          pt: 'Ribose é instável em água; Ricardo/Carrigan/Olcott/Benner 2004 mostraram que borato estabiliza via éster cíclico. Krishnamurthy expandiu, mostrando síntese de açúcares em condições prebióticas com borato. Plausível em ambientes evaporitícos (lago, deserto). Sutherland Cambridge prefere via formamida.'
          en: 'Ribose is unstable in water; Ricardo/Carrigan/Olcott/Benner 2004 showed borate stabilizes it via cyclic ester. Krishnamurthy expanded, showing sugar synthesis under prebiotic conditions with borate. Plausible in evaporitic environments (lake, desert). Sutherland Cambridge prefers formamide route.'
        objectives: [Borato]
      - type: choice
        difficulty: 5
        question:
          pt: 'A "shadow biosphere" (Cleland/Davies) hipoteticamente refere-se a…'
          en: '"Shadow biosphere" (Cleland/Davies) hypothetically refers to…'
        choices:
          - 'Forma alternativa de vida na Terra com bioquímica distinta (mirror life, alt-DNA), não detectada por métodos padrão'
          - 'Apenas vírus desconhecidos sem outras formas'
          - 'Vida em outras dimensões físicas'
          - 'Substituição direta de toda a vida conhecida'
        correctAnswer: 'Forma alternativa de vida na Terra com bioquímica distinta (mirror life, alt-DNA), não detectada por métodos padrão'
        rationale:
          pt: 'Cleland/Davies (2007): se vida originou múltiplas vezes na Terra, formas alternativas (e.g. D-DNA mirror, ácidos nucleicos diferentes) podem coexistir não-detectadas. Microbioma "dark matter" (ingenuamente inerte por métodos padrão). Especulativo mas motiva busca por bioquímicas alternativas.'
          en: 'Cleland/Davies (2007): if life originated multiple times on Earth, alternative forms (e.g., mirror D-DNA, different nucleic acids) might coexist undetected. "Dark matter" microbiome (naively inert by standard methods). Speculative but motivates search for alternative biochemistries.'
        objectives: [Shadow biosphere]
      - type: choice
        difficulty: 5
        question:
          pt: 'O conceito de "metabolism-first" (Wächtershäuser, Russell) compete com "RNA-first" propondo que…'
          en: '"Metabolism-first" (Wächtershäuser, Russell) competes with "RNA-first" by proposing that…'
        choices:
          - 'Metabolismo simples (ciclo de carbono em sulfeto-ferro) precedeu replicação informacional'
          - 'DNA precedeu RNA imediatamente'
          - 'Apenas proteínas surgiram primeiro sem ácidos nucleicos'
          - 'Driven by a single underpowered o conceito de metabolism-first observational series lacking confirmatory follow-up across multicenter cohorts'
        correctAnswer: 'Metabolismo simples (ciclo de carbono em sulfeto-ferro) precedeu replicação informacional'
        rationale:
          pt: 'Wächtershäuser (1988): "iron-sulfur world" — ciclos químicos auto-catalíticos em superfícies de pirita poderiam preceder genética. Russell estende para vents alcalinos. Gerald Joyce/Szostak preferem RNA-first; Mike Russell/Bill Martin metabolismo-first. Tensão central no campo.'
          en: 'Wächtershäuser (1988): "iron-sulfur world" — autocatalytic chemical cycles on pyrite surfaces could precede genetics. Russell extends to alkaline vents. Gerald Joyce/Szostak prefer RNA-first; Mike Russell/Bill Martin metabolism-first. Central field tension.'
        objectives: [Metabolism-first]
      - type: choice
        difficulty: 5
        question:
          pt: 'Ribosomo como "ribozima fossil" sustenta hipótese RNA world porque…'
          en: 'Ribosome as "fossil ribozyme" supports RNA world hypothesis because…'
        choices:
          - 'Catalise peptidil transferase ribosomal é exclusivamente RNA (Steitz 2000), proteínas são "scaffold"'
          - 'Toda a função ribosomal é exclusivamente proteica'
          - 'Ribosomo não tem função catalítica'
          - 'Apenas em archaea sem outros domínios'
        correctAnswer: 'Catalise peptidil transferase ribosomal é exclusivamente RNA (Steitz 2000), proteínas são "scaffold"'
        rationale:
          pt: 'Steitz/Moore/Yonath/Ramakrishnan resolveram cristalografia ribosomal (Nobel 2009). Centro peptidil transferase (PTC) é exclusivamente RNA — proteínas estão na periferia, função estrutural. Significa: maquina central de tradução é RNA → vestígio direto do RNA world.'
          en: 'Steitz/Moore/Yonath/Ramakrishnan solved ribosome crystallography (2009 Nobel). Peptidyl transferase center (PTC) is exclusively RNA — proteins are peripheral, structural. Implies: central translation machine is RNA → direct vestige of RNA world.'
        objectives: [Ribosome PTC]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em 1996, ALH84001 (meteorito Marciano) gerou controvérsia por…'
          en: 'In 1996, ALH84001 (Martian meteorite) generated controversy because of…'
        choices:
          - 'Estruturas microscópicas alegadas como microfósseis bacterianos (McKay/NASA), depois contestadas'
          - 'Confirmação inequívoca de vida em Marte'
          - 'Apenas mineralogia sem qualquer relevância biológica'
          - 'Substituição direta de hipóteses de origem'
        correctAnswer: 'Estruturas microscópicas alegadas como microfósseis bacterianos (McKay/NASA), depois contestadas'
        rationale:
          pt: 'McKay/Gibson NASA (Science 1996) reportou em ALH84001 (caído na Antártica): magnetitas em cadeia, PAHs, "shapes" tipo bactéria. Reanálise: produto químico abiótico. Não convincente, mas reabriu debate astrobiológico e justificou missões a Marte (Phoenix, Curiosity, Perseverance).'
          en: 'McKay/Gibson NASA (Science 1996) reported in ALH84001 (Antarctica fall): chain magnetites, PAHs, bacterium-like "shapes". Re-analysis: abiotic chemical product. Unconvincing, but reopened astrobiology debate and justified Mars missions (Phoenix, Curiosity, Perseverance).'
        objectives: [ALH84001]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em Enceladus (lua de Saturno), Cassini detectou…'
          en: 'At Enceladus (Saturn''s moon), Cassini detected…'
        choices:
          - 'Plumas de água + sais + moléculas orgânicas + H2 (atividade hidrotermal)'
          - 'Apenas atmosfera de metano sem qualquer plumas'
          - 'Apenas superfície congelada inerte'
          - 'Vida confirmada inequivocamente'
        correctAnswer: 'Plumas de água + sais + moléculas orgânicas + H2 (atividade hidrotermal)'
        rationale:
          pt: 'Cassini (NASA/ESA, 2005-2017) flyby Enceladus detectou plumas no polo sul: H2O, NaCl, NH3, moléculas orgânicas (Postberg 2018, Glein 2018), H2 — sugere reações serpentinização hidrotermal sob oceano subglacial. Junto com Europa (Júpiter), candidatos prioritários para vida extraterrestre. Missão Europa Clipper (2024).'
          en: 'Cassini (NASA/ESA, 2005-2017) Enceladus flyby detected south-pole plumes: H2O, NaCl, NH3, organic molecules (Postberg 2018, Glein 2018), H2 — suggests serpentinization hydrothermal reactions under subglacial ocean. With Europa (Jupiter), priority candidates for extraterrestrial life. Europa Clipper mission (2024).'
        objectives: [Enceladus]
      - type: choice
        difficulty: 5
        question:
          pt: 'A "Late Heavy Bombardment" (LHB, ~4.1-3.8 Ga) é importante porque…'
          en: 'The Late Heavy Bombardment (LHB, ~4.1-3.8 Ga) matters because…'
        choices:
          - 'Pode ter esterilizado parcialmente a Terra; LUCA pode ser pós-LHB ou refúgio profundo'
          - 'Não teve qualquer impacto biológico'
          - 'Substituição direta da atmosfera primitiva'
          - 'Apenas em Marte sem qualquer relação com Terra'
        correctAnswer: 'Pode ter esterilizado parcialmente a Terra; LUCA pode ser pós-LHB ou refúgio profundo'
        rationale:
