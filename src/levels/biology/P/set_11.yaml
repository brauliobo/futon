title:
  pt: 'Astrobiologia e Biossinaturas'
  en: 'Astrobiology and Biosignatures'
level: P
subject: biology
objectives:
  - 'Compreender critérios de habitabilidade'
  - 'Reconhecer biossinaturas (metano, O2, fosfina)'
  - 'Identificar missões (Curiosity, Perseverance, Europa Clipper)'
  - 'Avaliar SETI e Drake equation'
difficulty: 5
authorNotes: |
  Astrobiology. NASA Astrobiology Institute. Cassini Saturn 1997-2017. Mars 2020 Perseverance
  Jezero crater. Curiosity 2012. ExoMars Rosalind Franklin. Europa Clipper 2024 launch.
  JWST 2021. Biosignatures: Lovelock 1965 atmospheric. O2+CH4 disequilibrium. PH3 Greaves
  2020 controversy. SETI Drake equation 1961. Frank Drake. Carl Sagan. Wow signal 1977.
  Breakthrough Listen Yuri Milner. Ancient DNA permafrost. Tardigrades, deinococcus
  radiation tolerance. Yellowstone hyperthermophiles Brock.
example:
  question:
    pt: 'A equação de Drake (1961) busca estimar…'
    en: 'The Drake equation (1961) seeks to estimate…'
  choices:
    - 'Número de civilizações tecnológicas comunicantes na nossa galáxia (N)'
    - 'Apenas distância à estrela mais próxima'
    - 'Apenas idade do universo'
    - 'Probabilidade de vida na Terra apenas'
  correctAnswer: 'Número de civilizações tecnológicas comunicantes na nossa galáxia (N)'
  rationale:
    pt: 'N = R* × fp × ne × fl × fi × fc × L, onde R* taxa formação estelar, fp planetas, ne habitáveis, fl com vida, fi inteligente, fc tecnológica, L vida da civilização. Frank Drake (Green Bank 1961) — não resolve mas organiza problema. Estimativas vão de N=1 (humanos sozinhos) a milhões.'
    en: 'N = R* × fp × ne × fl × fi × fc × L, where R* star formation rate, fp planets, ne habitable, fl with life, fi intelligent, fc technological, L civilization lifespan. Frank Drake (Green Bank 1961) — doesn''t solve but organizes the problem. Estimates range from N=1 (humans alone) to millions.'
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - title:
      pt: 'Página 1 — Habitabilidade e biossinaturas'
      en: 'Page 1 — Habitability and biosignatures'
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: 'Lovelock (1965) propôs detecção de vida em outros planetas via…'
          en: 'Lovelock (1965) proposed detecting life on other planets via…'
        choices:
          - 'Desequilíbrio termodinâmico atmosférico (e.g. O2 + CH4 simultâneos) sugerindo metabolismo ativo'
          - 'Apenas detecção visual direta'
          - 'Apenas amostras retornadas'
          - 'Apenas vida tecnológica avançada'
        correctAnswer: 'Desequilíbrio termodinâmico atmosférico (e.g. O2 + CH4 simultâneos) sugerindo metabolismo ativo'
        rationale:
          pt: 'James Lovelock (Gaia hypothesis) trabalhou na NASA Mars program: vida modifica atmosfera longe do equilíbrio químico (O2 reactivo coexistindo com CH4 reduzido em Terra é insustentável sem produção biológica contínua). Marte tem atmosfera quase em equilíbrio → sem vida superficial. Princípio fundador.'
          en: 'James Lovelock (Gaia hypothesis) worked on NASA Mars program: life modifies atmosphere far from chemical equilibrium (O2 reactive coexisting with reduced CH4 on Earth is unsustainable without continuous biological production). Mars has near-equilibrium atmosphere → no surface life. Founding principle.'
        objectives: [Lovelock biosignature]
      - type: choice
        difficulty: 5
        question:
          pt: 'O JWST (James Webb Space Telescope, 2021) tem capacidade biosinatures por…'
          en: 'JWST (James Webb Space Telescope, 2021) has biosignature capability via…'
        choices:
          - 'Espectroscopia de transmissão de atmosferas exoplanetárias (CO2, H2O, O2, CH4, ozônio)'
          - 'Apenas imageamento direto sem espectroscopia'
          - 'Substituição direta de Hubble sem qualquer melhoria'
          - 'Apenas em raios-X, não infravermelho'
        correctAnswer: 'Espectroscopia de transmissão de atmosferas exoplanetárias (CO2, H2O, O2, CH4, ozônio)'
        rationale:
          pt: 'JWST observa em IR (0.6-28 μm), tem 6.5m vs Hubble 2.4m. Durante trânsito de exoplaneta, luz estelar passa pela atmosfera; absorção espectral revela moléculas. Detectou CO2 em WASP-39b (2022), DMS controverso em K2-18b (2023). Faltam tecnologias para Earth-like; Habitable Worlds Observatory NASA 2030s.'
          en: 'JWST observes in IR (0.6-28 μm), has 6.5m vs Hubble 2.4m. During exoplanet transit, starlight passes through atmosphere; spectral absorption reveals molecules. Detected CO2 in WASP-39b (2022), controversial DMS in K2-18b (2023). Lacks tech for Earth-like; Habitable Worlds Observatory NASA 2030s.'
        objectives: [JWST]
      - type: choice
        difficulty: 5
        question:
          pt: 'Em 2020, Greaves et al. reportaram fosfina (PH3) em Vênus — sinalizando potencial vida. Status atual?'
          en: 'In 2020, Greaves et al. reported phosphine (PH3) at Venus — signaling potential life. Current status?'
        choices:
          - 'Detecção controversa, reanálises divergem; explicação biológica não confirmada'
          - 'Confirmação inequívoca de vida em Venus'
          - 'Refutada totalmente sem qualquer dúvida'
          - 'Substituída por detecção em outro planeta'
        correctAnswer: 'Detecção controversa, reanálises divergem; explicação biológica não confirmada'
        rationale:
          pt: 'Greaves et al. (Nat Astron 2020) reportaram PH3 em nuvens de Vênus (~50 km altitude); biologicamente não-explicada por química conhecida. Reanálises (Snellen, Lincowski) contestaram detecção (artefato de ruído baseline, ou SO2). Vênus continua interessante mas vida não confirmada. Missões DAVINCI+ (2030s).'
          en: 'Greaves et al. (Nat Astron 2020) reported PH3 in Venusian clouds (~50 km altitude); biologically unexplainable by known chemistry. Reanalyses (Snellen, Lincowski) contested detection (baseline noise artifact, or SO2). Venus remains interesting but life not confirmed. DAVINCI+ missions (2030s).'
        objectives: [PH3 Vênus]
      - type: choice
        difficulty: 5
        question:
          pt: 'Marte 2020 (Perseverance) está em Jezero crater coletando amostras a serem retornadas. Por que Jezero?'
          en: 'Mars 2020 (Perseverance) is in Jezero crater collecting samples for return. Why Jezero?'
        choices:
          - 'Antigo lago + delta fluvial com sedimentos preservando potencial biossinatures de 3.5 Ga'
          - 'Apenas terreno plano para pouso fácil'
          - 'Posição equatorial conveniente'
          - 'Apenas para acesso a polos'
        correctAnswer: 'Antigo lago + delta fluvial com sedimentos preservando potencial biossinatures de 3.5 Ga'
        rationale:
          pt: 'Jezero (45 km diâmetro) tinha lago entre 3.5-3.8 Ga, com delta fluvial que depositou argilas e carbonatos onde biossinaturas se preservariam. Perseverance (chegada fev/2021) coletou ~24 amostras (até 2024). Mars Sample Return em planejamento; complexidade (cooperação NASA-ESA, atrasos) ameaça programa.'
          en: 'Jezero (45 km diameter) had a lake between 3.5-3.8 Ga, with a fluvial delta depositing clays and carbonates where biosignatures would be preserved. Perseverance (arrival Feb 2021) collected ~24 samples (through 2024). Mars Sample Return in planning; complexity (NASA-ESA cooperation, delays) threatens the program.'
        objectives: [Jezero]
      - type: choice
        difficulty: 5
        question:
          pt: 'O Wow! Signal (1977, Big Ear telescope, Ohio) é importante por…'
          en: 'The Wow! Signal (1977, Big Ear telescope, Ohio) is important because of…'
        choices:
          - 'Sinal de 72 segundos em 1420 MHz (linha H), nunca repetido nem explicado satisfatoriamente'
          - 'Confirmação de comunicação extraterrestre'
          - 'Apenas refletida da Terra trivialmente'
          - 'Substituído por sinais modernos repetidos'
        correctAnswer: 'Sinal de 72 segundos em 1420 MHz (linha H), nunca repetido nem explicado satisfatoriamente'
        rationale:
          pt: 'Jerry Ehman observou em 15/ago/1977 sinal forte em 1420 MHz (frequência H neutro, "magic frequency" SETI). Duração 72s, banda estreita, não terrestre conhecida. Direção Sagittarius. Nunca repetido. Hipótese de cometa cancelada. Permanece anomalia famosa de SETI; insuficiente para reivindicação ETI.'
          en: 'Jerry Ehman observed on 15 Aug 1977 a strong signal at 1420 MHz (neutral H frequency, SETI "magic frequency"). 72s duration, narrowband, not known terrestrial. Sagittarius direction. Never repeated. Comet hypothesis canceled. Remains famous SETI anomaly; insufficient for ETI claim.'
        objectives: [Wow signal]
      - type: choice
        difficulty: 5
        question:
          pt: 'Breakthrough Listen (2015, Yuri Milner US$ 100M) é importante por…'
          en: 'Breakthrough Listen (2015, Yuri Milner US$ 100M) is important for…'
        choices:
          - 'Maior programa SETI privado, varrendo 1M estrelas com Green Bank, Parkes, ATA'
          - 'Apenas projeto educativo sem busca real'
          - 'Substituição completa de SETI Institute'
          - 'Restrito ao Sistema Solar'
        correctAnswer: 'Maior programa SETI privado, varrendo 1M estrelas com Green Bank, Parkes, ATA'
        rationale:
          pt: 'Breakthrough Listen (Berkeley SETI Research Center, Andrew Siemion) varre 1M estrelas próximas + 100 galáxias em rádio + óptico com Green Bank, Parkes, MeerKAT. Dados públicos. Detecção de "BLC1" candidato em 2020 atribuído a interferência terrestre. Continua busca sistemática.'
          en: 'Breakthrough Listen (Berkeley SETI Research Center, Andrew Siemion) sweeps 1M nearby stars + 100 galaxies in radio + optical with Green Bank, Parkes, MeerKAT. Data public. "BLC1" candidate detection in 2020 attributed to terrestrial interference. Continues systematic search.'
        objectives: [Breakthrough Listen]
      - type: choice
        difficulty: 5
        question:
          pt: 'TRAPPIST-1 (descoberto 2017) é sistema importante por ter…'
          en: 'TRAPPIST-1 (discovered 2017) is an important system because it has…'
        choices:
          - '7 planetas terrestres orbitando anã M ultracool, 3 em zona habitável a 40 anos-luz'
          - 'Apenas 1 planeta gigante a centenas de anos-luz'
          - '100 planetas em sistema único'
          - 'Apenas estrela isolada sem planetas'
        correctAnswer: '7 planetas terrestres orbitando anã M ultracool, 3 em zona habitável a 40 anos-luz'
        rationale:
          pt: 'TRAPPIST-1 (Gillon et al., Nature 2017): anã M ultracool a ~40 anos-luz, 7 planetas terrestres com b-h. e, f, g em HZ (água líquida possível). Massa medida via TTV (transit-timing variations). JWST está caracterizando atmosferas (b, c CO2-thin 2023-2024). Trade-off: anãs M têm atividade flares fortes que podem esterilizar.'
          en: 'TRAPPIST-1 (Gillon et al., Nature 2017): ultracool M dwarf at ~40 light-years, 7 terrestrial planets b-h. e, f, g in HZ (liquid water possible). Mass measured via TTV (transit-timing variations). JWST characterizing atmospheres (b, c CO2-thin 2023-2024). Trade-off: M dwarfs have strong flares that can sterilize.'
        objectives: [TRAPPIST-1]
      - type: choice
        difficulty: 5
        question:
          pt: 'Tardígrados são astrobiológicamente interessantes por…'
          en: 'Tardigrades are astrobiologically interesting because they…'
        choices:
          - 'Sobreviverem vácuo, radiação, dessecação extrema via criptobiose com proteínas TDPs/CAHS'
          - 'Reproduzirem-se em vácuo'
          - 'Originarem-se em meteoritos'
          - 'Substituírem necessidade de água'
        correctAnswer: 'Sobreviverem vácuo, radiação, dessecação extrema via criptobiose com proteínas TDPs/CAHS'
        rationale:
          pt: 'Tardigrados (Hypsibius, Ramazzottius) entram em "tun" estado anidrobiótico — desidratação ~3% água, metabolismo ~0. Sobrevivem 10 dias em vácuo (Jönsson 2008 ESA), -200°C, 1000 Gy radiação. Mecanismo: trealose, proteínas IDP TDP (tardigrade-specific intrinsically disordered) que vitrificam citoplasma. Modelo de extremofilia.'
          en: 'Tardigrades (Hypsibius, Ramazzottius) enter "tun" anhydrobiotic state — dehydration ~3% water, metabolism ~0. Survive 10 days in vacuum (Jönsson 2008 ESA), -200°C, 1000 Gy radiation. Mechanism: trehalose, intrinsically disordered TDP proteins (tardigrade-specific) that vitrify cytoplasm. Extremophily model.'
        objectives: [Tardígrados]
      - type: choice
        difficulty: 5
        question:
          pt: 'Deinococcus radiodurans é "campeão de radiação" sobrevivendo a…'
          en: 'Deinococcus radiodurans is the "radiation champion" surviving…'
        choices:
          - '10 kGy de radiação ionizante via reparo eficiente de DNA fragmentado'
          - 'Apenas 1 Gy como qualquer organismo'
          - '1000 kGy sem qualquer dano'
          - 'Apenas radiação UV específica'
        correctAnswer: '10 kGy de radiação ionizante via reparo eficiente de DNA fragmentado'
        rationale:
          pt: 'D. radiodurans (Anderson 1956 fonte de carne irradiada): sobrevive 5-10 kGy (humano fatal a ~5 Gy). Mecanismo: genoma fragmentado em 100s pedaços, reúne via Mn-protected protein complexes, RecA, Pol — reconstrução em horas. Citosol concentra Mn²⁺/PO4 que protege proteínas contra ROS. Modelo astrobio + biotech.'
          en: 'D. radiodurans (Anderson 1956, irradiated meat source): survives 5-10 kGy (human fatal at ~5 Gy). Mechanism: genome fragmented into 100s of pieces, reassembles via Mn-protected protein complexes, RecA, Pol — rebuilt in hours. Cytosol concentrates Mn²⁺/PO4 protecting proteins against ROS. Astrobio + biotech model.'
        objectives: [Deinococcus]
      - type: choice
        difficulty: 5
        question:
          pt: 'Hyperthermofile descoberto em Yellowstone por Thomas Brock 1969 inaugurou…'
          en: 'A hyperthermophile discovered in Yellowstone by Thomas Brock in 1969 inaugurated…'
        choices:
          - 'Era de extremófilos: Thermus aquaticus → Taq polimerase → PCR (Mullis 1983 Nobel)'
          - 'Substituição completa de E. coli em laboratórios'
          - 'Apenas curiosidade sem aplicação'
          - 'Apenas vivem em Yellowstone'
        correctAnswer: 'Era de extremófilos: Thermus aquaticus → Taq polimerase → PCR (Mullis 1983 Nobel)'
        rationale:
          pt: 'Brock isolou Thermus aquaticus de fontes termais Yellowstone (~70°C). Sua DNA polimerase (Taq) é termoestável; permite ciclos PCR sem reposição. Mullis (Cetus, 1983) inventou PCR usando Taq → Nobel Química 1993. Cadeia: extremófilo → enzima → tecnologia. Análoga: Thermococcus litoralis → Vent. Crescente impacto em medicina/forense.'
          en: 'Brock isolated Thermus aquaticus from Yellowstone hot springs (~70°C). Its DNA polymerase (Taq) is thermostable; allows PCR cycles without replenishment. Mullis (Cetus, 1983) invented PCR using Taq → 1993 Chemistry Nobel. Chain: extremophile → enzyme → technology. Analogous: Thermococcus litoralis → Vent. Growing impact in medicine/forensics.'
        objectives: [Thermus aquaticus]
  - title:
      pt: 'Página 2 — Missões e perspectivas'
      en: 'Page 2 — Missions and outlook'
    exercises:
      - type: choice
        difficulty: 5
        question:
          pt: 'Europa Clipper (NASA, lançamento out/2024) chegará a Júpiter em 2030 para investigar…'
          en: 'Europa Clipper (NASA, launched Oct 2024) will reach Jupiter in 2030 to investigate…'
        choices:
          - 'Habitabilidade de oceano subglacial em Europa via flybys (~50 sobrevoos)'
          - 'Pouso direto na superfície de Europa'
          - 'Coleta de amostras retornadas para Terra'
          - 'Substituição da missão a Marte'
        correctAnswer: 'Habitabilidade de oceano subglacial em Europa via flybys (~50 sobrevoos)'
        rationale:
          pt: 'Europa Clipper: 9 instrumentos (radar de gelo REASON, espectrômetros UVS/MISE, magnetometro ICEMAG, mass spec MASPEX, dust analyser SUDA). Voa por Europa ~50 vezes amostrando plumas (se ativas) e atmosfera. Ocean ~100 km de profundidade abaixo de gelo ~25 km. Programa: 2030 chegada, missão até 2034.'
          en: 'Europa Clipper: 9 instruments (ice radar REASON, UVS/MISE spectrometers, ICEMAG magnetometer, MASPEX mass spec, SUDA dust analyzer). Flies by Europa ~50 times sampling plumes (if active) and atmosphere. ~100 km deep ocean beneath ~25 km of ice. Schedule: 2030 arrival, mission until 2034.'
        objectives: [Europa Clipper]
      - type: choice
        difficulty: 5
        question:
          pt: 'Perclorato em solo Marciano (detectado por Phoenix 2008, Curiosity) é desafio para vida porque…'
          en: 'Perchlorate in Martian soil (detected by Phoenix 2008, Curiosity) is a challenge for life because…'
        choices:
          - 'Tóxico em concentrações altas mas pode ser abundante em água salgada (brines RSL)'
          - 'Promove vida diretamente'
          - 'Não tem qualquer efeito biológico'
          - 'Apenas em poles sem qualquer relevância tropical'
        correctAnswer: 'Tóxico em concentrações altas mas pode ser abundante em água salgada (brines RSL)'
        rationale:
          pt: 'Phoenix lander (Polo Norte 2008) e Curiosity detectaram percloratos (~0.5%) em solo Marciano. Toxicidade dependente: alta para muitos organismos, mas algumas archaea perclorato-respiradoras (Haloferax, Desulfotomaculum) toleram. Brines com Mg(ClO4)2 podem ter ponto de fusão -70°C — permite água líquida transitória nas RSL (Recurring Slope Lineae).'
          en: 'Phoenix lander (North Pole 2008) and Curiosity detected perchlorates (~0.5%) in Martian soil. Toxicity is context-dependent: high for many organisms, but some perchlorate-respiring archaea (Haloferax, Desulfotomaculum) tolerate. Brines with Mg(ClO4)2 can have melting point -70°C — allowing transient liquid water in RSL (Recurring Slope Lineae).'
        objectives: [Perclorato]
      - type: choice
        difficulty: 5
        question:
          pt: 'O conceito de "Great Filter" (Robin Hanson) propõe que…'
          en: 'The "Great Filter" (Robin Hanson) proposes that…'
        choices:
          - 'Existe(m) barreira(s) entre química prebiótica e civilização galática que filtra(m) maioria; questão é se já passamos'
          - 'Não há qualquer obstáculo à evolução'
          - 'Vida é universal sem qualquer filtro'
          - 'Apenas filosofia sem qualquer relevância científica'
        correctAnswer: 'Existe(m) barreira(s) entre química prebiótica e civilização galática que filtra(m) maioria; questão é se já passamos'
        rationale:
          pt: 'Hanson (1996): o Paradoxo de Fermi ("onde está todo mundo?") sugere filtro. Possíveis: abiogênese, eucariogênese, multicelularidade, inteligência tecnológica, autodestruição (nuclear, AI). Se filtro está atrás, futuro promissor; se à frente, sombrio. Buscar microbios em outros mundos clarifica.'
          en: 'Hanson (1996): Fermi paradox ("where is everyone?") suggests a filter. Possibilities: abiogenesis, eukaryogenesis, multicellularity, technological intelligence, self-destruction (nuclear, AI). If filter behind us, future promising; if ahead, grim. Searching for microbes elsewhere clarifies.'
        objectives: [Great Filter]
      - type: choice
        difficulty: 5
        question:
          pt: 'A "Snowball Earth" hypothesis (Hoffman/Schrag 1998) postula que a Terra…'
          en: '"Snowball Earth" hypothesis (Hoffman/Schrag 1998) posits that Earth…'
        choices:
          - 'Foi totalmente coberta de gelo ~720 e 635 Mya (Cryogenian); explica mudanças isotópicas e BIFs'
          - 'Nunca teve qualquer glaciação global'
          - 'Sempre foi tropical sem qualquer extremo'
          - 'Apenas Marte teve glaciação'
        correctAnswer: 'Foi totalmente coberta de gelo ~720 e 635 Mya (Cryogenian); explica mudanças isotópicas e BIFs'
        rationale:
          pt: 'Hoffman/Schrag (Science 1998) argumentaram para 2 episódios "snowball" no Cryogenian (Sturtian e Marinoan), com gelo equatorial. Saída via efeito estufa CO2 vulcânico acumulado. Possível catalisador da explosão de Ediacaran/Cambrian que veio depois. Debate ativo: "slushball" alternativa (gelo parcial).'
          en: 'Hoffman/Schrag (Science 1998) argued for 2 "snowball" episodes in Cryogenian (Sturtian and Marinoan), with equatorial ice. Exit via CO2 greenhouse from accumulated volcanism. Possible catalyst for the Ediacaran/Cambrian explosion that followed. Active debate: "slushball" alternative (partial ice).'
        objectives: [Snowball Earth]
      - type: choice
        difficulty: 5
        question:
          pt: 'O conceito de "Anthropocene" (Crutzen 2000) propõe…'
          en: '"Anthropocene" (Crutzen 2000) proposes…'
        choices:
          - 'Nova época geológica iniciada por impactos humanos globais (Industrial, ou pós-1950 Great Acceleration)'
          - 'Apenas conceito filosófico sem geologia'
          - 'Substituição completa do Cenozoic'
          - 'Restrito ao Holoceno'
        correctAnswer: 'Nova época geológica iniciada por impactos humanos globais (Industrial, ou pós-1950 Great Acceleration)'
        rationale:
          pt: 'Crutzen (Nature 2002): após 11700 anos de Holocene, humanos modificaram tanto a Terra que define nova época. Marker proposta: 1950 (radioisotopes nuclear, Great Acceleration). International Commission on Stratigraphy votou contra formalização (mar/2024), mas conceito é amplamente aceito informalmente.'
          en: 'Crutzen (Nature 2002): after 11,700 years of Holocene, humans have modified Earth so much it defines a new epoch. Proposed marker: 1950 (nuclear radioisotopes, Great Acceleration). International Commission on Stratigraphy voted against formalization (Mar 2024), but concept is widely accepted informally.'
        objectives: [Anthropocene]
      - type: choice
        difficulty: 5
        question:
          pt: 'A hipótese "weak anthropic principle" em cosmologia astrobiológica é…'
          en: 'The "weak anthropic principle" in astrobiological cosmology is…'
        choices:
          - 'Universo deve ter parâmetros que permitem observadores; Earth-like rare ou não, somos prova'
          - 'Universo deve ser simétrico exatamente'
          - 'Apenas humanos podem existir'
          - 'Universo é infinito sem qualquer restrição'
        correctAnswer: 'Universo deve ter parâmetros que permitem observadores; Earth-like rare ou não, somos prova'
        rationale:
          pt: 'Carter (1973): observamos universo compatível conosco — não tautologia, mas restrição. Versão fraca: dada nossa existência, parâmetros ajustam. Versão forte: universo necessariamente permite observadores (controvertida). Usado em discussões de Drake, Carter Doomsday argument, multiverso.'
          en: 'Carter (1973): we observe a universe compatible with us — not tautology, but constraint. Weak version: given our existence, parameters fit. Strong version: universe necessarily permits observers (controversial). Used in Drake, Carter Doomsday argument, multiverse discussions.'
        objectives: [Anthropic principle]
      - type: choice
        difficulty: 5
        question:
          pt: 'Recente reanálise sugere abundância de planetas Earth-like (η⊕) na Via Láctea de…'
          en: 'Recent reanalysis suggests Earth-like planet abundance (η⊕) in Milky Way of…'
        choices:
          - '0.1-0.5 por estrela tipo solar, ~bilhões de candidatos potenciais'
          - 'Apenas 1 em todo Universo'
          - 'Zero, fora da Terra'
          - 'Mais que estrelas (impossível)'
        correctAnswer: '0.1-0.5 por estrela tipo solar, ~bilhões de candidatos potenciais'
        rationale:
          pt: 'η⊕ (Bryson 2021 NASA) baseado em Kepler: ~0.4 ETP (Earth-like terrestrial planets) por estrela tipo G no HZ. Galáxia tem ~10⁹ estrelas G → ~10⁸-10⁹ candidatos. Estimativas variam: anãs M expandem (mais comuns), mas habitabilidade complexa pelos flares.'
          en: 'η⊕ (Bryson 2021 NASA) based on Kepler: ~0.4 ETP (Earth-like terrestrial planets) per G-type star in HZ. Galaxy has ~10⁹ G stars → ~10⁸-10⁹ candidates. Estimates vary: M dwarfs expand (more common), but habitability complex due to flares.'
        objectives: [η⊕]
      - type: choice
        difficulty: 5
        question:
          pt: 'O conceito "technosignatures" (Wright/Sagan/Tarter) estende biossinaturas para…'
          en: '"Technosignatures" (Wright/Sagan/Tarter) extend biosignatures to…'
        choices:
          - 'Sinais de tecnologia (radio, laser, megastruturas Dyson, poluentes industriais) detectáveis'
          - 'Apenas sinais astrofísicos sem tecnologia'
          - 'Apenas vida microbiana'
          - 'Apenas em Sistema Solar'
        correctAnswer: 'Sinais de tecnologia (radio, laser, megastruturas Dyson, poluentes industriais) detectáveis'
        rationale:
          pt: 'Tecnosinaturas: emissões deliberadas (radio SETI, laser optical SETI), passivas (clorofluorcarbonetos, NO2 industrial em atmosfera), megastruturas (Dyson sphere infravermelho excessivo). KIC 8462852 ("Tabby''s Star") despertou especulação Dyson 2015 (depois explicado por nuvem de poeira). Frente expande SETI clássico.'
          en: 'Technosignatures: deliberate emissions (radio SETI, optical laser SETI), passive (CFCs, industrial NO2 in atmosphere), megastructures (Dyson sphere via excess IR). KIC 8462852 ("Tabby''s Star") sparked Dyson speculation 2015 (later explained by dust cloud). Frontier expands classical SETI.'
        objectives: [Technosignatures]
      - type: choice
        difficulty: 5
        question:
