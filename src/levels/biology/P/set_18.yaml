        correctAnswer: 'IgG, IgA, IgE de IgM via deleção de Sμ-Sx switch regions, alterando função efetora'
        rationale:
          pt: 'AID (Activation-Induced Deaminase, Honjo Nobel 2018): deamina C → U em Sμ regions, induzindo DSBs → recombinação que substitui Cμ por Cγ/α/ε. Resulta em IgG (FcγR), IgA (mucosa), IgE (alérgico). Mantém VDJ specificity. Falhas: Hyper-IgM syndrome (mutações AID, CD40L, CD40). Vacinação induce CSR via TFH-help.'
          en: 'AID (Activation-Induced Deaminase, Honjo 2018 Nobel): deaminates C → U in Sμ regions, inducing DSBs → recombination replacing Cμ with Cγ/α/ε. Results in IgG (FcγR), IgA (mucosa), IgE (allergic). Preserves VDJ specificity. Failures: Hyper-IgM syndrome (AID, CD40L, CD40 mutations). Vaccination induces CSR via TFH help.'
