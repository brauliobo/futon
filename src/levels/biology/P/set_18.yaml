          en: 'NetMHCpan (Nielsen, deep learning), MHCflurry (Park) predict peptide-HLA affinity. Pipeline: WES tumor → identify mutations → 9-mer peptides flanking → predict HLA binding → prioritize → mRNA encoding (Moderna, BioNTech). Ph2 results: KEYNOTE-942 melanoma, BNT122 pancreatic. Critique: real immunogenicity prediction still suboptimal.'
