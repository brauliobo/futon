title:
  pt: "🧯 Gene drives"
  en: "🧯 Gene drives"
level: 'D'
subject: biology
objectives: [biology.gene_drive]
difficulty: 5
authorNotes: "CRISPR gene drives, herança super-mendeliana, controle vetorial, contenção, ética."
example:
  pt: "Ex.: alelo com Cas9+gRNA → copia-se em ambos cromossomos → herança ~100% → espalha em população."
  en: "Ex.: allele with Cas9+gRNA → copies to both chromosomes → ~100% inheritance → spreads in population."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Mecanismos", en: "Mechanisms"}
    description: {pt: "Como gene drives funcionam.", en: "How gene drives work."}
    exercises:
      - type: choice
        question: {pt: "Conceito de gene drive:", en: "Gene drive concept:"}
        choices:
          - {pt: "Elemento genético que viola a herança mendeliana se copiando para ambos cromossomos", en: "Genetic element violating Mendelian inheritance by copying to both chromosomes"}
          - {pt: "Apenas mutação convencional", en: "Just conventional mutation"}
          - {pt: "Apenas herança recessiva", en: "Just recessive inheritance"}
          - {pt: "Apenas evento aleatório", en: "Just random event"}
        correctAnswer: {pt: "Elemento genético que viola a herança mendeliana se copiando para ambos cromossomos", en: "Genetic element violating Mendelian inheritance by copying to both chromosomes"}
        rationale: {pt: "Quando gene drive age, então alelo se espalha rapidamente mesmo sem vantagem de fitness.", en: "When gene drive acts, allele spreads rapidly even without fitness advantage."}
        objectives: [biology.gene_drive]
        difficulty: 5
      - type: choice
        question: {pt: "CRISPR-based drive (Cas9 + gRNA):", en: "CRISPR-based drive (Cas9 + gRNA):"}
        choices:
          - {pt: "Cas9 corta cromossomo homólogo selvagem; HDR copia o cassete para os dois alelos", en: "Cas9 cleaves wild homolog; HDR copies cassette to both alleles"}
          - {pt: "Apenas mutação espontânea", en: "Just spontaneous mutation"}
          - {pt: "Apenas seleção natural", en: "Just natural selection"}
          - {pt: "Apenas variação somática", en: "Just somatic variation"}
        correctAnswer: {pt: "Cas9 corta cromossomo homólogo selvagem; HDR copia o cassete para os dois alelos", en: "Cas9 cleaves wild homolog; HDR copies cassette to both alleles"}
        rationale: {pt: "Quando HDR é guiada, então conversão para drive ultrapassa 95% por geração.", en: "When HDR is guided, drive conversion exceeds 95% per generation."}
        objectives: [biology.gene_drive]
        difficulty: 5
      - type: choice
        question: {pt: "Suppression drive:", en: "Suppression drive:"}
        choices:
          - {pt: "Visa colapsar populações de vetores como Anopheles ao quebrar genes de fertilidade feminina", en: "Aims to collapse vector populations like Anopheles by breaking female fertility genes"}
          - {pt: "Apenas inseticida químico", en: "Just chemical insecticide"}
          - {pt: "Apenas armadilha física", en: "Just physical trap"}
          - {pt: "Apenas barreira ambiental", en: "Just environmental barrier"}
        correctAnswer: {pt: "Visa colapsar populações de vetores como Anopheles ao quebrar genes de fertilidade feminina", en: "Aims to collapse vector populations like Anopheles by breaking female fertility genes"}
        rationale: {pt: "Quando fertilidade colapsa, então transmissão de malária pode reduzir drasticamente.", en: "When fertility collapses, malaria transmission can drop drastically."}
        objectives: [biology.gene_drive]
        difficulty: 5
      - type: choice
        question: {pt: "Replacement drive:", en: "Replacement drive:"}
        choices:
          - {pt: "Substitui populações por variantes refratárias a patógeno mantendo número populacional", en: "Replaces populations with pathogen-refractory variants keeping population numbers"}
          - {pt: "Apenas extermínio total", en: "Just total extermination"}
          - {pt: "Apenas hibridização", en: "Just hybridization"}
          - {pt: "Apenas migração induzida", en: "Just induced migration"}
        correctAnswer: {pt: "Substitui populações por variantes refratárias a patógeno mantendo número populacional", en: "Replaces populations with pathogen-refractory variants keeping population numbers"}
        rationale: {pt: "Quando vetor não transmite, então doença para sem extinguir espécie.", en: "When vector cannot transmit, disease stops without species extinction."}
        objectives: [biology.gene_drive]
        difficulty: 5
      - type: choice
        question: {pt: "Resistência a drives:", en: "Drive resistance:"}
        choices:
          - {pt: "NHEJ gera alelos não-clivados que escapam — desafio principal de durabilidade", en: "NHEJ creates non-cleavable alleles that escape — main durability challenge"}
          - {pt: "Apenas tolerância imune", en: "Just immune tolerance"}
          - {pt: "Apenas adaptação comportamental", en: "Just behavioral adaptation"}
          - {pt: "Apenas migração geográfica", en: "Just geographic migration"}
        correctAnswer: {pt: "NHEJ gera alelos não-clivados que escapam — desafio principal de durabilidade", en: "NHEJ creates non-cleavable alleles that escape — main durability challenge"}
        rationale: {pt: "Quando resistência surge, então drive falha — designs multi-gRNA mitigam.", en: "When resistance emerges, drive fails — multi-gRNA designs mitigate."}
        objectives: [biology.gene_drive]
        difficulty: 5
      - type: choice
        question: {pt: "Daisy-chain drive:", en: "Daisy-chain drive:"}
        choices:
          - {pt: "Drive auto-limitante com elementos sequenciais que decaem ao longo de gerações", en: "Self-limiting drive with sequential elements that decay over generations"}
          - {pt: "Apenas drive permanente", en: "Just permanent drive"}
          - {pt: "Apenas controle químico", en: "Just chemical control"}
          - {pt: "Apenas predação biológica", en: "Just biological predation"}
        correctAnswer: {pt: "Drive auto-limitante com elementos sequenciais que decaem ao longo de gerações", en: "Self-limiting drive with sequential elements that decay over generations"}
        rationale: {pt: "Quando drive decai, então contenção espacial é alcançada por design.", en: "When drive decays, spatial containment is achieved by design."}
        objectives: [biology.gene_drive]
        difficulty: 5
      - type: choice
        question: {pt: "Threshold drive:", en: "Threshold drive:"}
        choices:
          - {pt: "Espalha apenas se introduzido acima de frequência crítica — auto-contém em populações pequenas", en: "Spreads only if introduced above critical frequency — self-contains in small populations"}
          - {pt: "Apenas todos os ambientes", en: "Just all environments"}
          - {pt: "Apenas barreira química", en: "Just chemical barrier"}
          - {pt: "Apenas migração natural", en: "Just natural migration"}
        correctAnswer: {pt: "Espalha apenas se introduzido acima de frequência crítica — auto-contém em populações pequenas", en: "Spreads only if introduced above critical frequency — self-contains in small populations"}
        rationale: {pt: "Quando há limiar, então invasão acidental de populações vizinhas é improvável.", en: "When threshold exists, accidental neighbor-population invasion is unlikely."}
        objectives: [biology.gene_drive]
        difficulty: 5
      - type: choice
        question: {pt: "Reversal drive:", en: "Reversal drive:"}
        choices:
          - {pt: "Segundo drive para reverter modificação caso ocorra problema imprevisto", en: "Secondary drive to reverse modification if unexpected issue occurs"}
          - {pt: "Apenas vacina genérica", en: "Just generic vaccine"}
          - {pt: "Apenas remediação química", en: "Just chemical remediation"}
          - {pt: "Apenas observação passiva", en: "Just passive observation"}
        correctAnswer: {pt: "Segundo drive para reverter modificação caso ocorra problema imprevisto", en: "Secondary drive to reverse modification if unexpected issue occurs"}
        rationale: {pt: "Quando reversão é possível, então segurança regulatória aumenta.", en: "When reversal is possible, regulatory safety increases."}
        objectives: [biology.gene_drive]
        difficulty: 5
      - type: choice
        question: {pt: "Modelagem populacional:", en: "Population modeling:"}
        choices:
          - {pt: "Simulações estocásticas predizem dinâmica de drive em redes ecológicas heterogêneas", en: "Stochastic simulations predict drive dynamics in heterogeneous ecological networks"}
          - {pt: "Apenas observação anedótica", en: "Just anecdotal observation"}
          - {pt: "Apenas senso comum", en: "Just common sense"}
          - {pt: "Apenas extrapolação linear", en: "Just linear extrapolation"}
        correctAnswer: {pt: "Simulações estocásticas predizem dinâmica de drive em redes ecológicas heterogêneas", en: "Stochastic simulations predict drive dynamics in heterogeneous ecological networks"}
        rationale: {pt: "Quando modelos preveem, então liberações são planejadas com mais segurança.", en: "When models predict, releases are planned more safely."}
        objectives: [biology.gene_drive]
        difficulty: 5
      - type: choice
        question: {pt: "Transgênese passiva (Wolbachia):", en: "Passive transgenesis (Wolbachia):"}
        choices:
          - {pt: "Bactéria endossimbionte que reduz transmissão de dengue/Zika sem edição genômica", en: "Endosymbiotic bacterium reducing dengue/Zika transmission without genome editing"}
          - {pt: "Apenas inseticida convencional", en: "Just conventional insecticide"}
          - {pt: "Apenas vacina humana", en: "Just human vaccine"}
          - {pt: "Apenas controle ambiental", en: "Just environmental control"}
        correctAnswer: {pt: "Bactéria endossimbionte que reduz transmissão de dengue/Zika sem edição genômica", en: "Endosymbiotic bacterium reducing dengue/Zika transmission without genome editing"}
        rationale: {pt: "Quando Wolbachia é estabelecida, então arboviroses caem sem CRISPR.", en: "When Wolbachia establishes, arbovirus disease drops without CRISPR."}
        objectives: [biology.gene_drive]
        difficulty: 5
  - pageNumber: 2
    title: {pt: "Aplicação e ética", en: "Application and ethics"}
    description: {pt: "Riscos e governança.", en: "Risks and governance."}
    exercises:
      - type: choice
        question: {pt: "Anopheles e malária:", en: "Anopheles and malaria:"}
