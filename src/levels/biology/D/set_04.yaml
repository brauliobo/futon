          - {pt: "Apenas testes de campo abertos", en: "Just open field tests"}
          - {pt: "Apenas modelos teóricos", en: "Just theoretical models"}
          - {pt: "Apenas observação passiva", en: "Just passive observation"}
        correctAnswer: {pt: "Drives anti-Anopheles em ensaios em laboratório com 100% supressão em condições gaiola", en: "Anti-Anopheles drives in lab trials with 100% suppression under cage conditions"}
        rationale: {pt: "Quando supressão é demonstrada, então saúde pública avalia tradeoffs.", en: "When suppression is shown, public health evaluates tradeoffs."}
