          - {pt: "Apenas via gustativa", en: "Just gustatory pathway"}
          - {pt: "Apenas canal cardíaco", en: "Just cardiac channel"}
        correctAnswer: {pt: "Canal ativado por capsaicina, calor (>43°C) e prótons — alvo analgésico", en: "Channel activated by capsaicin, heat (>43°C) and protons — analgesic target"}
        rationale: {pt: "Quando TRPV1 abre, então íons fluem despolarizando neurônio sensorial.", en: "When TRPV1 opens, ions flow depolarizing sensory neuron."}
        objectives: [biology.pain]
        difficulty: 5
      - type: choice
        question: {pt: "Fibras Aδ vs C:", en: "Aδ vs C fibers:"}
        choices:
          - {pt: "Aδ rápida (mielina) dor aguda; C lenta (amielínica) dor surda persistente", en: "Aδ fast (myelinated) sharp pain; C slow (unmyelinated) dull persistent pain"}
          - {pt: "Apenas tipos de músculo", en: "Just muscle types"}
          - {pt: "Apenas vasos linfáticos", en: "Just lymphatic vessels"}
          - {pt: "Apenas tipos de osso", en: "Just bone types"}
        correctAnswer: {pt: "Aδ rápida (mielina) dor aguda; C lenta (amielínica) dor surda persistente", en: "Aδ fast (myelinated) sharp pain; C slow (unmyelinated) dull persistent pain"}
        rationale: {pt: "Quando dois sistemas atuam, então primeira dor protege e segunda imobiliza.", en: "When two systems act, first pain protects and second immobilizes."}
        objectives: [biology.pain]
        difficulty: 5
