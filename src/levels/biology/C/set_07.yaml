title:
  pt: "🔥 Biologia da dor"
  en: "🔥 Pain biology"
level: 'C'
subject: biology
objectives: [biology.pain]
difficulty: 5
authorNotes: "Nociceptores, sensibilização central, modulação descendente, dor crônica, opioides."
example:
  pt: "Ex.: lesão tecidual → mediadores → nociceptor TRPV1 → corno dorsal → tálamo → córtex."
  en: "Ex.: tissue injury → mediators → TRPV1 nociceptor → dorsal horn → thalamus → cortex."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Nocicepção e sensibilização", en: "Nociception and sensitization"}
    description: {pt: "Como a dor se origina.", en: "How pain originates."}
    exercises:
      - type: choice
        question: {pt: "Nociceptor:", en: "Nociceptor:"}
        choices:
          - {pt: "Neurônio sensorial primário com terminais livres que detecta estímulos lesivos", en: "Primary sensory neuron with free endings detecting noxious stimuli"}
          - {pt: "Apenas sensor de pressão", en: "Just pressure sensor"}
          - {pt: "Apenas receptor de luz", en: "Just light receptor"}
          - {pt: "Apenas mecânico de equilíbrio", en: "Just balance mechanic"}
        correctAnswer: {pt: "Neurônio sensorial primário com terminais livres que detecta estímulos lesivos", en: "Primary sensory neuron with free endings detecting noxious stimuli"}
        rationale: {pt: "Quando dano ameaça tecido, então nociceptor sinaliza alerta protetivo.", en: "When tissue is threatened, nociceptor signals protective alert."}
        objectives: [biology.pain]
        difficulty: 5
      - type: choice
        question: {pt: "TRPV1:", en: "TRPV1:"}
        choices:
          - {pt: "Canal ativado por capsaicina, calor (>43°C) e prótons — alvo analgésico", en: "Channel activated by capsaicin, heat (>43°C) and protons — analgesic target"}
