          - {pt: "Slide-seq V2 é exclusivo a cérebro de zebrafish embrionário sem aplicação em tecidos adultos de mamíferos ou tumores humanos", en: "Slide-seq V2 is exclusive to embryonic zebrafish brain without application in adult mammalian tissue or human tumors"}
        correctAnswer: {pt: "Beads barcoded de 10µm em puck dão near-single-cell whole-transcriptome — preço/área baixo viabiliza atlas tecidual amplo", en: "10µm barcoded beads on puck give near-single-cell whole-transcriptome — low price/area enables broad tissue atlas"}
        rationale: {pt: "Quando bead é menor, então célula vira ponto único.", en: "When bead is smaller, cell becomes single point."}
        objectives: [biology.spatial_transcriptomics]
        difficulty: 5
