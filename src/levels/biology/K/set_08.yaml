    title: {pt: "Plataformas espaciais", en: "Spatial platforms"}
    description: {pt: "Como mapear RNA in situ.", en: "How to map RNA in situ."}
    exercises:
      - type: choice
        question: {pt: "10x Visium:", en: "10x Visium:"}
        choices:
          - {pt: "Capture array com spots de 55µm e ~1-10 células por spot mede whole-transcriptome — barcoded oligo-dT em vidro com tecido FFPE/fresh", en: "Capture array with 55µm spots and ~1-10 cells per spot measures whole-transcriptome — barcoded oligo-dT on glass with FFPE/fresh tissue"}
          - {pt: "Visium tem resolução subcelular de 1µm com transcriptoma single-cell direto sem necessidade de deconvolução computacional", en: "Visium has subcellular 1µm resolution with direct single-cell transcriptome and no computational deconvolution needed"}
          - {pt: "Plataforma de imagens fluorescentes target-based limitada a ~100 genes pré-selecionados sem captura whole-transcriptome", en: "Fluorescence imaging target-based platform limited to ~100 preselected genes without whole-transcriptome capture"}
          - {pt: "Visium é restrito a tecido líquido tumoral em suspensão com leitura via cytometry sem componente espacial preservado", en: "Visium is restricted to liquid tumor suspension read by cytometry with no preserved spatial component"}
