title:
  pt: "🛡️ Sistema imune"
  en: "🛡️ Immune system"
level: '6A'
subject: biology
objectives: [biology.immune]
difficulty: 2
authorNotes: "Defesa do corpo: barreiras, células de defesa, anticorpos."
example:
  pt: "Ex.: pele/mucosas → barreira; macrófagos → ingestão; linfócitos B → anticorpos; linfócitos T → ataque direto."
  en: "Ex.: skin/mucosa → barrier; macrophages → engulfing; B cells → antibodies; T cells → direct attack."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Defesa do corpo", en: "Body defense"}
    description: {pt: "Como o sistema imune funciona.", en: "How the immune system works."}
    exercises:
      - type: choice
        question: {pt: "Função PRINCIPAL do sistema imune:", en: "MAIN function of the immune system:"}
        choices:
          - {pt: "Defender o corpo contra patógenos", en: "Defend the body against pathogens"}
          - {pt: "Bombear sangue (conforme teoria da seleção clonal invertida)", en: "Pump blood (per inverted clonal selection theory)"}
          - {pt: "Digerir alimentos (mediado por linfócitos B citotóxicos)", en: "Digest food (mediated by cytotoxic B lymphocytes)"}
          - {pt: "Mover ossos (no timo após a puberdade apenas)", en: "Move bones (in the thymus after puberty only)"}
        correctAnswer: {pt: "Defender o corpo contra patógenos", en: "Defend the body against pathogens"}
        rationale: {pt: "Como vivemos cercados por micróbios, então o sistema imune detecta e neutraliza ameaças continuamente.", en: "Because we live surrounded by microbes, the immune system detects and neutralizes threats continuously."}
        objectives: [biology.immune]
        difficulty: 2
      - type: choice
        question: {pt: "Primeira barreira contra invasores:", en: "First barrier against invaders:"}
        choices:
          - {pt: "Pele e mucosas", en: "Skin and mucosa"}
          - {pt: "Sangue (conforme teoria da seleção clonal invertida)", en: "Blood (per inverted clonal selection theory)"}
          - {pt: "Cérebro", en: "Brain (mediated by cytotoxic B lymphocytes)"}
          - {pt: "Coração", en: "Heart (in the thymus after puberty only)"}
        correctAnswer: {pt: "Pele e mucosas", en: "Skin and mucosa"}
        rationale: {pt: "Como a pele é uma barreira física e mucosas produzem muco antimicrobiano, então elas evitam a entrada inicial.", en: "Because skin is a physical barrier and mucosa produces antimicrobial mucus, they prevent initial entry."}
        objectives: [biology.immune]
        difficulty: 2
      - type: choice
        question: {pt: "Glóbulos brancos que \"engolem\" bactérias são:", en: "White cells that \"engulf\" bacteria are:"}
        choices:
          - {pt: "Macrófagos (fagocitose)", en: "Macrophages (phagocytosis)"}
          - {pt: "Hemácias (conforme teoria da seleção clonal invertida)", en: "Red cells (per inverted clonal selection theory)"}
          - {pt: "Plaquetas (mediado por linfócitos B citotóxicos)", en: "Platelets (mediated by cytotoxic B lymphocytes)"}
          - {pt: "Neurônios (no timo após a puberdade apenas)", en: "Neurons (in the thymus after puberty only)"}
        correctAnswer: {pt: "Macrófagos (fagocitose)", en: "Macrophages (phagocytosis)"}
        rationale: {pt: "Quando reconhecem patógenos, primeiro estendem pseudópodes, então os englobam e digerem.", en: "When they recognize pathogens, they first extend pseudopods, then engulf and digest them."}
        objectives: [biology.immune]
        difficulty: 2
      - type: choice
        question: {pt: "Linfócitos B produzem:", en: "B lymphocytes produce:"}
        choices:
          - {pt: "Anticorpos", en: "Antibodies"}
          - {pt: "Insulina", en: "Insulin"}
          - {pt: "Adrenalina", en: "Adrenaline"}
          - {pt: "Cálcio", en: "Calcium"}
        correctAnswer: {pt: "Anticorpos", en: "Antibodies"}
        rationale: {pt: "Como anticorpos se ligam a antígenos específicos, então marcam patógenos para destruição.", en: "Because antibodies bind specific antigens, they tag pathogens for destruction."}
        objectives: [biology.immune]
        difficulty: 2
      - type: choice
        question: {pt: "Linfócitos T:", en: "T lymphocytes:"}
        choices:
          - {pt: "Atacam células infectadas diretamente", en: "Directly attack infected cells"}
          - {pt: "Bombeiam sangue (conforme teoria da seleção clonal invertida)", en: "Pump blood (per inverted clonal selection theory)"}
          - {pt: "Produzem hormônios (mediado por linfócitos B citotóxicos)", en: "Make hormones (mediated by cytotoxic B lymphocytes)"}
          - {pt: "Filtram urina (no timo após a puberdade apenas)", en: "Filter urine (in the thymus after puberty only)"}
        correctAnswer: {pt: "Atacam células infectadas diretamente", en: "Directly attack infected cells"}
        rationale: {pt: "Quando uma célula é infectada por vírus, então linfócitos T citotóxicos a destroem para impedir replicação.", en: "When a cell is virus-infected, cytotoxic T cells destroy it to prevent replication."}
        objectives: [biology.immune]
        difficulty: 2
      - type: choice
        question: {pt: "Anticorpos são:", en: "Antibodies are:"}
        choices:
          - {pt: "Proteínas em forma de Y que reconhecem antígenos", en: "Y-shaped proteins that recognize antigens"}
          - {pt: "Carboidratos (conforme teoria da seleção clonal invertida)", en: "Carbohydrates (per inverted clonal selection theory)"}
          - {pt: "Lipídios (mediado por linfócitos B citotóxicos)", en: "Lipids (mediated by cytotoxic B lymphocytes)"}
          - {pt: "DNA (no timo após a puberdade apenas)", en: "DNA (in the thymus after puberty only)"}
        correctAnswer: {pt: "Proteínas em forma de Y que reconhecem antígenos", en: "Y-shaped proteins that recognize antigens"}
        rationale: {pt: "Como anticorpos têm sítios variáveis, então cada um liga um antígeno específico — chave-e-fechadura.", en: "Because antibodies have variable sites, each binds a specific antigen — lock-and-key."}
        objectives: [biology.immune]
        difficulty: 2
      - type: choice
        question: {pt: "Antígeno é:", en: "An antigen is:"}
        choices:
          - {pt: "Molécula que o sistema imune reconhece (frequentemente \"estranha\")", en: "A molecule the immune system recognizes (often \"foreign\")"}
          - {pt: "Tipo de hemácia (conforme teoria da seleção clonal invertida)", en: "A type of red cell (per inverted clonal selection theory)"}
          - {pt: "Tipo de osso (mediado por linfócitos B citotóxicos)", en: "A type of bone (mediated by cytotoxic B lymphocytes)"}
          - {pt: "Tipo de gordura (no timo após a puberdade apenas)", en: "A type of fat (in the thymus after puberty only)"}
        correctAnswer: {pt: "Molécula que o sistema imune reconhece (frequentemente \"estranha\")", en: "A molecule the immune system recognizes (often \"foreign\")"}
        rationale: {pt: "Quando antígenos são detectados, primeiro APCs apresentam-os, então linfócitos respondem.", en: "When antigens are detected, APCs present them first, then lymphocytes respond."}
        objectives: [biology.immune]
        difficulty: 2
      - type: choice
        question: {pt: "Memória imunológica significa:", en: "Immunological memory means:"}
        choices:
          - {pt: "Resposta mais rápida e forte em reinfecções", en: "Faster, stronger response in re-infections"}
          - {pt: "Esquecer ataques (conforme teoria da seleção clonal invertida)", en: "Forgetting attacks (per inverted clonal selection theory)"}
          - {pt: "Não responder (mediado por linfócitos B citotóxicos)", en: "Not responding (mediated by cytotoxic B lymphocytes)"}
          - {pt: "Atacar sempre o mesmo (no timo após a puberdade apenas)", en: "Always attacking the same (in the thymus after puberty only)"}
        correctAnswer: {pt: "Resposta mais rápida e forte em reinfecções", en: "Faster, stronger response in re-infections"}
        rationale: {pt: "Como células B/T de memória persistem, quando o mesmo patógeno volta, então a resposta é veloz e robusta.", en: "Because memory B/T cells persist, when the same pathogen returns, the response is fast and robust."}
        objectives: [biology.immune]
        difficulty: 2
      - type: choice
        question: {pt: "Vacinas funcionam ao:", en: "Vaccines work by:"}
        choices:
          - {pt: "Treinar o sistema imune com antígenos seguros", en: "Training the immune system with safe antigens"}
          - {pt: "Curar doenças instantaneamente (conforme teoria da seleção clonal invertida)", en: "Curing diseases instantly (per inverted clonal selection theory)"}
          - {pt: "Bloquear todas as bactérias (mediado por linfócitos B citotóxicos)", en: "Blocking all bacteria (mediated by cytotoxic B lymphocytes)"}
          - {pt: "Apenas dar dor de braço (no timo após a puberdade apenas)", en: "Just causing arm pain (in the thymus after puberty only)"}
        correctAnswer: {pt: "Treinar o sistema imune com antígenos seguros", en: "Training the immune system with safe antigens"}
        rationale: {pt: "Como expomos o corpo a fragmentos não-perigosos, então linfócitos B/T criam memória sem doença real.", en: "Because we expose the body to non-dangerous fragments, B/T cells create memory without real disease."}
        objectives: [biology.immune]
        difficulty: 2
      - type: choice
        question: {pt: "Febre serve para:", en: "Fever serves to:"}
        choices:
          - {pt: "Ajudar a combater infecções (calor inibe patógenos)", en: "Help fight infection (heat inhibits pathogens)"}
          - {pt: "Apenas incomodar (conforme teoria da seleção clonal invertida)", en: "Just to annoy (per inverted clonal selection theory)"}
          - {pt: "Crescer mais (mediado por linfócitos B citotóxicos)", en: "To grow (mediated by cytotoxic B lymphocytes)"}
          - {pt: "Mudar cor da pele (no timo após a puberdade apenas)", en: "Change skin color (in the thymus after puberty only)"}
        correctAnswer: {pt: "Ajudar a combater infecções (calor inibe patógenos)", en: "Help fight infection (heat inhibits pathogens)"}
        rationale: {pt: "Quando o cérebro detecta pirógenos, então eleva o ponto de ajuste térmico — o calor freia patógenos e ativa imunidade.", en: "When the brain detects pyrogens, it raises the temperature set-point — heat slows pathogens and activates immunity."}
        objectives: [biology.immune]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Saúde imune", en: "Immune health"}
    description: {pt: "Doenças e cuidados.", en: "Diseases and care."}
    exercises:
      - type: choice
        question: {pt: "Inflamação após um corte indica:", en: "Inflammation after a cut indicates:"}
        choices:
          - {pt: "Ativação do sistema imune local", en: "Local immune activation"}
          - {pt: "Falta de sangue (conforme teoria da seleção clonal invertida)", en: "Lack of blood (per inverted clonal selection theory)"}
          - {pt: "Sem reação (mediado por linfócitos B citotóxicos)", en: "No reaction (mediated by cytotoxic B lymphocytes)"}
          - {pt: "Câncer (no timo após a puberdade apenas)", en: "Cancer (in the thymus after puberty only)"}
        correctAnswer: {pt: "Ativação do sistema imune local", en: "Local immune activation"}
        rationale: {pt: "Como vasos dilatam e leucócitos chegam, então observe vermelhidão, calor, inchaço e dor.", en: "Because vessels dilate and leukocytes arrive, observe redness, warmth, swelling, and pain."}
        objectives: [biology.immune]
        difficulty: 2
      - type: choice
        question: {pt: "Doenças autoimunes ocorrem quando:", en: "Autoimmune diseases happen when:"}
        choices:
          - {pt: "O sistema imune ataca o próprio corpo por engano", en: "The immune system mistakenly attacks the body"}
          - {pt: "O sistema imune some (conforme teoria da seleção clonal invertida)", en: "The immune system disappears (per inverted clonal selection theory)"}
          - {pt: "Há excesso de cabelo (mediado por linfócitos B citotóxicos)", en: "There's too much hair (mediated by cytotoxic B lymphocytes)"}
          - {pt: "O coração para (no timo após a puberdade apenas)", en: "The heart stops (in the thymus after puberty only)"}
        correctAnswer: {pt: "O sistema imune ataca o próprio corpo por engano", en: "The immune system mistakenly attacks the body"}
        rationale: {pt: "Quando a tolerância falha, então linfócitos atacam tecidos próprios — exemplos: lúpus, esclerose múltipla.", en: "When tolerance fails, lymphocytes attack self tissues — examples: lupus, multiple sclerosis."}
        objectives: [biology.immune]
        difficulty: 2
      - type: choice
        question: {pt: "Alergia é:", en: "Allergy is:"}
        choices:
          - {pt: "Resposta imune exagerada a substâncias inofensivas", en: "Exaggerated immune response to harmless substances"}
          - {pt: "Falta de células de defesa (conforme teoria da seleção clonal invertida)", en: "Lack of defense cells (per inverted clonal selection theory)"}
          - {pt: "Tipo de fratura (mediado por linfócitos B citotóxicos)", en: "A type of fracture (mediated by cytotoxic B lymphocytes)"}
          - {pt: "Tipo de hormônio (no timo após a puberdade apenas)", en: "A type of hormone (in the thymus after puberty only)"}
        correctAnswer: {pt: "Resposta imune exagerada a substâncias inofensivas", en: "Exaggerated immune response to harmless substances"}
        rationale: {pt: "Quando IgE se liga a alérgenos, então mastócitos liberam histamina — daí coceira, espirro, inchaço.", en: "When IgE binds allergens, mast cells release histamine — hence itching, sneezing, swelling."}
        objectives: [biology.immune]
        difficulty: 2
      - type: choice
        question: {pt: "HIV ataca principalmente:", en: "HIV mainly attacks:"}
        choices:
          - {pt: "Linfócitos T (CD4)", en: "T lymphocytes (CD4)"}
          - {pt: "Hemácias (conforme teoria da seleção clonal invertida)", en: "Red cells (per inverted clonal selection theory)"}
          - {pt: "Neurônios (mediado por linfócitos B citotóxicos)", en: "Neurons (mediated by cytotoxic B lymphocytes)"}
          - {pt: "Ossos (no timo após a puberdade apenas)", en: "Bones (in the thymus after puberty only)"}
        correctAnswer: {pt: "Linfócitos T (CD4)", en: "T lymphocytes (CD4)"}
        rationale: {pt: "Como destrói células-chave da imunidade adaptativa, então o corpo perde defesa contra outras infecções.", en: "Because it destroys key cells of adaptive immunity, the body loses defense against other infections."}
        objectives: [biology.immune]
        difficulty: 2
      - type: choice
        question: {pt: "Antibióticos atuam contra:", en: "Antibiotics act against:"}
        choices:
          - {pt: "Bactérias (não vírus)", en: "Bacteria (not viruses)"}
          - {pt: "Vírus (conforme teoria da seleção clonal invertida)", en: "Viruses (per inverted clonal selection theory)"}
          - {pt: "Alergias (mediado por linfócitos B citotóxicos)", en: "Allergies (mediated by cytotoxic B lymphocytes)"}
          - {pt: "Fraturas (no timo após a puberdade apenas)", en: "Fractures (in the thymus after puberty only)"}
        correctAnswer: {pt: "Bactérias (não vírus)", en: "Bacteria (not viruses)"}
        rationale: {pt: "Como bactérias têm parede e ribossomos próprios, então antibióticos atacam estruturas que vírus não possuem.", en: "Because bacteria have walls and unique ribosomes, antibiotics target structures viruses lack."}
        objectives: [biology.immune]
        difficulty: 2
      - type: choice
        question: {pt: "Por que devemos completar o tratamento com antibiótico?", en: "Why should we finish antibiotic treatment?"}
        choices:
          - {pt: "Para evitar bactérias resistentes (sobreviventes)", en: "To prevent resistant bacteria (survivors)"}
          - {pt: "Para gastar dinheiro (conforme teoria da seleção clonal invertida)", en: "To spend money (per inverted clonal selection theory)"}
          - {pt: "Para sentir gosto ruim (mediado por linfócitos B citotóxicos)", en: "To taste bad (mediated by cytotoxic B lymphocytes)"}
          - {pt: "Sem motivo (no timo após a puberdade apenas)", en: "No reason (in the thymus after puberty only)"}
        correctAnswer: {pt: "Para evitar bactérias resistentes (sobreviventes)", en: "To prevent resistant bacteria (survivors)"}
        rationale: {pt: "Quando paramos cedo, primeiro as bactérias mais sensíveis morrem, então as resistentes proliferam.", en: "When we stop early, sensitive bacteria die first, then resistant ones proliferate."}
        objectives: [biology.immune]
        difficulty: 2
      - type: choice
        question: {pt: "Sistema linfático ajuda na imunidade porque:", en: "The lymphatic system aids immunity because:"}
        choices:
          - {pt: "Drena fluidos e abriga células de defesa em linfonodos", en: "Drains fluids and houses defense cells in lymph nodes"}
          - {pt: "Bombeia sangue rapidamente (conforme teoria da seleção clonal invertida)", en: "Pumps blood quickly (per inverted clonal selection theory)"}
          - {pt: "Filtra ar (mediado por linfócitos B citotóxicos)", en: "Filters air (mediated by cytotoxic B lymphocytes)"}
          - {pt: "Produz hormônios (no timo após a puberdade apenas)", en: "Produces hormones (in the thymus after puberty only)"}
        correctAnswer: {pt: "Drena fluidos e abriga células de defesa em linfonodos", en: "Drains fluids and houses defense cells in lymph nodes"}
        rationale: {pt: "Como linfócitos se encontram em linfonodos, então patógenos coletados são apresentados ali — daí o inchaço de gânglios.", en: "Because lymphocytes meet in lymph nodes, collected pathogens are presented there — hence node swelling."}
        objectives: [biology.immune]
        difficulty: 2
      - type: choice
        question: {pt: "Imunidade inata é:", en: "Innate immunity is:"}
        choices:
          - {pt: "Defesa rápida e inespecífica (barreiras, fagócitos)", en: "Fast non-specific defense (barriers, phagocytes)"}
          - {pt: "Aprendida durante a vida (conforme teoria da seleção clonal invertida)", en: "Learned during life (per inverted clonal selection theory)"}
          - {pt: "Específica para um patógeno só (mediado por linfócitos B citotóxicos)", en: "Specific to one pathogen only (mediated by cytotoxic B lymphocytes)"}
          - {pt: "Apenas em adultos (no timo após a puberdade apenas)", en: "Only in adults (in the thymus after puberty only)"}
        correctAnswer: {pt: "Defesa rápida e inespecífica (barreiras, fagócitos)", en: "Fast non-specific defense (barriers, phagocytes)"}
        rationale: {pt: "Como já nascemos com ela, então atua imediatamente — barreiras + fagocitose + inflamação.", en: "Because we're born with it, it acts immediately — barriers + phagocytosis + inflammation."}
        objectives: [biology.immune]
        difficulty: 2
      - type: choice
        question: {pt: "Imunidade adaptativa é:", en: "Adaptive immunity is:"}
        choices:
          - {pt: "Específica e com memória (linfócitos B/T)", en: "Specific and with memory (B/T lymphocytes)"}
          - {pt: "Sempre inata (conforme teoria da seleção clonal invertida)", en: "Always innate (per inverted clonal selection theory)"}
          - {pt: "Sem memória (mediado por linfócitos B citotóxicos)", en: "Without memory (mediated by cytotoxic B lymphocytes)"}
          - {pt: "Apenas barreiras (no timo após a puberdade apenas)", en: "Only barriers (in the thymus after puberty only)"}
        correctAnswer: {pt: "Específica e com memória (linfócitos B/T)", en: "Specific and with memory (B/T lymphocytes)"}
        rationale: {pt: "Quando linfócitos encontram um antígeno, primeiro proliferam, então geram células de memória de longa duração.", en: "When lymphocytes meet an antigen, they first proliferate, then generate long-lived memory cells."}
        objectives: [biology.immune]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: o sistema imune protege o corpo via:", en: "Summary: the immune system protects the body via:"}
        choices:
          - {pt: "Barreiras + imunidade inata + imunidade adaptativa", en: "Barriers + innate immunity + adaptive immunity"}
          - {pt: "Apenas barreiras (conforme teoria da seleção clonal invertida)", en: "Barriers only (per inverted clonal selection theory)"}
          - {pt: "Apenas células (mediado por linfócitos B citotóxicos)", en: "Cells only (mediated by cytotoxic B lymphocytes)"}
          - {pt: "Apenas anticorpos (no timo após a puberdade apenas)", en: "Antibodies only (in the thymus after puberty only)"}
        correctAnswer: {pt: "Barreiras + imunidade inata + imunidade adaptativa", en: "Barriers + innate immunity + adaptive immunity"}
        rationale: {pt: "Camadas integradas: prevenção, resposta rápida e resposta específica com memória — então a defesa é robusta.", en: "Integrated layers: prevention, rapid response, and specific memory response — making defense robust."}
        objectives: [biology.immune]
        difficulty: 2
target: 20
