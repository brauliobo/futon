title:
  pt: "🧬 Evolução — fundamentos"
  en: "🧬 Evolution — fundamentals"
level: '6A'
subject: biology
objectives: [biology.evolution]
difficulty: 2
authorNotes: "Variabilidade, seleção natural, adaptação."
example:
  pt: "Ex.: girafas com pescoço longo → mais alimento → mais filhotes → após gerações, pescoços longos predominam."
  en: "Ex.: long-necked giraffes → more food → more offspring → over generations, long necks prevail."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Seleção natural", en: "Natural selection"}
    description: {pt: "Como populações mudam.", en: "How populations change."}
    exercises:
      - type: choice
        question: {pt: "Quem propôs a teoria da seleção natural?", en: "Who proposed the theory of natural selection?"}
        choices:
          - {pt: "Charles Darwin (e Wallace)", en: "Charles Darwin (and Wallace)"}
          - {pt: "Isaac Newton", en: "Isaac Newton"}
          - {pt: "Albert Einstein", en: "Albert Einstein"}
          - {pt: "Galileu", en: "Galileo"}
        correctAnswer: {pt: "Charles Darwin (e Wallace)", en: "Charles Darwin (and Wallace)"}
        rationale: {pt: "Como ambos chegaram à mesma ideia independentemente, então apresentaram-na juntos em 1858.", en: "Because both reached the same idea independently, they presented it together in 1858."}
        objectives: [biology.evolution]
        difficulty: 2
      - type: choice
        question: {pt: "Seleção natural age sobre:", en: "Natural selection acts on:"}
        choices:
          - {pt: "Variação hereditária dentro das populações", en: "Heritable variation within populations"}
          - {pt: "Apenas indivíduos isolados", en: "Only isolated individuals"}
          - {pt: "Apenas plantas", en: "Only plants"}
          - {pt: "Apenas humanos", en: "Only humans"}
        correctAnswer: {pt: "Variação hereditária dentro das populações", en: "Heritable variation within populations"}
        rationale: {pt: "Como genes variam entre indivíduos, então alguns têm maior chance de sobreviver e reproduzir.", en: "Because genes vary among individuals, some have a better chance of surviving and reproducing."}
        objectives: [biology.evolution]
        difficulty: 2
      - type: choice
        question: {pt: "De onde vem a variação genética?", en: "Where does genetic variation come from?"}
        choices:
          - {pt: "Mutações e recombinação genética", en: "Mutations and genetic recombination"}
          - {pt: "Apenas alimentação", en: "Only food"}
          - {pt: "Apenas vontade individual", en: "Only individual will"}
          - {pt: "Apenas clima", en: "Only climate"}
        correctAnswer: {pt: "Mutações e recombinação genética", en: "Mutations and genetic recombination"}
        rationale: {pt: "Como mutações alteram o DNA e meiose embaralha alelos, então variabilidade surge a cada geração.", en: "Because mutations alter DNA and meiosis shuffles alleles, variability arises each generation."}
        objectives: [biology.evolution]
        difficulty: 2
      - type: choice
        question: {pt: "Adaptação é:", en: "An adaptation is:"}
        choices:
          - {pt: "Característica que aumenta sobrevivência/reprodução", en: "Trait that boosts survival/reproduction"}
          - {pt: "Esforço consciente do indivíduo", en: "Conscious effort by an individual"}
          - {pt: "Cor preferida", en: "Favorite color"}
          - {pt: "Nome de um animal", en: "Name of an animal"}
        correctAnswer: {pt: "Característica que aumenta sobrevivência/reprodução", en: "Trait that boosts survival/reproduction"}
        rationale: {pt: "Como adaptações se acumulam por seleção, então populações ficam melhor ajustadas ao ambiente ao longo do tempo.", en: "Because adaptations accumulate via selection, populations become better fit to their environment over time."}
        objectives: [biology.evolution]
        difficulty: 2
      - type: choice
        question: {pt: "Indivíduos NÃO evoluem; quem evolui são:", en: "Individuals do NOT evolve; what evolves is:"}
        choices:
          - {pt: "Populações ao longo de gerações", en: "Populations across generations"}
          - {pt: "Cada célula", en: "Each cell"}
          - {pt: "Cada átomo", en: "Each atom"}
          - {pt: "Apenas o DNA", en: "Only DNA"}
        correctAnswer: {pt: "Populações ao longo de gerações", en: "Populations across generations"}
        rationale: {pt: "Como mudanças hereditárias se acumulam entre gerações, então a evolução é fenômeno populacional.", en: "Because heritable changes accumulate between generations, evolution is a population-level phenomenon."}
        objectives: [biology.evolution]
        difficulty: 2
      - type: choice
        question: {pt: "Fósseis fornecem evidência de evolução porque:", en: "Fossils provide evidence of evolution because:"}
        choices:
          - {pt: "Mostram formas intermediárias e mudanças no tempo", en: "Show intermediate forms and changes over time"}
          - {pt: "São coloridos", en: "Are colorful"}
          - {pt: "São feitos de plástico", en: "Are made of plastic"}
          - {pt: "Falam", en: "They speak"}
        correctAnswer: {pt: "Mostram formas intermediárias e mudanças no tempo", en: "Show intermediate forms and changes over time"}
        rationale: {pt: "Como sedimentos preservam fósseis em camadas datáveis, então observamos linhagens evoluindo cronologicamente.", en: "Because sediments preserve fossils in datable layers, we observe lineages evolving chronologically."}
        objectives: [biology.evolution]
        difficulty: 2
      - type: choice
        question: {pt: "Estruturas homólogas (mesma origem evolutiva) são exemplos:", en: "Homologous structures (same evolutionary origin) are examples:"}
        choices:
          - {pt: "Asa de morcego, braço humano, nadadeira de baleia", en: "Bat wing, human arm, whale flipper"}
          - {pt: "Nadadeira de peixe e nadadeira de baleia", en: "Fish fin and whale flipper"}
          - {pt: "Asa de inseto e asa de pássaro", en: "Insect wing and bird wing"}
          - {pt: "Concha de molusco e casca de árvore", en: "Mollusk shell and tree bark"}
        correctAnswer: {pt: "Asa de morcego, braço humano, nadadeira de baleia", en: "Bat wing, human arm, whale flipper"}
        rationale: {pt: "Como os ossos seguem o mesmo padrão (úmero, rádio, ulna), então têm ancestral comum, mas funções diferentes.", en: "Because the bones share the same pattern (humerus, radius, ulna), they share a common ancestor with different functions."}
        objectives: [biology.evolution]
        difficulty: 2
      - type: choice
        question: {pt: "Estruturas análogas (função similar, origem distinta):", en: "Analogous structures (similar function, different origin):"}
        choices:
          - {pt: "Asa de inseto e asa de pássaro (origens diferentes)", en: "Insect wing and bird wing (different origins)"}
          - {pt: "Braço humano e asa de morcego", en: "Human arm and bat wing"}
          - {pt: "Olho humano e olho de peixe", en: "Human eye and fish eye"}
          - {pt: "Pulmão humano e brânquia de peixe", en: "Human lung and fish gill"}
        correctAnswer: {pt: "Asa de inseto e asa de pássaro (origens diferentes)", en: "Insect wing and bird wing (different origins)"}
        rationale: {pt: "Como ambos voam mas vêm de linhagens diferentes, então a função é convergente, não a origem.", en: "Because both fly but come from different lineages, the function is convergent, not the origin."}
        objectives: [biology.evolution]
        difficulty: 2
      - type: choice
        question: {pt: "Espécie é definida (em parte) por:", en: "A species is defined (in part) by:"}
        choices:
          - {pt: "Capacidade de cruzar e gerar descendentes férteis", en: "Ability to interbreed and produce fertile offspring"}
          - {pt: "Cor da pele", en: "Skin color"}
          - {pt: "Tamanho exato", en: "Exact size"}
          - {pt: "Local onde nasceu", en: "Where it was born"}
        correctAnswer: {pt: "Capacidade de cruzar e gerar descendentes férteis", en: "Ability to interbreed and produce fertile offspring"}
        rationale: {pt: "Como cavalo + jumento dão mula estéril, então cavalos e jumentos são espécies distintas.", en: "Because horse + donkey produce sterile mule, horses and donkeys are distinct species."}
        objectives: [biology.evolution]
        difficulty: 2
      - type: choice
        question: {pt: "Especiação é:", en: "Speciation is:"}
        choices:
          - {pt: "Formação de novas espécies a partir de populações ancestrais", en: "Formation of new species from ancestral populations"}
          - {pt: "Extinção", en: "Extinction"}
          - {pt: "Tipo de doença", en: "Type of disease"}
          - {pt: "Tipo de hormônio", en: "Type of hormone"}
        correctAnswer: {pt: "Formação de novas espécies a partir de populações ancestrais", en: "Formation of new species from ancestral populations"}
        rationale: {pt: "Quando barreiras isolam populações, primeiro genes divergem, então surgem espécies separadas.", en: "When barriers isolate populations, genes diverge first, then separate species emerge."}
        objectives: [biology.evolution]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Evidências e exemplos", en: "Evidence and examples"}
    description: {pt: "Provas concretas.", en: "Concrete proof."}
    exercises:
      - type: choice
        question: {pt: "Resistência a antibióticos é exemplo de:", en: "Antibiotic resistance is an example of:"}
        choices:
          - {pt: "Seleção natural em ação rápida", en: "Natural selection acting fast"}
          - {pt: "Mágica", en: "Magic"}
          - {pt: "Acidente irrelevante", en: "An irrelevant accident"}
          - {pt: "Doença genética", en: "A genetic disease"}
        correctAnswer: {pt: "Seleção natural em ação rápida", en: "Natural selection acting fast"}
        rationale: {pt: "Quando antibiótico é aplicado, primeiro mata sensíveis, então resistentes proliferam — observamos evolução em tempo real.", en: "When antibiotic is applied, sensitive bacteria die first, then resistant ones proliferate — evolution observed in real time."}
        objectives: [biology.evolution]
        difficulty: 2
      - type: choice
        question: {pt: "DNA fornece evidência da evolução porque:", en: "DNA provides evidence of evolution because:"}
        choices:
          - {pt: "Espécies próximas têm DNA mais parecido", en: "Closely related species have more similar DNA"}
          - {pt: "Todo DNA é igual", en: "All DNA is identical"}
          - {pt: "DNA não muda", en: "DNA never changes"}
          - {pt: "Apenas humanos têm DNA", en: "Only humans have DNA"}
        correctAnswer: {pt: "Espécies próximas têm DNA mais parecido", en: "Closely related species have more similar DNA"}
        rationale: {pt: "Como mutações se acumulam ao longo do tempo, então quanto maior a divergência, mais diferenças no DNA.", en: "Because mutations accumulate over time, the longer the divergence, the more DNA differences."}
        objectives: [biology.evolution]
        difficulty: 2
      - type: choice
        question: {pt: "Bactérias evoluem rápido porque:", en: "Bacteria evolve fast because:"}
        choices:
          - {pt: "Geração curta e populações enormes", en: "Short generations and huge populations"}
          - {pt: "Têm cérebro grande", en: "They have a large brain"}
          - {pt: "Vivem em água apenas", en: "Live only in water"}
          - {pt: "Não possuem DNA", en: "Lack DNA"}
        correctAnswer: {pt: "Geração curta e populações enormes", en: "Short generations and huge populations"}
        rationale: {pt: "Como milhões de divisões geram muitas mutações, então a seleção tem matéria-prima abundante para agir.", en: "Because millions of divisions generate many mutations, selection has abundant raw material to act on."}
        objectives: [biology.evolution]
        difficulty: 2
      - type: choice
        question: {pt: "Camuflagem é uma adaptação que ajuda:", en: "Camouflage is an adaptation that helps:"}
        choices:
          - {pt: "Evitar predadores ou se aproximar de presas", en: "Avoid predators or approach prey"}
          - {pt: "Crescer mais", en: "To grow"}
          - {pt: "Voar mais alto", en: "To fly higher"}
          - {pt: "Sentir mais frio", en: "To feel colder"}
        correctAnswer: {pt: "Evitar predadores ou se aproximar de presas", en: "Avoid predators or approach prey"}
        rationale: {pt: "Como cor parecida com o ambiente reduz detecção, então indivíduos camuflados sobrevivem mais e deixam mais descendentes.", en: "Because environmental-matching color reduces detection, camouflaged individuals survive more and leave more offspring."}
        objectives: [biology.evolution]
        difficulty: 2
      - type: choice
        question: {pt: "Mariposas escuras se tornaram comuns em Londres industrial porque:", en: "Dark moths became common in industrial London because:"}
        choices:
          - {pt: "Fuligem escureceu árvores e camuflou as escuras", en: "Soot darkened trees and camouflaged the dark ones"}
          - {pt: "Mariposas claras decidiram mudar", en: "Light moths decided to change"}
          - {pt: "Foram pintadas", en: "They were painted"}
          - {pt: "Sem motivo", en: "No reason"}
        correctAnswer: {pt: "Fuligem escureceu árvores e camuflou as escuras", en: "Soot darkened trees and camouflaged the dark ones"}
        rationale: {pt: "Quando o ambiente mudou, então a vantagem passou para as escuras — exemplo clássico de seleção observada.", en: "When the environment changed, the advantage shifted to dark moths — a classic observed selection example."}
        objectives: [biology.evolution]
        difficulty: 2
      - type: choice
        question: {pt: "Extinção ocorre quando:", en: "Extinction occurs when:"}
        choices:
          - {pt: "Todos os indivíduos da espécie morrem sem deixar descendentes", en: "All members of a species die without offspring"}
          - {pt: "Apenas um indivíduo morre", en: "Only one individual dies"}
          - {pt: "A espécie se mistura com outra", en: "The species mixes with another"}
          - {pt: "Mudam de cor", en: "They change color"}
        correctAnswer: {pt: "Todos os indivíduos da espécie morrem sem deixar descendentes", en: "All members of a species die without offspring"}
        rationale: {pt: "Como evolução exige reprodução, quando a linhagem termina, então a espécie é extinta — irreversível.", en: "Because evolution requires reproduction, when the lineage ends, the species is extinct — irreversibly."}
        objectives: [biology.evolution]
        difficulty: 2
      - type: choice
        question: {pt: "Humanos modernos surgiram aproximadamente há:", en: "Modern humans emerged approximately:"}
        choices:
          - {pt: "300 mil anos atrás", en: "300,000 years ago"}
          - {pt: "100 anos atrás", en: "100 years ago"}
          - {pt: "1 bilhão de anos atrás", en: "1 billion years ago"}
          - {pt: "5 mil anos atrás", en: "5,000 years ago"}
        correctAnswer: {pt: "300 mil anos atrás", en: "300,000 years ago"}
        rationale: {pt: "Como fósseis de Homo sapiens datam dessa época na África, então a linhagem moderna é relativamente recente.", en: "Because Homo sapiens fossils from Africa date to that time, the modern lineage is relatively recent."}
        objectives: [biology.evolution]
        difficulty: 2
      - type: choice
        question: {pt: "Todos os seres vivos compartilham:", en: "All living things share:"}
        choices:
          - {pt: "Mesmo código genético (universal)", en: "The same genetic code (universal)"}
          - {pt: "Mesma cor", en: "The same color"}
          - {pt: "Mesma forma", en: "The same shape"}
          - {pt: "Mesma temperatura", en: "The same temperature"}
        correctAnswer: {pt: "Mesmo código genético (universal)", en: "The same genetic code (universal)"}
        rationale: {pt: "Como bactérias e humanos usam os mesmos códons para os mesmos aminoácidos, então têm ancestral comum.", en: "Because bacteria and humans use the same codons for the same amino acids, they share a common ancestor."}
        objectives: [biology.evolution]
        difficulty: 2
      - type: choice
        question: {pt: "Cães domésticos vieram de:", en: "Domestic dogs came from:"}
        choices:
          - {pt: "Lobos selvagens (seleção artificial humana)", en: "Wild wolves (human artificial selection)"}
          - {pt: "Gatos", en: "Cats"}
          - {pt: "Aves", en: "Birds"}
          - {pt: "Peixes", en: "Fish"}
        correctAnswer: {pt: "Lobos selvagens (seleção artificial humana)", en: "Wild wolves (human artificial selection)"}
        rationale: {pt: "Como humanos selecionaram lobos mais dóceis ao longo de milênios, então surgiram raças tão distintas.", en: "Because humans selected tamer wolves over millennia, the distinct breeds emerged."}
        objectives: [biology.evolution]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: a evolução por seleção natural exige:", en: "Summary: evolution by natural selection requires:"}
        choices:
          - {pt: "Variação + herança + diferenças em sobrevivência/reprodução", en: "Variation + heredity + differences in survival/reproduction"}
          - {pt: "Apenas tempo", en: "Just time"}
          - {pt: "Apenas vontade", en: "Just willpower"}
          - {pt: "Apenas oxigênio", en: "Just oxygen"}
        correctAnswer: {pt: "Variação + herança + diferenças em sobrevivência/reprodução", en: "Variation + heredity + differences in survival/reproduction"}
        rationale: {pt: "Os três pilares: traços diferem, são herdáveis e influenciam o sucesso — então populações mudam ao longo do tempo.", en: "Three pillars: traits differ, are heritable, and affect success — populations change over time."}
        objectives: [biology.evolution]
        difficulty: 2
target: 20
