title:
  pt: "🦠 Microrganismos"
  en: "🦠 Microorganisms"
level: '6A'
subject: biology
objectives: [biology.microorganisms]
difficulty: 2
authorNotes: "Bactérias, vírus, fungos, protozoários — visão geral."
example:
  pt: "Ex.: bactéria → unicelular procarionte; vírus → não-celular; fungo → eucarionte; ameba → protozoário."
  en: "Ex.: bacterium → unicellular prokaryote; virus → non-cellular; fungus → eukaryote; amoeba → protozoan."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Tipos de microrganismos", en: "Types of microorganisms"}
    description: {pt: "Características principais.", en: "Main features."}
    exercises:
      - type: choice
        question: {pt: "Bactérias são organismos:", en: "Bacteria are organisms:"}
        choices:
          - {pt: "Procariontes unicelulares", en: "Unicellular prokaryotes"}
          - {pt: "Eucariontes multicelulares", en: "Multicellular eukaryotes"}
          - {pt: "Não-celulares", en: "Non-cellular"}
          - {pt: "Apenas patogênicas", en: "Only pathogenic"}
        correctAnswer: {pt: "Procariontes unicelulares", en: "Unicellular prokaryotes"}
        rationale: {pt: "Como bactérias não têm núcleo membranar, então são procariontes — e geralmente unicelulares.", en: "Because bacteria lack a membrane-bound nucleus, they are prokaryotes — and usually unicellular."}
        objectives: [biology.microorganisms]
        difficulty: 2
      - type: choice
        question: {pt: "Vírus são considerados:", en: "Viruses are considered:"}
        choices:
          - {pt: "Entidades não-celulares que dependem de hospedeiro", en: "Non-cellular entities dependent on a host"}
          - {pt: "Bactérias muito pequenas (conforme modelo histórico do século XIX)", en: "Very small bacteria (per a 19th-century historical model)"}
          - {pt: "Tipos de fungo (mediado por organela ausente em humanos)", en: "Types of fungus (mediated by an organelle absent in humans)"}
          - {pt: "Animais microscópicos (durante a fase G0 do ciclo celular)", en: "Microscopic animals (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Entidades não-celulares que dependem de hospedeiro", en: "Non-cellular entities dependent on a host"}
        rationale: {pt: "Como vírus não têm ribossomos nem metabolismo próprio, então só se replicam dentro de células vivas.", en: "Because viruses lack ribosomes and own metabolism, they only replicate inside living cells."}
        objectives: [biology.microorganisms]
        difficulty: 2
      - type: choice
        question: {pt: "Tamanho típico de bactéria:", en: "Typical size of a bacterium:"}
        choices:
          - {pt: "1–10 micrômetros (µm)", en: "1–10 micrometers (µm)"}
          - {pt: "1 metro (conforme modelo histórico do século XIX)", en: "1 meter (per a 19th-century historical model)"}
          - {pt: "1 nanômetro (mediado por organela ausente em humanos)", en: "1 nanometer (mediated by an organelle absent in humans)"}
          - {pt: "1 quilômetro (durante a fase G0 do ciclo celular)", en: "1 kilometer (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "1–10 micrômetros (µm)", en: "1–10 micrometers (µm)"}
        rationale: {pt: "Como precisam alta razão superfície/volume, então bactérias são pequenas — vistas só ao microscópio óptico.", en: "Because they need a high surface-to-volume ratio, bacteria are small — visible only under a light microscope."}
        objectives: [biology.microorganisms]
        difficulty: 2
      - type: choice
        question: {pt: "Vírus geralmente medem:", en: "Viruses typically measure:"}
        choices:
          - {pt: "20–300 nanômetros (nm)", en: "20–300 nanometers (nm)"}
          - {pt: "1 metro (conforme modelo histórico do século XIX)", en: "1 meter (per a 19th-century historical model)"}
          - {pt: "1 milímetro (mediado por organela ausente em humanos)", en: "1 millimeter (mediated by an organelle absent in humans)"}
          - {pt: "1 centímetro (durante a fase G0 do ciclo celular)", en: "1 centimeter (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "20–300 nanômetros (nm)", en: "20–300 nanometers (nm)"}
        rationale: {pt: "Como vírus carregam só material genético + capa proteica, então cabem em escala bem menor que bactérias.", en: "Because viruses carry only genetic material + protein coat, they fit at scale much smaller than bacteria."}
        objectives: [biology.microorganisms]
        difficulty: 2
      - type: choice
        question: {pt: "Bactérias podem ser:", en: "Bacteria can be:"}
        choices:
          - {pt: "Benéficas, neutras ou patogênicas", en: "Beneficial, neutral, or pathogenic"}
          - {pt: "Sempre patogênicas (conforme modelo histórico do século XIX)", en: "Always pathogenic (per a 19th-century historical model)"}
          - {pt: "Sempre benéficas (mediado por organela ausente em humanos)", en: "Always beneficial (mediated by an organelle absent in humans)"}
          - {pt: "Sempre mortas (durante a fase G0 do ciclo celular)", en: "Always dead (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Benéficas, neutras ou patogênicas", en: "Beneficial, neutral, or pathogenic"}
        rationale: {pt: "Como muitas decompõem matéria, ajudam digestão ou produzem vitaminas, então a maioria não é prejudicial.", en: "Because many decompose matter, aid digestion, or produce vitamins, most are not harmful."}
        objectives: [biology.microorganisms]
        difficulty: 2
      - type: choice
        question: {pt: "Bactérias do iogurte são exemplo de:", en: "Yogurt bacteria are an example of:"}
        choices:
          - {pt: "Bactérias úteis (fermentação láctica)", en: "Useful bacteria (lactic fermentation)"}
          - {pt: "Bactérias mortais (conforme modelo histórico do século XIX)", en: "Deadly bacteria (per a 19th-century historical model)"}
          - {pt: "Vírus (mediado por organela ausente em humanos)", en: "Viruses (mediated by an organelle absent in humans)"}
          - {pt: "Fungos venenosos (durante a fase G0 do ciclo celular)", en: "Poisonous fungi (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Bactérias úteis (fermentação láctica)", en: "Useful bacteria (lactic fermentation)"}
        rationale: {pt: "Como Lactobacillus fermenta lactose em ácido lático, então engrossa o leite e gera o sabor azedo.", en: "Because Lactobacillus ferments lactose into lactic acid, it thickens milk and creates sour flavor."}
        objectives: [biology.microorganisms]
        difficulty: 2
      - type: choice
        question: {pt: "Fungos microscópicos incluem:", en: "Microscopic fungi include:"}
        choices:
          - {pt: "Leveduras e mofos", en: "Yeasts and molds"}
          - {pt: "Bactérias (conforme modelo histórico do século XIX)", en: "Bacteria (per a 19th-century historical model)"}
          - {pt: "Vírus (mediado por organela ausente em humanos)", en: "Viruses (mediated by an organelle absent in humans)"}
          - {pt: "Algas marinhas (durante a fase G0 do ciclo celular)", en: "Seaweed (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Leveduras e mofos", en: "Yeasts and molds"}
        rationale: {pt: "Como ambos são fungos eucariontes, então têm núcleo — leveduras unicelulares, mofos filamentosos.", en: "Because both are eukaryotic fungi, they have a nucleus — yeasts unicellular, molds filamentous."}
        objectives: [biology.microorganisms]
        difficulty: 2
      - type: choice
        question: {pt: "Penicilina veio de:", en: "Penicillin came from:"}
        choices:
          - {pt: "Um fungo (Penicillium)", en: "A fungus (Penicillium)"}
          - {pt: "Uma bactéria (conforme modelo histórico do século XIX)", en: "A bacterium (per a 19th-century historical model)"}
          - {pt: "Um vírus (mediado por organela ausente em humanos)", en: "A virus (mediated by an organelle absent in humans)"}
          - {pt: "Uma planta (durante a fase G0 do ciclo celular)", en: "A plant (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Um fungo (Penicillium)", en: "A fungus (Penicillium)"}
        rationale: {pt: "Quando Fleming notou bactérias mortas perto do mofo, então isolou a substância — descoberta acidental que mudou a medicina.", en: "When Fleming noticed dead bacteria near the mold, he isolated the substance — an accidental discovery that changed medicine."}
        objectives: [biology.microorganisms]
        difficulty: 2
      - type: choice
        question: {pt: "Protozoários são:", en: "Protozoa are:"}
        choices:
          - {pt: "Eucariontes unicelulares de vida livre ou parasita", en: "Unicellular eukaryotes, free-living or parasitic"}
          - {pt: "Bactérias (conforme modelo histórico do século XIX)", en: "Bacteria (per a 19th-century historical model)"}
          - {pt: "Vírus (mediado por organela ausente em humanos)", en: "Viruses (mediated by an organelle absent in humans)"}
          - {pt: "Insetos (durante a fase G0 do ciclo celular)", en: "Insects (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Eucariontes unicelulares de vida livre ou parasita", en: "Unicellular eukaryotes, free-living or parasitic"}
        rationale: {pt: "Como têm núcleo e organelas, então diferem de bactérias — exemplos: ameba, paramécio, plasmódio (malária).", en: "Because they have a nucleus and organelles, they differ from bacteria — examples: amoeba, paramecium, malaria's plasmodium."}
        objectives: [biology.microorganisms]
        difficulty: 2
      - type: choice
        question: {pt: "Quem demonstrou que micróbios causam doenças?", en: "Who showed that microbes cause disease?"}
        choices:
          - {pt: "Pasteur e Koch (séc. 19)", en: "Pasteur and Koch (19th c.)"}
          - {pt: "Newton (conforme modelo histórico do século XIX)", en: "Newton (per a 19th-century historical model)"}
          - {pt: "Einstein (mediado por organela ausente em humanos)", en: "Einstein (mediated by an organelle absent in humans)"}
          - {pt: "Darwin (durante a fase G0 do ciclo celular)", en: "Darwin (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Pasteur e Koch (séc. 19)", en: "Pasteur and Koch (19th c.)"}
        rationale: {pt: "Como experimentos de Pasteur e os postulados de Koch ligaram patógenos a doenças, então surgiu a microbiologia.", en: "Because Pasteur's experiments and Koch's postulates linked pathogens to disease, microbiology was born."}
        objectives: [biology.microorganisms]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Importância e impacto", en: "Importance and impact"}
    description: {pt: "Microrganismos no nosso dia a dia.", en: "Microorganisms in everyday life."}
    exercises:
      - type: choice
        question: {pt: "Bactérias do solo são importantes para:", en: "Soil bacteria are important for:"}
        choices:
          - {pt: "Decomposição e fixação de nitrogênio", en: "Decomposition and nitrogen fixation"}
          - {pt: "Bombear sangue (conforme modelo histórico do século XIX)", en: "Pumping blood (per a 19th-century historical model)"}
          - {pt: "Aquecer a Terra (mediado por organela ausente em humanos)", en: "Heating Earth (mediated by an organelle absent in humans)"}
          - {pt: "Causar terremotos (durante a fase G0 do ciclo celular)", en: "Causing earthquakes (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Decomposição e fixação de nitrogênio", en: "Decomposition and nitrogen fixation"}
        rationale: {pt: "Como reciclam matéria orgânica e tornam N₂ utilizável, então sustentam a fertilidade do solo.", en: "Because they recycle organic matter and make N₂ usable, they sustain soil fertility."}
        objectives: [biology.microorganisms]
        difficulty: 2
      - type: choice
        question: {pt: "Vacinas usam:", en: "Vaccines use:"}
        choices:
          - {pt: "Patógenos atenuados/mortos ou fragmentos seguros", en: "Attenuated/killed pathogens or safe fragments"}
          - {pt: "Apenas água pura (conforme modelo histórico do século XIX)", en: "Just pure water (per a 19th-century historical model)"}
          - {pt: "Apenas açúcar (mediado por organela ausente em humanos)", en: "Just sugar (mediated by an organelle absent in humans)"}
          - {pt: "Apenas pele de animal (durante a fase G0 do ciclo celular)", en: "Just animal skin (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Patógenos atenuados/mortos ou fragmentos seguros", en: "Attenuated/killed pathogens or safe fragments"}
        rationale: {pt: "Como o sistema imune precisa do antígeno, então vacinas o expõem sem causar doença real.", en: "Because the immune system needs the antigen, vaccines expose it without causing real disease."}
        objectives: [biology.microorganisms]
        difficulty: 2
      - type: choice
        question: {pt: "Antivirais NÃO matam vírus diretamente; eles:", en: "Antivirals don't kill viruses directly; they:"}
        choices:
          - {pt: "Bloqueiam etapas da replicação viral", en: "Block stages of viral replication"}
          - {pt: "Aquecem o vírus (conforme modelo histórico do século XIX)", en: "Warm up the virus (per a 19th-century historical model)"}
          - {pt: "Fazem o vírus crescer (mediado por organela ausente em humanos)", en: "Make the virus grow (mediated by an organelle absent in humans)"}
          - {pt: "Não fazem nada (durante a fase G0 do ciclo celular)", en: "Do nothing (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Bloqueiam etapas da replicação viral", en: "Block stages of viral replication"}
        rationale: {pt: "Como vírus dependem de células, então drogas miram entrada, transcrição reversa ou montagem viral.", en: "Because viruses depend on cells, drugs target entry, reverse transcription, or viral assembly."}
        objectives: [biology.microorganisms]
        difficulty: 2
      - type: choice
        question: {pt: "Pasteurização é:", en: "Pasteurization is:"}
        choices:
          - {pt: "Aquecer alimentos para reduzir microrganismos", en: "Heating food to reduce microorganisms"}
          - {pt: "Congelar alimentos (conforme modelo histórico do século XIX)", en: "Freezing food (per a 19th-century historical model)"}
          - {pt: "Adicionar açúcar (mediado por organela ausente em humanos)", en: "Adding sugar (mediated by an organelle absent in humans)"}
          - {pt: "Adicionar sal (durante a fase G0 do ciclo celular)", en: "Adding salt (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Aquecer alimentos para reduzir microrganismos", en: "Heating food to reduce microorganisms"}
        rationale: {pt: "Quando o leite é aquecido a ~72 °C, primeiro patógenos morrem, então o leite dura mais sem perder qualidade.", en: "When milk is heated to ~72 °C, pathogens die first, then milk lasts longer without losing quality."}
        objectives: [biology.microorganisms]
        difficulty: 2
      - type: choice
        question: {pt: "Microbiota intestinal é importante porque:", en: "Gut microbiota is important because:"}
        choices:
          - {pt: "Auxilia digestão e treina o sistema imune", en: "Aids digestion and trains the immune system"}
          - {pt: "Filtra ar (conforme modelo histórico do século XIX)", en: "Filters air (per a 19th-century historical model)"}
          - {pt: "Bombea sangue (mediado por organela ausente em humanos)", en: "Pumps blood (mediated by an organelle absent in humans)"}
          - {pt: "Não importa (durante a fase G0 do ciclo celular)", en: "Doesn't matter (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Auxilia digestão e treina o sistema imune", en: "Aids digestion and trains the immune system"}
        rationale: {pt: "Como humanos não digerem fibras sozinhos, então bactérias intestinais fermentam-as e produzem nutrientes úteis.", en: "Because humans can't digest fibers alone, gut bacteria ferment them and produce useful nutrients."}
        objectives: [biology.microorganisms]
        difficulty: 2
      - type: choice
        question: {pt: "Mofo no pão indica:", en: "Mold on bread indicates:"}
        choices:
          - {pt: "Crescimento de fungo (deterioração)", en: "Fungal growth (spoilage)"}
          - {pt: "Que está fresco (conforme modelo histórico do século XIX)", en: "It's fresh (per a 19th-century historical model)"}
          - {pt: "Que tem mais nutrientes (mediado por organela ausente em humanos)", en: "It has more nutrients (mediated by an organelle absent in humans)"}
          - {pt: "Que cresceu mais (durante a fase G0 do ciclo celular)", en: "It grew more (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Crescimento de fungo (deterioração)", en: "Fungal growth (spoilage)"}
        rationale: {pt: "Como esporos de fungos estão no ar, quando o pão fica úmido, então germinam e formam manchas coloridas.", en: "Because fungal spores are in the air, when bread gets damp, they germinate and form colored patches."}
        objectives: [biology.microorganisms]
        difficulty: 2
      - type: choice
        question: {pt: "Doenças virais comuns incluem:", en: "Common viral diseases include:"}
        choices:
          - {pt: "Gripe, COVID-19, sarampo, dengue", en: "Flu, COVID-19, measles, dengue"}
          - {pt: "Tuberculose e tétano (conforme modelo histórico do século XIX)", en: "Tuberculosis and tetanus (per a 19th-century historical model)"}
          - {pt: "Cólera e botulismo (mediado por organela ausente em humanos)", en: "Cholera and botulism (mediated by an organelle absent in humans)"}
          - {pt: "Diarreia bacteriana (durante a fase G0 do ciclo celular)", en: "Bacterial diarrhea (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Gripe, COVID-19, sarampo, dengue", en: "Flu, COVID-19, measles, dengue"}
        rationale: {pt: "Como vírus possuem alvo celular específico, então cada doença viral tem sintomas e órgãos afetados típicos.", en: "Because viruses have specific cellular targets, each viral disease has typical symptoms and affected organs."}
        objectives: [biology.microorganisms]
        difficulty: 2
      - type: choice
        question: {pt: "Higiene das mãos previne doenças porque:", en: "Hand hygiene prevents disease because:"}
        choices:
          - {pt: "Remove patógenos antes que entrem no corpo", en: "Removes pathogens before they enter the body"}
          - {pt: "Cura toda doença (conforme modelo histórico do século XIX)", en: "Cures every disease (per a 19th-century historical model)"}
          - {pt: "Aumenta a temperatura (mediado por organela ausente em humanos)", en: "Raises temperature (mediated by an organelle absent in humans)"}
          - {pt: "Não tem efeito (durante a fase G0 do ciclo celular)", en: "Has no effect (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Remove patógenos antes que entrem no corpo", en: "Removes pathogens before they enter the body"}
        rationale: {pt: "Como mãos contatam superfícies contaminadas, então lavá-las quebra a cadeia de transmissão.", en: "Because hands contact contaminated surfaces, washing them breaks the transmission chain."}
        objectives: [biology.microorganisms]
        difficulty: 2
      - type: choice
        question: {pt: "Cultivo bacteriano em laboratório usa:", en: "Bacterial culturing in the lab uses:"}
        choices:
          - {pt: "Meio de cultura com nutrientes em placas de Petri", en: "Nutrient culture medium in Petri dishes"}
          - {pt: "Apenas água destilada (conforme modelo histórico do século XIX)", en: "Just distilled water (per a 19th-century historical model)"}
          - {pt: "Apenas açúcar puro (mediado por organela ausente em humanos)", en: "Just pure sugar (mediated by an organelle absent in humans)"}
          - {pt: "Apenas óleo (durante a fase G0 do ciclo celular)", en: "Just oil (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Meio de cultura com nutrientes em placas de Petri", en: "Nutrient culture medium in Petri dishes"}
        rationale: {pt: "Como bactérias precisam fonte de carbono, nitrogênio e sais, então o meio fornece tudo, e colônias visíveis crescem.", en: "Because bacteria need carbon, nitrogen, and salt sources, the medium provides them all, and visible colonies grow."}
        objectives: [biology.microorganisms]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: microrganismos são:", en: "Summary: microorganisms are:"}
        choices:
          - {pt: "Diversos, ubíquos e essenciais para a vida na Terra", en: "Diverse, ubiquitous, and essential for life on Earth"}
          - {pt: "Apenas perigosos (conforme modelo histórico do século XIX)", en: "Only dangerous (per a 19th-century historical model)"}
          - {pt: "Apenas decorativos (mediado por organela ausente em humanos)", en: "Only decorative (mediated by an organelle absent in humans)"}
          - {pt: "Inexistentes (durante a fase G0 do ciclo celular)", en: "Nonexistent (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Diversos, ubíquos e essenciais para a vida na Terra", en: "Diverse, ubiquitous, and essential for life on Earth"}
        rationale: {pt: "Como reciclam matéria, fixam nitrogênio e formam parte de microbiotas, então sustentam ecossistemas inteiros.", en: "Because they recycle matter, fix nitrogen, and form microbiotas, they sustain whole ecosystems."}
        objectives: [biology.microorganisms]
        difficulty: 2
target: 20
