title:
  pt: "🦴 Sistema esquelético"
  en: "🦴 Skeletal system"
level: '6A'
subject: biology
objectives: [biology.skeletal]
difficulty: 2
authorNotes: "Ossos: estrutura, suporte, proteção, movimento."
example:
  pt: "Ex.: crânio → protege cérebro; coluna → sustenta; fêmur → suporta peso; costelas → protegem coração e pulmões."
  en: "Ex.: skull → protects brain; spine → supports; femur → bears weight; ribs → protect heart and lungs."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Funções dos ossos", en: "Bone functions"}
    description: {pt: "Para que serve o esqueleto.", en: "What the skeleton is for."}
    exercises:
      - type: choice
        question: {pt: "Quantos ossos um adulto humano tem aproximadamente?", en: "About how many bones does an adult human have?"}
        choices:
          - {pt: "206", en: "206"}
          - {pt: "100", en: "100"}
          - {pt: "500", en: "500"}
          - {pt: "50", en: "50"}
        correctAnswer: {pt: "206", en: "206"}
        rationale: {pt: "Bebês têm ~270 ossos que, quando crescemos, fundem-se até cerca de 206 no adulto.", en: "Babies have ~270 bones that, as we grow, fuse together to about 206 in adults."}
        objectives: [biology.skeletal]
        difficulty: 2
      - type: choice
        question: {pt: "Qual osso protege o cérebro?", en: "Which bone protects the brain?"}
        choices:
          - {pt: "Crânio", en: "Skull"}
          - {pt: "Fêmur", en: "Femur"}
          - {pt: "Tíbia", en: "Tibia"}
          - {pt: "Costela", en: "Rib"}
        correctAnswer: {pt: "Crânio", en: "Skull"}
        rationale: {pt: "Como o cérebro é frágil, o crânio forma uma caixa óssea que o protege contra impactos.", en: "Because the brain is fragile, the skull forms a bony case that protects it from impact."}
        objectives: [biology.skeletal]
        difficulty: 2
      - type: choice
        question: {pt: "Qual estrutura protege coração e pulmões?", en: "Which structure protects heart and lungs?"}
        choices:
          - {pt: "Caixa torácica (costelas)", en: "Rib cage"}
          - {pt: "Crânio", en: "Skull"}
          - {pt: "Coluna", en: "Spine"}
          - {pt: "Pelve", en: "Pelvis"}
        correctAnswer: {pt: "Caixa torácica (costelas)", en: "Rib cage"}
        rationale: {pt: "Quando respiramos, as costelas se movem; ao mesmo tempo, então protegem órgãos vitais.", en: "When we breathe, the ribs move; at the same time, they protect vital organs."}
        objectives: [biology.skeletal]
        difficulty: 2
      - type: choice
        question: {pt: "Qual é o osso mais longo do corpo humano?", en: "What is the longest bone in the human body?"}
        choices:
          - {pt: "Fêmur", en: "Femur"}
          - {pt: "Úmero", en: "Humerus"}
          - {pt: "Tíbia", en: "Tibia"}
          - {pt: "Costela", en: "Rib"}
        correctAnswer: {pt: "Fêmur", en: "Femur"}
        rationale: {pt: "O fêmur (osso da coxa) suporta o peso quando estamos de pé, então é grande e robusto.", en: "The femur (thigh bone) supports weight when standing, so it is large and robust."}
        objectives: [biology.skeletal]
        difficulty: 2
      - type: choice
        question: {pt: "A coluna vertebral é formada por:", en: "The vertebral column is formed by:"}
        choices:
          - {pt: "Vértebras", en: "Vertebrae"}
          - {pt: "Costelas", en: "Ribs"}
          - {pt: "Crânios", en: "Skulls"}
          - {pt: "Falanges", en: "Phalanges"}
        correctAnswer: {pt: "Vértebras", en: "Vertebrae"}
        rationale: {pt: "Como a coluna precisa flexibilidade e proteção da medula, ela se forma por vértebras articuladas.", en: "Because the spine needs flexibility and spinal-cord protection, it is formed by articulated vertebrae."}
        objectives: [biology.skeletal]
        difficulty: 2
      - type: choice
        question: {pt: "Articulações são:", en: "Joints are:"}
        choices:
          - {pt: "Pontos onde ossos se conectam", en: "Points where bones connect"}
          - {pt: "Tipos de músculo", en: "Types of muscle"}
          - {pt: "Tipos de pele", en: "Types of skin"}
          - {pt: "Tipos de neurônio", en: "Types of neuron"}
        correctAnswer: {pt: "Pontos onde ossos se conectam", en: "Points where bones connect"}
        rationale: {pt: "Quando dois ossos se encontram, então a articulação permite movimento controlado entre eles.", en: "When two bones meet, the joint allows controlled movement between them."}
        objectives: [biology.skeletal]
        difficulty: 2
      - type: choice
        question: {pt: "Cartilagem é encontrada principalmente em:", en: "Cartilage is mainly found in:"}
        choices:
          - {pt: "Articulações e nariz", en: "Joints and nose"}
          - {pt: "Cérebro", en: "Brain"}
          - {pt: "Fígado", en: "Liver"}
          - {pt: "Pulmões", en: "Lungs"}
        correctAnswer: {pt: "Articulações e nariz", en: "Joints and nose"}
        rationale: {pt: "Como a cartilagem é flexível e amortecedora, então protege articulações e dá forma ao nariz.", en: "Because cartilage is flexible and cushioning, it protects joints and shapes the nose."}
        objectives: [biology.skeletal]
        difficulty: 2
      - type: choice
        question: {pt: "Função PRINCIPAL do esqueleto:", en: "MAIN function of the skeleton:"}
        choices:
          - {pt: "Sustentar o corpo e proteger órgãos", en: "Support the body and protect organs"}
          - {pt: "Produzir energia", en: "Produce energy"}
          - {pt: "Digerir alimentos", en: "Digest food"}
          - {pt: "Pensar", en: "Think"}
        correctAnswer: {pt: "Sustentar o corpo e proteger órgãos", en: "Support the body and protect organs"}
        rationale: {pt: "O esqueleto dá estrutura rígida; assim, sustenta tecidos moles e protege órgãos vitais.", en: "The skeleton provides rigid structure; thus, it supports soft tissues and protects vital organs."}
        objectives: [biology.skeletal]
        difficulty: 2
      - type: choice
        question: {pt: "Onde se produz a maioria das células sanguíneas?", en: "Where are most blood cells produced?"}
        choices:
          - {pt: "Medula óssea", en: "Bone marrow"}
          - {pt: "Fígado", en: "Liver"}
          - {pt: "Cérebro", en: "Brain"}
          - {pt: "Pele", en: "Skin"}
        correctAnswer: {pt: "Medula óssea", en: "Bone marrow"}
        rationale: {pt: "Como dentro de ossos longos há medula vermelha, então ela produz hemácias, leucócitos e plaquetas.", en: "Because long bones contain red marrow, it produces red cells, white cells, and platelets."}
        objectives: [biology.skeletal]
        difficulty: 2
      - type: choice
        question: {pt: "Ossos contêm muito de qual mineral?", en: "Bones contain a lot of which mineral?"}
        choices:
          - {pt: "Cálcio", en: "Calcium"}
          - {pt: "Sódio", en: "Sodium"}
          - {pt: "Potássio", en: "Potassium"}
          - {pt: "Ferro", en: "Iron"}
        correctAnswer: {pt: "Cálcio", en: "Calcium"}
        rationale: {pt: "Quando ingerimos cálcio, então é depositado na matriz óssea, dando rigidez e dureza.", en: "When we consume calcium, it is deposited in the bone matrix, giving rigidity and hardness."}
        objectives: [biology.skeletal]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Movimento e crescimento", en: "Movement and growth"}
    description: {pt: "Como ossos trabalham com músculos.", en: "How bones work with muscles."}
    exercises:
      - type: choice
        question: {pt: "O que liga músculo a osso?", en: "What connects muscle to bone?"}
        choices:
          - {pt: "Tendão", en: "Tendon"}
          - {pt: "Ligamento", en: "Ligament"}
          - {pt: "Nervo", en: "Nerve"}
          - {pt: "Vaso sanguíneo", en: "Blood vessel"}
        correctAnswer: {pt: "Tendão", en: "Tendon"}
        rationale: {pt: "Como o músculo precisa puxar o osso para gerar movimento, então usa tendões fortes ricos em colágeno.", en: "Because the muscle must pull the bone to create movement, it uses strong collagen-rich tendons."}
        objectives: [biology.skeletal]
        difficulty: 2
      - type: choice
        question: {pt: "O que liga osso a osso?", en: "What connects bone to bone?"}
        choices:
          - {pt: "Ligamento", en: "Ligament"}
          - {pt: "Tendão", en: "Tendon"}
          - {pt: "Músculo", en: "Muscle"}
          - {pt: "Pele", en: "Skin"}
        correctAnswer: {pt: "Ligamento", en: "Ligament"}
        rationale: {pt: "Quando dois ossos articulam, ligamentos os mantêm alinhados e estabilizam a articulação.", en: "When two bones articulate, ligaments keep them aligned and stabilize the joint."}
        objectives: [biology.skeletal]
        difficulty: 2
      - type: choice
        question: {pt: "A pelve serve para:", en: "The pelvis serves to:"}
        choices:
          - {pt: "Sustentar tronco e proteger órgãos da bacia", en: "Support the trunk and protect pelvic organs"}
          - {pt: "Mastigar", en: "Chew"}
          - {pt: "Pensar", en: "Think"}
          - {pt: "Bombear sangue", en: "Pump blood"}
        correctAnswer: {pt: "Sustentar tronco e proteger órgãos da bacia", en: "Support the trunk and protect pelvic organs"}
        rationale: {pt: "Como a pelve é a base óssea do quadril, ela sustenta o tronco e protege bexiga e órgãos reprodutores.", en: "Because the pelvis is the bony base of the hip, it supports the trunk and protects the bladder and reproductive organs."}
        objectives: [biology.skeletal]
        difficulty: 2
      - type: choice
        question: {pt: "O que é uma fratura?", en: "What is a fracture?"}
        choices:
          - {pt: "Quebra de um osso", en: "A bone break"}
          - {pt: "Inflamação muscular", en: "Muscle inflammation"}
          - {pt: "Corte na pele", en: "Cut on the skin"}
          - {pt: "Dor de cabeça", en: "Headache"}
        correctAnswer: {pt: "Quebra de um osso", en: "A bone break"}
        rationale: {pt: "Quando força excessiva atinge um osso, então a estrutura cede e ocorre a fratura — depois cicatriza com calo ósseo.", en: "When excessive force hits a bone, the structure gives way and a fracture occurs — then it heals via bony callus."}
        objectives: [biology.skeletal]
        difficulty: 2
      - type: choice
        question: {pt: "Crianças crescem em altura porque:", en: "Children grow taller because:"}
        choices:
          - {pt: "Ossos longos crescem nas placas epifisárias", en: "Long bones grow at the growth plates"}
          - {pt: "Estômago aumenta", en: "Stomach grows"}
          - {pt: "Cabelo cresce", en: "Hair grows"}
          - {pt: "Comem muito", en: "They eat a lot"}
        correctAnswer: {pt: "Ossos longos crescem nas placas epifisárias", en: "Long bones grow at the growth plates"}
        rationale: {pt: "Como cartilagem nas placas se converte em osso, primeiro ela cresce, então o osso se alonga.", en: "Because cartilage at the plates converts into bone, first it grows, then the bone elongates."}
        objectives: [biology.skeletal]
        difficulty: 2
      - type: choice
        question: {pt: "Osteoporose é:", en: "Osteoporosis is:"}
        choices:
          - {pt: "Perda de densidade óssea", en: "Loss of bone density"}
          - {pt: "Dor muscular", en: "Muscle pain"}
          - {pt: "Inflamação intestinal", en: "Intestinal inflammation"}
          - {pt: "Doença pulmonar", en: "Lung disease"}
        correctAnswer: {pt: "Perda de densidade óssea", en: "Loss of bone density"}
        rationale: {pt: "Quando o cálcio sai mais rápido do que entra, então ossos ficam porosos e mais frágeis.", en: "When calcium leaves faster than it enters, bones become porous and more fragile."}
        objectives: [biology.skeletal]
        difficulty: 2
      - type: choice
        question: {pt: "Para fortalecer ossos, é importante:", en: "To strengthen bones, it is important to:"}
        choices:
          - {pt: "Cálcio + vitamina D + exercícios de carga", en: "Calcium + vitamin D + weight-bearing exercise"}
          - {pt: "Apenas dormir", en: "Only sleep"}
          - {pt: "Apenas beber água", en: "Only drink water"}
          - {pt: "Apenas comer doces", en: "Only eat sweets"}
        correctAnswer: {pt: "Cálcio + vitamina D + exercícios de carga", en: "Calcium + vitamin D + weight-bearing exercise"}
        rationale: {pt: "Como vitamina D ajuda a absorver cálcio e exercícios estimulam mineralização, juntos fortalecem o osso.", en: "Because vitamin D helps absorb calcium and exercise stimulates mineralization, together they strengthen bone."}
        objectives: [biology.skeletal]
        difficulty: 2
      - type: choice
        question: {pt: "Qual a articulação tipo \"dobradiça\"?", en: "Which joint is the \"hinge\" type?"}
        choices:
          - {pt: "Cotovelo e joelho", en: "Elbow and knee"}
          - {pt: "Ombro", en: "Shoulder"}
          - {pt: "Quadril", en: "Hip"}
          - {pt: "Crânio", en: "Skull"}
        correctAnswer: {pt: "Cotovelo e joelho", en: "Elbow and knee"}
        rationale: {pt: "Como a articulação dobradiça permite movimento em um plano, então cotovelo e joelho flexionam apenas em uma direção.", en: "Because hinge joints allow movement in one plane, the elbow and knee bend in only one direction."}
        objectives: [biology.skeletal]
        difficulty: 2
      - type: choice
        question: {pt: "Articulação tipo \"esfera\" (bola e soquete) está em:", en: "\"Ball-and-socket\" joints are in:"}
        choices:
          - {pt: "Ombro e quadril", en: "Shoulder and hip"}
          - {pt: "Cotovelo", en: "Elbow"}
          - {pt: "Joelho", en: "Knee"}
          - {pt: "Coluna", en: "Spine"}
        correctAnswer: {pt: "Ombro e quadril", en: "Shoulder and hip"}
        rationale: {pt: "Como esses pontos precisam de mobilidade ampla, então a articulação esférica permite rotações em vários planos.", en: "Because these points need wide mobility, ball-and-socket joints allow rotation in multiple planes."}
        objectives: [biology.skeletal]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: o esqueleto serve para:", en: "Summary: the skeleton serves to:"}
        choices:
          - {pt: "Sustentar, proteger, produzir células sanguíneas e permitir movimento", en: "Support, protect, make blood cells, and allow movement"}
          - {pt: "Apenas dar forma", en: "Just give shape"}
          - {pt: "Apenas crescer", en: "Just grow"}
          - {pt: "Apenas pesar", en: "Just weigh"}
        correctAnswer: {pt: "Sustentar, proteger, produzir células sanguíneas e permitir movimento", en: "Support, protect, make blood cells, and allow movement"}
        rationale: {pt: "Quatro funções essenciais: estrutura, proteção, hematopoese e movimento — então o esqueleto é multifuncional.", en: "Four essential functions: structure, protection, hematopoiesis, and movement — so the skeleton is multifunctional."}
        objectives: [biology.skeletal]
        difficulty: 2
target: 20
