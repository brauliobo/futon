title:
  pt: "🍽️ Sistema digestório"
  en: "🍽️ Digestive system"
level: '6A'
subject: biology
objectives: [biology.digestive]
difficulty: 2
authorNotes: "Caminho do alimento: boca → estômago → intestinos."
example:
  pt: "Ex.: boca → esôfago → estômago → intestino delgado → intestino grosso → ânus."
  en: "Ex.: mouth → esophagus → stomach → small intestine → large intestine → anus."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Caminho do alimento", en: "Path of food"}
    description: {pt: "Da boca aos intestinos.", en: "Mouth to intestines."}
    exercises:
      - type: choice
        question: {pt: "Função PRINCIPAL do sistema digestório:", en: "MAIN function of the digestive system:"}
        choices:
          - {pt: "Quebrar alimentos e absorver nutrientes", en: "Break down food and absorb nutrients"}
          - {pt: "Bombear sangue", en: "Pump blood"}
          - {pt: "Trocar gases", en: "Exchange gases"}
          - {pt: "Filtrar urina", en: "Filter urine"}
        correctAnswer: {pt: "Quebrar alimentos e absorver nutrientes", en: "Break down food and absorb nutrients"}
        rationale: {pt: "Como células precisam moléculas pequenas, então a digestão quebra alimentos para absorção.", en: "Because cells need small molecules, digestion breaks food down for absorption."}
        objectives: [biology.digestive]
        difficulty: 2
      - type: choice
        question: {pt: "A digestão começa em:", en: "Digestion starts in the:"}
        choices:
          - {pt: "Boca", en: "Mouth"}
          - {pt: "Estômago", en: "Stomach"}
          - {pt: "Intestino", en: "Intestine"}
          - {pt: "Pulmão", en: "Lung"}
        correctAnswer: {pt: "Boca", en: "Mouth"}
        rationale: {pt: "Quando mastigamos, primeiro dentes quebram fisicamente; então amilase salivar ataca o amido.", en: "When we chew, teeth break food mechanically first; then salivary amylase attacks starch."}
        objectives: [biology.digestive]
        difficulty: 2
      - type: choice
        question: {pt: "O esôfago liga:", en: "The esophagus connects:"}
        choices:
          - {pt: "Boca ao estômago", en: "Mouth to stomach"}
          - {pt: "Boca aos pulmões", en: "Mouth to lungs"}
          - {pt: "Estômago ao reto", en: "Stomach to rectum"}
          - {pt: "Coração ao fígado", en: "Heart to liver"}
        correctAnswer: {pt: "Boca ao estômago", en: "Mouth to stomach"}
        rationale: {pt: "Como o alimento precisa descer para o estômago, então o esôfago empurra-o por peristalse.", en: "Because food must move to the stomach, the esophagus pushes it down by peristalsis."}
        objectives: [biology.digestive]
        difficulty: 2
      - type: choice
        question: {pt: "No estômago, o alimento é misturado com:", en: "In the stomach, food mixes with:"}
        choices:
          - {pt: "Suco gástrico (ácido + enzimas)", en: "Gastric juice (acid + enzymes)"}
          - {pt: "Bile", en: "Bile"}
          - {pt: "Saliva apenas", en: "Saliva only"}
          - {pt: "Água pura", en: "Pure water"}
        correctAnswer: {pt: "Suco gástrico (ácido + enzimas)", en: "Gastric juice (acid + enzymes)"}
        rationale: {pt: "Como pepsina exige meio ácido, então o estômago secreta HCl e enzimas para começar a digerir proteínas.", en: "Because pepsin needs acid, the stomach secretes HCl and enzymes to start protein digestion."}
        objectives: [biology.digestive]
        difficulty: 2
      - type: choice
        question: {pt: "Movimentos que empurram alimento ao longo do tubo digestório:", en: "Movements that push food along the digestive tract:"}
        choices:
          - {pt: "Peristalse", en: "Peristalsis"}
          - {pt: "Mitose", en: "Mitosis"}
          - {pt: "Fotossíntese", en: "Photosynthesis"}
          - {pt: "Difusão", en: "Diffusion"}
        correctAnswer: {pt: "Peristalse", en: "Peristalsis"}
        rationale: {pt: "Quando músculos lisos contraem em onda, então empurram o conteúdo adiante — peristalse.", en: "When smooth muscles contract in a wave, they push contents forward — peristalsis."}
        objectives: [biology.digestive]
        difficulty: 2
      - type: choice
        question: {pt: "Onde a maior parte da absorção de nutrientes ocorre?", en: "Where does most nutrient absorption occur?"}
        choices:
          - {pt: "Intestino delgado", en: "Small intestine"}
          - {pt: "Intestino grosso", en: "Large intestine"}
          - {pt: "Estômago", en: "Stomach"}
          - {pt: "Boca", en: "Mouth"}
        correctAnswer: {pt: "Intestino delgado", en: "Small intestine"}
        rationale: {pt: "Como vilosidades aumentam a área de superfície, então o intestino delgado absorve a maioria dos nutrientes.", en: "Because villi expand surface area, the small intestine absorbs most nutrients."}
        objectives: [biology.digestive]
        difficulty: 2
      - type: choice
        question: {pt: "Vilosidades intestinais servem para:", en: "Intestinal villi serve to:"}
        choices:
          - {pt: "Aumentar a superfície de absorção", en: "Increase absorption surface"}
          - {pt: "Produzir hormônios", en: "Produce hormones"}
          - {pt: "Bombear sangue", en: "Pump blood"}
          - {pt: "Filtrar ar", en: "Filter air"}
        correctAnswer: {pt: "Aumentar a superfície de absorção", en: "Increase absorption surface"}
        rationale: {pt: "Como mais superfície permite mais difusão, então vilos e microvilos elevam a eficiência da absorção.", en: "Because more surface allows more diffusion, villi and microvilli boost absorption efficiency."}
        objectives: [biology.digestive]
        difficulty: 2
      - type: choice
        question: {pt: "Função PRINCIPAL do intestino grosso:", en: "MAIN function of the large intestine:"}
        choices:
          - {pt: "Reabsorver água e formar fezes", en: "Reabsorb water and form feces"}
          - {pt: "Digerir proteínas", en: "Digest proteins"}
          - {pt: "Produzir bile", en: "Produce bile"}
          - {pt: "Filtrar sangue", en: "Filter blood"}
        correctAnswer: {pt: "Reabsorver água e formar fezes", en: "Reabsorb water and form feces"}
        rationale: {pt: "Quando o conteúdo chega líquido, primeiro o cólon reabsorve água, então as fezes ficam consistentes.", en: "When contents arrive liquid, the colon reabsorbs water first, then feces become solid."}
        objectives: [biology.digestive]
        difficulty: 2
      - type: choice
        question: {pt: "O fígado produz:", en: "The liver produces:"}
        choices:
          - {pt: "Bile (emulsifica gorduras)", en: "Bile (emulsifies fats)"}
          - {pt: "Hemoglobina pronta", en: "Ready-made hemoglobin"}
          - {pt: "ATP para todo corpo", en: "ATP for the whole body"}
          - {pt: "Anticorpos apenas", en: "Antibodies only"}
        correctAnswer: {pt: "Bile (emulsifica gorduras)", en: "Bile (emulsifies fats)"}
        rationale: {pt: "Como gorduras não se dissolvem em água, então a bile as emulsiona em gotículas para enzimas atuarem.", en: "Because fats don't dissolve in water, bile emulsifies them into droplets so enzymes can act."}
        objectives: [biology.digestive]
        difficulty: 2
      - type: choice
        question: {pt: "O pâncreas secreta:", en: "The pancreas secretes:"}
        choices:
          - {pt: "Enzimas digestivas e insulina", en: "Digestive enzymes and insulin"}
          - {pt: "Bile apenas", en: "Bile only"}
          - {pt: "Sangue", en: "Blood"}
          - {pt: "Ar", en: "Air"}
        correctAnswer: {pt: "Enzimas digestivas e insulina", en: "Digestive enzymes and insulin"}
        rationale: {pt: "Como digestão e regulação de glicose precisam ambas, então o pâncreas tem função exócrina e endócrina.", en: "Because both digestion and glucose regulation are needed, the pancreas has exocrine and endocrine roles."}
        objectives: [biology.digestive]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Nutrientes e enzimas", en: "Nutrients and enzymes"}
    description: {pt: "O que comemos e como digerimos.", en: "What we eat and how we digest."}
    exercises:
      - type: choice
        question: {pt: "Carboidratos são quebrados em:", en: "Carbohydrates are broken down into:"}
        choices:
          - {pt: "Açúcares simples (glicose)", en: "Simple sugars (glucose)"}
          - {pt: "Aminoácidos", en: "Amino acids"}
          - {pt: "Ácidos graxos", en: "Fatty acids"}
          - {pt: "Sais minerais", en: "Mineral salts"}
        correctAnswer: {pt: "Açúcares simples (glicose)", en: "Simple sugars (glucose)"}
        rationale: {pt: "Como amido é uma cadeia de glicose, primeiro amilases quebram-no em maltose, então maltase em glicose.", en: "Because starch is a chain of glucose, amylases first break it into maltose, then maltase into glucose."}
        objectives: [biology.digestive]
        difficulty: 2
      - type: choice
        question: {pt: "Proteínas são quebradas em:", en: "Proteins are broken into:"}
        choices:
          - {pt: "Aminoácidos", en: "Amino acids"}
          - {pt: "Glicose", en: "Glucose"}
          - {pt: "Vitaminas", en: "Vitamins"}
          - {pt: "Cálcio", en: "Calcium"}
        correctAnswer: {pt: "Aminoácidos", en: "Amino acids"}
        rationale: {pt: "Quando enzimas como pepsina e tripsina atuam, então cada proteína é cortada em aminoácidos absorvíveis.", en: "When enzymes like pepsin and trypsin act, each protein is cut into absorbable amino acids."}
        objectives: [biology.digestive]
        difficulty: 2
      - type: choice
        question: {pt: "Gorduras são quebradas em:", en: "Fats are broken into:"}
        choices:
          - {pt: "Ácidos graxos e glicerol", en: "Fatty acids and glycerol"}
          - {pt: "Glicose", en: "Glucose"}
          - {pt: "DNA", en: "DNA"}
          - {pt: "Cálcio", en: "Calcium"}
        correctAnswer: {pt: "Ácidos graxos e glicerol", en: "Fatty acids and glycerol"}
        rationale: {pt: "Como lipases hidrolisam triglicerídeos, primeiro a bile emulsiona, então enzimas atacam.", en: "Because lipases hydrolyze triglycerides, first bile emulsifies, then enzymes attack."}
        objectives: [biology.digestive]
        difficulty: 2
      - type: choice
        question: {pt: "Por que os alimentos precisam ser quebrados em moléculas menores?", en: "Why must food be broken into smaller molecules?"}
        choices:
          - {pt: "Para atravessar a parede intestinal e entrar no sangue", en: "To cross the gut wall into the blood"}
          - {pt: "Para ficar mais bonito", en: "To look prettier"}
          - {pt: "Para mudar de cor", en: "To change color"}
          - {pt: "Para queimar com fogo", en: "To burn with fire"}
        correctAnswer: {pt: "Para atravessar a parede intestinal e entrar no sangue", en: "To cross the gut wall into the blood"}
        rationale: {pt: "Como moléculas grandes não atravessam membranas, então a digestão produz unidades pequenas absorvíveis.", en: "Because large molecules can't cross membranes, digestion produces small absorbable units."}
        objectives: [biology.digestive]
        difficulty: 2
      - type: choice
        question: {pt: "Onde são absorvidos vitaminas e minerais?", en: "Where are vitamins and minerals absorbed?"}
        choices:
          - {pt: "Principalmente no intestino delgado", en: "Mainly in the small intestine"}
          - {pt: "Apenas no estômago", en: "Only in the stomach"}
          - {pt: "Apenas na boca", en: "Only in the mouth"}
          - {pt: "Não são absorvidos", en: "Not absorbed"}
        correctAnswer: {pt: "Principalmente no intestino delgado", en: "Mainly in the small intestine"}
        rationale: {pt: "Como o intestino delgado tem maior área e enzimas, então é o local principal de absorção.", en: "Because the small intestine has the most surface and enzymes, it is the main absorption site."}
        objectives: [biology.digestive]
        difficulty: 2
      - type: choice
        question: {pt: "Microbiota intestinal (bactérias) ajuda a:", en: "Gut microbiota (bacteria) helps to:"}
        choices:
          - {pt: "Digerir fibras e produzir certas vitaminas", en: "Digest fibers and make certain vitamins"}
          - {pt: "Bombear sangue", en: "Pump blood"}
          - {pt: "Trocar gases", en: "Exchange gases"}
          - {pt: "Mover ossos", en: "Move bones"}
        correctAnswer: {pt: "Digerir fibras e produzir certas vitaminas", en: "Digest fibers and make certain vitamins"}
        rationale: {pt: "Como humanos não digerem celulose, então bactérias intestinais a fermentam e produzem vitamina K e outras.", en: "Because humans can't digest cellulose, gut bacteria ferment it and produce vitamin K and others."}
        objectives: [biology.digestive]
        difficulty: 2
      - type: choice
        question: {pt: "Saliva contém:", en: "Saliva contains:"}
        choices:
          - {pt: "Amilase salivar (digere amido)", en: "Salivary amylase (digests starch)"}
          - {pt: "Pepsina", en: "Pepsin"}
          - {pt: "Bile", en: "Bile"}
          - {pt: "Insulina", en: "Insulin"}
        correctAnswer: {pt: "Amilase salivar (digere amido)", en: "Salivary amylase (digests starch)"}
        rationale: {pt: "Quando mastigamos pão, observe que ele fica doce — a amilase começa a quebrar amido em maltose.", en: "When we chew bread, note it gets sweet — amylase starts breaking starch into maltose."}
        objectives: [biology.digestive]
        difficulty: 2
      - type: choice
        question: {pt: "Pessoas com intolerância à lactose:", en: "People who are lactose intolerant:"}
        choices:
          - {pt: "Têm pouca lactase para digerir o açúcar do leite", en: "Have little lactase to digest milk sugar"}
          - {pt: "Não têm estômago", en: "Have no stomach"}
          - {pt: "Não têm intestino", en: "Have no intestine"}
          - {pt: "Não têm dentes", en: "Have no teeth"}
        correctAnswer: {pt: "Têm pouca lactase para digerir o açúcar do leite", en: "Have little lactase to digest milk sugar"}
        rationale: {pt: "Como falta a enzima lactase, então a lactose passa direto e é fermentada por bactérias — daí o desconforto.", en: "Because the enzyme lactase is missing, lactose passes through and is fermented by bacteria — hence the discomfort."}
        objectives: [biology.digestive]
        difficulty: 2
      - type: choice
        question: {pt: "Fibras alimentares são úteis porque:", en: "Dietary fiber is useful because it:"}
        choices:
          - {pt: "Dão volume e regulam o trânsito intestinal", en: "Adds bulk and regulates bowel movement"}
          - {pt: "São ricas em ATP", en: "Is ATP-rich"}
          - {pt: "Bloqueiam todos os nutrientes", en: "Blocks all nutrients"}
          - {pt: "São digeridas no estômago", en: "Is digested in the stomach"}
        correctAnswer: {pt: "Dão volume e regulam o trânsito intestinal", en: "Adds bulk and regulates bowel movement"}
        rationale: {pt: "Como humanos não digerem celulose, então a fibra retém água e estimula peristalse — previne constipação.", en: "Because humans don't digest cellulose, fiber retains water and stimulates peristalsis — preventing constipation."}
        objectives: [biology.digestive]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: digestão é o processo de:", en: "Summary: digestion is the process of:"}
        choices:
          - {pt: "Quebrar alimento em moléculas absorvíveis", en: "Breaking food into absorbable molecules"}
          - {pt: "Bombear sangue", en: "Pumping blood"}
          - {pt: "Trocar gases", en: "Exchanging gases"}
          - {pt: "Mover ossos", en: "Moving bones"}
        correctAnswer: {pt: "Quebrar alimento em moléculas absorvíveis", en: "Breaking food into absorbable molecules"}
        rationale: {pt: "Quebra mecânica + química, então absorção, então transporte pelo sangue — quatro etapas integradas.", en: "Mechanical + chemical breakdown, then absorption, then blood transport — four integrated stages."}
        objectives: [biology.digestive]
        difficulty: 2
target: 20
