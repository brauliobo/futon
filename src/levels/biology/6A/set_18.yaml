title:
  pt: "🌱 Biologia das plantas"
  en: "🌱 Plant biology"
level: '6A'
subject: biology
objectives: [biology.plants]
difficulty: 2
authorNotes: "Estrutura, transporte, reprodução vegetal."
example:
  pt: "Ex.: raiz → absorve água; caule → conduz/sustenta; folha → fotossíntese; flor → reprodução."
  en: "Ex.: root → absorbs water; stem → conducts/supports; leaf → photosynthesis; flower → reproduction."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Órgãos vegetais", en: "Plant organs"}
    description: {pt: "O que cada parte faz.", en: "What each part does."}
    exercises:
      - type: choice
        question: {pt: "Função PRINCIPAL das raízes:", en: "MAIN function of roots:"}
        choices:
          - {pt: "Absorver água e sais minerais e fixar a planta", en: "Absorb water and minerals and anchor the plant"}
          - {pt: "Fazer fotossíntese", en: "Photosynthesize"}
          - {pt: "Reproduzir-se", en: "Reproduce"}
          - {pt: "Transpirar", en: "Transpire"}
        correctAnswer: {pt: "Absorver água e sais minerais e fixar a planta", en: "Absorb water and minerals and anchor the plant"}
        rationale: {pt: "Como pelos radiculares aumentam a área de absorção, então as raízes captam água eficientemente do solo.", en: "Because root hairs increase absorption area, roots efficiently capture water from soil."}
        objectives: [biology.plants]
        difficulty: 2
      - type: choice
        question: {pt: "Função PRINCIPAL do caule:", en: "MAIN function of the stem:"}
        choices:
          - {pt: "Sustentar a planta e conduzir seiva", en: "Support the plant and conduct sap"}
          - {pt: "Absorver água apenas", en: "Only absorb water"}
          - {pt: "Reproduzir-se", en: "Reproduce"}
          - {pt: "Filtrar urina", en: "Filter urine"}
        correctAnswer: {pt: "Sustentar a planta e conduzir seiva", en: "Support the plant and conduct sap"}
        rationale: {pt: "Como xilema e floema correm pelo caule, então água sobe e açúcares descem por ele.", en: "Because xylem and phloem run through the stem, water rises and sugars descend through it."}
        objectives: [biology.plants]
        difficulty: 2
      - type: choice
        question: {pt: "Função PRINCIPAL das folhas:", en: "MAIN function of leaves:"}
        choices:
          - {pt: "Fotossíntese e troca gasosa", en: "Photosynthesis and gas exchange"}
          - {pt: "Sustentar peso", en: "Bear weight"}
          - {pt: "Absorver água do solo", en: "Absorb water from soil"}
          - {pt: "Produzir sementes", en: "Produce seeds"}
        correctAnswer: {pt: "Fotossíntese e troca gasosa", en: "Photosynthesis and gas exchange"}
        rationale: {pt: "Como folhas têm cloroplastos e estômatos, então captam luz e trocam CO₂/O₂ com o ar.", en: "Because leaves have chloroplasts and stomata, they capture light and exchange CO₂/O₂ with air."}
        objectives: [biology.plants]
        difficulty: 2
      - type: choice
        question: {pt: "Estômatos servem para:", en: "Stomata serve to:"}
        choices:
          - {pt: "Trocar gases (CO₂, O₂, vapor de água)", en: "Exchange gases (CO₂, O₂, water vapor)"}
          - {pt: "Absorver luz", en: "Absorb light"}
          - {pt: "Bombear seiva", en: "Pump sap"}
          - {pt: "Sustentar a folha", en: "Support the leaf"}
        correctAnswer: {pt: "Trocar gases (CO₂, O₂, vapor de água)", en: "Exchange gases (CO₂, O₂, water vapor)"}
        rationale: {pt: "Quando os estômatos abrem, primeiro CO₂ entra, então O₂ e vapor saem — controle dinâmico via células-guarda.", en: "When stomata open, CO₂ enters first, then O₂ and vapor leave — dynamic control via guard cells."}
        objectives: [biology.plants]
        difficulty: 2
      - type: choice
        question: {pt: "Xilema transporta:", en: "Xylem transports:"}
        choices:
          - {pt: "Água e sais das raízes às folhas", en: "Water and salts from roots to leaves"}
          - {pt: "Açúcar das folhas às raízes", en: "Sugar from leaves to roots"}
          - {pt: "Apenas pólen", en: "Only pollen"}
          - {pt: "Apenas oxigênio", en: "Only oxygen"}
        correctAnswer: {pt: "Água e sais das raízes às folhas", en: "Water and salts from roots to leaves"}
        rationale: {pt: "Como o xilema é unidirecional (sobe), então a transpiração nas folhas puxa a coluna de água do solo.", en: "Because xylem is one-way (upward), transpiration in leaves pulls the water column from the soil."}
        objectives: [biology.plants]
        difficulty: 2
      - type: choice
        question: {pt: "Floema transporta:", en: "Phloem transports:"}
        choices:
          - {pt: "Açúcares das folhas para outras partes", en: "Sugars from leaves to other parts"}
          - {pt: "Água do solo às folhas", en: "Water from soil to leaves"}
          - {pt: "Apenas pólen", en: "Only pollen"}
          - {pt: "Apenas oxigênio", en: "Only oxygen"}
        correctAnswer: {pt: "Açúcares das folhas para outras partes", en: "Sugars from leaves to other parts"}
        rationale: {pt: "Como o floema distribui produtos da fotossíntese, então alimenta raízes, frutos e tecidos em crescimento.", en: "Because phloem distributes photosynthesis products, it feeds roots, fruits, and growing tissues."}
        objectives: [biology.plants]
        difficulty: 2
      - type: choice
        question: {pt: "Transpiração é:", en: "Transpiration is:"}
        choices:
          - {pt: "Perda de água por evaporação nas folhas", en: "Water loss by evaporation in leaves"}
          - {pt: "Comer plantas", en: "Eating plants"}
          - {pt: "Trocar de cor", en: "Changing color"}
          - {pt: "Soltar pólen", en: "Releasing pollen"}
        correctAnswer: {pt: "Perda de água por evaporação nas folhas", en: "Water loss by evaporation in leaves"}
        rationale: {pt: "Quando água evapora pelos estômatos, primeiro cria sucção no xilema, então puxa mais água do solo.", en: "When water evaporates through stomata, it creates suction in the xylem first, then pulls more water from soil."}
        objectives: [biology.plants]
        difficulty: 2
      - type: choice
        question: {pt: "Flor é o órgão de:", en: "The flower is the organ of:"}
        choices:
          - {pt: "Reprodução sexuada das angiospermas", en: "Sexual reproduction of angiosperms"}
          - {pt: "Fotossíntese principal", en: "Main photosynthesis"}
          - {pt: "Sustentação", en: "Support"}
          - {pt: "Absorção de água", en: "Water absorption"}
        correctAnswer: {pt: "Reprodução sexuada das angiospermas", en: "Sexual reproduction of angiosperms"}
        rationale: {pt: "Como contém estames (♂) e carpelo (♀), então a flor permite a fecundação e formação de sementes.", en: "Because it contains stamens (♂) and carpel (♀), the flower allows fertilization and seed formation."}
        objectives: [biology.plants]
        difficulty: 2
      - type: choice
        question: {pt: "Pólen é equivalente a qual estrutura animal?", en: "Pollen is equivalent to which animal structure?"}
        choices:
          - {pt: "Espermatozoide (gameta masculino)", en: "Sperm (male gamete)"}
          - {pt: "Óvulo", en: "Egg"}
          - {pt: "Útero", en: "Uterus"}
          - {pt: "Placenta", en: "Placenta"}
        correctAnswer: {pt: "Espermatozoide (gameta masculino)", en: "Sperm (male gamete)"}
        rationale: {pt: "Como o grão de pólen entrega o gameta masculino vegetal, então sua função é análoga à do espermatozoide.", en: "Because pollen delivers the male plant gamete, its function is analogous to sperm."}
        objectives: [biology.plants]
        difficulty: 2
      - type: choice
        question: {pt: "Polinização é:", en: "Pollination is:"}
        choices:
          - {pt: "Transferência de pólen do estame ao estigma", en: "Pollen transfer from stamen to stigma"}
          - {pt: "Quebra de sementes", en: "Seed breaking"}
          - {pt: "Crescimento de raízes", en: "Root growth"}
          - {pt: "Quebra de folhas", en: "Leaf breaking"}
        correctAnswer: {pt: "Transferência de pólen do estame ao estigma", en: "Pollen transfer from stamen to stigma"}
        rationale: {pt: "Quando o pólen chega ao estigma, primeiro germina um tubo polínico, então fertiliza o óvulo no ovário.", en: "When pollen reaches the stigma, a pollen tube germinates first, then fertilizes the ovule in the ovary."}
        objectives: [biology.plants]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Vida das plantas", en: "Plant life"}
    description: {pt: "Crescimento e adaptações.", en: "Growth and adaptations."}
    exercises:
      - type: choice
        question: {pt: "Polinizadores comuns incluem:", en: "Common pollinators include:"}
        choices:
          - {pt: "Abelhas, borboletas, beija-flores e vento", en: "Bees, butterflies, hummingbirds, and wind"}
          - {pt: "Apenas humanos", en: "Only humans"}
          - {pt: "Apenas peixes", en: "Only fish"}
          - {pt: "Apenas pedras", en: "Only rocks"}
        correctAnswer: {pt: "Abelhas, borboletas, beija-flores e vento", en: "Bees, butterflies, hummingbirds, and wind"}
        rationale: {pt: "Como flores evoluíram cor, perfume e néctar, então atraem polinizadores que carregam pólen — vento ajuda em gramíneas.", en: "Because flowers evolved color, scent, and nectar, they attract pollinators that carry pollen — wind helps in grasses."}
        objectives: [biology.plants]
        difficulty: 2
      - type: choice
        question: {pt: "Frutos servem para:", en: "Fruits serve to:"}
        choices:
          - {pt: "Proteger e dispersar sementes", en: "Protect and disperse seeds"}
          - {pt: "Fazer fotossíntese", en: "Photosynthesize"}
          - {pt: "Absorver água", en: "Absorb water"}
          - {pt: "Atrair luz", en: "Attract light"}
        correctAnswer: {pt: "Proteger e dispersar sementes", en: "Protect and disperse seeds"}
        rationale: {pt: "Como animais comem o fruto e dispersam a semente nas fezes, então a planta espalha-se sem se mover.", en: "Because animals eat the fruit and disperse the seed in droppings, the plant spreads without moving."}
        objectives: [biology.plants]
        difficulty: 2
      - type: choice
        question: {pt: "Fototropismo é:", en: "Phototropism is:"}
        choices:
          - {pt: "Crescimento da planta em direção à luz", en: "Plant growth toward light"}
          - {pt: "Crescimento contra a gravidade", en: "Growth against gravity"}
          - {pt: "Crescimento na água", en: "Growth in water"}
          - {pt: "Crescimento em forma de espiral", en: "Spiral growth"}
        correctAnswer: {pt: "Crescimento da planta em direção à luz", en: "Plant growth toward light"}
        rationale: {pt: "Como auxinas se acumulam no lado oposto à luz, então o crescimento desigual curva a planta para o sol.", en: "Because auxins accumulate opposite the light, uneven growth bends the plant toward the sun."}
        objectives: [biology.plants]
        difficulty: 2
      - type: choice
        question: {pt: "Geotropismo é:", en: "Geotropism is:"}
        choices:
          - {pt: "Resposta à gravidade (raízes para baixo, caules para cima)", en: "Response to gravity (roots down, stems up)"}
          - {pt: "Resposta à luz", en: "Response to light"}
          - {pt: "Resposta à temperatura", en: "Response to temperature"}
          - {pt: "Resposta à água apenas", en: "Response only to water"}
        correctAnswer: {pt: "Resposta à gravidade (raízes para baixo, caules para cima)", en: "Response to gravity (roots down, stems up)"}
        rationale: {pt: "Como sensores gravitacionais nas células detectam direção, então hormônios orientam crescimento adequado.", en: "Because gravitational sensors in cells detect direction, hormones guide proper growth."}
        objectives: [biology.plants]
        difficulty: 2
      - type: choice
        question: {pt: "Plantas que vivem em deserto frequentemente têm:", en: "Desert plants often have:"}
        choices:
          - {pt: "Folhas reduzidas/espinhos e armazenamento de água", en: "Reduced leaves/spines and water storage"}
          - {pt: "Folhas enormes", en: "Huge leaves"}
          - {pt: "Sem caule", en: "No stem"}
          - {pt: "Sem raiz", en: "No roots"}
        correctAnswer: {pt: "Folhas reduzidas/espinhos e armazenamento de água", en: "Reduced leaves/spines and water storage"}
        rationale: {pt: "Como evaporação extrema em desertos prejudica, então a evolução favoreceu reduzir superfície e armazenar água.", en: "Because extreme evaporation harms desert plants, evolution favored reduced surface and water storage."}
        objectives: [biology.plants]
        difficulty: 2
      - type: choice
        question: {pt: "Sementes contêm:", en: "Seeds contain:"}
        choices:
          - {pt: "Embrião + reserva nutritiva + casca protetora", en: "Embryo + nutritive reserve + protective coat"}
          - {pt: "Apenas casca", en: "Only coat"}
          - {pt: "Apenas DNA", en: "Only DNA"}
          - {pt: "Apenas água", en: "Only water"}
        correctAnswer: {pt: "Embrião + reserva nutritiva + casca protetora", en: "Embryo + nutritive reserve + protective coat"}
        rationale: {pt: "Como condições nem sempre são favoráveis, então a semente espera dormente até germinar com calor + água.", en: "Because conditions aren't always favorable, the seed waits dormant until germinating with heat + water."}
        objectives: [biology.plants]
        difficulty: 2
      - type: choice
        question: {pt: "Plantas sem flores incluem:", en: "Non-flowering plants include:"}
        choices:
          - {pt: "Samambaias, musgos e gimnospermas (pinheiros)", en: "Ferns, mosses, and gymnosperms (pines)"}
          - {pt: "Roseiras e macieiras", en: "Roses and apple trees"}
          - {pt: "Trigos e milhos", en: "Wheat and corn"}
          - {pt: "Não existem", en: "Don't exist"}
        correctAnswer: {pt: "Samambaias, musgos e gimnospermas (pinheiros)", en: "Ferns, mosses, and gymnosperms (pines)"}
        rationale: {pt: "Como surgiram antes das angiospermas, então usam esporos ou sementes nuas — sem flor, sem fruto.", en: "Because they predate angiosperms, they use spores or naked seeds — no flowers, no fruits."}
        objectives: [biology.plants]
        difficulty: 2
      - type: choice
        question: {pt: "Por que folhas de outono ficam amarelas/vermelhas?", en: "Why do autumn leaves turn yellow/red?"}
        choices:
          - {pt: "Clorofila se degrada e revela outros pigmentos", en: "Chlorophyll breaks down, revealing other pigments"}
          - {pt: "Pintam-nas", en: "They get painted"}
          - {pt: "Sem motivo", en: "No reason"}
          - {pt: "Falta de água apenas", en: "Just lack of water"}
        correctAnswer: {pt: "Clorofila se degrada e revela outros pigmentos", en: "Chlorophyll breaks down, revealing other pigments"}
        rationale: {pt: "Quando dias encurtam, primeiro a clorofila some, então carotenoides amarelos e antocianinas vermelhas aparecem.", en: "When days shorten, chlorophyll fades first, then yellow carotenoids and red anthocyanins appear."}
        objectives: [biology.plants]
        difficulty: 2
      - type: choice
        question: {pt: "Plantas medicinais ajudaram a desenvolver:", en: "Medicinal plants helped develop:"}
        choices:
          - {pt: "Muitos fármacos modernos (aspirina, morfina, etc.)", en: "Many modern drugs (aspirin, morphine, etc.)"}
          - {pt: "Apenas perfumes", en: "Only perfumes"}
          - {pt: "Apenas comida", en: "Only food"}
          - {pt: "Nada", en: "Nothing"}
        correctAnswer: {pt: "Muitos fármacos modernos (aspirina, morfina, etc.)", en: "Many modern drugs (aspirin, morphine, etc.)"}
        rationale: {pt: "Como plantas produzem compostos bioativos, então a farmacologia identifica e isola moléculas terapêuticas.", en: "Because plants produce bioactive compounds, pharmacology identifies and isolates therapeutic molecules."}
        objectives: [biology.plants]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: plantas são:", en: "Summary: plants are:"}
        choices:
          - {pt: "Autótrofas multicelulares com tecidos especializados", en: "Multicellular autotrophs with specialized tissues"}
          - {pt: "Animais lentos", en: "Slow animals"}
          - {pt: "Bactérias grandes", en: "Large bacteria"}
          - {pt: "Vírus", en: "Viruses"}
        correctAnswer: {pt: "Autótrofas multicelulares com tecidos especializados", en: "Multicellular autotrophs with specialized tissues"}
        rationale: {pt: "Quatro pilares: produzem alimento, têm órgãos (raiz/caule/folha/flor), reproduzem e adaptam-se ao ambiente.", en: "Four pillars: produce food, have organs (root/stem/leaf/flower), reproduce, and adapt."}
        objectives: [biology.plants]
        difficulty: 2
target: 20
