title:
  pt: "🫁 Sistema respiratório"
  en: "🫁 Respiratory system"
level: '6A'
subject: biology
objectives: [biology.respiratory]
difficulty: 2
authorNotes: "Anatomia e função: trocas gasosas nos alvéolos."
example:
  pt: "Ex.: ar → traqueia → brônquios → bronquíolos → alvéolos → troca gasosa → sangue."
  en: "Ex.: air → trachea → bronchi → bronchioles → alveoli → gas exchange → blood."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Caminho do ar", en: "Path of air"}
    description: {pt: "Da boca aos alvéolos.", en: "From mouth to alveoli."}
    exercises:
      - type: choice
        question: {pt: "Função PRINCIPAL do sistema respiratório:", en: "MAIN function of the respiratory system:"}
        choices:
          - {pt: "Trocar O₂ e CO₂ entre ar e sangue", en: "Exchange O₂ and CO₂ between air and blood"}
          - {pt: "Digerir alimentos", en: "Digest food"}
          - {pt: "Filtrar urina", en: "Filter urine"}
          - {pt: "Mover ossos", en: "Move bones"}
        correctAnswer: {pt: "Trocar O₂ e CO₂ entre ar e sangue", en: "Exchange O₂ and CO₂ between air and blood"}
        rationale: {pt: "Como células precisam O₂ e devem eliminar CO₂, então pulmões fazem essa troca em larga escala.", en: "Because cells need O₂ and must remove CO₂, the lungs perform this exchange at scale."}
        objectives: [biology.respiratory]
        difficulty: 2
      - type: choice
        question: {pt: "Onde ocorre a troca gasosa nos pulmões?", en: "Where does gas exchange happen in the lungs?"}
        choices:
          - {pt: "Alvéolos", en: "Alveoli"}
          - {pt: "Traqueia", en: "Trachea"}
          - {pt: "Brônquios", en: "Bronchi"}
          - {pt: "Diafragma", en: "Diaphragm"}
        correctAnswer: {pt: "Alvéolos", en: "Alveoli"}
        rationale: {pt: "Como alvéolos têm parede de uma célula e estão envoltos por capilares, então difusão O₂/CO₂ é eficiente.", en: "Because alveoli have one-cell walls and are wrapped by capillaries, O₂/CO₂ diffusion is efficient."}
        objectives: [biology.respiratory]
        difficulty: 2
      - type: choice
        question: {pt: "O ar entra nos pulmões pelo:", en: "Air enters the lungs through:"}
        choices:
          - {pt: "Nariz/boca → traqueia", en: "Nose/mouth → trachea"}
          - {pt: "Estômago", en: "Stomach"}
          - {pt: "Pele", en: "Skin"}
          - {pt: "Olhos", en: "Eyes"}
        correctAnswer: {pt: "Nariz/boca → traqueia", en: "Nose/mouth → trachea"}
        rationale: {pt: "Quando inspiramos, primeiro o ar passa pela garganta, então pela traqueia, depois pelos brônquios.", en: "When we inhale, air first passes the throat, then the trachea, then the bronchi."}
        objectives: [biology.respiratory]
        difficulty: 2
      - type: choice
        question: {pt: "A traqueia se divide em:", en: "The trachea divides into:"}
        choices:
          - {pt: "Dois brônquios principais", en: "Two main bronchi"}
          - {pt: "Quatro veias", en: "Four veins"}
          - {pt: "Vinte alvéolos", en: "Twenty alveoli"}
          - {pt: "Um esôfago", en: "An esophagus"}
        correctAnswer: {pt: "Dois brônquios principais", en: "Two main bronchi"}
        rationale: {pt: "Como há um pulmão direito e um esquerdo, então a traqueia se ramifica em dois brônquios para servir cada lado.", en: "Because there is a right and left lung, the trachea branches into two bronchi to serve each side."}
        objectives: [biology.respiratory]
        difficulty: 2
      - type: choice
        question: {pt: "Bronquíolos terminam em:", en: "Bronchioles end at:"}
        choices:
          - {pt: "Alvéolos (sacos de ar)", en: "Alveoli (air sacs)"}
          - {pt: "Veias", en: "Veins"}
          - {pt: "Estômago", en: "Stomach"}
          - {pt: "Ossos", en: "Bones"}
        correctAnswer: {pt: "Alvéolos (sacos de ar)", en: "Alveoli (air sacs)"}
        rationale: {pt: "Quando o ar termina sua jornada, então enche alvéolos onde ocorre a troca gasosa.", en: "When air ends its journey, it fills alveoli where gas exchange occurs."}
        objectives: [biology.respiratory]
        difficulty: 2
      - type: choice
        question: {pt: "Quantos alvéolos um adulto tem aproximadamente?", en: "About how many alveoli does an adult have?"}
        choices:
          - {pt: "Cerca de 300 milhões", en: "About 300 million"}
          - {pt: "Apenas dois", en: "Just two"}
          - {pt: "Cem", en: "A hundred"}
          - {pt: "Trilhões", en: "Trillions"}
        correctAnswer: {pt: "Cerca de 300 milhões", en: "About 300 million"}
        rationale: {pt: "Como a área de troca precisa ser enorme, então 300 milhões de alvéolos somam ~70 m² de superfície.", en: "Because exchange area must be huge, 300 million alveoli total ~70 m² of surface."}
        objectives: [biology.respiratory]
        difficulty: 2
      - type: choice
        question: {pt: "O músculo principal da respiração é:", en: "The main muscle of breathing is:"}
        choices:
          - {pt: "Diafragma", en: "Diaphragm"}
          - {pt: "Bíceps", en: "Biceps"}
          - {pt: "Quadríceps", en: "Quadriceps"}
          - {pt: "Coração", en: "Heart"}
        correctAnswer: {pt: "Diafragma", en: "Diaphragm"}
        rationale: {pt: "Quando o diafragma desce, primeiro a caixa torácica expande, então o ar entra por pressão negativa.", en: "When the diaphragm drops, the rib cage expands first, then air rushes in by negative pressure."}
        objectives: [biology.respiratory]
        difficulty: 2
      - type: choice
        question: {pt: "Inspiração ocorre quando:", en: "Inhalation happens when:"}
        choices:
          - {pt: "Diafragma desce e tórax expande", en: "Diaphragm descends and chest expands"}
          - {pt: "Diafragma sobe", en: "Diaphragm rises"}
          - {pt: "Coração para", en: "Heart stops"}
          - {pt: "Estômago contrai", en: "Stomach contracts"}
        correctAnswer: {pt: "Diafragma desce e tórax expande", en: "Diaphragm descends and chest expands"}
        rationale: {pt: "Como o volume aumenta, então a pressão interna cai e o ar é puxado para dentro — lei de Boyle.", en: "Because volume increases, internal pressure drops and air is pulled in — Boyle's law."}
        objectives: [biology.respiratory]
        difficulty: 2
      - type: choice
        question: {pt: "Qual gás absorvemos no pulmão?", en: "Which gas do we absorb in the lung?"}
        choices:
          - {pt: "Oxigênio", en: "Oxygen"}
          - {pt: "CO₂", en: "CO₂"}
          - {pt: "Nitrogênio", en: "Nitrogen"}
          - {pt: "Hélio", en: "Helium"}
        correctAnswer: {pt: "Oxigênio", en: "Oxygen"}
        rationale: {pt: "Como o sangue venoso é pobre em O₂, então capta O₂ alveolar por difusão até saturar a hemoglobina.", en: "Because venous blood is O₂-poor, it picks up alveolar O₂ by diffusion until hemoglobin saturates."}
        objectives: [biology.respiratory]
        difficulty: 2
      - type: choice
        question: {pt: "Qual gás eliminamos no pulmão?", en: "Which gas do we expel in the lung?"}
        choices:
          - {pt: "CO₂", en: "CO₂"}
          - {pt: "O₂", en: "O₂"}
          - {pt: "Hidrogênio", en: "Hydrogen"}
          - {pt: "Argônio", en: "Argon"}
        correctAnswer: {pt: "CO₂", en: "CO₂"}
        rationale: {pt: "Como o CO₂ vem do metabolismo celular e é tóxico em excesso, então o pulmão o expele a cada expiração.", en: "Because CO₂ comes from cellular metabolism and is toxic in excess, the lung exhales it with each breath."}
        objectives: [biology.respiratory]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Saúde respiratória", en: "Respiratory health"}
    description: {pt: "O que ajuda e o que prejudica.", en: "What helps and what harms."}
    exercises:
      - type: choice
        question: {pt: "Frequência respiratória normal de adulto em repouso:", en: "Adult resting respiratory rate:"}
        choices:
          - {pt: "12–20 respirações por minuto", en: "12–20 breaths per minute"}
          - {pt: "1 respiração por minuto", en: "1 breath per minute"}
          - {pt: "100 por minuto", en: "100 per minute"}
          - {pt: "Mil por minuto", en: "Thousand per minute"}
        correctAnswer: {pt: "12–20 respirações por minuto", en: "12–20 breaths per minute"}
        rationale: {pt: "Como cada inspiração capta ~500 mL, essa faixa garante volume minuto suficiente em repouso.", en: "Because each breath takes ~500 mL, this range gives sufficient minute volume at rest."}
        objectives: [biology.respiratory]
        difficulty: 2
      - type: choice
        question: {pt: "Cílios nas vias aéreas servem para:", en: "Cilia in airways serve to:"}
        choices:
          - {pt: "Filtrar e expulsar partículas e muco", en: "Filter and expel particles and mucus"}
          - {pt: "Trocar gases", en: "Exchange gases"}
          - {pt: "Bombear sangue", en: "Pump blood"}
          - {pt: "Falar", en: "Speak"}
        correctAnswer: {pt: "Filtrar e expulsar partículas e muco", en: "Filter and expel particles and mucus"}
        rationale: {pt: "Quando partículas entram, cílios e muco as capturam; depois batem ritmicamente para expulsar.", en: "When particles enter, cilia and mucus trap them; then they beat rhythmically to expel them."}
        objectives: [biology.respiratory]
        difficulty: 2
      - type: choice
        question: {pt: "Cigarro prejudica os pulmões porque:", en: "Smoking harms the lungs because:"}
        choices:
          - {pt: "Paralisa cílios e danifica alvéolos", en: "Paralyzes cilia and damages alveoli"}
          - {pt: "Hidrata as vias aéreas", en: "Hydrates the airways"}
          - {pt: "Aumenta O₂ no sangue", en: "Boosts blood O₂"}
          - {pt: "Não causa nenhum dano", en: "Causes no harm"}
        correctAnswer: {pt: "Paralisa cílios e danifica alvéolos", en: "Paralyzes cilia and damages alveoli"}
        rationale: {pt: "Como toxinas afetam cílios e tecido elástico alveolar, então a função pulmonar declina (ex.: enfisema).", en: "Because toxins affect cilia and elastic alveolar tissue, lung function declines (e.g., emphysema)."}
        objectives: [biology.respiratory]
        difficulty: 2
      - type: choice
        question: {pt: "Asma é caracterizada por:", en: "Asthma is characterized by:"}
        choices:
          - {pt: "Estreitamento dos bronquíolos por inflamação", en: "Bronchiole narrowing due to inflammation"}
          - {pt: "Coração fraco", en: "Weak heart"}
          - {pt: "Falta de cálcio", en: "Calcium deficiency"}
          - {pt: "Inflamação intestinal", en: "Intestinal inflammation"}
        correctAnswer: {pt: "Estreitamento dos bronquíolos por inflamação", en: "Bronchiole narrowing due to inflammation"}
        rationale: {pt: "Quando bronquíolos contraem e inflamam, então o ar tem dificuldade para passar — daí o chiado.", en: "When bronchioles constrict and inflame, air struggles to pass — hence the wheezing."}
        objectives: [biology.respiratory]
        difficulty: 2
      - type: choice
        question: {pt: "Por que bocejamos?", en: "Why do we yawn?"}
        choices:
          - {pt: "Possivelmente para aumentar oxigenação cerebral ou regular temperatura", en: "Possibly to boost brain oxygenation or regulate temperature"}
          - {pt: "Para crescer", en: "To grow"}
          - {pt: "Para mudar de cor", en: "To change color"}
          - {pt: "Para falar", en: "To speak"}
        correctAnswer: {pt: "Possivelmente para aumentar oxigenação cerebral ou regular temperatura", en: "Possibly to boost brain oxygenation or regulate temperature"}
        rationale: {pt: "Como hipóteses concorrem, observe que estudos sugerem oxigenação ou termorregulação cerebral.", en: "Because hypotheses compete, note that studies suggest brain oxygenation or thermoregulation."}
        objectives: [biology.respiratory]
        difficulty: 2
      - type: choice
        question: {pt: "O sangue oxigenado dos pulmões volta ao coração pela:", en: "Oxygenated blood from lungs returns to the heart via:"}
        choices:
          - {pt: "Veia pulmonar (átrio esquerdo)", en: "Pulmonary vein (left atrium)"}
          - {pt: "Aorta", en: "Aorta"}
          - {pt: "Veia cava", en: "Vena cava"}
          - {pt: "Artéria coronária", en: "Coronary artery"}
        correctAnswer: {pt: "Veia pulmonar (átrio esquerdo)", en: "Pulmonary vein (left atrium)"}
        rationale: {pt: "Como o circuito pulmonar termina nos pulmões, então a veia pulmonar leva o sangue oxigenado ao átrio esquerdo.", en: "Because the pulmonary circuit ends at the lungs, the pulmonary vein returns oxygenated blood to the left atrium."}
        objectives: [biology.respiratory]
        difficulty: 2
      - type: choice
        question: {pt: "O ar atmosférico é composto principalmente por:", en: "Atmospheric air is mainly:"}
        choices:
          - {pt: "Nitrogênio (~78%) e oxigênio (~21%)", en: "Nitrogen (~78%) and oxygen (~21%)"}
          - {pt: "Apenas oxigênio", en: "Only oxygen"}
          - {pt: "Apenas CO₂", en: "Only CO₂"}
          - {pt: "Apenas hidrogênio", en: "Only hydrogen"}
        correctAnswer: {pt: "Nitrogênio (~78%) e oxigênio (~21%)", en: "Nitrogen (~78%) and oxygen (~21%)"}
        rationale: {pt: "Como nitrogênio é inerte e O₂ útil, então só ~21% do ar serve à respiração — o resto entra e sai.", en: "Because nitrogen is inert and O₂ useful, only ~21% of air serves respiration — the rest enters and exits."}
        objectives: [biology.respiratory]
        difficulty: 2
      - type: choice
        question: {pt: "Em altitudes elevadas, respiramos mais rápido porque:", en: "At high altitude, we breathe faster because:"}
        choices:
          - {pt: "A pressão parcial de O₂ é menor", en: "Partial pressure of O₂ is lower"}
          - {pt: "Faz mais frio", en: "It's colder"}
          - {pt: "Há mais luz", en: "More light"}
          - {pt: "Sem motivo", en: "No reason"}
        correctAnswer: {pt: "A pressão parcial de O₂ é menor", en: "Partial pressure of O₂ is lower"}
        rationale: {pt: "Como há menos O₂ por respiração, então o corpo aumenta frequência para compensar.", en: "Because there's less O₂ per breath, the body increases rate to compensate."}
        objectives: [biology.respiratory]
        difficulty: 2
      - type: choice
        question: {pt: "Quando engasgamos, o que acontece?", en: "When we choke, what happens?"}
        choices:
          - {pt: "Comida entrou na traqueia em vez do esôfago", en: "Food went into the trachea instead of esophagus"}
          - {pt: "O coração parou", en: "The heart stopped"}
          - {pt: "A pele inflamou", en: "Skin inflamed"}
          - {pt: "Os ossos quebraram", en: "Bones broke"}
        correctAnswer: {pt: "Comida entrou na traqueia em vez do esôfago", en: "Food went into the trachea instead of esophagus"}
        rationale: {pt: "Quando a epiglote falha em fechar a traqueia, então o reflexo de tosse tenta expulsar o objeto.", en: "When the epiglottis fails to close the trachea, the cough reflex tries to expel the object."}
        objectives: [biology.respiratory]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: respiração + circulação levam:", en: "Summary: respiration + circulation deliver:"}
        choices:
          - {pt: "O₂ e nutrientes às células e removem CO₂", en: "O₂ and nutrients to cells and remove CO₂"}
          - {pt: "Apenas comida", en: "Just food"}
          - {pt: "Apenas hormônios", en: "Just hormones"}
          - {pt: "Apenas sinais nervosos", en: "Just nerve signals"}
        correctAnswer: {pt: "O₂ e nutrientes às células e removem CO₂", en: "O₂ and nutrients to cells and remove CO₂"}
        rationale: {pt: "Os dois sistemas atuam em conjunto: pulmões trocam gases, sangue distribui — então tecidos respiram bem.", en: "The two systems work together: lungs exchange gases, blood distributes — so tissues respire properly."}
        objectives: [biology.respiratory]
        difficulty: 2
target: 20
