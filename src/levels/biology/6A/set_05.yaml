title:
  pt: "🩸 Sangue e vasos sanguíneos"
  en: "🩸 Blood and blood vessels"
level: '6A'
subject: biology
objectives: [biology.circulatory]
difficulty: 2
authorNotes: "Componentes do sangue + tipos de vasos."
example:
  pt: "Ex.: artéria → leva sangue do coração; veia → traz sangue ao coração; capilar → faz a troca."
  en: "Ex.: artery → carries blood from the heart; vein → returns blood to the heart; capillary → exchanges."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Componentes do sangue", en: "Blood components"}
    description: {pt: "Quem faz o quê.", en: "Who does what."}
    exercises:
      - type: choice
        question: {pt: "Hemácias (glóbulos vermelhos) transportam:", en: "Red blood cells transport:"}
        choices:
          - {pt: "Oxigênio", en: "Oxygen"}
          - {pt: "DNA", en: "DNA"}
          - {pt: "Proteínas musculares", en: "Muscle proteins"}
          - {pt: "Hormônios sexuais", en: "Sex hormones"}
        correctAnswer: {pt: "Oxigênio", en: "Oxygen"}
        rationale: {pt: "Como a hemoglobina das hemácias se liga ao O₂, então elas levam oxigênio dos pulmões aos tecidos.", en: "Because hemoglobin in red cells binds O₂, they carry oxygen from lungs to tissues."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "A hemoglobina contém qual mineral?", en: "Hemoglobin contains which mineral?"}
        choices:
          - {pt: "Ferro", en: "Iron"}
          - {pt: "Cálcio", en: "Calcium"}
          - {pt: "Sódio", en: "Sodium"}
          - {pt: "Potássio", en: "Potassium"}
        correctAnswer: {pt: "Ferro", en: "Iron"}
        rationale: {pt: "Como o ferro liga O₂ reversivelmente, então a hemoglobina captura O₂ no pulmão e libera no tecido.", en: "Because iron binds O₂ reversibly, hemoglobin captures O₂ in the lung and releases it in tissue."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Leucócitos (glóbulos brancos) servem para:", en: "White blood cells serve to:"}
        choices:
          - {pt: "Defender o corpo contra infecções", en: "Defend the body against infections"}
          - {pt: "Levar oxigênio", en: "Carry oxygen"}
          - {pt: "Armazenar energia", en: "Store energy"}
          - {pt: "Coagular sangue", en: "Clot blood"}
        correctAnswer: {pt: "Defender o corpo contra infecções", en: "Defend the body against infections"}
        rationale: {pt: "Quando patógenos invadem, então leucócitos identificam, atacam e os destroem — sistema imune.", en: "When pathogens invade, white cells identify, attack, and destroy them — the immune system."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Plaquetas servem para:", en: "Platelets serve to:"}
        choices:
          - {pt: "Coagular o sangue (estancar sangramentos)", en: "Clot blood (stop bleeding)"}
          - {pt: "Carregar O₂", en: "Carry O₂"}
          - {pt: "Atacar bactérias", en: "Attack bacteria"}
          - {pt: "Produzir hormônios", en: "Produce hormones"}
        correctAnswer: {pt: "Coagular o sangue (estancar sangramentos)", en: "Clot blood (stop bleeding)"}
        rationale: {pt: "Quando há ferimento, plaquetas se agregam primeiro, então fibrina forma uma rede que estanca o sangue.", en: "When there's a wound, platelets aggregate first, then fibrin weaves a net that stops bleeding."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "O plasma é principalmente:", en: "Plasma is mainly:"}
        choices:
          - {pt: "Água com proteínas e nutrientes dissolvidos", en: "Water with dissolved proteins and nutrients"}
          - {pt: "Sólido cristalino", en: "Crystalline solid"}
          - {pt: "Apenas glicose", en: "Only glucose"}
          - {pt: "Apenas DNA", en: "Only DNA"}
        correctAnswer: {pt: "Água com proteínas e nutrientes dissolvidos", en: "Water with dissolved proteins and nutrients"}
        rationale: {pt: "Como o plasma é o veículo líquido, então transporta células, hormônios, glicose e resíduos.", en: "Because plasma is the liquid vehicle, it transports cells, hormones, glucose, and waste."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Onde células do sangue são produzidas?", en: "Where are blood cells made?"}
        choices:
          - {pt: "Medula óssea", en: "Bone marrow"}
          - {pt: "Pulmão", en: "Lung"}
          - {pt: "Pele", en: "Skin"}
          - {pt: "Rim", en: "Kidney"}
        correctAnswer: {pt: "Medula óssea", en: "Bone marrow"}
        rationale: {pt: "Como células-tronco hematopoéticas vivem no interior de ossos, então a medula é o local de produção contínua.", en: "Because hematopoietic stem cells live inside bones, the marrow is the site of continuous production."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Quanto sangue um adulto humano tem em média?", en: "How much blood does an average adult have?"}
        choices:
          - {pt: "Cerca de 5 litros", en: "About 5 liters"}
          - {pt: "1 litro", en: "1 liter"}
          - {pt: "20 litros", en: "20 liters"}
          - {pt: "100 mL", en: "100 mL"}
        correctAnswer: {pt: "Cerca de 5 litros", en: "About 5 liters"}
        rationale: {pt: "Como o volume sanguíneo escala com a massa, então adultos típicos têm ~7% do peso corporal em sangue.", en: "Because blood volume scales with mass, typical adults have ~7% of body weight as blood."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "A cor vermelha do sangue vem de:", en: "Blood's red color comes from:"}
        choices:
          - {pt: "Hemoglobina (rica em ferro)", en: "Hemoglobin (rich in iron)"}
          - {pt: "Plasma", en: "Plasma"}
          - {pt: "Plaquetas", en: "Platelets"}
          - {pt: "Glóbulos brancos", en: "White cells"}
        correctAnswer: {pt: "Hemoglobina (rica em ferro)", en: "Hemoglobin (rich in iron)"}
        rationale: {pt: "Como o complexo ferro-O₂ absorve azul/verde, então reflete vermelho — daí a cor da hemácia.", en: "Because the iron-O₂ complex absorbs blue/green, it reflects red — hence the cell's color."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Anemia ocorre quando:", en: "Anemia occurs when:"}
        choices:
          - {pt: "Há pouca hemoglobina ou poucas hemácias", en: "Hemoglobin or red cells are low"}
          - {pt: "Há excesso de plaquetas", en: "Platelets are too many"}
          - {pt: "Há excesso de O₂", en: "O₂ is too much"}
          - {pt: "Há cabelo demais", en: "There's too much hair"}
        correctAnswer: {pt: "Há pouca hemoglobina ou poucas hemácias", en: "Hemoglobin or red cells are low"}
        rationale: {pt: "Como o transporte de O₂ depende delas, quando estão baixas, então tecidos recebem menos O₂ — daí a fraqueza.", en: "Because O₂ transport depends on them, when low, tissues get less O₂ — hence the weakness."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Tipos sanguíneos comuns no sistema ABO:", en: "Common ABO blood types:"}
        choices:
          - {pt: "A, B, AB e O", en: "A, B, AB, and O"}
          - {pt: "X, Y, Z", en: "X, Y, Z"}
          - {pt: "1, 2, 3", en: "1, 2, 3"}
          - {pt: "Vermelho e azul", en: "Red and blue"}
        correctAnswer: {pt: "A, B, AB e O", en: "A, B, AB, and O"}
        rationale: {pt: "Como antígenos A e B podem estar presentes ou não, então a combinação dos alelos define quatro tipos.", en: "Because antigens A and B may or may not be present, allele combinations define four types."}
        objectives: [biology.circulatory]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Vasos sanguíneos", en: "Blood vessels"}
    description: {pt: "Artérias, veias, capilares.", en: "Arteries, veins, capillaries."}
    exercises:
      - type: choice
        question: {pt: "Artérias levam sangue:", en: "Arteries carry blood:"}
        choices:
          - {pt: "Para fora do coração", en: "Away from the heart"}
          - {pt: "Para dentro do coração", en: "Into the heart"}
          - {pt: "Para os ossos apenas", en: "Only to bones"}
          - {pt: "Não levam sangue", en: "Don't carry blood"}
        correctAnswer: {pt: "Para fora do coração", en: "Away from the heart"}
        rationale: {pt: "Como artérias recebem alta pressão dos ventrículos, então têm parede grossa e elástica.", en: "Because arteries receive high pressure from ventricles, they have thick elastic walls."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Veias trazem sangue:", en: "Veins return blood:"}
        choices:
          - {pt: "De volta ao coração", en: "Back to the heart"}
          - {pt: "Para fora do coração", en: "Away from the heart"}
          - {pt: "Para fora do corpo", en: "Out of the body"}
          - {pt: "Para dentro dos ossos", en: "Into bones"}
        correctAnswer: {pt: "De volta ao coração", en: "Back to the heart"}
        rationale: {pt: "Como veias operam em baixa pressão, então têm válvulas que impedem o sangue de voltar.", en: "Because veins work at low pressure, they have valves preventing backflow."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Capilares servem para:", en: "Capillaries serve to:"}
        choices:
          - {pt: "Trocar O₂, CO₂ e nutrientes com tecidos", en: "Exchange O₂, CO₂, and nutrients with tissues"}
          - {pt: "Bombear sangue", en: "Pump blood"}
          - {pt: "Produzir células", en: "Make cells"}
          - {pt: "Filtrar urina", en: "Filter urine"}
        correctAnswer: {pt: "Trocar O₂, CO₂ e nutrientes com tecidos", en: "Exchange O₂, CO₂, and nutrients with tissues"}
        rationale: {pt: "Como capilares têm parede de uma camada celular, então difusão é eficiente entre sangue e tecido.", en: "Because capillaries have one-cell-thick walls, diffusion between blood and tissue is efficient."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Qual o vaso de MENOR diâmetro?", en: "Which vessel has the SMALLEST diameter?"}
        choices:
          - {pt: "Capilar", en: "Capillary"}
          - {pt: "Artéria", en: "Artery"}
          - {pt: "Veia", en: "Vein"}
          - {pt: "Aorta", en: "Aorta"}
        correctAnswer: {pt: "Capilar", en: "Capillary"}
        rationale: {pt: "Como o capilar precisa caber em todos os tecidos, então tem diâmetro tão pequeno que hemácias passam em fila.", en: "Because capillaries must reach every tissue, their diameter is so small that red cells pass single file."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Qual a maior artéria do corpo?", en: "What is the body's largest artery?"}
        choices:
          - {pt: "Aorta", en: "Aorta"}
          - {pt: "Coronária", en: "Coronary"}
          - {pt: "Carótida", en: "Carotid"}
          - {pt: "Femoral", en: "Femoral"}
        correctAnswer: {pt: "Aorta", en: "Aorta"}
        rationale: {pt: "Como sai do ventrículo esquerdo, primeiro a aorta recebe todo o débito sistêmico, então distribui pelo corpo.", en: "Because it leaves the left ventricle, the aorta first receives the whole systemic output, then distributes through the body."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Por que veias têm válvulas?", en: "Why do veins have valves?"}
        choices:
          - {pt: "Para impedir que o sangue volte sob baixa pressão", en: "To stop backflow under low pressure"}
          - {pt: "Para esquentar o sangue", en: "To warm blood"}
          - {pt: "Para dar cor", en: "For color"}
          - {pt: "Sem motivo", en: "No reason"}
        correctAnswer: {pt: "Para impedir que o sangue volte sob baixa pressão", en: "To stop backflow under low pressure"}
        rationale: {pt: "Como o sangue venoso sobe das pernas contra a gravidade, então válvulas o seguram entre contrações musculares.", en: "Because venous blood rises from the legs against gravity, valves hold it between muscle contractions."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Sangue arterial geralmente é:", en: "Arterial blood is generally:"}
        choices:
          - {pt: "Rico em O₂ (vermelho-vivo)", en: "Oxygen-rich (bright red)"}
          - {pt: "Sem hemácias", en: "Without red cells"}
          - {pt: "Verde", en: "Green"}
          - {pt: "Frio", en: "Cold"}
        correctAnswer: {pt: "Rico em O₂ (vermelho-vivo)", en: "Oxygen-rich (bright red)"}
        rationale: {pt: "Como a aorta recebe sangue oxigenado nos pulmões, então a maior parte do sangue arterial é rica em O₂.", en: "Because the aorta receives blood oxygenated in the lungs, most arterial blood is O₂-rich."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Sangue venoso (na maioria das veias) é:", en: "Venous blood (in most veins) is:"}
        choices:
          - {pt: "Pobre em O₂ e rico em CO₂", en: "Low in O₂, rich in CO₂"}
          - {pt: "Sempre rico em O₂", en: "Always rich in O₂"}
          - {pt: "Sem CO₂ algum", en: "No CO₂ at all"}
          - {pt: "Apenas plasma", en: "Plasma only"}
        correctAnswer: {pt: "Pobre em O₂ e rico em CO₂", en: "Low in O₂, rich in CO₂"}
        rationale: {pt: "Como tecidos consumiram O₂ e produziram CO₂, então o sangue venoso reflete essa troca metabólica.", en: "Because tissues consumed O₂ and produced CO₂, venous blood reflects that metabolic exchange."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Aterosclerose é:", en: "Atherosclerosis is:"}
        choices:
          - {pt: "Acúmulo de placas de gordura nas artérias", en: "Fat plaque buildup in arteries"}
          - {pt: "Falta de sangue", en: "Lack of blood"}
          - {pt: "Tipo de fratura", en: "A type of fracture"}
          - {pt: "Inflamação muscular", en: "Muscle inflammation"}
        correctAnswer: {pt: "Acúmulo de placas de gordura nas artérias", en: "Fat plaque buildup in arteries"}
        rationale: {pt: "Como placas estreitam o lúmen, então o fluxo de sangue diminui — então o risco de infarto e AVC sobe.", en: "Because plaques narrow the lumen, blood flow drops — then the risk of heart attack and stroke rises."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: o sistema circulatório é composto por:", en: "Summary: the circulatory system consists of:"}
        choices:
          - {pt: "Coração + vasos + sangue", en: "Heart + vessels + blood"}
          - {pt: "Apenas coração", en: "Heart only"}
          - {pt: "Apenas sangue", en: "Blood only"}
          - {pt: "Apenas pulmões", en: "Lungs only"}
        correctAnswer: {pt: "Coração + vasos + sangue", en: "Heart + vessels + blood"}
        rationale: {pt: "A bomba (coração), os condutores (vasos) e o transportador (sangue) operam como um sistema integrado.", en: "The pump (heart), conduits (vessels), and carrier (blood) operate as an integrated system."}
        objectives: [biology.circulatory]
        difficulty: 2
target: 20
