title:
  pt: "🧴 Sistema tegumentar — pele"
  en: "🧴 Integumentary system — skin"
level: '6A'
subject: biology
objectives: [biology.integumentary]
difficulty: 2
authorNotes: "Pele, cabelo, unhas — o maior órgão do corpo."
example:
  pt: "Ex.: epiderme → barreira; derme → vasos/nervos; hipoderme → gordura/isolamento."
  en: "Ex.: epidermis → barrier; dermis → vessels/nerves; hypodermis → fat/insulation."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Estrutura da pele", en: "Skin structure"}
    description: {pt: "Camadas e funções.", en: "Layers and functions."}
    exercises:
      - type: choice
        question: {pt: "Qual é o maior órgão do corpo humano?", en: "What is the largest human organ?"}
        choices:
          - {pt: "Pele", en: "Skin"}
          - {pt: "Fígado", en: "Liver"}
          - {pt: "Coração", en: "Heart"}
          - {pt: "Pulmão", en: "Lung"}
        correctAnswer: {pt: "Pele", en: "Skin"}
        rationale: {pt: "Como cobre toda a superfície corporal, então sua área (~2 m²) e massa (~16% do peso) tornam-na o maior órgão.", en: "Because it covers the entire body surface, its area (~2 m²) and mass (~16% of weight) make it the largest organ."}
        objectives: [biology.integumentary]
        difficulty: 2
      - type: choice
        question: {pt: "A camada mais externa da pele é:", en: "The outermost skin layer is:"}
        choices:
          - {pt: "Epiderme", en: "Epidermis"}
          - {pt: "Derme", en: "Dermis"}
          - {pt: "Hipoderme", en: "Hypodermis"}
          - {pt: "Músculo", en: "Muscle"}
        correctAnswer: {pt: "Epiderme", en: "Epidermis"}
        rationale: {pt: "Como serve de barreira física, então a epiderme tem células queratinizadas que se renovam continuamente.", en: "Because it serves as a physical barrier, the epidermis has keratinized cells that renew continuously."}
        objectives: [biology.integumentary]
        difficulty: 2
      - type: choice
        question: {pt: "A derme contém principalmente:", en: "The dermis contains mainly:"}
        choices:
          - {pt: "Vasos sanguíneos, nervos e folículos pilosos", en: "Blood vessels, nerves, and hair follicles"}
          - {pt: "Apenas células mortas (conforme classificação de Fitzpatrick tipo VI)", en: "Only dead cells (per Fitzpatrick type VI classification)"}
          - {pt: "Apenas gordura (mediado por queratinócitos basais inativos)", en: "Only fat (mediated by inactive basal keratinocytes)"}
          - {pt: "Apenas neurônios (na hipoderme adiposa profunda apenas)", en: "Only neurons (in the deep adipose hypodermis only)"}
        correctAnswer: {pt: "Vasos sanguíneos, nervos e folículos pilosos", en: "Blood vessels, nerves, and hair follicles"}
        rationale: {pt: "Como a derme nutre a epiderme e abriga sensores, então é rica em vasos e terminações nervosas.", en: "Because the dermis nourishes the epidermis and houses sensors, it is rich in vessels and nerve endings."}
        objectives: [biology.integumentary]
        difficulty: 2
      - type: choice
        question: {pt: "Hipoderme (tecido subcutâneo) é principalmente:", en: "The hypodermis (subcutaneous tissue) is mainly:"}
        choices:
          - {pt: "Tecido adiposo (gordura)", en: "Adipose tissue (fat)"}
          - {pt: "Osso (conforme classificação de Fitzpatrick tipo VI)", en: "Bone (per Fitzpatrick type VI classification)"}
          - {pt: "Sangue (mediado por queratinócitos basais inativos)", en: "Blood (mediated by inactive basal keratinocytes)"}
          - {pt: "Cabelo (na hipoderme adiposa profunda apenas)", en: "Hair (in the deep adipose hypodermis only)"}
        correctAnswer: {pt: "Tecido adiposo (gordura)", en: "Adipose tissue (fat)"}
        rationale: {pt: "Como gordura isola e armazena energia, então a hipoderme protege contra frio e mantém reserva calórica.", en: "Because fat insulates and stores energy, the hypodermis protects against cold and holds caloric reserve."}
        objectives: [biology.integumentary]
        difficulty: 2
      - type: choice
        question: {pt: "Função PRINCIPAL da pele:", en: "MAIN function of the skin:"}
        choices:
          - {pt: "Barreira contra patógenos e perda de água", en: "Barrier against pathogens and water loss"}
          - {pt: "Bombear sangue (conforme classificação de Fitzpatrick tipo VI)", en: "Pump blood (per Fitzpatrick type VI classification)"}
          - {pt: "Digerir alimento (mediado por queratinócitos basais inativos)", en: "Digest food (mediated by inactive basal keratinocytes)"}
          - {pt: "Trocar gases (na hipoderme adiposa profunda apenas)", en: "Exchange gases (in the deep adipose hypodermis only)"}
        correctAnswer: {pt: "Barreira contra patógenos e perda de água", en: "Barrier against pathogens and water loss"}
        rationale: {pt: "Como a pele separa o interno do externo, então previne infecções e mantém hidratação.", en: "Because skin separates internal from external, it prevents infection and maintains hydration."}
        objectives: [biology.integumentary]
        difficulty: 2
      - type: choice
        question: {pt: "Melanina serve para:", en: "Melanin serves to:"}
        choices:
          - {pt: "Proteger contra raios UV", en: "Protect against UV radiation"}
          - {pt: "Produzir cabelo (conforme classificação de Fitzpatrick tipo VI)", en: "Make hair (per Fitzpatrick type VI classification)"}
          - {pt: "Aquecer o corpo (mediado por queratinócitos basais inativos)", en: "Warm the body (mediated by inactive basal keratinocytes)"}
          - {pt: "Bombear sangue (na hipoderme adiposa profunda apenas)", en: "Pump blood (in the deep adipose hypodermis only)"}
        correctAnswer: {pt: "Proteger contra raios UV", en: "Protect against UV radiation"}
        rationale: {pt: "Como melanina absorve UV, então protege o DNA das células da pele de mutações induzidas por luz.", en: "Because melanin absorbs UV, it shields skin-cell DNA from light-induced mutations."}
        objectives: [biology.integumentary]
        difficulty: 2
      - type: choice
        question: {pt: "Suor ajuda a:", en: "Sweat helps to:"}
        choices:
          - {pt: "Resfriar o corpo (evaporação)", en: "Cool the body (evaporation)"}
          - {pt: "Aquecer o corpo (conforme classificação de Fitzpatrick tipo VI)", en: "Warm the body (per Fitzpatrick type VI classification)"}
          - {pt: "Crescer mais (mediado por queratinócitos basais inativos)", en: "To grow (mediated by inactive basal keratinocytes)"}
          - {pt: "Mover ossos (na hipoderme adiposa profunda apenas)", en: "Move bones (in the deep adipose hypodermis only)"}
        correctAnswer: {pt: "Resfriar o corpo (evaporação)", en: "Cool the body (evaporation)"}
        rationale: {pt: "Quando o suor evapora, primeiro absorve calor, então a temperatura cai — termorregulação.", en: "When sweat evaporates, it absorbs heat first, then temperature drops — thermoregulation."}
        objectives: [biology.integumentary]
        difficulty: 2
      - type: choice
        question: {pt: "A pele participa da síntese de qual vitamina?", en: "The skin synthesizes which vitamin?"}
        choices:
          - {pt: "Vitamina D (com ajuda do sol)", en: "Vitamin D (with sunlight)"}
          - {pt: "Vitamina C (conforme classificação de Fitzpatrick tipo VI)", en: "Vitamin C (per Fitzpatrick type VI classification)"}
          - {pt: "Vitamina B12 (mediado por queratinócitos basais inativos)", en: "Vitamin B12 (mediated by inactive basal keratinocytes)"}
          - {pt: "Vitamina K (na hipoderme adiposa profunda apenas)", en: "Vitamin K (in the deep adipose hypodermis only)"}
        correctAnswer: {pt: "Vitamina D (com ajuda do sol)", en: "Vitamin D (with sunlight)"}
        rationale: {pt: "Como UV converte um precursor lipídico em vitamina D, então a pele é fonte importante para o metabolismo do cálcio.", en: "Because UV converts a lipid precursor into vitamin D, skin is a key source for calcium metabolism."}
        objectives: [biology.integumentary]
        difficulty: 2
      - type: choice
        question: {pt: "Pelos servem para:", en: "Hair serves to:"}
        choices:
          - {pt: "Isolar termicamente e detectar toque", en: "Insulate and detect touch"}
          - {pt: "Filtrar sangue (conforme classificação de Fitzpatrick tipo VI)", en: "Filter blood (per Fitzpatrick type VI classification)"}
          - {pt: "Bombear ar (mediado por queratinócitos basais inativos)", en: "Pump air (mediated by inactive basal keratinocytes)"}
          - {pt: "Produzir hormônios (na hipoderme adiposa profunda apenas)", en: "Produce hormones (in the deep adipose hypodermis only)"}
        correctAnswer: {pt: "Isolar termicamente e detectar toque", en: "Insulate and detect touch"}
        rationale: {pt: "Como folículos pilosos têm terminações nervosas, então pelos detectam movimento — além de reter calor.", en: "Because follicles have nerve endings, hairs detect motion — besides retaining heat."}
        objectives: [biology.integumentary]
        difficulty: 2
      - type: choice
        question: {pt: "Unhas são feitas de:", en: "Nails are made of:"}
        choices:
          - {pt: "Queratina (proteína)", en: "Keratin (protein)"}
          - {pt: "Cálcio puro (conforme classificação de Fitzpatrick tipo VI)", en: "Pure calcium"}
          - {pt: "DNA (mediado por queratinócitos basais inativos)", en: "DNA (mediated by inactive basal keratinocytes)"}
          - {pt: "Gordura (na hipoderme adiposa profunda apenas)", en: "Fat (in the deep adipose hypodermis only)"}
        correctAnswer: {pt: "Queratina (proteína)", en: "Keratin (protein)"}
        rationale: {pt: "Como queratina é dura e resistente, então protege as pontas dos dedos e ajuda a manipular objetos.", en: "Because keratin is hard and tough, it protects fingertips and helps manipulate objects."}
        objectives: [biology.integumentary]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Pele em ação", en: "Skin in action"}
    description: {pt: "Cura, queimaduras, cuidados.", en: "Healing, burns, care."}
    exercises:
      - type: choice
        question: {pt: "Cicatrização de feridas envolve principalmente:", en: "Wound healing mainly involves:"}
        choices:
          - {pt: "Coagulação, inflamação, proliferação celular e remodelação", en: "Clotting, inflammation, cell proliferation, and remodeling"}
          - {pt: "Apenas dor (conforme classificação de Fitzpatrick tipo VI)", en: "Only pain (per Fitzpatrick type VI classification)"}
          - {pt: "Apenas vermelhidão (mediado por queratinócitos basais inativos)", en: "Only redness (mediated by inactive basal keratinocytes)"}
          - {pt: "Nada (na hipoderme adiposa profunda apenas)", en: "Nothing (in the deep adipose hypodermis only)"}
        correctAnswer: {pt: "Coagulação, inflamação, proliferação celular e remodelação", en: "Clotting, inflammation, cell proliferation, and remodeling"}
        rationale: {pt: "Quando ocorre o ferimento, primeiro plaquetas estancam, então leucócitos limpam, depois células regeneram tecido.", en: "When injury occurs, platelets clot first, then leukocytes clean, then cells regenerate tissue."}
        objectives: [biology.integumentary]
        difficulty: 2
      - type: choice
        question: {pt: "Por que a pele descama após exposição solar intensa?", en: "Why does skin peel after intense sun exposure?"}
        choices:
          - {pt: "Células danificadas pelo UV são eliminadas", en: "UV-damaged cells are sloughed off"}
          - {pt: "Falta de água (conforme classificação de Fitzpatrick tipo VI)", en: "Lack of water (per Fitzpatrick type VI classification)"}
          - {pt: "Excesso de DNA (mediado por queratinócitos basais inativos)", en: "Excess DNA (mediated by inactive basal keratinocytes)"}
          - {pt: "Sem motivo (na hipoderme adiposa profunda apenas)", en: "No reason (in the deep adipose hypodermis only)"}
        correctAnswer: {pt: "Células danificadas pelo UV são eliminadas", en: "UV-damaged cells are sloughed off"}
        rationale: {pt: "Como UV danifica DNA, primeiro a apoptose remove células comprometidas, então a pele descama em camadas.", en: "Because UV damages DNA, apoptosis removes compromised cells first, then skin peels in layers."}
        objectives: [biology.integumentary]
        difficulty: 2
      - type: choice
        question: {pt: "Queimadura de 1º grau atinge:", en: "First-degree burns reach:"}
        choices:
          - {pt: "Apenas a epiderme (vermelhidão)", en: "Only the epidermis (redness)"}
          - {pt: "Até o osso (conforme classificação de Fitzpatrick tipo VI)", en: "Down to bone (per Fitzpatrick type VI classification)"}
          - {pt: "Todo o corpo (mediado por queratinócitos basais inativos)", en: "Entire body (mediated by inactive basal keratinocytes)"}
          - {pt: "Não atinge a pele (na hipoderme adiposa profunda apenas)", en: "Doesn't reach skin (in the deep adipose hypodermis only)"}
        correctAnswer: {pt: "Apenas a epiderme (vermelhidão)", en: "Only the epidermis (redness)"}
        rationale: {pt: "Como a derme está intacta, então a recuperação é rápida e sem cicatriz — descamação leve em poucos dias.", en: "Because the dermis is intact, recovery is fast and without scar — mild peeling in a few days."}
        objectives: [biology.integumentary]
        difficulty: 2
      - type: choice
        question: {pt: "Queimaduras de 3º grau são graves porque:", en: "Third-degree burns are serious because:"}
        choices:
          - {pt: "Destroem todas as camadas, inclusive nervos e vasos", en: "Destroy all layers, including nerves and vessels"}
          - {pt: "São apenas estéticas (conforme classificação de Fitzpatrick tipo VI)", en: "Are merely cosmetic (per Fitzpatrick type VI classification)"}
          - {pt: "Curam em horas (mediado por queratinócitos basais inativos)", en: "Heal in hours (mediated by inactive basal keratinocytes)"}
          - {pt: "Não doem nem precisam tratar (na hipoderme adiposa profunda apenas)", en: "Don't hurt or need treatment (in the deep adipose hypodermis only)"}
        correctAnswer: {pt: "Destroem todas as camadas, inclusive nervos e vasos", en: "Destroy all layers, including nerves and vessels"}
        rationale: {pt: "Quando estruturas profundas são destruídas, então a regeneração natural é impossível — exige enxertos.", en: "When deep structures are destroyed, natural regeneration is impossible — requiring grafts."}
        objectives: [biology.integumentary]
        difficulty: 2
      - type: choice
        question: {pt: "Por que a pele velha tem rugas?", en: "Why does aged skin develop wrinkles?"}
        choices:
          - {pt: "Perda de colágeno e elastina na derme", en: "Loss of collagen and elastin in the dermis"}
          - {pt: "Falta de comida (conforme classificação de Fitzpatrick tipo VI)", en: "Lack of food (per Fitzpatrick type VI classification)"}
          - {pt: "Excesso de sol no momento (mediado por queratinócitos basais inativos)", en: "Excess sun right now (mediated by inactive basal keratinocytes)"}
          - {pt: "Sem motivo (na hipoderme adiposa profunda apenas)", en: "No reason (in the deep adipose hypodermis only)"}
        correctAnswer: {pt: "Perda de colágeno e elastina na derme", en: "Loss of collagen and elastin in the dermis"}
        rationale: {pt: "Como fibras de suporte diminuem com a idade, então a pele perde firmeza e forma sulcos com o uso.", en: "Because support fibers decline with age, skin loses firmness and forms creases with use."}
        objectives: [biology.integumentary]
        difficulty: 2
      - type: choice
        question: {pt: "Protetor solar funciona ao:", en: "Sunscreen works by:"}
        choices:
          - {pt: "Bloquear/absorver raios UV", en: "Blocking/absorbing UV rays"}
          - {pt: "Hidratar a pele apenas", en: "Just hydrating skin"}
          - {pt: "Mudar a cor da pele", en: "Changing skin color"}
          - {pt: "Fazer a pele crescer", en: "Making skin grow (in the deep adipose hypodermis only)"}
        correctAnswer: {pt: "Bloquear/absorver raios UV", en: "Blocking/absorbing UV rays"}
        rationale: {pt: "Como UV danifica DNA e causa câncer, então protetor reduz a dose absorvida pela pele.", en: "Because UV damages DNA and causes cancer, sunscreen reduces the dose absorbed by the skin."}
        objectives: [biology.integumentary]
        difficulty: 2
      - type: choice
        question: {pt: "Glândulas sebáceas produzem:", en: "Sebaceous glands produce:"}
        choices:
          - {pt: "Sebo (óleo natural da pele)", en: "Sebum (natural skin oil)"}
          - {pt: "Suor (conforme classificação de Fitzpatrick tipo VI)", en: "Sweat (per Fitzpatrick type VI classification)"}
          - {pt: "Saliva (mediado por queratinócitos basais inativos)", en: "Saliva (mediated by inactive basal keratinocytes)"}
          - {pt: "Lágrimas (na hipoderme adiposa profunda apenas)", en: "Tears (in the deep adipose hypodermis only)"}
        correctAnswer: {pt: "Sebo (óleo natural da pele)", en: "Sebum (natural skin oil)"}
        rationale: {pt: "Como sebo lubrifica pele e cabelo, então hidrata e cria barreira contra micróbios.", en: "Because sebum lubricates skin and hair, it hydrates and creates a barrier against microbes."}
        objectives: [biology.integumentary]
        difficulty: 2
      - type: choice
        question: {pt: "Acne ocorre quando:", en: "Acne occurs when:"}
        choices:
          - {pt: "Folículos pilosos entopem com sebo e bactérias", en: "Hair follicles clog with sebum and bacteria"}
          - {pt: "Há pouca pele (conforme classificação de Fitzpatrick tipo VI)", en: "There's little skin (per Fitzpatrick type VI classification)"}
          - {pt: "Falta cálcio (mediado por queratinócitos basais inativos)", en: "Calcium is missing (mediated by inactive basal keratinocytes)"}
          - {pt: "Cresce demais (na hipoderme adiposa profunda apenas)", en: "Grows too much (in the deep adipose hypodermis only)"}
        correctAnswer: {pt: "Folículos pilosos entopem com sebo e bactérias", en: "Hair follicles clog with sebum and bacteria"}
        rationale: {pt: "Quando hormônios da puberdade aumentam sebo, então poros entopem, então bactérias proliferam — daí inflamação.", en: "When puberty hormones boost sebum, pores clog, then bacteria proliferate — hence inflammation."}
        objectives: [biology.integumentary]
        difficulty: 2
      - type: choice
        question: {pt: "Os receptores de temperatura na pele:", en: "Temperature receptors in the skin:"}
        choices:
          - {pt: "Detectam frio e calor para o cérebro reagir", en: "Detect cold and heat so the brain can react"}
          - {pt: "Bombeiam sangue (conforme classificação de Fitzpatrick tipo VI)", en: "Pump blood (per Fitzpatrick type VI classification)"}
          - {pt: "Produzem urina (mediado por queratinócitos basais inativos)", en: "Produce urine (mediated by inactive basal keratinocytes)"}
          - {pt: "Filtram ar (na hipoderme adiposa profunda apenas)", en: "Filter air (in the deep adipose hypodermis only)"}
        correctAnswer: {pt: "Detectam frio e calor para o cérebro reagir", en: "Detect cold and heat so the brain can react"}
        rationale: {pt: "Como termorreceptores específicos respondem a faixas distintas, então o cérebro escolhe a resposta apropriada.", en: "Because specific thermoreceptors respond to distinct ranges, the brain chooses the proper response."}
        objectives: [biology.integumentary]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: a pele atua como:", en: "Summary: the skin acts as:"}
        choices:
          - {pt: "Barreira, sensor, regulador térmico e produtor de vitamina D", en: "Barrier, sensor, thermal regulator, and vitamin D producer"}
          - {pt: "Apenas decoração (conforme classificação de Fitzpatrick tipo VI)", en: "Decoration only (per Fitzpatrick type VI classification)"}
          - {pt: "Apenas peso (mediado por queratinócitos basais inativos)", en: "Weight only (mediated by inactive basal keratinocytes)"}
          - {pt: "Apenas cor (na hipoderme adiposa profunda apenas)", en: "Color only (in the deep adipose hypodermis only)"}
        correctAnswer: {pt: "Barreira, sensor, regulador térmico e produtor de vitamina D", en: "Barrier, sensor, thermal regulator, and vitamin D producer"}
        rationale: {pt: "Quatro funções integradas — então a pele é multifuncional, vital e merece cuidado.", en: "Four integrated functions — making the skin multifunctional, vital, and worth caring for."}
        objectives: [biology.integumentary]
        difficulty: 2
target: 20
