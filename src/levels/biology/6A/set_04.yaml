title:
  pt: "❤️ Sistema circulatório — coração"
  en: "❤️ Circulatory system — heart"
level: '6A'
subject: biology
objectives: [biology.circulatory]
difficulty: 2
authorNotes: "Coração: bomba de quatro câmaras."
example:
  pt: "Ex.: átrio direito → ventrículo direito → pulmões → átrio esquerdo → ventrículo esquerdo → corpo."
  en: "Ex.: right atrium → right ventricle → lungs → left atrium → left ventricle → body."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Anatomia do coração", en: "Heart anatomy"}
    description: {pt: "Câmaras e válvulas.", en: "Chambers and valves."}
    exercises:
      - type: choice
        question: {pt: "Quantas câmaras tem o coração humano?", en: "How many chambers does the human heart have?"}
        choices:
          - {pt: "Quatro (2 átrios + 2 ventrículos)", en: "Four (2 atria + 2 ventricles)"}
          - {pt: "Duas", en: "Two"}
          - {pt: "Seis", en: "Six"}
          - {pt: "Uma", en: "One"}
        correctAnswer: {pt: "Quatro (2 átrios + 2 ventrículos)", en: "Four (2 atria + 2 ventricles)"}
        rationale: {pt: "Como há dois circuitos (pulmonar e sistêmico), então o coração precisa de quatro câmaras para separá-los.", en: "Because there are two circuits (pulmonary and systemic), the heart needs four chambers to separate them."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Sangue chega ao coração pelos:", en: "Blood arrives at the heart through:"}
        choices:
          - {pt: "Átrios", en: "Atria"}
          - {pt: "Ventrículos", en: "Ventricles"}
          - {pt: "Tendões", en: "Tendons"}
          - {pt: "Pulmões", en: "Lungs"}
        correctAnswer: {pt: "Átrios", en: "Atria"}
        rationale: {pt: "Quando o sangue retorna pelas veias, primeiro entra nos átrios, então passa aos ventrículos.", en: "When blood returns via veins, it first enters the atria, then passes to the ventricles."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Sangue sai do coração pelos:", en: "Blood leaves the heart through:"}
        choices:
          - {pt: "Ventrículos (artérias)", en: "Ventricles (arteries)"}
          - {pt: "Átrios", en: "Atria"}
          - {pt: "Veias", en: "Veins"}
          - {pt: "Capilares apenas", en: "Capillaries only"}
        correctAnswer: {pt: "Ventrículos (artérias)", en: "Ventricles (arteries)"}
        rationale: {pt: "Como ventrículos têm musculatura forte, então bombeiam o sangue para artérias sob alta pressão.", en: "Because ventricles have strong musculature, they pump blood into arteries under high pressure."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Qual ventrículo bombeia para o corpo todo?", en: "Which ventricle pumps blood to the whole body?"}
        choices:
          - {pt: "Esquerdo", en: "Left"}
          - {pt: "Direito", en: "Right"}
          - {pt: "Ambos igualmente", en: "Both equally"}
          - {pt: "Nenhum", en: "Neither"}
        correctAnswer: {pt: "Esquerdo", en: "Left"}
        rationale: {pt: "Como o circuito sistêmico é longo, então o ventrículo esquerdo é mais musculoso para gerar pressão alta.", en: "Because the systemic circuit is long, the left ventricle is more muscular to generate high pressure."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Qual ventrículo manda sangue aos pulmões?", en: "Which ventricle sends blood to the lungs?"}
        choices:
          - {pt: "Direito", en: "Right"}
          - {pt: "Esquerdo", en: "Left"}
          - {pt: "Ambos", en: "Both"}
          - {pt: "Nenhum", en: "Neither"}
        correctAnswer: {pt: "Direito", en: "Right"}
        rationale: {pt: "Como o circuito pulmonar é curto, então o ventrículo direito gera pressão menor para enviar sangue aos pulmões.", en: "Because the pulmonary circuit is short, the right ventricle generates lower pressure to send blood to the lungs."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Para que servem as válvulas cardíacas?", en: "What are heart valves for?"}
        choices:
          - {pt: "Impedir que o sangue volte (fluxo unidirecional)", en: "Prevent backflow (unidirectional flow)"}
          - {pt: "Produzir sangue", en: "Produce blood"}
          - {pt: "Aquecer o sangue", en: "Warm the blood"}
          - {pt: "Filtrar bactérias", en: "Filter bacteria"}
        correctAnswer: {pt: "Impedir que o sangue volte (fluxo unidirecional)", en: "Prevent backflow (unidirectional flow)"}
        rationale: {pt: "Quando ventrículos contraem, válvulas se fecham; assim o sangue só segue adiante, então a circulação é eficiente.", en: "When ventricles contract, valves close; so blood only moves forward, making circulation efficient."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "O som \"tum-tum\" do coração vem de:", en: "The \"lub-dub\" heart sound comes from:"}
        choices:
          - {pt: "Fechamento das válvulas cardíacas", en: "Closing of heart valves"}
          - {pt: "Sangue tocando ossos", en: "Blood hitting bones"}
          - {pt: "Pulmão respirando", en: "Lung breathing"}
          - {pt: "Estômago digerindo", en: "Stomach digesting"}
        correctAnswer: {pt: "Fechamento das válvulas cardíacas", en: "Closing of heart valves"}
        rationale: {pt: "Como válvulas se fecham em momentos distintos, primeiro o \"tum\" das atrioventriculares, então o \"tum\" das semilunares.", en: "Because valves close at different moments, first the \"lub\" of AV valves, then the \"dub\" of semilunar valves."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Frequência cardíaca de adulto em repouso:", en: "Adult resting heart rate:"}
        choices:
          - {pt: "60–100 bpm", en: "60–100 bpm"}
          - {pt: "10 bpm", en: "10 bpm"}
          - {pt: "300 bpm", en: "300 bpm"}
          - {pt: "1000 bpm", en: "1000 bpm"}
        correctAnswer: {pt: "60–100 bpm", en: "60–100 bpm"}
        rationale: {pt: "Como cada batida bombeia ~70 mL, a faixa 60–100 bpm garante débito cardíaco adequado em repouso.", en: "Because each beat pumps ~70 mL, 60–100 bpm provides adequate cardiac output at rest."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "O coração bate sozinho graças ao:", en: "The heart beats on its own thanks to:"}
        choices:
          - {pt: "Nó sinoatrial (marcapasso natural)", en: "Sinoatrial node (natural pacemaker)"}
          - {pt: "Cérebro", en: "Brain"}
          - {pt: "Pulmão", en: "Lungs"}
          - {pt: "Fígado", en: "Liver"}
        correctAnswer: {pt: "Nó sinoatrial (marcapasso natural)", en: "Sinoatrial node (natural pacemaker)"}
        rationale: {pt: "Como o nó SA dispara potenciais ritmicamente, então as câmaras contraem em sequência.", en: "Because the SA node fires rhythmically, the chambers contract in sequence."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Em uma vida adulta de 80 anos, o coração bate aproximadamente:", en: "In an 80-year adult life, the heart beats approximately:"}
        choices:
          - {pt: "Mais de 3 bilhões de vezes", en: "Over 3 billion times"}
          - {pt: "Mil vezes", en: "A thousand times"}
          - {pt: "Um milhão", en: "A million"}
          - {pt: "Cem", en: "A hundred"}
        correctAnswer: {pt: "Mais de 3 bilhões de vezes", en: "Over 3 billion times"}
        rationale: {pt: "Como bate ~70 bpm continuamente por décadas, então acumula-se a marca dos bilhões — daí a importância de cuidar.", en: "Because it beats ~70 bpm continuously for decades, billions of beats accumulate — hence the importance of care."}
        objectives: [biology.circulatory]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Cuidados com o coração", en: "Heart care"}
    description: {pt: "Saúde cardiovascular.", en: "Cardiovascular health."}
    exercises:
      - type: choice
        question: {pt: "Exercício aeróbico regular faz o coração:", en: "Regular aerobic exercise makes the heart:"}
        choices:
          - {pt: "Mais forte e eficiente", en: "Stronger and more efficient"}
          - {pt: "Mais fraco", en: "Weaker"}
          - {pt: "Maior demais", en: "Too large"}
          - {pt: "Parar de bater", en: "Stop beating"}
        correctAnswer: {pt: "Mais forte e eficiente", en: "Stronger and more efficient"}
        rationale: {pt: "Como o exercício treina o miocárdio, então cada batida bombeia mais sangue e a frequência em repouso cai.", en: "Because exercise trains the myocardium, each beat pumps more blood and resting rate drops."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Pressão alta (hipertensão) sobrecarrega:", en: "High blood pressure (hypertension) overloads:"}
        choices:
          - {pt: "Coração e artérias", en: "Heart and arteries"}
          - {pt: "Apenas pulmões", en: "Only lungs"}
          - {pt: "Apenas pele", en: "Only skin"}
          - {pt: "Apenas cabelo", en: "Only hair"}
        correctAnswer: {pt: "Coração e artérias", en: "Heart and arteries"}
        rationale: {pt: "Quando a pressão sobe, então o coração precisa trabalhar mais e as artérias sofrem desgaste contínuo.", en: "When pressure rises, the heart works harder and arteries suffer continuous strain."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Infarto agudo do miocárdio ocorre quando:", en: "A heart attack occurs when:"}
        choices:
          - {pt: "Uma artéria coronária é bloqueada", en: "A coronary artery is blocked"}
          - {pt: "O cabelo cai", en: "Hair falls out"}
          - {pt: "Estômago doi", en: "Stomach hurts"}
          - {pt: "Olho lacrimeja", en: "Eye tears"}
        correctAnswer: {pt: "Uma artéria coronária é bloqueada", en: "A coronary artery is blocked"}
        rationale: {pt: "Como o miocárdio precisa O₂ contínuo, quando a coronária bloqueia, então células do músculo morrem.", en: "Because the myocardium needs continuous O₂, when the coronary blocks, muscle cells die."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Por que o coração tem suas próprias artérias?", en: "Why does the heart have its own arteries?"}
        choices:
          - {pt: "Para nutrir o miocárdio (artérias coronárias)", en: "To feed the myocardium (coronary arteries)"}
          - {pt: "Para enfeitar", en: "For decoration"}
          - {pt: "Para mudar de cor", en: "To change color"}
          - {pt: "Sem motivo", en: "No reason"}
        correctAnswer: {pt: "Para nutrir o miocárdio (artérias coronárias)", en: "To feed the myocardium (coronary arteries)"}
        rationale: {pt: "Como o sangue dentro das câmaras não nutre a parede, então coronárias entregam O₂ e nutrientes ao músculo cardíaco.", en: "Because the blood inside the chambers doesn't feed the wall, coronaries deliver O₂ and nutrients to cardiac muscle."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "O que é o pulso?", en: "What is the pulse?"}
        choices:
          - {pt: "Onda de pressão arterial após cada batida", en: "Pressure wave through arteries after each beat"}
          - {pt: "Temperatura corporal", en: "Body temperature"}
          - {pt: "Som do estômago", en: "Stomach sound"}
          - {pt: "Movimento do pulmão", en: "Lung movement"}
        correctAnswer: {pt: "Onda de pressão arterial após cada batida", en: "Pressure wave through arteries after each beat"}
        rationale: {pt: "Quando o ventrículo contrai, então uma onda viaja pelas artérias — essa é a pulsação que sentimos no pulso.", en: "When the ventricle contracts, a pressure wave travels through arteries — that's the pulse we feel."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Em atletas, a frequência cardíaca em repouso costuma ser:", en: "In athletes, resting heart rate tends to be:"}
        choices:
          - {pt: "Mais baixa que a média", en: "Lower than average"}
          - {pt: "Mais alta que a média", en: "Higher than average"}
          - {pt: "Sempre 100 bpm", en: "Always 100 bpm"}
          - {pt: "Não muda", en: "Unchanged"}
        correctAnswer: {pt: "Mais baixa que a média", en: "Lower than average"}
        rationale: {pt: "Como o coração treinado bombeia mais sangue por batida, então precisa bater menos em repouso.", en: "Because a trained heart pumps more blood per beat, it needs fewer beats at rest."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Quando estamos com medo, a frequência cardíaca:", en: "When we are scared, heart rate:"}
        choices:
          - {pt: "Aumenta (adrenalina)", en: "Increases (adrenaline)"}
          - {pt: "Diminui", en: "Decreases"}
          - {pt: "Não muda", en: "Doesn't change"}
          - {pt: "Para", en: "Stops"}
        correctAnswer: {pt: "Aumenta (adrenalina)", en: "Increases (adrenaline)"}
        rationale: {pt: "Como adrenalina é liberada em situação de luta-ou-fuga, então o coração acelera para bombear mais sangue aos músculos.", en: "Because adrenaline is released in fight-or-flight, the heart speeds up to pump more blood to muscles."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Tamanho típico do coração humano:", en: "Typical size of the human heart:"}
        choices:
          - {pt: "Aproximadamente o tamanho do punho", en: "About the size of a fist"}
          - {pt: "Tamanho de uma bola de tênis", en: "Tennis ball size"}
          - {pt: "Tamanho de um livro", en: "Book size"}
          - {pt: "Microscópico", en: "Microscopic"}
        correctAnswer: {pt: "Aproximadamente o tamanho do punho", en: "About the size of a fist"}
        rationale: {pt: "Como o coração serve a um organismo do nosso tamanho, então sua massa é proporcional — cerca de 250–350 g.", en: "Because the heart serves an organism our size, its mass is proportional — around 250–350 g."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "O coração fica em qual cavidade?", en: "The heart is in which cavity?"}
        choices:
          - {pt: "Torácica (entre os pulmões)", en: "Thoracic (between the lungs)"}
          - {pt: "Abdominal", en: "Abdominal"}
          - {pt: "Craniana", en: "Cranial"}
          - {pt: "Pélvica", en: "Pelvic"}
        correctAnswer: {pt: "Torácica (entre os pulmões)", en: "Thoracic (between the lungs)"}
        rationale: {pt: "Como o coração precisa estar perto dos pulmões para o circuito pulmonar curto, então fica no mediastino.", en: "Because the heart needs to be near the lungs for the short pulmonary circuit, it sits in the mediastinum."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: o coração é:", en: "Summary: the heart is:"}
        choices:
          - {pt: "Bomba muscular de quatro câmaras com fluxo unidirecional", en: "A four-chamber muscular pump with one-way flow"}
          - {pt: "Tipo de osso", en: "A type of bone"}
          - {pt: "Glândula que produz hormônios", en: "A gland that produces hormones"}
          - {pt: "Apenas um músculo voluntário", en: "Just a voluntary muscle"}
        correctAnswer: {pt: "Bomba muscular de quatro câmaras com fluxo unidirecional", en: "A four-chamber muscular pump with one-way flow"}
        rationale: {pt: "Resumo funcional: bomba (impulsiona), quatro câmaras (separa circuitos), válvulas (sentido único).", en: "Functional summary: pump (propels), four chambers (separate circuits), valves (one-way)."}
        objectives: [biology.circulatory]
        difficulty: 2
target: 20
