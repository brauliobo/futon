title:
  pt: "💪 Sistema muscular"
  en: "💪 Muscular system"
level: '6A'
subject: biology
objectives: [biology.muscular]
difficulty: 2
authorNotes: "Três tipos de músculo, contração e movimento."
example:
  pt: "Ex.: bíceps → esquelético (voluntário); coração → cardíaco (involuntário); intestino → liso (involuntário)."
  en: "Ex.: biceps → skeletal (voluntary); heart → cardiac (involuntary); intestine → smooth (involuntary)."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Tipos de músculo", en: "Muscle types"}
    description: {pt: "Esquelético, liso, cardíaco.", en: "Skeletal, smooth, cardiac."}
    exercises:
      - type: choice
        question: {pt: "Quantos tipos básicos de músculo existem?", en: "How many basic muscle types exist?"}
        choices:
          - {pt: "Três (esquelético, liso, cardíaco)", en: "Three (skeletal, smooth, cardiac)"}
          - {pt: "Dois", en: "Two"}
          - {pt: "Cinco", en: "Five"}
          - {pt: "Dez", en: "Ten"}
        correctAnswer: {pt: "Três (esquelético, liso, cardíaco)", en: "Three (skeletal, smooth, cardiac)"}
        rationale: {pt: "Como a função muda — mover esqueleto, mover órgãos internos, bombear sangue — então existem três tipos especializados.", en: "Because function differs — move skeleton, move internal organs, pump blood — there are three specialized types."}
        objectives: [biology.muscular]
        difficulty: 2
      - type: choice
        question: {pt: "Músculo esquelético é controlado:", en: "Skeletal muscle is controlled:"}
        choices:
          - {pt: "Voluntariamente (consciente)", en: "Voluntarily (consciously)"}
          - {pt: "Involuntariamente", en: "Involuntarily"}
          - {pt: "Apenas durante o sono", en: "Only during sleep"}
          - {pt: "Por hormônios apenas", en: "Only by hormones"}
        correctAnswer: {pt: "Voluntariamente (consciente)", en: "Voluntarily (consciously)"}
        rationale: {pt: "Quando decidimos mover um braço, então o cérebro envia o sinal e o músculo esquelético responde — controle voluntário.", en: "When we decide to move an arm, the brain sends a signal and skeletal muscle responds — voluntary control."}
        objectives: [biology.muscular]
        difficulty: 2
      - type: choice
        question: {pt: "Músculo cardíaco fica em:", en: "Cardiac muscle is in:"}
        choices:
          - {pt: "Coração", en: "Heart"}
          - {pt: "Bíceps", en: "Biceps"}
          - {pt: "Estômago", en: "Stomach"}
          - {pt: "Pele", en: "Skin"}
        correctAnswer: {pt: "Coração", en: "Heart"}
        rationale: {pt: "Como o coração precisa bater ritmicamente sem parar, então o músculo cardíaco contrai-se involuntariamente.", en: "Because the heart must beat rhythmically without stopping, cardiac muscle contracts involuntarily."}
        objectives: [biology.muscular]
        difficulty: 2
      - type: choice
        question: {pt: "Músculo liso está em:", en: "Smooth muscle is in:"}
        choices:
          - {pt: "Paredes de órgãos internos (intestino, vasos)", en: "Walls of internal organs (intestine, vessels)"}
          - {pt: "Esqueleto", en: "Skeleton"}
          - {pt: "Cérebro", en: "Brain"}
          - {pt: "Cabelo", en: "Hair"}
        correctAnswer: {pt: "Paredes de órgãos internos (intestino, vasos)", en: "Walls of internal organs (intestine, vessels)"}
        rationale: {pt: "Como esses órgãos precisam mover conteúdo (peristalse) ou ajustar fluxo, então usam músculo liso involuntário.", en: "Because these organs must move contents (peristalsis) or adjust flow, they use involuntary smooth muscle."}
        objectives: [biology.muscular]
        difficulty: 2
      - type: choice
        question: {pt: "Quais proteínas geram contração muscular?", en: "Which proteins generate muscle contraction?"}
        choices:
          - {pt: "Actina e miosina", en: "Actin and myosin"}
          - {pt: "DNA e RNA", en: "DNA and RNA"}
          - {pt: "Glicose e amido", en: "Glucose and starch"}
          - {pt: "Sódio e potássio", en: "Sodium and potassium"}
        correctAnswer: {pt: "Actina e miosina", en: "Actin and myosin"}
        rationale: {pt: "Quando estimuladas, miosina puxa actina; primeiro deslizam, então o músculo encurta — modelo de filamentos deslizantes.", en: "When stimulated, myosin pulls actin; first they slide, then the muscle shortens — sliding-filament model."}
        objectives: [biology.muscular]
        difficulty: 2
      - type: choice
        question: {pt: "Energia para contração muscular vem de:", en: "Energy for muscle contraction comes from:"}
        choices:
          - {pt: "ATP", en: "ATP"}
          - {pt: "DNA", en: "DNA"}
          - {pt: "Água", en: "Water"}
          - {pt: "Sal", en: "Salt"}
        correctAnswer: {pt: "ATP", en: "ATP"}
        rationale: {pt: "Como cada ciclo da miosina precisa de energia, então ATP se quebra em ADP — primeiro o ATP, depois a contração.", en: "Because each myosin cycle needs energy, ATP is broken into ADP — first ATP, then contraction."}
        objectives: [biology.muscular]
        difficulty: 2
      - type: choice
        question: {pt: "Sinal nervoso chega ao músculo via:", en: "The nerve signal reaches muscle via:"}
        choices:
          - {pt: "Junção neuromuscular", en: "Neuromuscular junction"}
          - {pt: "Tendão", en: "Tendon"}
          - {pt: "Vaso sanguíneo", en: "Blood vessel"}
          - {pt: "Pele", en: "Skin"}
        correctAnswer: {pt: "Junção neuromuscular", en: "Neuromuscular junction"}
        rationale: {pt: "Quando o neurônio dispara, então libera acetilcolina na junção, e o músculo contrai.", en: "When the neuron fires, it releases acetylcholine at the junction, and the muscle contracts."}
        objectives: [biology.muscular]
        difficulty: 2
      - type: choice
        question: {pt: "Função PRINCIPAL dos músculos esqueléticos:", en: "MAIN function of skeletal muscles:"}
        choices:
          - {pt: "Mover ossos e gerar postura", en: "Move bones and maintain posture"}
          - {pt: "Bombear sangue", en: "Pump blood"}
          - {pt: "Digerir alimentos", en: "Digest food"}
          - {pt: "Pensar", en: "Think"}
        correctAnswer: {pt: "Mover ossos e gerar postura", en: "Move bones and maintain posture"}
        rationale: {pt: "Como músculos esqueléticos se inserem em ossos via tendões, então sua contração move o esqueleto.", en: "Because skeletal muscles attach to bones via tendons, their contraction moves the skeleton."}
        objectives: [biology.muscular]
        difficulty: 2
      - type: choice
        question: {pt: "Músculos costumam trabalhar em pares antagônicos. Por quê?", en: "Muscles often work in antagonistic pairs. Why?"}
        choices:
          - {pt: "Um contrai enquanto o outro relaxa, então o movimento ocorre em ambas direções", en: "One contracts while the other relaxes, so movement happens in both directions"}
          - {pt: "Para gastar mais energia", en: "To use more energy"}
          - {pt: "Para crescer mais", en: "To grow more"}
          - {pt: "Para parecer simétrico", en: "To look symmetric"}
        correctAnswer: {pt: "Um contrai enquanto o outro relaxa, então o movimento ocorre em ambas direções", en: "One contracts while the other relaxes, so movement happens in both directions"}
        rationale: {pt: "Bíceps flexiona o cotovelo enquanto tríceps estende; por isso, o movimento é controlado nos dois sentidos.", en: "Biceps flexes the elbow while triceps extends; that's why movement is controlled both ways."}
        objectives: [biology.muscular]
        difficulty: 2
      - type: choice
        question: {pt: "O que aquece o corpo durante exercício intenso?", en: "What heats up the body during intense exercise?"}
        choices:
          - {pt: "Calor liberado pelas mitocôndrias musculares", en: "Heat released by muscle mitochondria"}
          - {pt: "Sol direto", en: "Direct sun"}
          - {pt: "Roupas", en: "Clothes"}
          - {pt: "Nada", en: "Nothing"}
        correctAnswer: {pt: "Calor liberado pelas mitocôndrias musculares", en: "Heat released by muscle mitochondria"}
        rationale: {pt: "Como músculos respiram intensamente, primeiro consomem ATP, então liberam calor como subproduto.", en: "Because muscles respire intensely, first they consume ATP, then release heat as a by-product."}
        objectives: [biology.muscular]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Saúde muscular", en: "Muscle health"}
    description: {pt: "Treino e recuperação.", en: "Training and recovery."}
    exercises:
      - type: choice
        question: {pt: "Treino de força aumenta:", en: "Strength training increases:"}
        choices:
          - {pt: "Tamanho e força das fibras musculares", en: "Size and strength of muscle fibers"}
          - {pt: "Número de ossos", en: "Number of bones"}
          - {pt: "Número de neurônios", en: "Number of neurons"}
          - {pt: "Cor da pele", en: "Skin color"}
        correctAnswer: {pt: "Tamanho e força das fibras musculares", en: "Size and strength of muscle fibers"}
        rationale: {pt: "Quando carregamos peso, então fibras se microrrompem; depois, quando recuperam, crescem e ficam mais fortes (hipertrofia).", en: "When we lift weight, fibers micro-tear; then, as they recover, they grow and get stronger (hypertrophy)."}
        objectives: [biology.muscular]
        difficulty: 2
      - type: choice
        question: {pt: "Cãibras podem ocorrer por:", en: "Cramps can result from:"}
        choices:
          - {pt: "Desidratação ou desequilíbrio de eletrólitos", en: "Dehydration or electrolyte imbalance"}
          - {pt: "Excesso de DNA", en: "Excess DNA"}
          - {pt: "Falta de cabelo", en: "Lack of hair"}
          - {pt: "Cor azul", en: "Blue color"}
        correctAnswer: {pt: "Desidratação ou desequilíbrio de eletrólitos", en: "Dehydration or electrolyte imbalance"}
        rationale: {pt: "Como íons regulam contração, quando faltam ou variam muito, então músculos contraem involuntariamente.", en: "Because ions regulate contraction, when they're missing or imbalanced, muscles contract involuntarily."}
        objectives: [biology.muscular]
        difficulty: 2
      - type: choice
        question: {pt: "Músculos liso e cardíaco têm em comum:", en: "Smooth and cardiac muscles share:"}
        choices:
          - {pt: "Contração involuntária", en: "Involuntary contraction"}
          - {pt: "Cor azul", en: "Blue color"}
          - {pt: "Tamanho gigante", en: "Giant size"}
          - {pt: "Reprodução assexuada", en: "Asexual reproduction"}
        correctAnswer: {pt: "Contração involuntária", en: "Involuntary contraction"}
        rationale: {pt: "Como ambos atuam em órgãos vitais sem controle consciente, então sua contração é involuntária.", en: "Because both act in vital organs without conscious control, their contraction is involuntary."}
        objectives: [biology.muscular]
        difficulty: 2
      - type: choice
        question: {pt: "Tendinite é:", en: "Tendinitis is:"}
        choices:
          - {pt: "Inflamação de tendão por sobrecarga", en: "Tendon inflammation from overuse"}
          - {pt: "Fratura óssea", en: "Bone fracture"}
          - {pt: "Falta de cálcio", en: "Calcium deficiency"}
          - {pt: "Tipo de tumor", en: "A type of tumor"}
        correctAnswer: {pt: "Inflamação de tendão por sobrecarga", en: "Tendon inflammation from overuse"}
        rationale: {pt: "Quando movimentos repetitivos sobrecarregam o tendão, então surge inflamação e dor — descanso ajuda a recuperar.", en: "When repetitive motion overloads a tendon, inflammation and pain follow — rest helps recovery."}
        objectives: [biology.muscular]
        difficulty: 2
      - type: choice
        question: {pt: "Para o músculo crescer, é importante:", en: "For muscle growth, it is important to:"}
        choices:
          - {pt: "Treino de força + proteína na dieta + descanso", en: "Strength training + dietary protein + rest"}
          - {pt: "Apenas dormir", en: "Only sleep"}
          - {pt: "Apenas correr", en: "Only run"}
          - {pt: "Apenas comer açúcar", en: "Only eat sugar"}
        correctAnswer: {pt: "Treino de força + proteína na dieta + descanso", en: "Strength training + dietary protein + rest"}
        rationale: {pt: "Como o músculo precisa estímulo, matéria-prima e tempo, então os três elementos juntos promovem hipertrofia.", en: "Because muscle needs stimulus, raw material, and time, the three together promote hypertrophy."}
        objectives: [biology.muscular]
        difficulty: 2
      - type: choice
        question: {pt: "Quando músculos não têm O₂ suficiente, eles fazem:", en: "When muscles lack enough O₂, they do:"}
        choices:
          - {pt: "Fermentação láctica", en: "Lactic fermentation"}
          - {pt: "Fotossíntese", en: "Photosynthesis"}
          - {pt: "Mitose extra", en: "Extra mitosis"}
          - {pt: "Síntese de DNA", en: "DNA synthesis"}
        correctAnswer: {pt: "Fermentação láctica", en: "Lactic fermentation"}
        rationale: {pt: "Como respiração aeróbia exige O₂, quando ele falta, então células recorrem à fermentação anaeróbia (gera lactato).", en: "Because aerobic respiration needs O₂, when it's lacking, cells switch to anaerobic fermentation (lactate)."}
        objectives: [biology.muscular]
        difficulty: 2
      - type: choice
        question: {pt: "O músculo cardíaco se cansa?", en: "Does cardiac muscle get tired?"}
        choices:
          - {pt: "Praticamente nunca — é especialmente resistente à fadiga", en: "Practically never — it's especially fatigue-resistant"}
          - {pt: "Sempre, em segundos", en: "Always, in seconds"}
          - {pt: "Apenas no inverno", en: "Only in winter"}
          - {pt: "Apenas durante sono", en: "Only during sleep"}
        correctAnswer: {pt: "Praticamente nunca — é especialmente resistente à fadiga", en: "Practically never — it's especially fatigue-resistant"}
        rationale: {pt: "Como tem muitas mitocôndrias e suprimento contínuo de O₂, então o coração trabalha 100+ anos sem pausa.", en: "Because it has many mitochondria and continuous O₂ supply, the heart works 100+ years without pause."}
        objectives: [biology.muscular]
        difficulty: 2
      - type: choice
        question: {pt: "Sem músculo nenhum, nós:", en: "Without any muscle, we:"}
        choices:
          - {pt: "Não conseguiríamos nos mover, respirar nem bombear sangue", en: "Couldn't move, breathe, or pump blood"}
          - {pt: "Cresceríamos mais rápido", en: "Would grow faster"}
          - {pt: "Veríamos melhor", en: "Would see better"}
          - {pt: "Falaríamos mais alto", en: "Would speak louder"}
        correctAnswer: {pt: "Não conseguiríamos nos mover, respirar nem bombear sangue", en: "Couldn't move, breathe, or pump blood"}
        rationale: {pt: "Como músculos respondem por movimento, respiração e circulação, então sua falta paralisa funções vitais.", en: "Because muscles enable movement, breathing, and circulation, their absence halts vital functions."}
        objectives: [biology.muscular]
        difficulty: 2
      - type: choice
        question: {pt: "Diafragma é qual tipo de músculo?", en: "The diaphragm is which type of muscle?"}
        choices:
          - {pt: "Esquelético (mas em ritmo automático)", en: "Skeletal (but with automatic rhythm)"}
          - {pt: "Cardíaco", en: "Cardiac"}
          - {pt: "Liso", en: "Smooth"}
          - {pt: "Não é músculo", en: "Not a muscle"}
        correctAnswer: {pt: "Esquelético (mas em ritmo automático)", en: "Skeletal (but with automatic rhythm)"}
        rationale: {pt: "Como podemos prender a respiração, o diafragma é esquelético; quando não pensamos nele, então o tronco encefálico controla.", en: "Because we can hold our breath, the diaphragm is skeletal; when we don't think about it, the brainstem controls it."}
        objectives: [biology.muscular]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: músculos servem para:", en: "Summary: muscles serve to:"}
        choices:
          - {pt: "Gerar movimento, postura e calor", en: "Generate movement, posture, and heat"}
          - {pt: "Apenas ficar bonito", en: "Just look good"}
          - {pt: "Apenas pesar", en: "Just weigh"}
          - {pt: "Apenas crescer", en: "Just grow"}
        correctAnswer: {pt: "Gerar movimento, postura e calor", en: "Generate movement, posture, and heat"}
        rationale: {pt: "Três funções centrais: movimento (esquelético), funções involuntárias (liso/cardíaco) e produção de calor.", en: "Three core functions: movement (skeletal), involuntary functions (smooth/cardiac), and heat production."}
        objectives: [biology.muscular]
        difficulty: 2
      - type: choice
        question: {pt: "Quando o sangue chega ao músculo, ele traz principalmente:", en: "When blood reaches a muscle, it mainly brings:"}
        choices:
          - {pt: "O₂ e glicose", en: "O₂ and glucose"}
          - {pt: "DNA", en: "DNA"}
          - {pt: "Cálcio dos ossos", en: "Calcium from bones"}
          - {pt: "Sódio extra", en: "Extra sodium"}
        correctAnswer: {pt: "O₂ e glicose", en: "O₂ and glucose"}
        rationale: {pt: "Como mitocôndrias precisam combustível e oxidante, então o sangue entrega glicose e O₂ para gerar ATP.", en: "Because mitochondria need fuel and oxidizer, blood delivers glucose and O₂ to generate ATP."}
        objectives: [biology.muscular]
        difficulty: 2
target: 20
