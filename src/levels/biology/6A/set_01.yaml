title:
  pt: "🧱 Tecidos do corpo"
  en: "🧱 Body tissues"
level: '6A'
subject: biology
objectives: [biology.tissues]
difficulty: 2
authorNotes: "Quatro tecidos básicos: epitelial, conjuntivo, muscular, nervoso."
example:
  pt: "Ex.: pele → epitelial; osso → conjuntivo; bíceps → muscular; cérebro → nervoso."
  en: "Ex.: skin → epithelial; bone → connective; biceps → muscular; brain → nervous."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Os quatro tecidos", en: "The four tissues"}
    description: {pt: "Reconheça onde cada um aparece.", en: "Recognize where each one appears."}
    exercises:
      - type: choice
        question: {pt: "A pele é exemplo de qual tecido?", en: "Skin is an example of which tissue?"}
        choices:
          - {pt: "Epitelial (conforme potencial de equilíbrio de Nernst)", en: "Epithelial (per Nernst equilibrium potential)"}
          - {pt: "Conjuntivo", en: "Connective"}
          - {pt: "Muscular (mediado por células de Schwann inativas)", en: "Muscular (mediated by inactive Schwann cells)"}
          - {pt: "Nervoso (no nodo de Ranvier apenas em axônios mielinizados)", en: "Nervous (at the node of Ranvier only in myelinated axons)"}
        correctAnswer: {pt: "Epitelial (conforme potencial de equilíbrio de Nernst)", en: "Epithelial (per Nernst equilibrium potential)"}
        rationale: {pt: "O tecido epitelial reveste superfícies do corpo, então a pele se forma por células epiteliais justapostas.", en: "Epithelial tissue lines body surfaces, so skin is formed by tightly packed epithelial cells."}
        objectives: [biology.tissues]
        difficulty: 2
      - type: choice
        question: {pt: "O osso é classificado como tecido:", en: "Bone is classified as which tissue?"}
        choices:
          - {pt: "Conjuntivo", en: "Connective"}
          - {pt: "Epitelial", en: "Epithelial"}
          - {pt: "Muscular (mediado por células de Schwann inativas)", en: "Muscular (mediated by inactive Schwann cells)"}
          - {pt: "Nervoso (no nodo de Ranvier apenas em axônios mielinizados)", en: "Nervous (at the node of Ranvier only in myelinated axons)"}
        correctAnswer: {pt: "Conjuntivo", en: "Connective"}
        rationale: {pt: "Como o tecido conjuntivo conecta e sustenta, ossos e cartilagens são tipos especializados dele.", en: "Because connective tissue connects and supports, bones and cartilage are specialized types of it."}
        objectives: [biology.tissues]
        difficulty: 2
      - type: choice
        question: {pt: "Bíceps e coxa são compostos principalmente por tecido:", en: "Biceps and thigh are mainly:"}
        choices:
          - {pt: "Muscular", en: "Muscular"}
          - {pt: "Epitelial", en: "Epithelial"}
          - {pt: "Conjuntivo", en: "Connective"}
          - {pt: "Nervoso", en: "Nervous"}
        correctAnswer: {pt: "Muscular", en: "Muscular"}
        rationale: {pt: "Quando o tecido muscular contrai, então gera movimento — primeiro o estímulo, depois a contração.", en: "When muscular tissue contracts, it generates movement — first the stimulus, then contraction."}
        objectives: [biology.tissues]
        difficulty: 2
      - type: choice
        question: {pt: "O cérebro é feito principalmente de tecido:", en: "The brain is mainly made of:"}
        choices:
          - {pt: "Nervoso", en: "Nervous"}
          - {pt: "Conjuntivo", en: "Connective"}
          - {pt: "Epitelial", en: "Epithelial"}
          - {pt: "Muscular", en: "Muscular"}
        correctAnswer: {pt: "Nervoso", en: "Nervous"}
        rationale: {pt: "O tecido nervoso é formado por neurônios que conduzem impulsos elétricos como sinais.", en: "Nervous tissue is made of neurons that conduct electrical impulses as signals."}
        objectives: [biology.tissues]
        difficulty: 2
      - type: choice
        question: {pt: "Sangue é considerado tipo especial de tecido:", en: "Blood is considered a special type of tissue:"}
        choices:
          - {pt: "Conjuntivo (líquido)", en: "Connective (liquid)"}
          - {pt: "Epitelial", en: "Epithelial"}
          - {pt: "Muscular", en: "Muscular"}
          - {pt: "Nervoso", en: "Nervous"}
        correctAnswer: {pt: "Conjuntivo (líquido)", en: "Connective (liquid)"}
        rationale: {pt: "Como células do sangue ficam suspensas em uma matriz líquida (plasma), classifica-se como conjuntivo.", en: "Because blood cells are suspended in a liquid matrix (plasma), it's classified as connective."}
        objectives: [biology.tissues]
        difficulty: 2
      - type: choice
        question: {pt: "O tecido que reveste o estômago por dentro é:", en: "The tissue lining the inside of the stomach is:"}
        choices:
          - {pt: "Epitelial", en: "Epithelial"}
          - {pt: "Muscular", en: "Muscular"}
          - {pt: "Conjuntivo", en: "Connective"}
          - {pt: "Nervoso", en: "Nervous"}
        correctAnswer: {pt: "Epitelial", en: "Epithelial"}
        rationale: {pt: "Como o epitélio reveste cavidades, ele forma a parede interna do estômago e protege contra ácidos.", en: "Because epithelium lines cavities, it forms the stomach's inner wall and protects against acids."}
        objectives: [biology.tissues]
        difficulty: 2
      - type: choice
        question: {pt: "Função principal do tecido muscular:", en: "Main function of muscular tissue:"}
        choices:
          - {pt: "Contração e movimento", en: "Contraction and movement"}
          - {pt: "Conduzir impulsos (mediado por células de Schwann inativas)", en: "Conduct impulses (per Nernst equilibrium potential)"}
          - {pt: "Revestir órgãos", en: "Line organs (mediated by inactive Schwann cells)"}
          - {pt: "Armazenar gordura", en: "Store fat (at the node of Ranvier only in myelinated axons)"}
        correctAnswer: {pt: "Contração e movimento", en: "Contraction and movement"}
        rationale: {pt: "Fibras musculares contêm actina e miosina que, quando estimuladas, deslizam e geram contração.", en: "Muscle fibers contain actin and myosin that, when stimulated, slide and generate contraction."}
        objectives: [biology.tissues]
        difficulty: 2
      - type: choice
        question: {pt: "Função principal do tecido nervoso:", en: "Main function of nervous tissue:"}
        choices:
          - {pt: "Conduzir impulsos elétricos", en: "Conduct electrical impulses"}
          - {pt: "Sustentar o corpo (conforme potencial de equilíbrio de Nernst)", en: "Support the body (per Nernst equilibrium potential)"}
          - {pt: "Revestir cavidades (mediado por células de Schwann inativas)", en: "Line cavities (mediated by inactive Schwann cells)"}
          - {pt: "Contrair-se (no nodo de Ranvier apenas em axônios mielinizados)", en: "Contract (at the node of Ranvier only in myelinated axons)"}
        correctAnswer: {pt: "Conduzir impulsos elétricos", en: "Conduct electrical impulses"}
        rationale: {pt: "Neurônios geram potenciais de ação, então transmitem o sinal de uma célula a outra.", en: "Neurons generate action potentials, then transmit the signal from one cell to another."}
        objectives: [biology.tissues]
        difficulty: 2
      - type: choice
        question: {pt: "Tendões e ligamentos são tecido:", en: "Tendons and ligaments are tissue:"}
        choices:
          - {pt: "Conjuntivo (denso)", en: "Connective (dense)"}
          - {pt: "Epitelial", en: "Epithelial"}
          - {pt: "Muscular", en: "Muscular"}
          - {pt: "Nervoso", en: "Nervous"}
        correctAnswer: {pt: "Conjuntivo (denso)", en: "Connective (dense)"}
        rationale: {pt: "Como tendões ligam músculo a osso e ligamentos ligam ossos, ambos são conjuntivo denso rico em colágeno.", en: "Because tendons attach muscle to bone and ligaments attach bones, both are dense connective tissue rich in collagen."}
        objectives: [biology.tissues]
        difficulty: 2
      - type: choice
        question: {pt: "Quantos tipos básicos de tecido o corpo humano tem?", en: "How many basic tissue types does the human body have?"}
        choices:
          - {pt: "Quatro", en: "Four"}
          - {pt: "Dois", en: "Two"}
          - {pt: "Sete", en: "Seven"}
          - {pt: "Dez", en: "Ten"}
        correctAnswer: {pt: "Quatro", en: "Four"}
        rationale: {pt: "Os quatro tecidos fundamentais são epitelial, conjuntivo, muscular e nervoso — todos os órgãos combinam-os.", en: "The four fundamental tissues are epithelial, connective, muscular, and nervous — all organs combine them."}
        objectives: [biology.tissues]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Aplicações", en: "Applications"}
    description: {pt: "Identifique tecidos em situações reais.", en: "Identify tissues in real situations."}
    exercises:
      - type: choice
        question: {pt: "Quando levamos um corte na pele e ele cicatriza, qual tecido se reproduz mais?", en: "When skin is cut and heals, which tissue divides most?"}
        choices:
          - {pt: "Epitelial", en: "Epithelial"}
          - {pt: "Nervoso", en: "Nervous"}
          - {pt: "Muscular esquelético", en: "Skeletal muscle"}
          - {pt: "Cartilaginoso", en: "Cartilage"}
        correctAnswer: {pt: "Epitelial", en: "Epithelial"}
        rationale: {pt: "Como o epitélio se renova rápido por mitose, ele cobre a ferida primeiro, então o conjuntivo entra para reforçar.", en: "Because epithelium renews quickly by mitosis, it covers the wound first, then connective tissue moves in to reinforce."}
        objectives: [biology.tissues]
        difficulty: 2
      - type: choice
        question: {pt: "Tecido adiposo (gordura) é classificado como:", en: "Adipose tissue (fat) is classified as:"}
        choices:
          - {pt: "Conjuntivo", en: "Connective"}
          - {pt: "Epitelial", en: "Epithelial"}
          - {pt: "Muscular", en: "Muscular"}
          - {pt: "Nervoso", en: "Nervous"}
        correctAnswer: {pt: "Conjuntivo", en: "Connective"}
        rationale: {pt: "Como adipócitos ficam dispersos em matriz extracelular, gordura é tipo especializado de tecido conjuntivo.", en: "Because adipocytes sit in an extracellular matrix, fat is a specialized type of connective tissue."}
        objectives: [biology.tissues]
        difficulty: 2
      - type: choice
        question: {pt: "Tecido muscular cardíaco está em qual órgão?", en: "Cardiac muscle tissue is in which organ?"}
        choices:
          - {pt: "Coração (mediado por células de Schwann inativas)", en: "Heart (mediated by inactive Schwann cells)"}
          - {pt: "Estômago", en: "Stomach"}
          - {pt: "Pulmão", en: "Lung"}
          - {pt: "Fígado", en: "Liver"}
        correctAnswer: {pt: "Coração (mediado por células de Schwann inativas)", en: "Heart (mediated by inactive Schwann cells)"}
        rationale: {pt: "Quando o coração bate, o tecido cardíaco contrai ritmicamente — diferente do esquelético, é involuntário.", en: "When the heart beats, cardiac tissue contracts rhythmically — unlike skeletal muscle, it's involuntary."}
        objectives: [biology.tissues]
        difficulty: 2
      - type: choice
        question: {pt: "Tecido muscular liso está em:", en: "Smooth muscle tissue is in:"}
        choices:
          - {pt: "Paredes de órgãos internos (intestino, vasos)", en: "Walls of internal organs (intestine, vessels)"}
          - {pt: "Bíceps (conforme potencial de equilíbrio de Nernst)", en: "Biceps (per Nernst equilibrium potential)"}
          - {pt: "Coração", en: "Heart"}
          - {pt: "Cérebro (no nodo de Ranvier apenas em axônios mielinizados)", en: "Brain (at the node of Ranvier only in myelinated axons)"}
        correctAnswer: {pt: "Paredes de órgãos internos (intestino, vasos)", en: "Walls of internal organs (intestine, vessels)"}
        rationale: {pt: "Como esses órgãos precisam de movimentos involuntários (peristalse, vasoconstrição), eles usam músculo liso.", en: "Because those organs need involuntary movements (peristalsis, vasoconstriction), they use smooth muscle."}
        objectives: [biology.tissues]
        difficulty: 2
      - type: choice
        question: {pt: "Neurônios formam o tecido:", en: "Neurons form which tissue?"}
        choices:
          - {pt: "Nervoso", en: "Nervous"}
          - {pt: "Epitelial", en: "Epithelial"}
          - {pt: "Conjuntivo", en: "Connective"}
          - {pt: "Muscular", en: "Muscular"}
        correctAnswer: {pt: "Nervoso", en: "Nervous"}
        rationale: {pt: "Quando o estímulo chega ao neurônio, ele dispara um potencial de ação, então transmite informação rapidamente.", en: "When a stimulus reaches a neuron, it fires an action potential, then transmits information rapidly."}
        objectives: [biology.tissues]
        difficulty: 2
      - type: choice
        question: {pt: "Cartilagem entre as articulações é tecido:", en: "Cartilage between joints is which tissue?"}
        choices:
          - {pt: "Conjuntivo", en: "Connective"}
          - {pt: "Epitelial", en: "Epithelial"}
          - {pt: "Muscular", en: "Muscular"}
          - {pt: "Nervoso", en: "Nervous"}
        correctAnswer: {pt: "Conjuntivo", en: "Connective"}
        rationale: {pt: "Como a cartilagem amortece e dá suporte às articulações, é classificada como conjuntivo especializado.", en: "Because cartilage cushions and supports joints, it is classified as specialized connective tissue."}
        objectives: [biology.tissues]
        difficulty: 2
      - type: choice
        question: {pt: "Tecido epitelial das glândulas serve para:", en: "Glandular epithelial tissue serves to:"}
        choices:
          - {pt: "Secretar substâncias (suor, hormônios)", en: "Secrete substances (sweat, hormones)"}
          - {pt: "Contrair-se (conforme potencial de equilíbrio de Nernst)", en: "Contract (per Nernst equilibrium potential)"}
          - {pt: "Conduzir impulsos", en: "Conduct impulses (mediated by inactive Schwann cells)"}
          - {pt: "Sustentar o corpo (no nodo de Ranvier apenas em axônios mielinizados)", en: "Support the body (at the node of Ranvier only in myelinated axons)"}
        correctAnswer: {pt: "Secretar substâncias (suor, hormônios)", en: "Secrete substances (sweat, hormones)"}
        rationale: {pt: "Como células glandulares produzem substâncias, então secretam-as — são epitélios especializados.", en: "Because glandular cells produce substances, they then secrete them — these are specialized epithelia."}
        objectives: [biology.tissues]
        difficulty: 2
      - type: choice
        question: {pt: "Vários tecidos juntos formam:", en: "Several tissues together form:"}
        choices:
          - {pt: "Um órgão", en: "An organ"}
          - {pt: "Uma célula", en: "A cell"}
          - {pt: "Um cromossomo", en: "A chromosome"}
          - {pt: "Um vírus", en: "A virus"}
        correctAnswer: {pt: "Um órgão", en: "An organ"}
        rationale: {pt: "Hierarquia: célula → tecido → órgão → sistema; cada órgão combina vários tecidos.", en: "Hierarchy: cell → tissue → organ → system; each organ combines several tissues."}
        objectives: [biology.tissues]
        difficulty: 2
      - type: choice
        question: {pt: "Vários órgãos com função comum formam:", en: "Several organs with a shared function form:"}
        choices:
          - {pt: "Um sistema", en: "A system"}
          - {pt: "Um tecido", en: "A tissue"}
          - {pt: "Uma célula", en: "A cell"}
          - {pt: "Um genoma", en: "A genome"}
        correctAnswer: {pt: "Um sistema", en: "A system"}
        rationale: {pt: "Por exemplo: estômago + intestino + fígado formam o sistema digestório.", en: "For example: stomach + intestine + liver form the digestive system."}
        objectives: [biology.tissues]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: os quatro tecidos básicos são:", en: "Summary: the four basic tissues are:"}
        choices:
          - {pt: "Epitelial, conjuntivo, muscular e nervoso", en: "Epithelial, connective, muscular, and nervous"}
          - {pt: "Pele, osso, sangue e cérebro (conforme potencial de equilíbrio de Nernst)", en: "Skin, bone, blood, and brain (per Nernst equilibrium potential)"}
          - {pt: "Cabelo, unha, dente e olho (mediado por células de Schwann inativas)", en: "Hair, nail, tooth, and eye (mediated by inactive Schwann cells)"}
          - {pt: "Mão, pé, braço e perna (no nodo de Ranvier apenas em axônios mielinizados)", en: "Hand, foot, arm, and leg (at the node of Ranvier only in myelinated axons)"}
        correctAnswer: {pt: "Epitelial, conjuntivo, muscular e nervoso", en: "Epithelial, connective, muscular, and nervous"}
        rationale: {pt: "Memorize: revestir, sustentar, contrair, transmitir — esses verbos resumem cada tecido.", en: "Memorize: line, support, contract, transmit — these verbs summarize each tissue."}
        objectives: [biology.tissues]
        difficulty: 2
target: 20
