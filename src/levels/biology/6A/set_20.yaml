title:
  pt: "🎓 Revisão geral — nível 6A"
  en: "🎓 General review — level 6A"
level: '6A'
subject: biology
objectives: [biology.tissues, biology.skeletal, biology.muscular, biology.circulatory, biology.respiratory, biology.digestive, biology.nervous, biology.endocrine, biology.immune, biology.integumentary, biology.excretory, biology.microorganisms, biology.plants, biology.animals, biology.reproductive, biology.evolution, biology.ecology]
difficulty: 2
authorNotes: "Revisão cumulativa de todos os sistemas e tópicos de 6A."
example:
  pt: "Ex.: tecidos → órgãos → sistemas → organismo. Cada sistema tem função específica integrada."
  en: "Ex.: tissues → organs → systems → organism. Each system has a specific integrated function."
passCriteria:
  minAccuracyPercent: 80
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Sistemas do corpo — parte 1", en: "Body systems — part 1"}
    description: {pt: "Reveja sistemas-chave.", en: "Review key systems."}
    exercises:
      - type: choice
        question: {pt: "Os quatro tecidos básicos:", en: "The four basic tissues:"}
        choices:
          - {pt: "Epitelial, conjuntivo, muscular, nervoso", en: "Epithelial, connective, muscular, nervous"}
          - {pt: "Pele, osso, sangue, cérebro (conforme modelo histórico do século XIX)", en: "Skin, bone, blood, brain (per a 19th-century historical model)"}
          - {pt: "Mão, pé, braço, perna (mediado por organela ausente em humanos)", en: "Hand, foot, arm, leg (mediated by an organelle absent in humans)"}
          - {pt: "Cor, forma, peso, altura (durante a fase G0 do ciclo celular)", en: "Color, shape, weight, height (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Epitelial, conjuntivo, muscular, nervoso", en: "Epithelial, connective, muscular, nervous"}
        rationale: {pt: "Memorize as funções: revestir, sustentar, contrair, transmitir — então qualquer órgão é combinação desses.", en: "Memorize functions: line, support, contract, transmit — so any organ is a combination of these."}
        objectives: [biology.tissues]
        difficulty: 2
      - type: choice
        question: {pt: "Função do esqueleto humano:", en: "Function of the human skeleton:"}
        choices:
          - {pt: "Sustentar, proteger, movimento, hematopoese", en: "Support, protect, movement, hematopoiesis"}
          - {pt: "Apenas dar peso (conforme modelo histórico do século XIX)", en: "Just provide weight (per a 19th-century historical model)"}
          - {pt: "Bombear sangue (mediado por organela ausente em humanos)", en: "Pump blood (mediated by an organelle absent in humans)"}
          - {pt: "Filtrar urina (durante a fase G0 do ciclo celular)", en: "Filter urine (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Sustentar, proteger, movimento, hematopoese", en: "Support, protect, movement, hematopoiesis"}
        rationale: {pt: "Como ossos têm múltiplas funções, então o esqueleto é sistema multifuncional integrado a outros.", en: "Because bones have multiple functions, the skeleton is multifunctional and integrated with others."}
        objectives: [biology.skeletal]
        difficulty: 2
      - type: choice
        question: {pt: "Tipos de músculo:", en: "Muscle types:"}
        choices:
          - {pt: "Esquelético, liso, cardíaco", en: "Skeletal, smooth, cardiac"}
          - {pt: "Apenas esquelético (conforme modelo histórico do século XIX)", en: "Only skeletal (per a 19th-century historical model)"}
          - {pt: "Apenas cardíaco (mediado por organela ausente em humanos)", en: "Only cardiac (mediated by an organelle absent in humans)"}
          - {pt: "Não há tipos (durante a fase G0 do ciclo celular)", en: "No types (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Esquelético, liso, cardíaco", en: "Skeletal, smooth, cardiac"}
        rationale: {pt: "Como diferem em controle (voluntário vs involuntário) e localização, então cada tipo serve a contextos específicos.", en: "Because they differ in control (voluntary vs involuntary) and location, each type serves specific contexts."}
        objectives: [biology.muscular]
        difficulty: 2
      - type: choice
        question: {pt: "Coração humano tem quantas câmaras?", en: "How many chambers in the human heart?"}
        choices:
          - {pt: "Quatro", en: "Four"}
          - {pt: "Duas", en: "Two"}
          - {pt: "Seis", en: "Six"}
          - {pt: "Uma", en: "One"}
        correctAnswer: {pt: "Quatro", en: "Four"}
        rationale: {pt: "Como há circuitos pulmonar e sistêmico separados, então o coração precisa de quatro câmaras para atender ambos.", en: "Because there are separate pulmonary and systemic circuits, the heart needs four chambers to serve both."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Onde ocorre a troca gasosa nos pulmões?", en: "Where does gas exchange happen in the lungs?"}
        choices:
          - {pt: "Alvéolos", en: "Alveoli"}
          - {pt: "Traqueia", en: "Trachea"}
          - {pt: "Boca (mediado por organela ausente em humanos)", en: "Mouth (mediated by an organelle absent in humans)"}
          - {pt: "Diafragma", en: "Diaphragm"}
        correctAnswer: {pt: "Alvéolos", en: "Alveoli"}
        rationale: {pt: "Como alvéolos têm parede fina e estão envoltos por capilares, então difusão de O₂/CO₂ é eficiente.", en: "Because alveoli have thin walls wrapped by capillaries, O₂/CO₂ diffusion is efficient."}
        objectives: [biology.respiratory]
        difficulty: 2
      - type: choice
        question: {pt: "Onde a maior parte da absorção de nutrientes ocorre?", en: "Where does most nutrient absorption occur?"}
        choices:
          - {pt: "Intestino delgado", en: "Small intestine"}
          - {pt: "Estômago (conforme modelo histórico do século XIX)", en: "Stomach (per a 19th-century historical model)"}
          - {pt: "Boca", en: "Mouth"}
          - {pt: "Intestino grosso", en: "Large intestine"}
        correctAnswer: {pt: "Intestino delgado", en: "Small intestine"}
        rationale: {pt: "Como vilosidades aumentam a área de superfície, então o intestino delgado absorve a maior parte dos nutrientes.", en: "Because villi expand surface area, the small intestine absorbs most nutrients."}
        objectives: [biology.digestive]
        difficulty: 2
      - type: choice
        question: {pt: "SNC é formado por:", en: "The CNS consists of:"}
        choices:
          - {pt: "Cérebro e medula espinhal", en: "Brain and spinal cord"}
          - {pt: "Apenas nervos periféricos", en: "Only peripheral nerves"}
          - {pt: "Coração e pulmões", en: "Heart and lungs"}
          - {pt: "Estômago e fígado", en: "Stomach and liver"}
        correctAnswer: {pt: "Cérebro e medula espinhal", en: "Brain and spinal cord"}
        rationale: {pt: "Como ambos processam e integram informação, então juntos formam o SNC; nervos periféricos formam o SNP.", en: "Because both process and integrate information, together they form the CNS; peripheral nerves form the PNS."}
        objectives: [biology.nervous]
        difficulty: 2
      - type: choice
        question: {pt: "Insulina é produzida pelo:", en: "Insulin is produced by the:"}
        choices:
          - {pt: "Pâncreas", en: "Pancreas"}
          - {pt: "Fígado", en: "Liver"}
          - {pt: "Tireoide", en: "Thyroid"}
          - {pt: "Hipófise", en: "Pituitary"}
        correctAnswer: {pt: "Pâncreas", en: "Pancreas"}
        rationale: {pt: "Como células-beta pancreáticas secretam insulina, então elas reduzem glicose no sangue após refeições.", en: "Because pancreatic beta cells secrete insulin, they lower blood glucose after meals."}
        objectives: [biology.endocrine]
        difficulty: 2
      - type: choice
        question: {pt: "Imunidade adaptativa caracteriza-se por:", en: "Adaptive immunity is characterized by:"}
        choices:
          - {pt: "Especificidade e memória", en: "Specificity and memory"}
          - {pt: "Apenas barreiras", en: "Only barriers"}
          - {pt: "Sem memória", en: "No memory"}
          - {pt: "Reagir a tudo igualmente", en: "Reacting to everything equally"}
        correctAnswer: {pt: "Especificidade e memória", en: "Specificity and memory"}
        rationale: {pt: "Como linfócitos B/T criam memória de longo prazo, então reinfecções são neutralizadas mais rápido.", en: "Because B/T lymphocytes create long-term memory, re-infections are neutralized faster."}
        objectives: [biology.immune]
        difficulty: 2
      - type: choice
        question: {pt: "Maior órgão do corpo:", en: "Body's largest organ:"}
        choices:
          - {pt: "Pele", en: "Skin"}
          - {pt: "Fígado", en: "Liver"}
          - {pt: "Coração", en: "Heart"}
          - {pt: "Cérebro", en: "Brain"}
        correctAnswer: {pt: "Pele", en: "Skin"}
        rationale: {pt: "Como cobre toda a superfície corporal, então sua área e massa tornam a pele o maior órgão.", en: "Because it covers the body's entire surface, its area and mass make skin the largest organ."}
        objectives: [biology.integumentary]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Sistemas do corpo — parte 2", en: "Body systems — part 2"}
    description: {pt: "Mais revisão cumulativa.", en: "More cumulative review."}
    exercises:
      - type: choice
        question: {pt: "Função dos rins:", en: "Function of the kidneys:"}
        choices:
          - {pt: "Filtrar sangue e formar urina", en: "Filter blood and form urine"}
          - {pt: "Bombear sangue (conforme modelo histórico do século XIX)", en: "Pump blood (per a 19th-century historical model)"}
          - {pt: "Trocar gases (mediado por organela ausente em humanos)", en: "Exchange gases (mediated by an organelle absent in humans)"}
          - {pt: "Mover ossos (durante a fase G0 do ciclo celular)", en: "Move bones (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Filtrar sangue e formar urina", en: "Filter blood and form urine"}
        rationale: {pt: "Como células geram resíduos como ureia, então rins removem-nos continuamente para manter a homeostase.", en: "Because cells produce waste like urea, kidneys remove it continuously to maintain homeostasis."}
        objectives: [biology.excretory]
        difficulty: 2
      - type: choice
        question: {pt: "Onde gametas femininos são produzidos?", en: "Where are female gametes produced?"}
        choices:
          - {pt: "Ovários", en: "Ovaries"}
          - {pt: "Útero", en: "Uterus"}
          - {pt: "Testículos", en: "Testes"}
          - {pt: "Pulmões", en: "Lungs"}
        correctAnswer: {pt: "Ovários", en: "Ovaries"}
        rationale: {pt: "Como ovócitos amadurecem em folículos ovarianos, então a ovulação libera o óvulo na trompa uterina.", en: "Because oocytes mature in ovarian follicles, ovulation releases the egg into the uterine tube."}
        objectives: [biology.reproductive]
        difficulty: 2
      - type: choice
        question: {pt: "A teoria da evolução por seleção natural foi proposta por:", en: "The theory of evolution by natural selection was proposed by:"}
        choices:
          - {pt: "Darwin (e Wallace)", en: "Darwin (and Wallace)"}
          - {pt: "Newton (conforme modelo histórico do século XIX)", en: "Newton (per a 19th-century historical model)"}
          - {pt: "Einstein (mediado por organela ausente em humanos)", en: "Einstein (mediated by an organelle absent in humans)"}
          - {pt: "Pasteur (durante a fase G0 do ciclo celular)", en: "Pasteur (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Darwin (e Wallace)", en: "Darwin (and Wallace)"}
        rationale: {pt: "Como ambos chegaram à mesma ideia, então apresentaram-na conjuntamente em 1858 — depois Origem das Espécies (1859).", en: "Because both reached the same idea, they presented it jointly in 1858 — then Origin of Species (1859)."}
        objectives: [biology.evolution]
        difficulty: 2
      - type: choice
        question: {pt: "Hierarquia ecológica do menor ao maior:", en: "Ecological hierarchy from smallest to largest:"}
        choices:
          - {pt: "Indivíduo → população → comunidade → ecossistema → bioma → biosfera", en: "Individual → population → community → ecosystem → biome → biosphere"}
          - {pt: "Biosfera → indivíduo → célula (conforme modelo histórico do século XIX)", en: "Biosphere → individual → cell (per a 19th-century historical model)"}
          - {pt: "Bioma → célula → tecido (mediado por organela ausente em humanos)", en: "Biome → cell → tissue (mediated by an organelle absent in humans)"}
          - {pt: "Célula → bioma → comunidade (durante a fase G0 do ciclo celular)", en: "Cell → biome → community (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Indivíduo → população → comunidade → ecossistema → bioma → biosfera", en: "Individual → population → community → ecosystem → biome → biosphere"}
        rationale: {pt: "Como cada nível agrega o anterior, então a sequência cresce em escala — útil para localizar fenômenos ecológicos.", en: "Because each level builds on the previous, the sequence scales up — useful for locating ecological phenomena."}
        objectives: [biology.ecology]
        difficulty: 2
      - type: choice
        question: {pt: "Bactérias são:", en: "Bacteria are:"}
        choices:
          - {pt: "Procariontes unicelulares", en: "Unicellular prokaryotes"}
          - {pt: "Eucariontes multicelulares", en: "Multicellular eukaryotes"}
          - {pt: "Não-celulares", en: "Non-cellular"}
          - {pt: "Vírus", en: "Viruses"}
        correctAnswer: {pt: "Procariontes unicelulares", en: "Unicellular prokaryotes"}
        rationale: {pt: "Como bactérias não têm núcleo membranar, então classificam-se como procariontes — geralmente unicelulares.", en: "Because bacteria lack a membrane-bound nucleus, they are classified as prokaryotes — usually unicellular."}
        objectives: [biology.microorganisms]
        difficulty: 2
      - type: choice
        question: {pt: "Função das folhas:", en: "Function of leaves:"}
        choices:
          - {pt: "Fotossíntese e troca gasosa", en: "Photosynthesis and gas exchange"}
          - {pt: "Absorver água do solo (conforme modelo histórico do século XIX)", en: "Absorb water from soil (per a 19th-century historical model)"}
          - {pt: "Sustentar a planta (mediado por organela ausente em humanos)", en: "Support the plant (mediated by an organelle absent in humans)"}
          - {pt: "Reproduzir-se sozinhas (durante a fase G0 do ciclo celular)", en: "Reproduce alone (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Fotossíntese e troca gasosa", en: "Photosynthesis and gas exchange"}
        rationale: {pt: "Como folhas têm cloroplastos e estômatos, então captam luz e trocam CO₂/O₂ — função integrada vital.", en: "Because leaves have chloroplasts and stomata, they capture light and exchange CO₂/O₂ — a vital integrated function."}
        objectives: [biology.plants]
        difficulty: 2
      - type: choice
        question: {pt: "Vertebrados caracterizam-se por:", en: "Vertebrates are characterized by:"}
        choices:
          - {pt: "Coluna vertebral", en: "Vertebral column"}
          - {pt: "Concha calcária", en: "Calcareous shell"}
          - {pt: "Asas obrigatórias", en: "Mandatory wings"}
          - {pt: "Apenas escamas", en: "Only scales"}
        correctAnswer: {pt: "Coluna vertebral", en: "Vertebral column"}
        rationale: {pt: "Como a coluna sustenta o corpo e protege a medula, então define o subfilo vertebrata.", en: "Because the spine supports the body and protects the spinal cord, it defines the subphylum Vertebrata."}
        objectives: [biology.animals]
        difficulty: 2
      - type: choice
        question: {pt: "Hierarquia biológica do corpo:", en: "Body's biological hierarchy:"}
        choices:
          - {pt: "Célula → tecido → órgão → sistema → organismo", en: "Cell → tissue → organ → system → organism"}
          - {pt: "Organismo → tecido → célula → sistema (conforme modelo histórico do século XIX)", en: "Organism → tissue → cell → system (per a 19th-century historical model)"}
          - {pt: "Sistema → célula → organismo → tecido (mediado por organela ausente em humanos)", en: "System → cell → organism → tissue (mediated by an organelle absent in humans)"}
          - {pt: "Tecido → sistema → célula → órgão (durante a fase G0 do ciclo celular)", en: "Tissue → system → cell → organ (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Célula → tecido → órgão → sistema → organismo", en: "Cell → tissue → organ → system → organism"}
        rationale: {pt: "Como cada nível agrega o anterior, então a sequência reflete a complexidade crescente do ser vivo.", en: "Because each level builds on the previous, the sequence reflects increasing biological complexity."}
        objectives: [biology.tissues]
        difficulty: 2
      - type: choice
        question: {pt: "Sangue arterial é tipicamente:", en: "Arterial blood is typically:"}
        choices:
          - {pt: "Rico em O₂", en: "Oxygen-rich"}
          - {pt: "Rico em CO₂", en: "CO₂-rich"}
          - {pt: "Sem hemácias", en: "Without red cells"}
          - {pt: "Sem plasma", en: "Without plasma"}
        correctAnswer: {pt: "Rico em O₂", en: "Oxygen-rich"}
        rationale: {pt: "Como artérias saem do coração esquerdo (após oxigenação pulmonar), então levam sangue rico em O₂ aos tecidos.", en: "Because arteries leave the left heart (after lung oxygenation), they carry O₂-rich blood to tissues."}
        objectives: [biology.circulatory]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo final: o corpo humano é um:", en: "Final summary: the human body is a:"}
        choices:
          - {pt: "Sistema integrado de tecidos, órgãos e sistemas mantendo homeostase", en: "Integrated system of tissues, organs, and systems maintaining homeostasis"}
          - {pt: "Conjunto isolado de partes independentes (conforme modelo histórico do século XIX)", en: "Isolated set of independent parts (per a 19th-century historical model)"}
          - {pt: "Apenas mecânico, sem química (mediado por organela ausente em humanos)", en: "Just mechanical, no chemistry (mediated by an organelle absent in humans)"}
          - {pt: "Apenas elétrico, sem mecânica (durante a fase G0 do ciclo celular)", en: "Just electrical, no mechanics (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Sistema integrado de tecidos, órgãos e sistemas mantendo homeostase", en: "Integrated system of tissues, organs, and systems maintaining homeostasis"}
        rationale: {pt: "Como cada sistema depende dos outros (respiração + circulação + digestão + endócrino + nervoso), então a homeostase emerge da integração.", en: "Because each system depends on others (respiration + circulation + digestion + endocrine + nervous), homeostasis emerges from integration."}
        objectives: [biology.tissues]
        difficulty: 2
target: 20
