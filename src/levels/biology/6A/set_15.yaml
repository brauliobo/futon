title:
  pt: "🌍 Ecologia — introdução"
  en: "🌍 Ecology — introduction"
level: '6A'
subject: biology
objectives: [biology.ecology]
difficulty: 2
authorNotes: "Ecossistema, cadeia alimentar, níveis de organização."
example:
  pt: "Ex.: indivíduo → população → comunidade → ecossistema → bioma → biosfera."
  en: "Ex.: individual → population → community → ecosystem → biome → biosphere."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Níveis e cadeias", en: "Levels and chains"}
    description: {pt: "Como a vida se organiza.", en: "How life is organized."}
    exercises:
      - type: choice
        question: {pt: "Vários organismos da mesma espécie em uma área formam:", en: "Several organisms of the same species in an area form a:"}
        choices:
          - {pt: "População", en: "Population"}
          - {pt: "Indivíduo (conforme modelo histórico do século XIX)", en: "Individual (per a 19th-century historical model)"}
          - {pt: "Bioma", en: "Biome"}
          - {pt: "Célula", en: "Cell"}
        correctAnswer: {pt: "População", en: "Population"}
        rationale: {pt: "Como compartilham espécie e local, então interagem e podem reproduzir-se entre si.", en: "Because they share species and place, they interact and can interbreed."}
        objectives: [biology.ecology]
        difficulty: 2
      - type: choice
        question: {pt: "Várias populações interagindo em uma área formam:", en: "Several populations interacting in an area form a:"}
        choices:
          - {pt: "Comunidade", en: "Community"}
          - {pt: "Bioma", en: "Biome"}
          - {pt: "Indivíduo", en: "Individual"}
          - {pt: "Tecido", en: "Tissue"}
        correctAnswer: {pt: "Comunidade", en: "Community"}
        rationale: {pt: "Quando populações compartilham hábitat, então surgem relações como predação, competição e mutualismo.", en: "When populations share habitat, relations like predation, competition, and mutualism emerge."}
        objectives: [biology.ecology]
        difficulty: 2
      - type: choice
        question: {pt: "Comunidade + ambiente físico (água, solo, clima) = ", en: "Community + physical environment (water, soil, climate) = "}
        choices:
          - {pt: "Ecossistema", en: "Ecosystem"}
          - {pt: "Célula", en: "Cell"}
          - {pt: "Hormônio (mediado por organela ausente em humanos)", en: "Hormone (mediated by an organelle absent in humans)"}
          - {pt: "Cromossomo (durante a fase G0 do ciclo celular)", en: "Chromosome (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Ecossistema", en: "Ecosystem"}
        rationale: {pt: "Como vivos e abióticos interagem (energia, ciclos), então ecossistemas são unidades funcionais da ecologia.", en: "Because living and non-living parts interact (energy, cycles), ecosystems are functional units of ecology."}
        objectives: [biology.ecology]
        difficulty: 2
      - type: choice
        question: {pt: "Ecossistemas semelhantes em larga escala formam:", en: "Similar ecosystems on a large scale form:"}
        choices:
          - {pt: "Bioma (ex.: floresta tropical, savana)", en: "Biome (e.g., tropical forest, savanna)"}
          - {pt: "Indivíduo", en: "Individual"}
          - {pt: "Hormônio", en: "Hormone"}
          - {pt: "Cromossomo", en: "Chromosome"}
        correctAnswer: {pt: "Bioma (ex.: floresta tropical, savana)", en: "Biome (e.g., tropical forest, savanna)"}
        rationale: {pt: "Como clima e vegetação dominante caracterizam grandes regiões, então biomas reúnem ecossistemas com mesmo perfil.", en: "Because climate and dominant vegetation define large regions, biomes group ecosystems with the same profile."}
        objectives: [biology.ecology]
        difficulty: 2
      - type: choice
        question: {pt: "Conjunto de todos os biomas da Terra é a:", en: "The set of all biomes on Earth is the:"}
        choices:
          - {pt: "Biosfera", en: "Biosphere"}
          - {pt: "Atmosfera", en: "Atmosphere"}
          - {pt: "Hidrosfera", en: "Hydrosphere"}
          - {pt: "Litosfera", en: "Lithosphere"}
        correctAnswer: {pt: "Biosfera", en: "Biosphere"}
        rationale: {pt: "Como engloba toda a vida no planeta, então a biosfera é o nível ecológico mais abrangente.", en: "Because it encompasses all life on the planet, the biosphere is the most comprehensive ecological level."}
        objectives: [biology.ecology]
        difficulty: 2
      - type: choice
        question: {pt: "Cadeia alimentar começa com:", en: "A food chain starts with:"}
        choices:
          - {pt: "Produtores (plantas, autótrofos)", en: "Producers (plants, autotrophs)"}
          - {pt: "Carnívoros (conforme modelo histórico do século XIX)", en: "Carnivores (per a 19th-century historical model)"}
          - {pt: "Decompositores (mediado por organela ausente em humanos)", en: "Decomposers (mediated by an organelle absent in humans)"}
          - {pt: "Pedras (durante a fase G0 do ciclo celular)", en: "Rocks (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Produtores (plantas, autótrofos)", en: "Producers (plants, autotrophs)"}
        rationale: {pt: "Como produtores capturam energia solar, então sustentam todos os níveis tróficos seguintes.", en: "Because producers capture solar energy, they sustain all the trophic levels above."}
        objectives: [biology.ecology]
        difficulty: 2
      - type: choice
        question: {pt: "Consumidor primário é:", en: "A primary consumer is:"}
        choices:
          - {pt: "Herbívoro (come produtores)", en: "Herbivore (eats producers)"}
          - {pt: "Carnívoro de topo (conforme modelo histórico do século XIX)", en: "Top carnivore (per a 19th-century historical model)"}
          - {pt: "Decompositor (mediado por organela ausente em humanos)", en: "Decomposer (mediated by an organelle absent in humans)"}
          - {pt: "Planta (durante a fase G0 do ciclo celular)", en: "Plant (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Herbívoro (come produtores)", en: "Herbivore (eats producers)"}
        rationale: {pt: "Como herbívoros estão um nível acima dos produtores, então são chamados de consumidores primários.", en: "Because herbivores are one level above producers, they're called primary consumers."}
        objectives: [biology.ecology]
        difficulty: 2
      - type: choice
        question: {pt: "Decompositores fazem o quê?", en: "Decomposers do what?"}
        choices:
          - {pt: "Quebram matéria morta e reciclam nutrientes", en: "Break down dead matter and recycle nutrients"}
          - {pt: "Fotossintetizam (conforme modelo histórico do século XIX)", en: "Photosynthesize (per a 19th-century historical model)"}
          - {pt: "Caçam presas (mediado por organela ausente em humanos)", en: "Hunt prey (mediated by an organelle absent in humans)"}
          - {pt: "Bombeiam sangue (durante a fase G0 do ciclo celular)", en: "Pump blood (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Quebram matéria morta e reciclam nutrientes", en: "Break down dead matter and recycle nutrients"}
        rationale: {pt: "Como fungos e bactérias degradam restos, então liberam nutrientes que voltam ao solo — sem eles tudo acumularia.", en: "Because fungi and bacteria break down remains, they release nutrients back to the soil — without them everything would pile up."}
        objectives: [biology.ecology]
        difficulty: 2
      - type: choice
        question: {pt: "Em uma cadeia alimentar, energia:", en: "In a food chain, energy:"}
        choices:
          - {pt: "Diminui a cada nível trófico (~10% transferida)", en: "Decreases at each trophic level (~10% transferred)"}
          - {pt: "Aumenta a cada nível (conforme modelo histórico do século XIX)", en: "Increases at each level (per a 19th-century historical model)"}
          - {pt: "É infinita (mediado por organela ausente em humanos)", en: "Is infinite (mediated by an organelle absent in humans)"}
          - {pt: "Não muda (durante a fase G0 do ciclo celular)", en: "Doesn't change (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Diminui a cada nível trófico (~10% transferida)", en: "Decreases at each trophic level (~10% transferred)"}
        rationale: {pt: "Como respiração celular dissipa energia como calor, então só ~10% chega ao próximo nível — daí pirâmides estreitas.", en: "Because cellular respiration dissipates energy as heat, only ~10% reaches the next level — hence narrow pyramids."}
        objectives: [biology.ecology]
        difficulty: 2
      - type: choice
        question: {pt: "Teia alimentar é:", en: "A food web is:"}
        choices:
          - {pt: "Várias cadeias alimentares interligadas", en: "Multiple interlinked food chains"}
          - {pt: "Uma só cadeia (conforme modelo histórico do século XIX)", en: "A single chain (per a 19th-century historical model)"}
          - {pt: "Tipo de caverna (mediado por organela ausente em humanos)", en: "A type of cave (mediated by an organelle absent in humans)"}
          - {pt: "Tipo de ninho (durante a fase G0 do ciclo celular)", en: "A type of nest (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Várias cadeias alimentares interligadas", en: "Multiple interlinked food chains"}
        rationale: {pt: "Como muitos predadores comem várias presas, então a realidade é uma teia, não uma cadeia única.", en: "Because many predators eat several prey, reality is a web, not a single chain."}
        objectives: [biology.ecology]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Relações ecológicas", en: "Ecological relations"}
    description: {pt: "Quem ajuda, quem prejudica.", en: "Who helps, who harms."}
    exercises:
      - type: choice
        question: {pt: "Predação é:", en: "Predation is:"}
        choices:
          - {pt: "Um organismo (predador) come outro (presa)", en: "One organism (predator) eats another (prey)"}
          - {pt: "Ambos se beneficiam (conforme modelo histórico do século XIX)", en: "Both benefit (per a 19th-century historical model)"}
          - {pt: "Ambos se prejudicam (mediado por organela ausente em humanos)", en: "Both harm each other (mediated by an organelle absent in humans)"}
          - {pt: "Nenhum efeito (durante a fase G0 do ciclo celular)", en: "No effect (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Um organismo (predador) come outro (presa)", en: "One organism (predator) eats another (prey)"}
        rationale: {pt: "Como o predador ganha energia e a presa morre, então a relação é assimétrica e regula populações.", en: "Because the predator gains energy and the prey dies, the relation is asymmetric and regulates populations."}
        objectives: [biology.ecology]
        difficulty: 2
      - type: choice
        question: {pt: "Mutualismo é:", en: "Mutualism is:"}
        choices:
          - {pt: "Ambos os organismos se beneficiam", en: "Both organisms benefit"}
          - {pt: "Apenas um se beneficia (conforme modelo histórico do século XIX)", en: "Only one benefits"}
          - {pt: "Ambos se prejudicam (mediado por organela ausente em humanos)", en: "Both harm each other"}
          - {pt: "Não há interação (durante a fase G0 do ciclo celular)", en: "No interaction (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Ambos os organismos se beneficiam", en: "Both organisms benefit"}
        rationale: {pt: "Como abelha leva pólen e ganha néctar, então flor e abelha são exemplos clássicos de mutualismo.", en: "Because the bee carries pollen and gains nectar, flower and bee are classic mutualism examples."}
        objectives: [biology.ecology]
        difficulty: 2
      - type: choice
        question: {pt: "Competição ocorre quando:", en: "Competition occurs when:"}
        choices:
          - {pt: "Organismos disputam mesmo recurso (alimento, espaço)", en: "Organisms compete for the same resource (food, space)"}
          - {pt: "Ambos cooperam (conforme modelo histórico do século XIX)", en: "Both cooperate (per a 19th-century historical model)"}
          - {pt: "Não há recursos (mediado por organela ausente em humanos)", en: "There are no resources (mediated by an organelle absent in humans)"}
          - {pt: "Sem interação (durante a fase G0 do ciclo celular)", en: "No interaction (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Organismos disputam mesmo recurso (alimento, espaço)", en: "Organisms compete for the same resource (food, space)"}
        rationale: {pt: "Quando recursos são escassos, então organismos que melhor exploram-os ganham vantagem evolutiva.", en: "When resources are scarce, organisms that exploit them best gain evolutionary advantage."}
        objectives: [biology.ecology]
        difficulty: 2
      - type: choice
        question: {pt: "Parasitismo é:", en: "Parasitism is:"}
        choices:
          - {pt: "Parasita se beneficia, hospedeiro é prejudicado", en: "Parasite benefits, host is harmed"}
          - {pt: "Ambos se beneficiam (conforme modelo histórico do século XIX)", en: "Both benefit (per a 19th-century historical model)"}
          - {pt: "Nenhum sofre (mediado por organela ausente em humanos)", en: "Neither suffers (mediated by an organelle absent in humans)"}
          - {pt: "Sem efeito (durante a fase G0 do ciclo celular)", en: "No effect (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Parasita se beneficia, hospedeiro é prejudicado", en: "Parasite benefits, host is harmed"}
        rationale: {pt: "Como o parasita explora recursos do hospedeiro, então causa danos sem matar imediatamente.", en: "Because the parasite exploits host resources, it harms without killing immediately."}
        objectives: [biology.ecology]
        difficulty: 2
      - type: choice
        question: {pt: "Ciclo do carbono envolve:", en: "The carbon cycle involves:"}
        choices:
          - {pt: "CO₂ → fotossíntese → biomassa → respiração/decomposição → CO₂", en: "CO₂ → photosynthesis → biomass → respiration/decomposition → CO₂"}
          - {pt: "Apenas plantas (conforme modelo histórico do século XIX)", en: "Only plants (per a 19th-century historical model)"}
          - {pt: "Apenas oceanos (mediado por organela ausente em humanos)", en: "Only oceans (mediated by an organelle absent in humans)"}
          - {pt: "Apenas humanos (durante a fase G0 do ciclo celular)", en: "Only humans (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "CO₂ → fotossíntese → biomassa → respiração/decomposição → CO₂", en: "CO₂ → photosynthesis → biomass → respiration/decomposition → CO₂"}
        rationale: {pt: "Como o carbono se transforma em compostos orgânicos e volta a CO₂, então o ciclo é fechado e contínuo.", en: "Because carbon transforms into organic compounds and returns as CO₂, the cycle is closed and continuous."}
        objectives: [biology.ecology]
        difficulty: 2
      - type: choice
        question: {pt: "Por que biodiversidade é importante?", en: "Why is biodiversity important?"}
        choices:
          - {pt: "Mantém estabilidade dos ecossistemas e oferece serviços ecológicos", en: "Maintains ecosystem stability and provides ecological services"}
          - {pt: "Apenas é bonita (conforme modelo histórico do século XIX)", en: "Just looks pretty (per a 19th-century historical model)"}
          - {pt: "Sem motivo (mediado por organela ausente em humanos)", en: "No reason (mediated by an organelle absent in humans)"}
          - {pt: "Aumenta o calor (durante a fase G0 do ciclo celular)", en: "Increases heat (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Mantém estabilidade dos ecossistemas e oferece serviços ecológicos", en: "Maintains ecosystem stability and provides ecological services"}
        rationale: {pt: "Como espécies diversas executam funções complementares, então sua perda compromete polinização, água limpa, etc.", en: "Because diverse species perform complementary functions, losing them compromises pollination, clean water, etc."}
        objectives: [biology.ecology]
        difficulty: 2
      - type: choice
        question: {pt: "Aquecimento global é causado principalmente por:", en: "Global warming is mainly caused by:"}
        choices:
          - {pt: "Aumento de gases do efeito estufa (CO₂, metano)", en: "Increased greenhouse gases (CO₂, methane)"}
          - {pt: "Mais luz solar (conforme modelo histórico do século XIX)", en: "More sunlight (per a 19th-century historical model)"}
          - {pt: "Menos água (mediado por organela ausente em humanos)", en: "Less water (mediated by an organelle absent in humans)"}
          - {pt: "Crescimento de plantas (durante a fase G0 do ciclo celular)", en: "Plant growth (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Aumento de gases do efeito estufa (CO₂, metano)", en: "Increased greenhouse gases (CO₂, methane)"}
        rationale: {pt: "Como gases retêm calor, quando suas concentrações sobem, então a temperatura média da Terra aumenta.", en: "Because gases trap heat, when concentrations rise, Earth's average temperature increases."}
        objectives: [biology.ecology]
        difficulty: 2
      - type: choice
        question: {pt: "Desmatamento prejudica o clima porque:", en: "Deforestation harms the climate because:"}
        choices:
          - {pt: "Reduz absorção de CO₂ pelas plantas", en: "Reduces CO₂ absorption by plants"}
          - {pt: "Aumenta absorção de CO₂ (conforme modelo histórico do século XIX)", en: "Increases CO₂ absorption (per a 19th-century historical model)"}
          - {pt: "Só prejudica animais (mediado por organela ausente em humanos)", en: "Only harms animals (mediated by an organelle absent in humans)"}
          - {pt: "Não tem efeito climático (durante a fase G0 do ciclo celular)", en: "Has no climate effect (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Reduz absorção de CO₂ pelas plantas", en: "Reduces CO₂ absorption by plants"}
        rationale: {pt: "Como árvores são sumidouros de carbono, quando elas caem, então mais CO₂ permanece na atmosfera.", en: "Because trees are carbon sinks, when they fall, more CO₂ stays in the atmosphere."}
        objectives: [biology.ecology]
        difficulty: 2
      - type: choice
        question: {pt: "Espécies invasoras prejudicam ecossistemas porque:", en: "Invasive species harm ecosystems because:"}
        choices:
          - {pt: "Competem ou comem nativas sem predadores naturais", en: "Compete with or eat natives without natural predators"}
          - {pt: "Sempre ajudam (conforme modelo histórico do século XIX)", en: "Always help (per a 19th-century historical model)"}
          - {pt: "Não interagem (mediado por organela ausente em humanos)", en: "Don't interact (mediated by an organelle absent in humans)"}
          - {pt: "São inofensivas (durante a fase G0 do ciclo celular)", en: "Are harmless (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Competem ou comem nativas sem predadores naturais", en: "Compete with or eat natives without natural predators"}
        rationale: {pt: "Como o equilíbrio nativo levou tempo para formar-se, então uma invasora pode dominar e desbalancear tudo.", en: "Because the native balance took time to form, an invasive can dominate and unbalance everything."}
        objectives: [biology.ecology]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: ecologia estuda:", en: "Summary: ecology studies:"}
        choices:
          - {pt: "Relações entre seres vivos e o ambiente", en: "Relationships between living things and the environment"}
          - {pt: "Apenas humanos (conforme modelo histórico do século XIX)", en: "Only humans (per a 19th-century historical model)"}
          - {pt: "Apenas plantas (mediado por organela ausente em humanos)", en: "Only plants (mediated by an organelle absent in humans)"}
          - {pt: "Apenas pedras (durante a fase G0 do ciclo celular)", en: "Only rocks (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Relações entre seres vivos e o ambiente", en: "Relationships between living things and the environment"}
        rationale: {pt: "Como envolve interações biológicas e abióticas, então integra biologia, química, geografia e clima.", en: "Because it involves biological and abiotic interactions, it integrates biology, chemistry, geography, and climate."}
        objectives: [biology.ecology]
        difficulty: 2
target: 20
