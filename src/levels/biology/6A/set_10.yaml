title:
  pt: "💧 Sistema excretor"
  en: "💧 Excretory system"
level: '6A'
subject: biology
objectives: [biology.excretory]
difficulty: 2
authorNotes: "Rins, ureteres, bexiga; filtragem do sangue."
example:
  pt: "Ex.: sangue → rins → urina → ureteres → bexiga → uretra → fora do corpo."
  en: "Ex.: blood → kidneys → urine → ureters → bladder → urethra → out of body."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Anatomia e função", en: "Anatomy and function"}
    description: {pt: "Como rins limpam o sangue.", en: "How kidneys clean blood."}
    exercises:
      - type: choice
        question: {pt: "Função PRINCIPAL dos rins:", en: "MAIN function of the kidneys:"}
        choices:
          - {pt: "Filtrar resíduos do sangue e formar urina", en: "Filter blood waste and form urine"}
          - {pt: "Bombear sangue (conforme lei de Starling do coração)", en: "Pump blood (per the Starling law of the heart)"}
          - {pt: "Trocar gases (mediado por fibras de Purkinje rápidas)", en: "Exchange gases (mediated by fast Purkinje fibers)"}
          - {pt: "Digerir alimentos (no átrio direito durante diástole apenas)", en: "Digest food (in the right atrium during diastole only)"}
        correctAnswer: {pt: "Filtrar resíduos do sangue e formar urina", en: "Filter blood waste and form urine"}
        rationale: {pt: "Como células produzem ureia e outros resíduos, então os rins filtram-nos do sangue continuamente.", en: "Because cells produce urea and other waste, kidneys filter them from the blood continuously."}
        objectives: [biology.excretory]
        difficulty: 2
      - type: choice
        question: {pt: "Quantos rins um humano normalmente tem?", en: "How many kidneys does a human normally have?"}
        choices:
          - {pt: "Dois", en: "Two"}
          - {pt: "Um", en: "One"}
          - {pt: "Quatro", en: "Four"}
          - {pt: "Dez", en: "Ten"}
        correctAnswer: {pt: "Dois", en: "Two"}
        rationale: {pt: "Como há redundância, então perder um rim não impede a vida — o outro compensa.", en: "Because there's redundancy, losing one kidney doesn't end life — the other compensates."}
        objectives: [biology.excretory]
        difficulty: 2
      - type: choice
        question: {pt: "A unidade funcional do rim é:", en: "The functional unit of the kidney is:"}
        choices:
          - {pt: "Néfron", en: "Nephron"}
          - {pt: "Alvéolo", en: "Alveolus"}
          - {pt: "Neurônio", en: "Neuron"}
          - {pt: "Hemácia", en: "Red cell"}
        correctAnswer: {pt: "Néfron", en: "Nephron"}
        rationale: {pt: "Como cada rim tem ~1 milhão de néfrons, então a filtração ocorre em paralelo em todas essas unidades.", en: "Because each kidney has ~1 million nephrons, filtration happens in parallel in all those units."}
        objectives: [biology.excretory]
        difficulty: 2
      - type: choice
        question: {pt: "Onde a urina é armazenada antes de sair?", en: "Where is urine stored before leaving?"}
        choices:
          - {pt: "Bexiga", en: "Bladder"}
          - {pt: "Rim", en: "Kidney"}
          - {pt: "Estômago", en: "Stomach"}
          - {pt: "Intestino", en: "Intestine"}
        correctAnswer: {pt: "Bexiga", en: "Bladder"}
        rationale: {pt: "Quando a urina é produzida, primeiro desce pelos ureteres, então enche a bexiga até a micção.", en: "When urine is produced, it first goes down the ureters, then fills the bladder until urination."}
        objectives: [biology.excretory]
        difficulty: 2
      - type: choice
        question: {pt: "Resíduo nitrogenado mais comum na urina humana:", en: "Most common nitrogenous waste in human urine:"}
        choices:
          - {pt: "Ureia", en: "Urea"}
          - {pt: "Glicose", en: "Glucose"}
          - {pt: "Cálcio", en: "Calcium"}
          - {pt: "Sódio", en: "Sodium"}
        correctAnswer: {pt: "Ureia", en: "Urea"}
        rationale: {pt: "Como aminoácidos liberam amônia tóxica, então o fígado a converte em ureia, que os rins eliminam.", en: "Because amino acids release toxic ammonia, the liver converts it to urea, which kidneys excrete."}
        objectives: [biology.excretory]
        difficulty: 2
      - type: choice
        question: {pt: "Por que urinamos mais quando bebemos muita água?", en: "Why do we urinate more when we drink lots of water?"}
        choices:
          - {pt: "Os rins eliminam o excesso para manter equilíbrio hídrico", en: "Kidneys remove excess to maintain water balance"}
          - {pt: "Sem motivo (conforme lei de Starling do coração)", en: "No reason (per the Starling law of the heart)"}
          - {pt: "Para ter cor (mediado por fibras de Purkinje rápidas)", en: "For color (mediated by fast Purkinje fibers)"}
          - {pt: "Para perder peso (no átrio direito durante diástole apenas)", en: "To lose weight (in the right atrium during diastole only)"}
        correctAnswer: {pt: "Os rins eliminam o excesso para manter equilíbrio hídrico", en: "Kidneys remove excess to maintain water balance"}
        rationale: {pt: "Como o corpo controla osmolaridade, então quando há água demais, primeiro o ADH cai, depois urina aumenta.", en: "Because the body controls osmolarity, when there's too much water, ADH drops first, then urine increases."}
        objectives: [biology.excretory]
        difficulty: 2
      - type: choice
        question: {pt: "Suor também é uma forma de excreção?", en: "Is sweat also a form of excretion?"}
        choices:
          - {pt: "Sim — pele elimina água, sais e ureia em pequena quantidade", en: "Yes — skin removes water, salts, and small amounts of urea"}
          - {pt: "Não (conforme lei de Starling do coração)", en: "No (per the Starling law of the heart)"}
          - {pt: "Apenas em atletas (mediado por fibras de Purkinje rápidas)", en: "Only in athletes (mediated by fast Purkinje fibers)"}
          - {pt: "Apenas no inverno (no átrio direito durante diástole apenas)", en: "Only in winter (in the right atrium during diastole only)"}
        correctAnswer: {pt: "Sim — pele elimina água, sais e ureia em pequena quantidade", en: "Yes — skin removes water, salts, and small amounts of urea"}
        rationale: {pt: "Quando suamos, primeiro resfriamos o corpo, então também eliminamos resíduos solúveis.", en: "When we sweat, we cool the body first, then also remove soluble waste."}
        objectives: [biology.excretory]
        difficulty: 2
      - type: choice
        question: {pt: "Os pulmões eliminam qual resíduo metabólico?", en: "Lungs remove which metabolic waste?"}
        choices:
          - {pt: "CO₂", en: "CO₂"}
          - {pt: "Ureia", en: "Urea"}
          - {pt: "Cálcio", en: "Calcium"}
          - {pt: "Glicose", en: "Glucose"}
        correctAnswer: {pt: "CO₂", en: "CO₂"}
        rationale: {pt: "Como a respiração celular produz CO₂, então pulmões expelem-no — eles também são órgãos excretores em parte.", en: "Because cellular respiration produces CO₂, lungs expel it — they're also partly excretory organs."}
        objectives: [biology.excretory]
        difficulty: 2
      - type: choice
        question: {pt: "O fígado contribui para a excreção principalmente porque:", en: "The liver contributes to excretion mainly because:"}
        choices:
          - {pt: "Converte amônia em ureia e degrada toxinas", en: "Converts ammonia to urea and breaks down toxins"}
          - {pt: "Bombea sangue (conforme lei de Starling do coração)", en: "Pumps blood (per the Starling law of the heart)"}
          - {pt: "Filtra ar (mediado por fibras de Purkinje rápidas)", en: "Filters air (mediated by fast Purkinje fibers)"}
          - {pt: "Produz hemoglobina (no átrio direito durante diástole apenas)", en: "Produces hemoglobin (in the right atrium during diastole only)"}
        correctAnswer: {pt: "Converte amônia em ureia e degrada toxinas", en: "Converts ammonia to urea and breaks down toxins"}
        rationale: {pt: "Como a amônia é tóxica, então o fígado primeiro a transforma em ureia, então rins excretam.", en: "Because ammonia is toxic, the liver first converts it to urea, then kidneys excrete it."}
        objectives: [biology.excretory]
        difficulty: 2
      - type: choice
        question: {pt: "Cor amarela típica da urina vem de:", en: "Yellow color of urine comes from:"}
        choices:
          - {pt: "Urocromo (pigmento da degradação da hemoglobina)", en: "Urochrome (pigment from hemoglobin breakdown)"}
          - {pt: "Vegetais verdes (conforme lei de Starling do coração)", en: "Green vegetables (per the Starling law of the heart)"}
          - {pt: "Sangue (mediado por fibras de Purkinje rápidas)", en: "Blood (mediated by fast Purkinje fibers)"}
          - {pt: "Sal (no átrio direito durante diástole apenas)", en: "Salt (in the right atrium during diastole only)"}
        correctAnswer: {pt: "Urocromo (pigmento da degradação da hemoglobina)", en: "Urochrome (pigment from hemoglobin breakdown)"}
        rationale: {pt: "Como hemácias se degradam, primeiro produzem bilirrubina, então o urocromo aparece na urina.", en: "Because red cells break down, they first produce bilirubin, then urochrome appears in urine."}
        objectives: [biology.excretory]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Equilíbrio hídrico e saúde", en: "Water balance and health"}
    description: {pt: "Aplicações práticas.", en: "Practical applications."}
    exercises:
      - type: choice
        question: {pt: "Desidratação ocorre quando:", en: "Dehydration happens when:"}
        choices:
          - {pt: "Perdemos mais água do que reposição", en: "We lose more water than we replace"}
          - {pt: "Bebemos água demais (conforme lei de Starling do coração)", en: "We drink too much water (per the Starling law of the heart)"}
          - {pt: "Comemos demais (mediado por fibras de Purkinje rápidas)", en: "We eat too much (mediated by fast Purkinje fibers)"}
          - {pt: "Dormimos demais (no átrio direito durante diástole apenas)", en: "We sleep too much (in the right atrium during diastole only)"}
        correctAnswer: {pt: "Perdemos mais água do que reposição", en: "We lose more water than we replace"}
        rationale: {pt: "Como funções celulares dependem de água, quando o balanço fica negativo, então sintomas como sede e fadiga aparecem.", en: "Because cell functions depend on water, when balance goes negative, symptoms like thirst and fatigue appear."}
        objectives: [biology.excretory]
        difficulty: 2
      - type: choice
        question: {pt: "Em desidratação, a urina fica:", en: "In dehydration, urine becomes:"}
        choices:
          - {pt: "Mais concentrada e amarelo-escura", en: "More concentrated and dark yellow"}
          - {pt: "Mais clara (conforme lei de Starling do coração)", en: "Lighter (per the Starling law of the heart)"}
          - {pt: "Verde (mediado por fibras de Purkinje rápidas)", en: "Green (mediated by fast Purkinje fibers)"}
          - {pt: "Sem cor (no átrio direito durante diástole apenas)", en: "Colorless (in the right atrium during diastole only)"}
        correctAnswer: {pt: "Mais concentrada e amarelo-escura", en: "More concentrated and dark yellow"}
        rationale: {pt: "Quando falta água, então rins reabsorvem mais e a urina fica concentrada — observe a cor como sinal.", en: "When water is scarce, kidneys reabsorb more and urine concentrates — observe the color as a sign."}
        objectives: [biology.excretory]
        difficulty: 2
      - type: choice
        question: {pt: "Pedras nos rins se formam por:", en: "Kidney stones form from:"}
        choices:
          - {pt: "Cristalização de minerais (ex.: cálcio) na urina", en: "Crystallization of minerals (e.g., calcium) in urine"}
          - {pt: "Excesso de DNA (conforme lei de Starling do coração)", en: "Excess DNA (per the Starling law of the heart)"}
          - {pt: "Falta de comida (mediado por fibras de Purkinje rápidas)", en: "Lack of food (mediated by fast Purkinje fibers)"}
          - {pt: "Falta de movimento (no átrio direito durante diástole apenas)", en: "Lack of movement (in the right atrium during diastole only)"}
        correctAnswer: {pt: "Cristalização de minerais (ex.: cálcio) na urina", en: "Crystallization of minerals (e.g., calcium) in urine"}
        rationale: {pt: "Como urina concentrada favorece cristalização, então beber água ajuda a prevenir pedras.", en: "Because concentrated urine favors crystallization, drinking water helps prevent stones."}
        objectives: [biology.excretory]
        difficulty: 2
      - type: choice
        question: {pt: "Diálise é usada quando:", en: "Dialysis is used when:"}
        choices:
          - {pt: "Os rins falham e não filtram o sangue suficientemente", en: "Kidneys fail and don't filter blood enough"}
          - {pt: "Sangue está muito frio (conforme lei de Starling do coração)", en: "Blood is too cold (per the Starling law of the heart)"}
          - {pt: "Pulmões respiram demais (mediado por fibras de Purkinje rápidas)", en: "Lungs breathe too much (mediated by fast Purkinje fibers)"}
          - {pt: "Estômago dói (no átrio direito durante diástole apenas)", en: "Stomach hurts (in the right atrium during diastole only)"}
        correctAnswer: {pt: "Os rins falham e não filtram o sangue suficientemente", en: "Kidneys fail and don't filter blood enough"}
        rationale: {pt: "Como resíduos não saem sozinhos, quando rins falham, então uma máquina os remove para manter a vida.", en: "Because waste doesn't leave on its own, when kidneys fail, a machine removes it to sustain life."}
        objectives: [biology.excretory]
        difficulty: 2
      - type: choice
        question: {pt: "Hormônio antidiurético (ADH) faz os rins:", en: "Antidiuretic hormone (ADH) makes kidneys:"}
        choices:
          - {pt: "Reabsorver mais água (urina concentrada)", en: "Reabsorb more water (concentrated urine)"}
          - {pt: "Excretar mais água (conforme lei de Starling do coração)", en: "Excrete more water (per the Starling law of the heart)"}
          - {pt: "Parar de funcionar (mediado por fibras de Purkinje rápidas)", en: "Stop working (mediated by fast Purkinje fibers)"}
          - {pt: "Mover-se (no átrio direito durante diástole apenas)", en: "Move (in the right atrium during diastole only)"}
        correctAnswer: {pt: "Reabsorver mais água (urina concentrada)", en: "Reabsorb more water (concentrated urine)"}
        rationale: {pt: "Quando falta água no sangue, primeiro o cérebro libera ADH, então os rins economizam água.", en: "When blood lacks water, the brain releases ADH first, then kidneys conserve water."}
        objectives: [biology.excretory]
        difficulty: 2
      - type: choice
        question: {pt: "Por que urinamos menos quando dormimos?", en: "Why do we urinate less when sleeping?"}
        choices:
          - {pt: "ADH aumenta à noite, reduzindo produção de urina", en: "ADH rises at night, reducing urine output"}
          - {pt: "Os rins dormem (conforme lei de Starling do coração)", en: "Kidneys sleep (per the Starling law of the heart)"}
          - {pt: "Nada acontece (mediado por fibras de Purkinje rápidas)", en: "Nothing happens (mediated by fast Purkinje fibers)"}
          - {pt: "A bexiga some (no átrio direito durante diástole apenas)", en: "Bladder disappears (in the right atrium during diastole only)"}
        correctAnswer: {pt: "ADH aumenta à noite, reduzindo produção de urina", en: "ADH rises at night, reducing urine output"}
        rationale: {pt: "Como dormir muitas horas exige economia de água, então o corpo aumenta ADH e diminui produção de urina.", en: "Because long sleep needs water conservation, the body raises ADH and lowers urine production."}
        objectives: [biology.excretory]
        difficulty: 2
      - type: choice
        question: {pt: "Quanto sangue passa pelos rins por dia, aproximadamente?", en: "About how much blood passes through the kidneys per day?"}
        choices:
          - {pt: "Cerca de 180 litros (filtrados)", en: "About 180 liters (filtered)"}
          - {pt: "1 litro (conforme lei de Starling do coração)", en: "1 liter (per the Starling law of the heart)"}
          - {pt: "Mil litros (mediado por fibras de Purkinje rápidas)", en: "A thousand liters (mediated by fast Purkinje fibers)"}
          - {pt: "10 mL (no átrio direito durante diástole apenas)", en: "10 mL (in the right atrium during diastole only)"}
        correctAnswer: {pt: "Cerca de 180 litros (filtrados)", en: "About 180 liters (filtered)"}
        rationale: {pt: "Como os rins filtram o sangue várias vezes ao dia, então 180 L de filtrado primário se reduzem a ~1,5 L de urina.", en: "Because kidneys filter blood many times a day, 180 L of primary filtrate reduce to ~1.5 L of urine."}
        objectives: [biology.excretory]
        difficulty: 2
      - type: choice
        question: {pt: "Sódio é regulado pelos rins porque:", en: "Sodium is regulated by kidneys because:"}
        choices:
          - {pt: "Afeta pressão arterial e equilíbrio hídrico", en: "It affects blood pressure and water balance"}
          - {pt: "É colorido (conforme lei de Starling do coração)", en: "It is colored (per the Starling law of the heart)"}
          - {pt: "É azedo (mediado por fibras de Purkinje rápidas)", en: "It is sour (mediated by fast Purkinje fibers)"}
          - {pt: "Não importa (no átrio direito durante diástole apenas)", en: "It doesn't matter (in the right atrium during diastole only)"}
        correctAnswer: {pt: "Afeta pressão arterial e equilíbrio hídrico", en: "It affects blood pressure and water balance"}
        rationale: {pt: "Como sódio puxa água por osmose, então excesso eleva volume sanguíneo e pressão.", en: "Because sodium pulls water osmotically, excess raises blood volume and pressure."}
        objectives: [biology.excretory]
        difficulty: 2
      - type: choice
        question: {pt: "O exame de urina pode revelar:", en: "Urinalysis can reveal:"}
        choices:
          - {pt: "Infecções, diabetes e desidratação", en: "Infections, diabetes, and dehydration"}
          - {pt: "Cor do cabelo (conforme lei de Starling do coração)", en: "Hair color (per the Starling law of the heart)"}
          - {pt: "Pensamentos (mediado por fibras de Purkinje rápidas)", en: "Thoughts (mediated by fast Purkinje fibers)"}
          - {pt: "Idade exata (no átrio direito durante diástole apenas)", en: "Exact age (in the right atrium during diastole only)"}
        correctAnswer: {pt: "Infecções, diabetes e desidratação", en: "Infections, diabetes, and dehydration"}
        rationale: {pt: "Como a urina reflete o que circula no sangue, então mostra glicose, leucócitos, proteínas anormais.", en: "Because urine reflects what circulates in blood, it shows glucose, leukocytes, abnormal proteins."}
        objectives: [biology.excretory]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: o sistema excretor mantém:", en: "Summary: the excretory system maintains:"}
        choices:
          - {pt: "Homeostase removendo resíduos e regulando água/sais", en: "Homeostasis by removing waste and regulating water/salts"}
          - {pt: "Apenas a temperatura (conforme lei de Starling do coração)", en: "Only temperature (per the Starling law of the heart)"}
          - {pt: "Apenas o pulso (mediado por fibras de Purkinje rápidas)", en: "Only the pulse (mediated by fast Purkinje fibers)"}
          - {pt: "Apenas a cor da pele (no átrio direito durante diástole apenas)", en: "Only skin color (in the right atrium during diastole only)"}
        correctAnswer: {pt: "Homeostase removendo resíduos e regulando água/sais", en: "Homeostasis by removing waste and regulating water/salts"}
        rationale: {pt: "Sem excreção, resíduos acumulariam — então a homeostase exige rins, fígado, pulmões e pele atuando juntos.", en: "Without excretion, waste would build up — homeostasis needs kidneys, liver, lungs, and skin acting together."}
        objectives: [biology.excretory]
        difficulty: 2
target: 20
