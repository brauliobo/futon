title:
  pt: "🐾 Reino animal — visão geral"
  en: "🐾 Animal kingdom — overview"
level: '6A'
subject: biology
objectives: [biology.animals]
difficulty: 2
authorNotes: "Vertebrados e invertebrados, principais classes."
example:
  pt: "Ex.: peixe → vertebrado aquático; sapo → anfíbio; cobra → réptil; pomba → ave; gato → mamífero."
  en: "Ex.: fish → aquatic vertebrate; frog → amphibian; snake → reptile; dove → bird; cat → mammal."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Vertebrados", en: "Vertebrates"}
    description: {pt: "Animais com coluna vertebral.", en: "Animals with a vertebral column."}
    exercises:
      - type: choice
        question: {pt: "Vertebrados são animais que têm:", en: "Vertebrates are animals that have:"}
        choices:
          - {pt: "Coluna vertebral (espinha dorsal)", en: "A vertebral column (backbone)"}
          - {pt: "Concha (conforme modelo histórico do século XIX)", en: "A shell (per a 19th-century historical model)"}
          - {pt: "Escamas obrigatórias (mediado por organela ausente em humanos)", en: "Mandatory scales (mediated by an organelle absent in humans)"}
          - {pt: "Asas obrigatórias (durante a fase G0 do ciclo celular)", en: "Mandatory wings (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Coluna vertebral (espinha dorsal)", en: "A vertebral column (backbone)"}
        rationale: {pt: "Como a coluna sustenta o corpo e protege a medula, então define o grupo dos vertebrados.", en: "Because the spine supports the body and protects the spinal cord, it defines the vertebrate group."}
        objectives: [biology.animals]
        difficulty: 2
      - type: choice
        question: {pt: "Peixes respiram por:", en: "Fish breathe through:"}
        choices:
          - {pt: "Brânquias (extraem O₂ da água)", en: "Gills (extract O₂ from water)"}
          - {pt: "Pulmões (conforme modelo histórico do século XIX)", en: "Lungs (per a 19th-century historical model)"}
          - {pt: "Pele apenas (mediado por organela ausente em humanos)", en: "Only skin (mediated by an organelle absent in humans)"}
          - {pt: "Não respiram (durante a fase G0 do ciclo celular)", en: "Don't breathe (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Brânquias (extraem O₂ da água)", en: "Gills (extract O₂ from water)"}
        rationale: {pt: "Como brânquias têm vasos finos e grande superfície, então difusão eficiente capta O₂ dissolvido.", en: "Because gills have thin vessels and large surface, efficient diffusion captures dissolved O₂."}
        objectives: [biology.animals]
        difficulty: 2
      - type: choice
        question: {pt: "Anfíbios (sapo, salamandra) caracterizam-se por:", en: "Amphibians (frog, salamander) are characterized by:"}
        choices:
          - {pt: "Vida aquática na fase larval e terrestre/úmida na adulta", en: "Aquatic larval life and terrestrial/moist adult life"}
          - {pt: "Apenas vida aquática (conforme modelo histórico do século XIX)", en: "Only aquatic life (per a 19th-century historical model)"}
          - {pt: "Apenas vida terrestre seca (mediado por organela ausente em humanos)", en: "Only dry terrestrial life (mediated by an organelle absent in humans)"}
          - {pt: "Vivem em alta altitude (durante a fase G0 do ciclo celular)", en: "Live at high altitude (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Vida aquática na fase larval e terrestre/úmida na adulta", en: "Aquatic larval life and terrestrial/moist adult life"}
        rationale: {pt: "Como pele permeável precisa umidade, então adultos vivem perto da água; girinos respiram por brânquias antes da metamorfose.", en: "Because permeable skin requires moisture, adults live near water; tadpoles breathe via gills before metamorphosis."}
        objectives: [biology.animals]
        difficulty: 2
      - type: choice
        question: {pt: "Répteis (cobra, lagarto) têm:", en: "Reptiles (snake, lizard) have:"}
        choices:
          - {pt: "Pele com escamas e ovos com casca", en: "Scaly skin and shelled eggs"}
          - {pt: "Pele úmida sem escamas (conforme modelo histórico do século XIX)", en: "Moist skin without scales (per a 19th-century historical model)"}
          - {pt: "Penas em todo corpo (mediado por organela ausente em humanos)", en: "Feathers all over (mediated by an organelle absent in humans)"}
          - {pt: "Pelo denso (durante a fase G0 do ciclo celular)", en: "Dense fur (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Pele com escamas e ovos com casca", en: "Scaly skin and shelled eggs"}
        rationale: {pt: "Como escamas reduzem perda de água e ovos com casca permitem reprodução em terra seca, então répteis dominam ambientes terrestres.", en: "Because scales reduce water loss and shelled eggs allow reproduction on dry land, reptiles dominate terrestrial habitats."}
        objectives: [biology.animals]
        difficulty: 2
      - type: choice
        question: {pt: "Aves caracterizam-se por:", en: "Birds are characterized by:"}
        choices:
          - {pt: "Penas, bico e ovos com casca calcária", en: "Feathers, beak, and calcareous-shelled eggs"}
          - {pt: "Pele nua e dentes (conforme modelo histórico do século XIX)", en: "Bare skin and teeth (per a 19th-century historical model)"}
          - {pt: "Pelos e amamentação (mediado por organela ausente em humanos)", en: "Fur and nursing (mediated by an organelle absent in humans)"}
          - {pt: "Brânquias e nadadeiras (durante a fase G0 do ciclo celular)", en: "Gills and fins (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Penas, bico e ovos com casca calcária", en: "Feathers, beak, and calcareous-shelled eggs"}
        rationale: {pt: "Como penas isolam e permitem voo, então as aves se diferenciaram dos répteis ancestrais.", en: "Because feathers insulate and enable flight, birds diverged from ancestral reptiles."}
        objectives: [biology.animals]
        difficulty: 2
      - type: choice
        question: {pt: "Mamíferos caracterizam-se por:", en: "Mammals are characterized by:"}
        choices:
          - {pt: "Pelos e glândulas mamárias (amamentação)", en: "Fur and mammary glands (nursing)"}
          - {pt: "Penas e bico (conforme modelo histórico do século XIX)", en: "Feathers and beak (per a 19th-century historical model)"}
          - {pt: "Brânquias (mediado por organela ausente em humanos)", en: "Gills (mediated by an organelle absent in humans)"}
          - {pt: "Casca calcária no ovo (durante a fase G0 do ciclo celular)", en: "Calcareous egg shell (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Pelos e glândulas mamárias (amamentação)", en: "Fur and mammary glands (nursing)"}
        rationale: {pt: "Como filhotes mamíferos dependem de leite materno, então a amamentação é traço definidor do grupo.", en: "Because mammal young depend on mother's milk, nursing is the defining trait."}
        objectives: [biology.animals]
        difficulty: 2
      - type: choice
        question: {pt: "Animais endotérmicos (sangue quente) são:", en: "Endothermic (warm-blooded) animals are:"}
        choices:
          - {pt: "Aves e mamíferos", en: "Birds and mammals"}
          - {pt: "Peixes e répteis", en: "Fish and reptiles"}
          - {pt: "Apenas insetos", en: "Only insects"}
          - {pt: "Apenas humanos (durante a fase G0 do ciclo celular)", en: "Only humans (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Aves e mamíferos", en: "Birds and mammals"}
        rationale: {pt: "Como geram calor metabolicamente, então mantêm temperatura interna estável independente do ambiente.", en: "Because they generate heat metabolically, they keep stable internal temperature regardless of environment."}
        objectives: [biology.animals]
        difficulty: 2
      - type: choice
        question: {pt: "Animais ectotérmicos (sangue frio) incluem:", en: "Ectothermic (cold-blooded) animals include:"}
        choices:
          - {pt: "Peixes, anfíbios, répteis", en: "Fish, amphibians, reptiles"}
          - {pt: "Apenas mamíferos (conforme modelo histórico do século XIX)", en: "Only mammals (per a 19th-century historical model)"}
          - {pt: "Apenas aves (mediado por organela ausente em humanos)", en: "Only birds (mediated by an organelle absent in humans)"}
          - {pt: "Apenas humanos", en: "Only humans"}
        correctAnswer: {pt: "Peixes, anfíbios, répteis", en: "Fish, amphibians, reptiles"}
        rationale: {pt: "Como dependem do calor externo, então temperatura corporal varia com o ambiente — daí gastam menos energia.", en: "Because they rely on external heat, body temperature varies with environment — using less energy."}
        objectives: [biology.animals]
        difficulty: 2
      - type: choice
        question: {pt: "Humanos são:", en: "Humans are:"}
        choices:
          - {pt: "Mamíferos primatas", en: "Primate mammals"}
          - {pt: "Aves (conforme modelo histórico do século XIX)", en: "Birds (per a 19th-century historical model)"}
          - {pt: "Répteis (mediado por organela ausente em humanos)", en: "Reptiles (mediated by an organelle absent in humans)"}
          - {pt: "Anfíbios (durante a fase G0 do ciclo celular)", en: "Amphibians (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Mamíferos primatas", en: "Primate mammals"}
        rationale: {pt: "Como temos pelos, glândulas mamárias e cérebro grande, então pertencemos à ordem dos primatas dentro de Mammalia.", en: "Because we have fur, mammary glands, and large brains, we belong to the primate order within Mammalia."}
        objectives: [biology.animals]
        difficulty: 2
      - type: choice
        question: {pt: "Vertebrado mais antigo evolutivamente:", en: "Evolutionarily oldest vertebrate group:"}
        choices:
          - {pt: "Peixes", en: "Fish"}
          - {pt: "Mamíferos", en: "Mammals"}
          - {pt: "Aves", en: "Birds"}
          - {pt: "Répteis", en: "Reptiles"}
        correctAnswer: {pt: "Peixes", en: "Fish"}
        rationale: {pt: "Como a vida começou nos oceanos, então peixes surgiram primeiro; depois anfíbios, répteis, aves e mamíferos.", en: "Because life began in oceans, fish appeared first; then amphibians, reptiles, birds, and mammals."}
        objectives: [biology.animals]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Invertebrados", en: "Invertebrates"}
    description: {pt: "Animais sem coluna vertebral.", en: "Animals without a backbone."}
    exercises:
      - type: choice
        question: {pt: "Invertebrados representam aproximadamente:", en: "Invertebrates represent about:"}
        choices:
          - {pt: "Mais de 95% das espécies animais", en: "Over 95% of animal species"}
          - {pt: "Apenas 1% (conforme modelo histórico do século XIX)", en: "Just 1% (per a 19th-century historical model)"}
          - {pt: "Cerca de 50% (mediado por organela ausente em humanos)", en: "About 50% (mediated by an organelle absent in humans)"}
          - {pt: "Não há invertebrados (durante a fase G0 do ciclo celular)", en: "There are none (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Mais de 95% das espécies animais", en: "Over 95% of animal species"}
        rationale: {pt: "Como insetos, moluscos e vermes são abundantes, então a maior parte da diversidade animal é invertebrada.", en: "Because insects, mollusks, and worms are abundant, most animal diversity is invertebrate."}
        objectives: [biology.animals]
        difficulty: 2
      - type: choice
        question: {pt: "Insetos são:", en: "Insects are:"}
        choices:
          - {pt: "Artrópodes com 6 pernas e exoesqueleto", en: "Arthropods with 6 legs and exoskeleton"}
          - {pt: "Vertebrados pequenos (conforme modelo histórico do século XIX)", en: "Small vertebrates (per a 19th-century historical model)"}
          - {pt: "Tipos de fungos (mediado por organela ausente em humanos)", en: "Types of fungi (mediated by an organelle absent in humans)"}
          - {pt: "Plantas miniatura (durante a fase G0 do ciclo celular)", en: "Miniature plants (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Artrópodes com 6 pernas e exoesqueleto", en: "Arthropods with 6 legs and exoskeleton"}
        rationale: {pt: "Como o exoesqueleto de quitina protege e dá forma, então insetos dominaram quase todos ambientes terrestres.", en: "Because the chitin exoskeleton protects and shapes them, insects dominate nearly every terrestrial habitat."}
        objectives: [biology.animals]
        difficulty: 2
      - type: choice
        question: {pt: "Aranhas têm quantas pernas?", en: "How many legs do spiders have?"}
        choices:
          - {pt: "Oito", en: "Eight"}
          - {pt: "Seis", en: "Six"}
          - {pt: "Quatro", en: "Four"}
          - {pt: "Dez", en: "Ten"}
        correctAnswer: {pt: "Oito", en: "Eight"}
        rationale: {pt: "Como aranhas são aracnídeos (não insetos), então têm 8 pernas — diferença anatômica importante.", en: "Because spiders are arachnids (not insects), they have 8 legs — an important anatomical distinction."}
        objectives: [biology.animals]
        difficulty: 2
      - type: choice
        question: {pt: "Moluscos incluem:", en: "Mollusks include:"}
        choices:
          - {pt: "Caracol, polvo, lula, mexilhão", en: "Snail, octopus, squid, mussel"}
          - {pt: "Cobra, lagarto, jacaré (conforme modelo histórico do século XIX)", en: "Snake, lizard, alligator (per a 19th-century historical model)"}
          - {pt: "Cão, gato, vaca (mediado por organela ausente em humanos)", en: "Dog, cat, cow (mediated by an organelle absent in humans)"}
          - {pt: "Pinheiro, carvalho, palmeira (durante a fase G0 do ciclo celular)", en: "Pine, oak, palm (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Caracol, polvo, lula, mexilhão", en: "Snail, octopus, squid, mussel"}
        rationale: {pt: "Como têm corpo mole (com ou sem concha), então a classe reúne formas variadas mas com plano corporal comum.", en: "Because they have soft bodies (with or without shell), the class groups varied forms with a common body plan."}
        objectives: [biology.animals]
        difficulty: 2
      - type: choice
        question: {pt: "Anelídeos são:", en: "Annelids are:"}
        choices:
          - {pt: "Vermes segmentados (minhoca, sanguessuga)", en: "Segmented worms (earthworm, leech)"}
          - {pt: "Vermes sem segmentos (conforme modelo histórico do século XIX)", en: "Non-segmented worms (per a 19th-century historical model)"}
          - {pt: "Insetos voadores (mediado por organela ausente em humanos)", en: "Flying insects (mediated by an organelle absent in humans)"}
          - {pt: "Caracóis (durante a fase G0 do ciclo celular)", en: "Snails (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Vermes segmentados (minhoca, sanguessuga)", en: "Segmented worms (earthworm, leech)"}
        rationale: {pt: "Como o corpo é dividido em anéis idênticos, então cada segmento tem músculo, nervos e tubo digestivo próprios.", en: "Because the body is divided into identical rings, each segment has its own muscle, nerves, and gut."}
        objectives: [biology.animals]
        difficulty: 2
      - type: choice
        question: {pt: "Cnidários incluem:", en: "Cnidarians include:"}
        choices:
          - {pt: "Águas-vivas, corais, anêmonas", en: "Jellyfish, corals, anemones"}
          - {pt: "Peixes e tubarões (conforme modelo histórico do século XIX)", en: "Fish and sharks (per a 19th-century historical model)"}
          - {pt: "Cobras e jacarés (mediado por organela ausente em humanos)", en: "Snakes and alligators (mediated by an organelle absent in humans)"}
          - {pt: "Insetos (durante a fase G0 do ciclo celular)", en: "Insects (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Águas-vivas, corais, anêmonas", en: "Jellyfish, corals, anemones"}
        rationale: {pt: "Como possuem células urticantes, então capturam presas com toxinas — daí o nome \"cnidos\" (urtiga, em grego).", en: "Because they have stinging cells, they catch prey with toxins — hence the name \"cnido\" (Greek for nettle)."}
        objectives: [biology.animals]
        difficulty: 2
      - type: choice
        question: {pt: "Equinodermos são:", en: "Echinoderms are:"}
        choices:
          - {pt: "Estrelas-do-mar, ouriços, pepinos-do-mar", en: "Starfish, urchins, sea cucumbers"}
          - {pt: "Insetos (conforme modelo histórico do século XIX)", en: "Insects (per a 19th-century historical model)"}
          - {pt: "Aves marinhas (mediado por organela ausente em humanos)", en: "Sea birds (mediated by an organelle absent in humans)"}
          - {pt: "Mamíferos aquáticos (durante a fase G0 do ciclo celular)", en: "Aquatic mammals (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Estrelas-do-mar, ouriços, pepinos-do-mar", en: "Starfish, urchins, sea cucumbers"}
        rationale: {pt: "Como têm simetria radial e sistema vascular hídrico, então o grupo é exclusivo do ambiente marinho.", en: "Because they have radial symmetry and a water vascular system, the group is exclusive to the marine environment."}
        objectives: [biology.animals]
        difficulty: 2
      - type: choice
        question: {pt: "Insetos são importantes ecologicamente porque:", en: "Insects are ecologically important because:"}
        choices:
          - {pt: "Polinizam plantas e participam de cadeias tróficas", en: "Pollinate plants and join food chains"}
          - {pt: "São apenas pragas (conforme modelo histórico do século XIX)", en: "Are only pests (per a 19th-century historical model)"}
          - {pt: "Não fazem nada (mediado por organela ausente em humanos)", en: "Do nothing (mediated by an organelle absent in humans)"}
          - {pt: "São apenas decorativos (durante a fase G0 do ciclo celular)", en: "Are only decorative (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Polinizam plantas e participam de cadeias tróficas", en: "Pollinate plants and join food chains"}
        rationale: {pt: "Como abelhas e borboletas polinizam culturas e insetos servem de alimento a aves/peixes, então sua perda afeta tudo.", en: "Because bees and butterflies pollinate crops and insects feed birds/fish, their loss affects everything."}
        objectives: [biology.animals]
        difficulty: 2
      - type: choice
        question: {pt: "Plâncton inclui:", en: "Plankton includes:"}
        choices:
          - {pt: "Pequenos organismos que flutuam na água (animais e vegetais)", en: "Small organisms drifting in water (animal and plant)"}
          - {pt: "Apenas grandes peixes (conforme modelo histórico do século XIX)", en: "Only large fish (per a 19th-century historical model)"}
          - {pt: "Apenas baleias (mediado por organela ausente em humanos)", en: "Only whales (mediated by an organelle absent in humans)"}
          - {pt: "Apenas conchas (durante a fase G0 do ciclo celular)", en: "Only shells (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Pequenos organismos que flutuam na água (animais e vegetais)", en: "Small organisms drifting in water (animal and plant)"}
        rationale: {pt: "Como zooplâncton e fitoplâncton sustentam cadeias marinhas, então sua biomassa é a base da vida no oceano.", en: "Because zooplankton and phytoplankton sustain marine chains, their biomass is the base of ocean life."}
        objectives: [biology.animals]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: o reino animal é dominado em diversidade por:", en: "Summary: the animal kingdom is dominated in diversity by:"}
        choices:
          - {pt: "Invertebrados (especialmente insetos)", en: "Invertebrates (especially insects)"}
          - {pt: "Apenas mamíferos (conforme modelo histórico do século XIX)", en: "Only mammals (per a 19th-century historical model)"}
          - {pt: "Apenas peixes (mediado por organela ausente em humanos)", en: "Only fish (mediated by an organelle absent in humans)"}
          - {pt: "Apenas aves (durante a fase G0 do ciclo celular)", en: "Only birds (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Invertebrados (especialmente insetos)", en: "Invertebrates (especially insects)"}
        rationale: {pt: "Como insetos somam ~1 milhão de espécies descritas, então superam de longe os ~70 mil vertebrados.", en: "Because insects total ~1 million described species, they vastly outnumber the ~70,000 vertebrates."}
        objectives: [biology.animals]
        difficulty: 2
target: 20
