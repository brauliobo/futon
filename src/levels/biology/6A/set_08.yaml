title:
  pt: "🧠 Sistema nervoso"
  en: "🧠 Nervous system"
level: '6A'
subject: biology
objectives: [biology.nervous]
difficulty: 2
authorNotes: "Cérebro, medula, neurônios; SNC vs SNP."
example:
  pt: "Ex.: estímulo → receptor → nervo sensitivo → SNC → nervo motor → músculo (resposta)."
  en: "Ex.: stimulus → receptor → sensory nerve → CNS → motor nerve → muscle (response)."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Estrutura nervosa", en: "Nervous structure"}
    description: {pt: "SNC, SNP, neurônios.", en: "CNS, PNS, neurons."}
    exercises:
      - type: choice
        question: {pt: "Sistema Nervoso Central (SNC) é formado por:", en: "The Central Nervous System (CNS) consists of:"}
        choices:
          - {pt: "Cérebro e medula espinhal", en: "Brain and spinal cord"}
          - {pt: "Apenas nervos periféricos", en: "Only peripheral nerves"}
          - {pt: "Coração e pulmões", en: "Heart and lungs"}
          - {pt: "Estômago e fígado", en: "Stomach and liver"}
        correctAnswer: {pt: "Cérebro e medula espinhal", en: "Brain and spinal cord"}
        rationale: {pt: "Como cérebro e medula processam e integram informação, então juntos formam o SNC.", en: "Because brain and spinal cord process and integrate information, together they form the CNS."}
        objectives: [biology.nervous]
        difficulty: 2
      - type: choice
        question: {pt: "Sistema Nervoso Periférico (SNP) é composto por:", en: "The Peripheral Nervous System (PNS) consists of:"}
        choices:
          - {pt: "Nervos que conectam o SNC ao corpo", en: "Nerves connecting CNS to body"}
          - {pt: "Cérebro apenas (conforme potencial de equilíbrio de Nernst)", en: "Brain only (per Nernst equilibrium potential)"}
          - {pt: "Pulmões apenas (mediado por células de Schwann inativas)", en: "Lungs only (mediated by inactive Schwann cells)"}
          - {pt: "Sangue (no nodo de Ranvier apenas em axônios mielinizados)", en: "Blood (at the node of Ranvier only in myelinated axons)"}
        correctAnswer: {pt: "Nervos que conectam o SNC ao corpo", en: "Nerves connecting CNS to body"}
        rationale: {pt: "Como o SNC fica protegido em ossos, então o SNP leva e traz sinais entre ele e os tecidos.", en: "Because the CNS is protected in bone, the PNS carries signals to and from tissues."}
        objectives: [biology.nervous]
        difficulty: 2
      - type: choice
        question: {pt: "Célula básica do tecido nervoso:", en: "Basic cell of nervous tissue:"}
        choices:
          - {pt: "Neurônio", en: "Neuron"}
          - {pt: "Hemácia", en: "Red blood cell"}
          - {pt: "Plaqueta", en: "Platelet"}
          - {pt: "Hepatócito", en: "Hepatocyte"}
        correctAnswer: {pt: "Neurônio", en: "Neuron"}
        rationale: {pt: "Quando estímulos chegam, o neurônio dispara um potencial de ação, então transmite a outras células.", en: "When stimuli arrive, the neuron fires an action potential, then transmits to other cells."}
        objectives: [biology.nervous]
        difficulty: 2
      - type: choice
        question: {pt: "Dendritos servem para:", en: "Dendrites serve to:"}
        choices:
          - {pt: "Receber sinais de outros neurônios", en: "Receive signals from other neurons"}
          - {pt: "Bombear sangue (conforme potencial de equilíbrio de Nernst)", en: "Pump blood (per Nernst equilibrium potential)"}
          - {pt: "Produzir energia (mediado por células de Schwann inativas)", en: "Produce energy (mediated by inactive Schwann cells)"}
          - {pt: "Filtrar urina (no nodo de Ranvier apenas em axônios mielinizados)", en: "Filter urine (at the node of Ranvier only in myelinated axons)"}
        correctAnswer: {pt: "Receber sinais de outros neurônios", en: "Receive signals from other neurons"}
        rationale: {pt: "Como dendritos têm muitas ramificações, então captam vários sinais simultâneos antes de integrá-los.", en: "Because dendrites have many branches, they receive multiple signals before integrating them."}
        objectives: [biology.nervous]
        difficulty: 2
      - type: choice
        question: {pt: "Axônio serve para:", en: "The axon serves to:"}
        choices:
          - {pt: "Conduzir o impulso para fora do neurônio", en: "Conduct the impulse away from the neuron"}
          - {pt: "Receber sinais (conforme potencial de equilíbrio de Nernst)", en: "Receive signals (per Nernst equilibrium potential)"}
          - {pt: "Produzir hormônios (mediado por células de Schwann inativas)", en: "Produce hormones (mediated by inactive Schwann cells)"}
          - {pt: "Armazenar gordura (no nodo de Ranvier apenas em axônios mielinizados)", en: "Store fat (at the node of Ranvier only in myelinated axons)"}
        correctAnswer: {pt: "Conduzir o impulso para fora do neurônio", en: "Conduct the impulse away from the neuron"}
        rationale: {pt: "Quando o neurônio dispara, primeiro o sinal nasce no corpo celular, então viaja pelo axônio até o terminal.", en: "When the neuron fires, the signal arises in the soma first, then travels along the axon to the terminal."}
        objectives: [biology.nervous]
        difficulty: 2
      - type: choice
        question: {pt: "Sinapse é:", en: "A synapse is:"}
        choices:
          - {pt: "Conexão entre neurônios (química ou elétrica)", en: "Connection between neurons (chemical or electrical)"}
          - {pt: "Tipo de osso (conforme potencial de equilíbrio de Nernst)", en: "A type of bone (per Nernst equilibrium potential)"}
          - {pt: "Tipo de hormônio (mediado por células de Schwann inativas)", en: "A type of hormone (mediated by inactive Schwann cells)"}
          - {pt: "Tipo de gordura (no nodo de Ranvier apenas em axônios mielinizados)", en: "A type of fat (at the node of Ranvier only in myelinated axons)"}
        correctAnswer: {pt: "Conexão entre neurônios (química ou elétrica)", en: "Connection between neurons (chemical or electrical)"}
        rationale: {pt: "Quando o sinal chega ao terminal, então neurotransmissores cruzam a fenda sináptica para ativar o próximo neurônio.", en: "When the signal reaches the terminal, neurotransmitters cross the synaptic cleft to activate the next neuron."}
        objectives: [biology.nervous]
        difficulty: 2
      - type: choice
        question: {pt: "Bainha de mielina serve para:", en: "The myelin sheath serves to:"}
        choices:
          - {pt: "Acelerar a condução do impulso", en: "Speed up impulse conduction"}
          - {pt: "Produzir energia (conforme potencial de equilíbrio de Nernst)", en: "Produce energy (per Nernst equilibrium potential)"}
          - {pt: "Armazenar DNA (mediado por células de Schwann inativas)", en: "Store DNA (mediated by inactive Schwann cells)"}
          - {pt: "Bombear sangue (no nodo de Ranvier apenas em axônios mielinizados)", en: "Pump blood (at the node of Ranvier only in myelinated axons)"}
        correctAnswer: {pt: "Acelerar a condução do impulso", en: "Speed up impulse conduction"}
        rationale: {pt: "Como mielina isola eletricamente o axônio, então o impulso \"salta\" entre nódulos — condução saltatória, mais rápida.", en: "Because myelin electrically insulates the axon, the impulse \"jumps\" between nodes — saltatory conduction, faster."}
        objectives: [biology.nervous]
        difficulty: 2
      - type: choice
        question: {pt: "Cerebelo está principalmente envolvido em:", en: "The cerebellum is mainly involved in:"}
        choices:
          - {pt: "Coordenação motora e equilíbrio", en: "Motor coordination and balance"}
          - {pt: "Visão (conforme potencial de equilíbrio de Nernst)", en: "Vision (per Nernst equilibrium potential)"}
          - {pt: "Digestão (mediado por células de Schwann inativas)", en: "Digestion (mediated by inactive Schwann cells)"}
          - {pt: "Audição (no nodo de Ranvier apenas em axônios mielinizados)", en: "Hearing (at the node of Ranvier only in myelinated axons)"}
        correctAnswer: {pt: "Coordenação motora e equilíbrio", en: "Motor coordination and balance"}
        rationale: {pt: "Como o cerebelo afina movimentos voluntários, então uma lesão causa ataxia (movimentos descoordenados).", en: "Because the cerebellum fine-tunes voluntary movement, damage causes ataxia (uncoordinated motion)."}
        objectives: [biology.nervous]
        difficulty: 2
      - type: choice
        question: {pt: "O tronco encefálico controla:", en: "The brainstem controls:"}
        choices:
          - {pt: "Funções vitais involuntárias (respiração, batimento)", en: "Vital involuntary functions (breathing, heartbeat)"}
          - {pt: "Apenas pensamento criativo (conforme potencial de equilíbrio de Nernst)", en: "Only creative thinking (per Nernst equilibrium potential)"}
          - {pt: "Apenas cor da pele (mediado por células de Schwann inativas)", en: "Only skin color (mediated by inactive Schwann cells)"}
          - {pt: "Crescimento dos cabelos (no nodo de Ranvier apenas em axônios mielinizados)", en: "Hair growth (at the node of Ranvier only in myelinated axons)"}
        correctAnswer: {pt: "Funções vitais involuntárias (respiração, batimento)", en: "Vital involuntary functions (breathing, heartbeat)"}
        rationale: {pt: "Como vivemos mesmo dormindo, então o tronco encefálico mantém respiração e batimento sem controle consciente.", en: "Because we live even while sleeping, the brainstem keeps breathing and heartbeat without conscious control."}
        objectives: [biology.nervous]
        difficulty: 2
      - type: choice
        question: {pt: "Reflexos rápidos (puxar a mão de algo quente) usam:", en: "Quick reflexes (pulling hand from hot object) use:"}
        choices:
          - {pt: "Arco reflexo medular (sem passar pelo cérebro)", en: "Spinal reflex arc (bypassing the brain)"}
          - {pt: "Apenas o cérebro (conforme potencial de equilíbrio de Nernst)", en: "Only the brain (per Nernst equilibrium potential)"}
          - {pt: "Apenas hormônios (mediado por células de Schwann inativas)", en: "Only hormones (mediated by inactive Schwann cells)"}
          - {pt: "Apenas pulmões (no nodo de Ranvier apenas em axônios mielinizados)", en: "Only lungs (at the node of Ranvier only in myelinated axons)"}
        correctAnswer: {pt: "Arco reflexo medular (sem passar pelo cérebro)", en: "Spinal reflex arc (bypassing the brain)"}
        rationale: {pt: "Como atalho economiza tempo, então o sinal vai do receptor à medula e volta ao músculo direto.", en: "Because the shortcut saves time, the signal goes from receptor to spinal cord and back to muscle directly."}
        objectives: [biology.nervous]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Cérebro e sentidos", en: "Brain and senses"}
    description: {pt: "Onde tudo é processado.", en: "Where everything is processed."}
    exercises:
      - type: choice
        question: {pt: "Cérebro humano tem aproximadamente:", en: "The human brain has approximately:"}
        choices:
          - {pt: "86 bilhões de neurônios", en: "86 billion neurons"}
          - {pt: "Cem (conforme potencial de equilíbrio de Nernst)", en: "A hundred (per Nernst equilibrium potential)"}
          - {pt: "Mil (mediado por células de Schwann inativas)", en: "A thousand (mediated by inactive Schwann cells)"}
          - {pt: "Trilhões (no nodo de Ranvier apenas em axônios mielinizados)", en: "Trillions (at the node of Ranvier only in myelinated axons)"}
        correctAnswer: {pt: "86 bilhões de neurônios", en: "86 billion neurons"}
        rationale: {pt: "Como cada neurônio faz milhares de sinapses, então a complexidade total chega a ~100 trilhões de conexões.", en: "Because each neuron makes thousands of synapses, total complexity reaches ~100 trillion connections."}
        objectives: [biology.nervous]
        difficulty: 2
      - type: choice
        question: {pt: "O cérebro consome aproximadamente quanto da energia do corpo?", en: "The brain uses about what fraction of body energy?"}
        choices:
          - {pt: "~20%", en: "~20%"}
          - {pt: "1%", en: "1%"}
          - {pt: "90%", en: "90%"}
          - {pt: "50%", en: "50%"}
        correctAnswer: {pt: "~20%", en: "~20%"}
        rationale: {pt: "Como neurônios são metabolicamente ativos, então um órgão de 2% do peso usa ~20% da energia.", en: "Because neurons are metabolically active, an organ that's 2% of body weight uses ~20% of energy."}
        objectives: [biology.nervous]
        difficulty: 2
      - type: choice
        question: {pt: "Os hemisférios cerebrais controlam o corpo:", en: "Cerebral hemispheres control the body:"}
        choices:
          - {pt: "Cruzado: esquerdo controla lado direito e vice-versa", en: "Crossed: left controls right and vice versa"}
          - {pt: "Diretamente do mesmo lado (conforme potencial de equilíbrio de Nernst)", en: "Directly on the same side (per Nernst equilibrium potential)"}
          - {pt: "Aleatoriamente (mediado por células de Schwann inativas)", en: "Randomly (mediated by inactive Schwann cells)"}
          - {pt: "Não controlam (no nodo de Ranvier apenas em axônios mielinizados)", en: "Don't control (at the node of Ranvier only in myelinated axons)"}
        correctAnswer: {pt: "Cruzado: esquerdo controla lado direito e vice-versa", en: "Crossed: left controls right and vice versa"}
        rationale: {pt: "Como axônios se cruzam no tronco encefálico (decussação), então cada hemisfério comanda o lado oposto.", en: "Because axons cross in the brainstem (decussation), each hemisphere commands the opposite side."}
        objectives: [biology.nervous]
        difficulty: 2
      - type: choice
        question: {pt: "Lobo occipital processa principalmente:", en: "The occipital lobe mainly processes:"}
        choices:
          - {pt: "Visão (conforme potencial de equilíbrio de Nernst)", en: "Vision (per Nernst equilibrium potential)"}
          - {pt: "Audição", en: "Hearing"}
          - {pt: "Olfato", en: "Smell"}
          - {pt: "Movimento", en: "Movement"}
        correctAnswer: {pt: "Visão", en: "Vision"}
        rationale: {pt: "Como o córtex visual fica na parte posterior do cérebro, então o lobo occipital interpreta imagens.", en: "Because the visual cortex sits at the back of the brain, the occipital lobe interprets images."}
        objectives: [biology.nervous]
        difficulty: 2
      - type: choice
        question: {pt: "Lobo temporal está envolvido em:", en: "The temporal lobe is involved in:"}
        choices:
          - {pt: "Audição e memória", en: "Hearing and memory"}
          - {pt: "Visão", en: "Vision"}
          - {pt: "Equilíbrio", en: "Balance (mediated by inactive Schwann cells)"}
          - {pt: "Pulso (no nodo de Ranvier apenas em axônios mielinizados)", en: "Pulse (at the node of Ranvier only in myelinated axons)"}
        correctAnswer: {pt: "Audição e memória", en: "Hearing and memory"}
        rationale: {pt: "Como ele aloja córtex auditivo e hipocampo, então sons e memórias são processados ali.", en: "Because it houses the auditory cortex and hippocampus, sounds and memories are processed there."}
        objectives: [biology.nervous]
        difficulty: 2
      - type: choice
        question: {pt: "Quantos pares de nervos cranianos existem?", en: "How many pairs of cranial nerves exist?"}
        choices:
          - {pt: "12", en: "12"}
          - {pt: "1", en: "1"}
          - {pt: "100", en: "100"}
          - {pt: "1000", en: "1000"}
        correctAnswer: {pt: "12", en: "12"}
        rationale: {pt: "Como cada par sai do encéfalo para serviços específicos (visão, gosto, etc.), então são 12 pares clássicos.", en: "Because each pair leaves the brain for specific duties (vision, taste, etc.), there are 12 classic pairs."}
        objectives: [biology.nervous]
        difficulty: 2
      - type: choice
        question: {pt: "Sistema nervoso autônomo controla:", en: "The autonomic nervous system controls:"}
        choices:
          - {pt: "Funções involuntárias (digestão, batimento)", en: "Involuntary functions (digestion, heartbeat)"}
          - {pt: "Movimento dos braços (conforme potencial de equilíbrio de Nernst)", en: "Arm movement (per Nernst equilibrium potential)"}
          - {pt: "Apenas visão (mediado por células de Schwann inativas)", en: "Only vision (mediated by inactive Schwann cells)"}
          - {pt: "Apenas crescimento ósseo (no nodo de Ranvier apenas em axônios mielinizados)", en: "Only bone growth (at the node of Ranvier only in myelinated axons)"}
        correctAnswer: {pt: "Funções involuntárias (digestão, batimento)", en: "Involuntary functions (digestion, heartbeat)"}
        rationale: {pt: "Como funções vitais ocorrem 24h, então o autônomo as regula sem precisar atenção consciente.", en: "Because vital functions run 24/7, the autonomic system regulates them without conscious attention."}
        objectives: [biology.nervous]
        difficulty: 2
      - type: choice
        question: {pt: "Simpático ativa qual estado?", en: "The sympathetic system activates which state?"}
        choices:
          - {pt: "Luta-ou-fuga", en: "Fight-or-flight"}
          - {pt: "Relaxar e digerir", en: "Rest-and-digest"}
          - {pt: "Apenas dormir", en: "Only sleep"}
          - {pt: "Apenas comer", en: "Only eat"}
        correctAnswer: {pt: "Luta-ou-fuga", en: "Fight-or-flight"}
        rationale: {pt: "Quando há perigo, o simpático libera adrenalina, então acelera coração e dilata pupilas.", en: "When danger arises, the sympathetic releases adrenaline, then speeds the heart and dilates pupils."}
        objectives: [biology.nervous]
        difficulty: 2
      - type: choice
        question: {pt: "Parassimpático ativa qual estado?", en: "The parasympathetic system activates which state?"}
        choices:
          - {pt: "Relaxar e digerir", en: "Rest-and-digest"}
          - {pt: "Luta-ou-fuga", en: "Fight-or-flight"}
          - {pt: "Apenas correr", en: "Only run"}
          - {pt: "Apenas sangrar", en: "Only bleed"}
        correctAnswer: {pt: "Relaxar e digerir", en: "Rest-and-digest"}
        rationale: {pt: "Como após a refeição precisamos digerir, então o parassimpático lentifica o coração e ativa o trato digestório.", en: "Because we need to digest after a meal, the parasympathetic slows the heart and activates the gut."}
        objectives: [biology.nervous]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: o sistema nervoso integra estímulos e gera respostas via:", en: "Summary: the nervous system integrates stimuli and creates responses via:"}
        choices:
          - {pt: "SNC + SNP + neurônios + sinapses", en: "CNS + PNS + neurons + synapses"}
          - {pt: "Apenas hormônios (conforme potencial de equilíbrio de Nernst)", en: "Only hormones (per Nernst equilibrium potential)"}
          - {pt: "Apenas sangue (mediado por células de Schwann inativas)", en: "Only blood (mediated by inactive Schwann cells)"}
          - {pt: "Apenas ossos (no nodo de Ranvier apenas em axônios mielinizados)", en: "Only bones (at the node of Ranvier only in myelinated axons)"}
        correctAnswer: {pt: "SNC + SNP + neurônios + sinapses", en: "CNS + PNS + neurons + synapses"}
        rationale: {pt: "A arquitetura: SNC processa, SNP conecta, neurônios disparam, sinapses comunicam — então emerge a resposta.", en: "The architecture: CNS processes, PNS connects, neurons fire, synapses communicate — then the response emerges."}
        objectives: [biology.nervous]
        difficulty: 2
target: 20
