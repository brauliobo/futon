title:
  pt: "👁️ Os cinco sentidos"
  en: "👁️ The five senses"
level: '6A'
subject: biology
objectives: [biology.senses]
difficulty: 2
authorNotes: "Visão, audição, olfato, paladar, tato — receptores e processamento."
example:
  pt: "Ex.: olho → visão; ouvido → audição; nariz → olfato; língua → paladar; pele → tato."
  en: "Ex.: eye → sight; ear → hearing; nose → smell; tongue → taste; skin → touch."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Visão e audição", en: "Sight and hearing"}
    description: {pt: "Olho e ouvido em detalhe.", en: "Eye and ear in detail."}
    exercises:
      - type: choice
        question: {pt: "A retina serve para:", en: "The retina serves to:"}
        choices:
          - {pt: "Capturar luz e converter em sinal nervoso", en: "Capture light and convert it to nerve signal"}
          - {pt: "Bombear sangue (conforme modelo histórico do século XIX)", en: "Pump blood (per a 19th-century historical model)"}
          - {pt: "Filtrar urina (mediado por organela ausente em humanos)", en: "Filter urine (mediated by an organelle absent in humans)"}
          - {pt: "Mover ossos (durante a fase G0 do ciclo celular)", en: "Move bones (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Capturar luz e converter em sinal nervoso", en: "Capture light and convert it to nerve signal"}
        rationale: {pt: "Como cones e bastonetes têm pigmentos fotossensíveis, então a luz desencadeia um potencial elétrico no nervo óptico.", en: "Because cones and rods have photosensitive pigments, light triggers an electrical potential in the optic nerve."}
        objectives: [biology.senses]
        difficulty: 2
      - type: choice
        question: {pt: "Cones detectam principalmente:", en: "Cones mainly detect:"}
        choices:
          - {pt: "Cores em luz forte", en: "Colors in bright light"}
          - {pt: "Sons agudos", en: "High-pitched sounds"}
          - {pt: "Cheiros (mediado por organela ausente em humanos)", en: "Smells (mediated by an organelle absent in humans)"}
          - {pt: "Sabores (durante a fase G0 do ciclo celular)", en: "Tastes (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Cores em luz forte", en: "Colors in bright light"}
        rationale: {pt: "Como cones têm três pigmentos sensíveis (RGB), então combinam-se para perceber cores diversas.", en: "Because cones have three sensitive pigments (RGB), they combine to perceive diverse colors."}
        objectives: [biology.senses]
        difficulty: 2
      - type: choice
        question: {pt: "Bastonetes detectam principalmente:", en: "Rods mainly detect:"}
        choices:
          - {pt: "Luz fraca (visão noturna, preto-e-branco)", en: "Dim light (night vision, black-and-white)"}
          - {pt: "Cores vivas (conforme modelo histórico do século XIX)", en: "Bright colors (per a 19th-century historical model)"}
          - {pt: "Som (mediado por organela ausente em humanos)", en: "Sound (mediated by an organelle absent in humans)"}
          - {pt: "Sabor (durante a fase G0 do ciclo celular)", en: "Taste (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Luz fraca (visão noturna, preto-e-branco)", en: "Dim light (night vision, black-and-white)"}
        rationale: {pt: "Como bastonetes são muito sensíveis mas não distinguem cores, então funcionam bem no escuro.", en: "Because rods are very sensitive but don't distinguish colors, they work well in the dark."}
        objectives: [biology.senses]
        difficulty: 2
      - type: choice
        question: {pt: "A pupila controla:", en: "The pupil controls:"}
        choices:
          - {pt: "A quantidade de luz que entra no olho", en: "How much light enters the eye"}
          - {pt: "A cor dos olhos (conforme modelo histórico do século XIX)", en: "Eye color (per a 19th-century historical model)"}
          - {pt: "A pressão arterial (mediado por organela ausente em humanos)", en: "Blood pressure (mediated by an organelle absent in humans)"}
          - {pt: "A respiração (durante a fase G0 do ciclo celular)", en: "Breathing (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "A quantidade de luz que entra no olho", en: "How much light enters the eye"}
        rationale: {pt: "Quando há muita luz, a pupila contrai; quando há pouca, dilata — íris ajusta como o diafragma de uma câmera.", en: "When light is bright, the pupil constricts; when dim, it dilates — the iris adjusts like a camera aperture."}
        objectives: [biology.senses]
        difficulty: 2
      - type: choice
        question: {pt: "O cristalino do olho serve para:", en: "The eye lens serves to:"}
        choices:
          - {pt: "Focar a imagem na retina", en: "Focus the image on the retina"}
          - {pt: "Produzir lágrimas (conforme modelo histórico do século XIX)", en: "Produce tears (per a 19th-century historical model)"}
          - {pt: "Mover o olho (mediado por organela ausente em humanos)", en: "Move the eye (mediated by an organelle absent in humans)"}
          - {pt: "Trocar gases (durante a fase G0 do ciclo celular)", en: "Exchange gases (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Focar a imagem na retina", en: "Focus the image on the retina"}
        rationale: {pt: "Como o cristalino é flexível, então músculos ciliares ajustam sua curvatura — primeiro o objeto, então o foco.", en: "Because the lens is flexible, ciliary muscles adjust its curvature — first the object, then focus."}
        objectives: [biology.senses]
        difficulty: 2
      - type: choice
        question: {pt: "Som chega ao ouvido como:", en: "Sound reaches the ear as:"}
        choices:
          - {pt: "Ondas de pressão (vibração do ar)", en: "Pressure waves (air vibrations)"}
          - {pt: "Luz (conforme modelo histórico do século XIX)", en: "Light (per a 19th-century historical model)"}
          - {pt: "Calor (mediado por organela ausente em humanos)", en: "Heat (mediated by an organelle absent in humans)"}
          - {pt: "Eletricidade direta (durante a fase G0 do ciclo celular)", en: "Direct electricity (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Ondas de pressão (vibração do ar)", en: "Pressure waves (air vibrations)"}
        rationale: {pt: "Quando algo vibra, então cria ondas no ar; o tímpano vibra junto, e o sinal segue para a cóclea.", en: "When something vibrates, it creates air waves; the eardrum vibrates along, and the signal goes to the cochlea."}
        objectives: [biology.senses]
        difficulty: 2
      - type: choice
        question: {pt: "A cóclea (ouvido interno) tem:", en: "The cochlea (inner ear) has:"}
        choices:
          - {pt: "Células ciliadas que detectam vibrações", en: "Hair cells that detect vibrations"}
          - {pt: "Hemácias", en: "Red cells"}
          - {pt: "Glóbulos brancos", en: "White cells"}
          - {pt: "Ossos do crânio", en: "Skull bones"}
        correctAnswer: {pt: "Células ciliadas que detectam vibrações", en: "Hair cells that detect vibrações"}
        rationale: {pt: "Como diferentes regiões da cóclea respondem a frequências distintas, então conseguimos distinguir agudo de grave.", en: "Because different regions of the cochlea respond to different frequencies, we distinguish high from low pitch."}
        objectives: [biology.senses]
        difficulty: 2
      - type: choice
        question: {pt: "Sons muito altos podem causar:", en: "Very loud sounds can cause:"}
        choices:
          - {pt: "Dano às células ciliadas (perda auditiva)", en: "Damage to hair cells (hearing loss)"}
          - {pt: "Perda de cabelo (conforme modelo histórico do século XIX)", en: "Hair loss (per a 19th-century historical model)"}
          - {pt: "Ganho de peso (mediado por organela ausente em humanos)", en: "Weight gain (mediated by an organelle absent in humans)"}
          - {pt: "Mudança de cor da pele (durante a fase G0 do ciclo celular)", en: "Skin color change (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Dano às células ciliadas (perda auditiva)", en: "Damage to hair cells (hearing loss)"}
        rationale: {pt: "Como células ciliadas não se regeneram em humanos, então a perda por trauma sonoro é permanente.", en: "Because hair cells don't regenerate in humans, hearing loss from acoustic trauma is permanent."}
        objectives: [biology.senses]
        difficulty: 2
      - type: choice
        question: {pt: "Daltonismo é mais comum em homens porque:", en: "Color blindness is more common in men because:"}
        choices:
          - {pt: "Genes do cone ficam no cromossomo X (homens só têm um)", en: "Cone genes sit on the X chromosome (men have only one)"}
          - {pt: "Homens olham mais (conforme modelo histórico do século XIX)", en: "Men look more (per a 19th-century historical model)"}
          - {pt: "Mulheres não têm cones (mediado por organela ausente em humanos)", en: "Women have no cones (mediated by an organelle absent in humans)"}
          - {pt: "Hormônios (durante a fase G0 do ciclo celular)", en: "Hormones (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Genes do cone ficam no cromossomo X (homens só têm um)", en: "Cone genes sit on the X chromosome (men have only one)"}
        rationale: {pt: "Como mulheres XX podem compensar com o outro X, então a herança recessiva ligada ao X afeta mais homens (XY).", en: "Because XX women can compensate via the other X, X-linked recessive inheritance affects men (XY) more."}
        objectives: [biology.senses]
        difficulty: 2
      - type: choice
        question: {pt: "O equilíbrio (sentido vestibular) é detectado em:", en: "Balance (vestibular sense) is detected in:"}
        choices:
          - {pt: "Canais semicirculares do ouvido interno", en: "Semicircular canals of the inner ear"}
          - {pt: "Olhos apenas (conforme modelo histórico do século XIX)", en: "Eyes only (per a 19th-century historical model)"}
          - {pt: "Pés apenas (mediado por organela ausente em humanos)", en: "Feet only (mediated by an organelle absent in humans)"}
          - {pt: "Estômago (durante a fase G0 do ciclo celular)", en: "Stomach (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Canais semicirculares do ouvido interno", en: "Semicircular canals of the inner ear"}
        rationale: {pt: "Quando a cabeça se move, então fluido nos canais detecta direção e velocidade — visão e tato ajudam.", en: "When the head moves, fluid in the canals detects direction and speed — vision and touch assist."}
        objectives: [biology.senses]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Olfato, paladar e tato", en: "Smell, taste, and touch"}
    description: {pt: "Sentidos químicos e mecânicos.", en: "Chemical and mechanical senses."}
    exercises:
      - type: choice
        question: {pt: "Olfato é detectado em:", en: "Smell is detected in:"}
        choices:
          - {pt: "Receptores olfatórios no nariz", en: "Olfactory receptors in the nose"}
          - {pt: "Língua (conforme modelo histórico do século XIX)", en: "Tongue (per a 19th-century historical model)"}
          - {pt: "Olho (mediado por organela ausente em humanos)", en: "Eye (mediated by an organelle absent in humans)"}
          - {pt: "Pele (durante a fase G0 do ciclo celular)", en: "Skin (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Receptores olfatórios no nariz", en: "Olfactory receptors in the nose"}
        rationale: {pt: "Quando moléculas voláteis chegam, então se ligam a receptores específicos — daí a variedade de odores.", en: "When volatile molecules arrive, they bind specific receptors — hence the variety of odors."}
        objectives: [biology.senses]
        difficulty: 2
      - type: choice
        question: {pt: "Sabor (paladar) é detectado em:", en: "Taste is detected in:"}
        choices:
          - {pt: "Papilas gustativas na língua", en: "Taste buds on the tongue"}
          - {pt: "Olho (conforme modelo histórico do século XIX)", en: "Eye (per a 19th-century historical model)"}
          - {pt: "Pele (mediado por organela ausente em humanos)", en: "Skin (mediated by an organelle absent in humans)"}
          - {pt: "Pulmão (durante a fase G0 do ciclo celular)", en: "Lung (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Papilas gustativas na língua", en: "Taste buds on the tongue"}
        rationale: {pt: "Como papilas têm receptores específicos, então identificam doce, salgado, azedo, amargo e umami.", en: "Because taste buds have specific receptors, they identify sweet, salty, sour, bitter, and umami."}
        objectives: [biology.senses]
        difficulty: 2
      - type: choice
        question: {pt: "Quantos sabores básicos identificamos?", en: "How many basic tastes do we identify?"}
        choices:
          - {pt: "Cinco (doce, salgado, azedo, amargo, umami)", en: "Five (sweet, salty, sour, bitter, umami)"}
          - {pt: "Dois (conforme modelo histórico do século XIX)", en: "Two (per a 19th-century historical model)"}
          - {pt: "Vinte (mediado por organela ausente em humanos)", en: "Twenty (mediated by an organelle absent in humans)"}
          - {pt: "Cem (durante a fase G0 do ciclo celular)", en: "A hundred (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Cinco (doce, salgado, azedo, amargo, umami)", en: "Five (sweet, salty, sour, bitter, umami)"}
        rationale: {pt: "Como receptores específicos respondem a cada categoria, então a percepção complexa do sabor combina os cinco com olfato.", en: "Because specific receptors respond to each category, complex flavor perception combines the five with smell."}
        objectives: [biology.senses]
        difficulty: 2
      - type: choice
        question: {pt: "Por que sabor e olfato estão tão ligados?", en: "Why are taste and smell so linked?"}
        choices:
          - {pt: "Aromas chegam ao nariz pelo fundo da boca durante a mastigação", en: "Aromas reach the nose through the back of the mouth while chewing"}
          - {pt: "São o mesmo sentido (conforme modelo histórico do século XIX)", en: "They are the same sense (per a 19th-century historical model)"}
          - {pt: "Coincidência (mediado por organela ausente em humanos)", en: "Coincidence (mediated by an organelle absent in humans)"}
          - {pt: "Cor da comida (durante a fase G0 do ciclo celular)", en: "Food color (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Aromas chegam ao nariz pelo fundo da boca durante a mastigação", en: "Aromas reach the nose through the back of the mouth while chewing"}
        rationale: {pt: "Quando estamos resfriados, observe que comidas perdem sabor — falta o componente olfativo.", en: "When we have a cold, note that food loses flavor — the olfactory component is missing."}
        objectives: [biology.senses]
        difficulty: 2
      - type: choice
        question: {pt: "Tato é detectado por:", en: "Touch is detected by:"}
        choices:
          - {pt: "Receptores variados na pele", en: "Various receptors in the skin"}
          - {pt: "Cérebro diretamente (conforme modelo histórico do século XIX)", en: "The brain directly (per a 19th-century historical model)"}
          - {pt: "Pulmão (mediado por organela ausente em humanos)", en: "Lungs (mediated by an organelle absent in humans)"}
          - {pt: "Estômago (durante a fase G0 do ciclo celular)", en: "Stomach (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Receptores variados na pele", en: "Various receptors in the skin"}
        rationale: {pt: "Como pressão, vibração, temperatura e dor têm receptores próprios, então a pele percebe múltiplos estímulos.", en: "Because pressure, vibration, temperature, and pain have their own receptors, skin senses multiple stimuli."}
        objectives: [biology.senses]
        difficulty: 2
      - type: choice
        question: {pt: "Onde a pele tem MAIS receptores táteis?", en: "Where does skin have THE MOST touch receptors?"}
        choices:
          - {pt: "Pontas dos dedos e lábios", en: "Fingertips and lips"}
          - {pt: "Costas (conforme modelo histórico do século XIX)", en: "Back (per a 19th-century historical model)"}
          - {pt: "Plantas dos pés (mediado por organela ausente em humanos)", en: "Soles of feet (mediated by an organelle absent in humans)"}
          - {pt: "Couro cabeludo (durante a fase G0 do ciclo celular)", en: "Scalp (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Pontas dos dedos e lábios", en: "Fingertips and lips"}
        rationale: {pt: "Como esses pontos exploram o ambiente, então a densidade de receptores é alta — daí a sensibilidade fina.", en: "Because these areas explore the environment, receptor density is high — hence the fine sensitivity."}
        objectives: [biology.senses]
        difficulty: 2
      - type: choice
        question: {pt: "Receptores de dor (nociceptores) servem para:", en: "Pain receptors (nociceptors) serve to:"}
        choices:
          - {pt: "Avisar sobre danos ao corpo", en: "Warn about body damage"}
          - {pt: "Atrapalhar a vida (conforme modelo histórico do século XIX)", en: "Annoy us (per a 19th-century historical model)"}
          - {pt: "Aquecer o corpo (mediado por organela ausente em humanos)", en: "Warm the body (mediated by an organelle absent in humans)"}
          - {pt: "Bombear sangue (durante a fase G0 do ciclo celular)", en: "Pump blood (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Avisar sobre danos ao corpo", en: "Warn about body damage"}
        rationale: {pt: "Quando há lesão real ou iminente, então nociceptores disparam para iniciarmos uma reação protetora.", en: "When there's real or imminent injury, nociceptors fire so we start a protective reaction."}
        objectives: [biology.senses]
        difficulty: 2
      - type: choice
        question: {pt: "Por que pessoas em situações estressantes podem sentir menos dor?", en: "Why might people in stressful situations feel less pain?"}
        choices:
          - {pt: "Liberação de endorfinas que bloqueiam sinais de dor", en: "Endorphin release blocks pain signals"}
          - {pt: "Pele fica mais grossa (conforme modelo histórico do século XIX)", en: "Skin gets thicker (per a 19th-century historical model)"}
          - {pt: "Receptores desaparecem (mediado por organela ausente em humanos)", en: "Receptors disappear (mediated by an organelle absent in humans)"}
          - {pt: "Sem motivo (durante a fase G0 do ciclo celular)", en: "No reason (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Liberação de endorfinas que bloqueiam sinais de dor", en: "Endorphin release blocks pain signals"}
        rationale: {pt: "Como o cérebro libera analgésicos próprios em emergência, então a dor é temporariamente abafada.", en: "Because the brain releases its own painkillers in emergencies, pain is temporarily dampened."}
        objectives: [biology.senses]
        difficulty: 2
      - type: choice
        question: {pt: "Visão é integrada com outros sentidos no:", en: "Vision is integrated with other senses in the:"}
        choices:
          - {pt: "Cérebro (cortex associativo)", en: "Brain (associative cortex)"}
          - {pt: "Olho diretamente (conforme modelo histórico do século XIX)", en: "Eye directly (per a 19th-century historical model)"}
          - {pt: "Estômago (mediado por organela ausente em humanos)", en: "Stomach (mediated by an organelle absent in humans)"}
          - {pt: "Coração (durante a fase G0 do ciclo celular)", en: "Heart (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Cérebro (cortex associativo)", en: "Brain (associative cortex)"}
        rationale: {pt: "Como percepção exige integrar múltiplas modalidades, então o córtex combina visão, audição, tato e contexto.", en: "Because perception requires integrating multiple modalities, the cortex combines sight, hearing, touch, and context."}
        objectives: [biology.senses]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: os sentidos transformam estímulos do mundo em:", en: "Summary: senses turn world stimuli into:"}
        choices:
          - {pt: "Sinais nervosos interpretados pelo cérebro", en: "Nerve signals interpreted by the brain"}
          - {pt: "Hormônios diretamente (conforme modelo histórico do século XIX)", en: "Hormones directly (per a 19th-century historical model)"}
          - {pt: "Calor apenas (mediado por organela ausente em humanos)", en: "Heat only (mediated by an organelle absent in humans)"}
          - {pt: "Som apenas (durante a fase G0 do ciclo celular)", en: "Sound only (during the G0 phase of the cell cycle)"}
        correctAnswer: {pt: "Sinais nervosos interpretados pelo cérebro", en: "Nerve signals interpreted by the brain"}
        rationale: {pt: "Receptores convertem estímulos físicos/químicos em potenciais elétricos; então o cérebro decodifica.", en: "Receptors turn physical/chemical stimuli into electrical potentials; then the brain decodes them."}
        objectives: [biology.senses]
        difficulty: 2
target: 20
