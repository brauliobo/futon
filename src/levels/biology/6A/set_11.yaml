title:
  pt: "🧪 Sistema endócrino"
  en: "🧪 Endocrine system"
level: '6A'
subject: biology
objectives: [biology.endocrine]
difficulty: 2
authorNotes: "Hormônios e glândulas: comunicação química lenta."
example:
  pt: "Ex.: pâncreas → insulina → reduz glicose; tireoide → tiroxina → metabolismo; suprarrenais → adrenalina → luta-ou-fuga."
  en: "Ex.: pancreas → insulin → lowers glucose; thyroid → thyroxine → metabolism; adrenals → adrenaline → fight-or-flight."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Glândulas e hormônios", en: "Glands and hormones"}
    description: {pt: "Quem produz o quê.", en: "Who produces what."}
    exercises:
      - type: choice
        question: {pt: "Hormônios são:", en: "Hormones are:"}
        choices:
          - {pt: "Mensageiros químicos transportados pelo sangue", en: "Chemical messengers carried by blood"}
          - {pt: "Tipos de osso", en: "Types of bone"}
          - {pt: "Tipos de gordura inerte", en: "Inert types of fat"}
          - {pt: "Vírus", en: "Viruses"}
        correctAnswer: {pt: "Mensageiros químicos transportados pelo sangue", en: "Chemical messengers carried by blood"}
        rationale: {pt: "Quando uma glândula libera hormônio, então ele percorre o sangue e atua em receptores específicos longe.", en: "When a gland releases a hormone, it travels in blood and acts on specific distant receptors."}
        objectives: [biology.endocrine]
        difficulty: 2
      - type: choice
        question: {pt: "Insulina é produzida pelo:", en: "Insulin is produced by the:"}
        choices:
          - {pt: "Pâncreas", en: "Pancreas"}
          - {pt: "Tireoide", en: "Thyroid"}
          - {pt: "Suprarrenal", en: "Adrenal"}
          - {pt: "Hipófise", en: "Pituitary"}
        correctAnswer: {pt: "Pâncreas", en: "Pancreas"}
        rationale: {pt: "Como células-beta detectam glicose alta, então liberam insulina para baixá-la.", en: "Because beta cells detect high glucose, they release insulin to lower it."}
        objectives: [biology.endocrine]
        difficulty: 2
      - type: choice
        question: {pt: "Insulina serve para:", en: "Insulin serves to:"}
        choices:
          - {pt: "Reduzir glicose no sangue (entrada nas células)", en: "Lower blood glucose (entry into cells)"}
          - {pt: "Aumentar glicose", en: "Raise glucose"}
          - {pt: "Reduzir cálcio", en: "Reduce calcium"}
          - {pt: "Bombear sangue", en: "Pump blood"}
        correctAnswer: {pt: "Reduzir glicose no sangue (entrada nas células)", en: "Lower blood glucose (entry into cells)"}
        rationale: {pt: "Quando comemos, glicose sobe; insulina é liberada, então as células absorvem o açúcar e a glicemia normaliza.", en: "When we eat, glucose rises; insulin is released, then cells absorb sugar and glycemia normalizes."}
        objectives: [biology.endocrine]
        difficulty: 2
      - type: choice
        question: {pt: "Diabetes tipo 1 ocorre por:", en: "Type 1 diabetes occurs because:"}
        choices:
          - {pt: "Falta de insulina (células-beta destruídas)", en: "Insulin deficiency (beta cells destroyed)"}
          - {pt: "Excesso de insulina", en: "Excess insulin"}
          - {pt: "Falta de cálcio", en: "Calcium deficiency"}
          - {pt: "Excesso de água", en: "Excess water"}
        correctAnswer: {pt: "Falta de insulina (células-beta destruídas)", en: "Insulin deficiency (beta cells destroyed)"}
        rationale: {pt: "Como o sistema imune ataca as células-beta, então o pâncreas para de produzir insulina e a glicose acumula.", en: "Because the immune system attacks beta cells, the pancreas stops producing insulin and glucose accumulates."}
        objectives: [biology.endocrine]
        difficulty: 2
      - type: choice
        question: {pt: "Tireoide produz:", en: "The thyroid produces:"}
        choices:
          - {pt: "Tiroxina (regula metabolismo)", en: "Thyroxine (regulates metabolism)"}
          - {pt: "Insulina", en: "Insulin"}
          - {pt: "Adrenalina", en: "Adrenaline"}
          - {pt: "Estrogênio", en: "Estrogen"}
        correctAnswer: {pt: "Tiroxina (regula metabolismo)", en: "Thyroxine (regulates metabolism)"}
        rationale: {pt: "Como tiroxina acelera reações celulares, então influencia frequência cardíaca, temperatura e energia.", en: "Because thyroxine speeds cellular reactions, it influences heart rate, temperature, and energy."}
        objectives: [biology.endocrine]
        difficulty: 2
      - type: choice
        question: {pt: "Adrenalina é liberada pelas:", en: "Adrenaline is released by the:"}
        choices:
          - {pt: "Glândulas suprarrenais", en: "Adrenal glands"}
          - {pt: "Tireoide", en: "Thyroid"}
          - {pt: "Pâncreas", en: "Pancreas"}
          - {pt: "Hipófise", en: "Pituitary"}
        correctAnswer: {pt: "Glândulas suprarrenais", en: "Adrenal glands"}
        rationale: {pt: "Quando há perigo, então o cérebro sinaliza às suprarrenais e adrenalina prepara o corpo para luta-ou-fuga.", en: "When danger arises, the brain signals the adrenals and adrenaline prepares the body for fight-or-flight."}
        objectives: [biology.endocrine]
        difficulty: 2
      - type: choice
        question: {pt: "Hormônio do crescimento é liberado pela:", en: "Growth hormone is released by the:"}
        choices:
          - {pt: "Hipófise", en: "Pituitary"}
          - {pt: "Tireoide", en: "Thyroid"}
          - {pt: "Pâncreas", en: "Pancreas"}
          - {pt: "Coração", en: "Heart"}
        correctAnswer: {pt: "Hipófise", en: "Pituitary"}
        rationale: {pt: "Como a hipófise é a \"glândula mestra\", então comanda crescimento e outras glândulas via hormônios.", en: "Because the pituitary is the \"master gland\", it commands growth and other glands via hormones."}
        objectives: [biology.endocrine]
        difficulty: 2
      - type: choice
        question: {pt: "Estrogênio e testosterona são produzidos principalmente em:", en: "Estrogen and testosterone are mainly produced in:"}
        choices:
          - {pt: "Ovários e testículos", en: "Ovaries and testes"}
          - {pt: "Pâncreas", en: "Pancreas"}
          - {pt: "Pulmão", en: "Lungs"}
          - {pt: "Pele", en: "Skin"}
        correctAnswer: {pt: "Ovários e testículos", en: "Ovaries and testes"}
        rationale: {pt: "Como hormônios sexuais regulam características sexuais, então gônadas são suas fontes principais.", en: "Because sex hormones regulate sexual features, the gonads are their main sources."}
        objectives: [biology.endocrine]
        difficulty: 2
      - type: choice
        question: {pt: "A diferença entre sistema nervoso e endócrino é:", en: "The difference between nervous and endocrine systems is:"}
        choices:
          - {pt: "Nervoso é rápido e local; endócrino é lento e global", en: "Nervous is fast and local; endocrine is slow and global"}
          - {pt: "São idênticos", en: "Identical"}
          - {pt: "Endócrino é mais rápido", en: "Endocrine is faster"}
          - {pt: "Não há diferença", en: "No difference"}
        correctAnswer: {pt: "Nervoso é rápido e local; endócrino é lento e global", en: "Nervous is fast and local; endocrine is slow and global"}
        rationale: {pt: "Como sinais nervosos viajam em milissegundos via axônios, então a comunicação é localizada e veloz; hormônios duram minutos a horas.", en: "Because nerve signals travel in milliseconds via axons, the communication is local and fast; hormones last minutes to hours."}
        objectives: [biology.endocrine]
        difficulty: 2
      - type: choice
        question: {pt: "Hormônios atuam em células que possuem:", en: "Hormones act on cells that have:"}
        choices:
          - {pt: "Receptores específicos para aquele hormônio", en: "Specific receptors for that hormone"}
          - {pt: "Cabelo", en: "Hair"}
          - {pt: "Cor azul", en: "Blue color"}
          - {pt: "Forma redonda", en: "Round shape"}
        correctAnswer: {pt: "Receptores específicos para aquele hormônio", en: "Specific receptors for that hormone"}
        rationale: {pt: "Como receptores são chave-e-fechadura, então só células-alvo respondem ao hormônio circulante.", en: "Because receptors are lock-and-key, only target cells respond to the circulating hormone."}
        objectives: [biology.endocrine]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Regulação e equilíbrio", en: "Regulation and balance"}
    description: {pt: "Como hormônios mantêm homeostase.", en: "How hormones maintain homeostasis."}
    exercises:
      - type: choice
        question: {pt: "Glucagon faz o oposto da insulina, ou seja:", en: "Glucagon does the opposite of insulin, that is:"}
        choices:
          - {pt: "Libera glicose do fígado quando glicemia está baixa", en: "Releases glucose from liver when glycemia is low"}
          - {pt: "Reduz glicose", en: "Lowers glucose"}
          - {pt: "Aumenta sódio", en: "Raises sodium"}
          - {pt: "Bombea sangue", en: "Pumps blood"}
        correctAnswer: {pt: "Libera glicose do fígado quando glicemia está baixa", en: "Releases glucose from liver when glycemia is low"}
        rationale: {pt: "Como células-alfa detectam glicose baixa, então liberam glucagon, que mobiliza glicogênio hepático em glicose.", en: "Because alpha cells detect low glucose, they release glucagon, which mobilizes hepatic glycogen to glucose."}
        objectives: [biology.endocrine]
        difficulty: 2
      - type: choice
        question: {pt: "Cortisol é um hormônio do(a):", en: "Cortisol is a hormone of:"}
        choices:
          - {pt: "Estresse (suprarrenal)", en: "Stress (adrenal)"}
          - {pt: "Crescimento", en: "Growth"}
          - {pt: "Reprodução", en: "Reproduction"}
          - {pt: "Audição", en: "Hearing"}
        correctAnswer: {pt: "Estresse (suprarrenal)", en: "Stress (adrenal)"}
        rationale: {pt: "Como cortisol mobiliza energia, então é liberado em estresse prolongado para sustentar a resposta.", en: "Because cortisol mobilizes energy, it's released in prolonged stress to sustain the response."}
        objectives: [biology.endocrine]
        difficulty: 2
      - type: choice
        question: {pt: "Melatonina regula:", en: "Melatonin regulates:"}
        choices:
          - {pt: "Ciclo do sono (relógio biológico)", en: "Sleep cycle (biological clock)"}
          - {pt: "Crescimento", en: "Growth"}
          - {pt: "Gestação", en: "Pregnancy"}
          - {pt: "Pressão arterial direta", en: "Direct blood pressure"}
        correctAnswer: {pt: "Ciclo do sono (relógio biológico)", en: "Sleep cycle (biological clock)"}
        rationale: {pt: "Quando escurece, então a glândula pineal libera melatonina e induz sono — luz forte inibe.", en: "When it gets dark, the pineal gland releases melatonin and induces sleep — bright light inhibits it."}
        objectives: [biology.endocrine]
        difficulty: 2
      - type: choice
        question: {pt: "Por que diabéticos tipo 1 tomam insulina injetável?", en: "Why do type 1 diabetics take injected insulin?"}
        choices:
          - {pt: "Porque o pâncreas não produz; insulina oral seria digerida", en: "Because the pancreas doesn't make it; oral insulin would be digested"}
          - {pt: "Porque é divertido", en: "Because it's fun"}
          - {pt: "Sem motivo", en: "No reason"}
          - {pt: "Para crescer mais", en: "To grow more"}
        correctAnswer: {pt: "Porque o pâncreas não produz; insulina oral seria digerida", en: "Because the pancreas doesn't make it; oral insulin would be digested"}
        rationale: {pt: "Como insulina é proteína, quando ingerida, então enzimas digestivas a destroem antes de agir — daí a injeção.", en: "Because insulin is a protein, when ingested, digestive enzymes destroy it before action — hence injection."}
        objectives: [biology.endocrine]
        difficulty: 2
      - type: choice
        question: {pt: "Tireoide pouco ativa (hipotireoidismo) causa:", en: "Underactive thyroid (hypothyroidism) causes:"}
        choices:
          - {pt: "Cansaço, ganho de peso, frio", en: "Fatigue, weight gain, feeling cold"}
          - {pt: "Energia extra", en: "Extra energy"}
          - {pt: "Crescimento de altura", en: "Height growth"}
          - {pt: "Sede demais", en: "Too much thirst"}
        correctAnswer: {pt: "Cansaço, ganho de peso, frio", en: "Fatigue, weight gain, feeling cold"}
        rationale: {pt: "Como tiroxina acelera metabolismo, quando ela falta, então tudo fica mais lento.", en: "Because thyroxine speeds metabolism, when it's low, everything slows."}
        objectives: [biology.endocrine]
        difficulty: 2
      - type: choice
        question: {pt: "Sistema endócrino comunica-se com sistema nervoso via:", en: "Endocrine system communicates with nervous system via:"}
        choices:
          - {pt: "Hipotálamo (e hipófise)", en: "Hypothalamus (and pituitary)"}
          - {pt: "Estômago", en: "Stomach"}
          - {pt: "Pulmão", en: "Lungs"}
          - {pt: "Pele", en: "Skin"}
        correctAnswer: {pt: "Hipotálamo (e hipófise)", en: "Hypothalamus (and pituitary)"}
        rationale: {pt: "Como o hipotálamo recebe sinais do cérebro e regula a hipófise, então integra resposta nervosa e endócrina.", en: "Because the hypothalamus receives brain signals and regulates the pituitary, it integrates nervous and endocrine responses."}
        objectives: [biology.endocrine]
        difficulty: 2
      - type: choice
        question: {pt: "Por que não engordamos imediatamente ao comer um doce?", en: "Why don't we gain weight immediately after eating sweets?"}
        choices:
          - {pt: "Insulina envia o açúcar às células antes de virar gordura excessiva", en: "Insulin sends sugar to cells before excess turns to fat"}
          - {pt: "Cor da comida", en: "Food color"}
          - {pt: "Sem motivo", en: "No reason"}
          - {pt: "Apenas mágica", en: "Just magic"}
        correctAnswer: {pt: "Insulina envia o açúcar às células antes de virar gordura excessiva", en: "Insulin sends sugar to cells before excess turns to fat"}
        rationale: {pt: "Como hormônios regulam o uso da energia, então ganho de peso depende do balanço calórico ao longo do tempo.", en: "Because hormones regulate energy use, weight gain depends on caloric balance over time."}
        objectives: [biology.endocrine]
        difficulty: 2
      - type: choice
        question: {pt: "Hormônios são geralmente:", en: "Hormones are generally:"}
        choices:
          - {pt: "Lipídios (esteroides) ou proteínas/peptídeos", en: "Lipids (steroids) or proteins/peptides"}
          - {pt: "Apenas DNA", en: "Only DNA"}
          - {pt: "Apenas água", en: "Only water"}
          - {pt: "Apenas sal", en: "Only salt"}
        correctAnswer: {pt: "Lipídios (esteroides) ou proteínas/peptídeos", en: "Lipids (steroids) or proteins/peptides"}
        rationale: {pt: "Como esteroides atravessam membranas e proteicos não, então o local do receptor difere — citoplasmático vs membrana.", en: "Because steroids cross membranes and protein hormones don't, receptor location differs — cytoplasmic vs membrane."}
        objectives: [biology.endocrine]
        difficulty: 2
      - type: choice
        question: {pt: "Feedback negativo significa:", en: "Negative feedback means:"}
        choices:
          - {pt: "O efeito de um hormônio inibe sua própria liberação", en: "A hormone's effect inhibits its own release"}
          - {pt: "O hormônio não faz nada", en: "The hormone does nothing"}
          - {pt: "É sempre ruim", en: "It's always bad"}
          - {pt: "Acelera tudo", en: "Speeds everything"}
        correctAnswer: {pt: "O efeito de um hormônio inibe sua própria liberação", en: "A hormone's effect inhibits its own release"}
        rationale: {pt: "Como o sistema busca equilíbrio, quando o efeito é alcançado, então o hormônio cai — é a regra da homeostase.", en: "Because the system seeks balance, when the effect is reached, the hormone drops — the homeostasis rule."}
        objectives: [biology.endocrine]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: o sistema endócrino:", en: "Summary: the endocrine system:"}
        choices:
          - {pt: "Regula homeostase de longo prazo via hormônios", en: "Regulates long-term homeostasis via hormones"}
          - {pt: "Apenas digere comida", en: "Only digests food"}
          - {pt: "Apenas bombea sangue", en: "Only pumps blood"}
          - {pt: "Apenas filtra urina", en: "Only filters urine"}
        correctAnswer: {pt: "Regula homeostase de longo prazo via hormônios", en: "Regulates long-term homeostasis via hormones"}
        rationale: {pt: "Hormônios coordenam crescimento, metabolismo, reprodução e resposta ao estresse — então mantêm o equilíbrio integral.", en: "Hormones coordinate growth, metabolism, reproduction, and stress response — maintaining overall balance."}
        objectives: [biology.endocrine]
        difficulty: 2
target: 20
