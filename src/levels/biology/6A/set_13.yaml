title:
  pt: "🧬 Sistema reprodutor"
  en: "🧬 Reproductive system"
level: '6A'
subject: biology
objectives: [biology.reproductive]
difficulty: 2
authorNotes: "Visão geral apropriada para 6A: gametas, fertilização, gestação."
example:
  pt: "Ex.: testículos → espermatozoides; ovários → óvulos; fertilização → zigoto → embrião → feto → bebê."
  en: "Ex.: testes → sperm; ovaries → eggs; fertilization → zygote → embryo → fetus → baby."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
  - pageNumber: 1
    title: {pt: "Anatomia básica", en: "Basic anatomy"}
    description: {pt: "Onde gametas são produzidos.", en: "Where gametes are made."}
    exercises:
      - type: choice
        question: {pt: "Espermatozoides são produzidos nos:", en: "Sperm cells are produced in the:"}
        choices:
          - {pt: "Testículos", en: "Testes"}
          - {pt: "Ovários", en: "Ovaries"}
          - {pt: "Útero", en: "Uterus"}
          - {pt: "Fígado", en: "Liver"}
        correctAnswer: {pt: "Testículos", en: "Testes"}
        rationale: {pt: "Como meiose ocorre nos túbulos seminíferos, então testículos produzem gametas masculinos continuamente após a puberdade.", en: "Because meiosis occurs in seminiferous tubules, testes produce male gametes continuously after puberty."}
        objectives: [biology.reproductive]
        difficulty: 2
      - type: choice
        question: {pt: "Óvulos são produzidos nos:", en: "Egg cells are produced in the:"}
        choices:
          - {pt: "Ovários", en: "Ovaries"}
          - {pt: "Testículos", en: "Testes"}
          - {pt: "Fígado", en: "Liver"}
          - {pt: "Coração", en: "Heart"}
        correctAnswer: {pt: "Ovários", en: "Ovaries"}
        rationale: {pt: "Quando a mulher nasce, primeiro já tem todos os ovócitos primários, então a maturação ocorre mês a mês.", en: "When a woman is born, she already has all primary oocytes, then maturation happens month by month."}
        objectives: [biology.reproductive]
        difficulty: 2
      - type: choice
        question: {pt: "Onde o feto se desenvolve?", en: "Where does the fetus develop?"}
        choices:
          - {pt: "Útero", en: "Uterus"}
          - {pt: "Estômago", en: "Stomach"}
          - {pt: "Pulmão", en: "Lung"}
          - {pt: "Bexiga", en: "Bladder"}
        correctAnswer: {pt: "Útero", en: "Uterus"}
        rationale: {pt: "Como o útero tem parede muscular elástica, então cresce conforme o feto e o protege durante a gestação.", en: "Because the uterus has elastic muscular walls, it grows with the fetus and protects it during pregnancy."}
        objectives: [biology.reproductive]
        difficulty: 2
      - type: choice
        question: {pt: "Fertilização é o encontro de:", en: "Fertilization is the meeting of:"}
        choices:
          - {pt: "Espermatozoide e óvulo", en: "Sperm and egg"}
          - {pt: "Duas hemácias", en: "Two red cells"}
          - {pt: "Dois neurônios", en: "Two neurons"}
          - {pt: "Duas plaquetas", en: "Two platelets"}
        correctAnswer: {pt: "Espermatozoide e óvulo", en: "Sperm and egg"}
        rationale: {pt: "Quando se fundem, primeiro os DNAs combinam-se, então o zigoto começa a se dividir por mitose.", en: "When they fuse, DNAs combine first, then the zygote starts dividing by mitosis."}
        objectives: [biology.reproductive]
        difficulty: 2
      - type: choice
        question: {pt: "O zigoto resulta de:", en: "The zygote results from:"}
        choices:
          - {pt: "Fertilização (uma só célula com DNA dos pais)", en: "Fertilization (a single cell with DNA from both parents)"}
          - {pt: "Mitose simples", en: "Simple mitosis"}
          - {pt: "Fotossíntese", en: "Photosynthesis"}
          - {pt: "Digestão", en: "Digestion"}
        correctAnswer: {pt: "Fertilização (uma só célula com DNA dos pais)", en: "Fertilization (a single cell with DNA from both parents)"}
        rationale: {pt: "Como cada gameta é haploide, então a soma forma um diploide com 46 cromossomos.", en: "Because each gamete is haploid, their fusion forms a diploid with 46 chromosomes."}
        objectives: [biology.reproductive]
        difficulty: 2
      - type: choice
        question: {pt: "A gestação humana dura aproximadamente:", en: "Human pregnancy lasts approximately:"}
        choices:
          - {pt: "9 meses (~40 semanas)", en: "9 months (~40 weeks)"}
          - {pt: "1 mês", en: "1 month"}
          - {pt: "2 anos", en: "2 years"}
          - {pt: "1 semana", en: "1 week"}
        correctAnswer: {pt: "9 meses (~40 semanas)", en: "9 months (~40 weeks)"}
        rationale: {pt: "Como o feto precisa tempo para desenvolver órgãos, então a gestação humana é longa relativa a outros mamíferos pequenos.", en: "Because the fetus needs time to develop organs, human gestation is long relative to small mammals."}
        objectives: [biology.reproductive]
        difficulty: 2
      - type: choice
        question: {pt: "Placenta serve para:", en: "The placenta serves to:"}
        choices:
          - {pt: "Trocar nutrientes/gases entre mãe e feto", en: "Exchange nutrients/gases between mother and fetus"}
          - {pt: "Bombear sangue", en: "Pump blood"}
          - {pt: "Digerir comida", en: "Digest food"}
          - {pt: "Mover o feto", en: "Move the fetus"}
        correctAnswer: {pt: "Trocar nutrientes/gases entre mãe e feto", en: "Exchange nutrients/gases between mother and fetus"}
        rationale: {pt: "Como o feto não respira ar nem se alimenta diretamente, então a placenta entrega O₂/nutrientes e remove resíduos.", en: "Because the fetus doesn't breathe air or eat directly, the placenta delivers O₂/nutrients and removes waste."}
        objectives: [biology.reproductive]
        difficulty: 2
      - type: choice
        question: {pt: "Cordão umbilical liga:", en: "The umbilical cord connects:"}
        choices:
          - {pt: "Feto à placenta", en: "Fetus to placenta"}
          - {pt: "Útero ao estômago", en: "Uterus to stomach"}
          - {pt: "Pele ao cérebro", en: "Skin to brain"}
          - {pt: "Ovário ao pulmão", en: "Ovary to lung"}
        correctAnswer: {pt: "Feto à placenta", en: "Fetus to placenta"}
        rationale: {pt: "Como vasos do cordão transportam sangue, então oxigênio e nutrientes chegam ao feto pela placenta materna.", en: "Because cord vessels carry blood, oxygen and nutrients reach the fetus through the maternal placenta."}
        objectives: [biology.reproductive]
        difficulty: 2
      - type: choice
        question: {pt: "Gameta humano tem quantos cromossomos?", en: "How many chromosomes are in a human gamete?"}
        choices:
          - {pt: "23 (haploide)", en: "23 (haploid)"}
          - {pt: "46", en: "46"}
          - {pt: "1", en: "1"}
          - {pt: "100", en: "100"}
        correctAnswer: {pt: "23 (haploide)", en: "23 (haploid)"}
        rationale: {pt: "Como meiose reduz pela metade, então cada gameta tem metade do número diplóide.", en: "Because meiosis halves the count, each gamete has half the diploid number."}
        objectives: [biology.reproductive]
        difficulty: 2
      - type: choice
        question: {pt: "Sexo do bebê é determinado por:", en: "Baby's sex is determined by:"}
        choices:
          - {pt: "Cromossomo do espermatozoide (X ou Y)", en: "Sperm's chromosome (X or Y)"}
          - {pt: "Óvulo apenas", en: "Egg only"}
          - {pt: "Comida da mãe", en: "Mother's food"}
          - {pt: "Posição da lua", en: "Moon position"}
        correctAnswer: {pt: "Cromossomo do espermatozoide (X ou Y)", en: "Sperm's chromosome (X or Y)"}
        rationale: {pt: "Como óvulos sempre carregam X, então o espermatozoide define se a fusão dá XX (feminino) ou XY (masculino).", en: "Because eggs always carry X, the sperm determines whether fusion gives XX (female) or XY (male)."}
        objectives: [biology.reproductive]
        difficulty: 2
  - pageNumber: 2
    title: {pt: "Ciclo e desenvolvimento", en: "Cycle and development"}
    description: {pt: "Puberdade até nascimento.", en: "Puberty to birth."}
    exercises:
      - type: choice
        question: {pt: "Puberdade é desencadeada por:", en: "Puberty is triggered by:"}
        choices:
          - {pt: "Hormônios sexuais (estrogênio, testosterona)", en: "Sex hormones (estrogen, testosterone)"}
          - {pt: "Comer muito", en: "Eating a lot"}
          - {pt: "Idade exata em anos", en: "Exact age in years"}
          - {pt: "Sol direto", en: "Direct sunlight"}
        correctAnswer: {pt: "Hormônios sexuais (estrogênio, testosterona)", en: "Sex hormones (estrogen, testosterone)"}
        rationale: {pt: "Quando o hipotálamo amadurece, primeiro libera GnRH, então hipófise estimula gônadas — começa a puberdade.", en: "When the hypothalamus matures, it releases GnRH first, then the pituitary stimulates gonads — puberty begins."}
        objectives: [biology.reproductive]
        difficulty: 2
      - type: choice
        question: {pt: "Ciclo menstrual dura aproximadamente:", en: "The menstrual cycle lasts approximately:"}
        choices:
          - {pt: "28 dias (varia)", en: "28 days (varies)"}
          - {pt: "1 dia", en: "1 day"}
          - {pt: "1 ano", en: "1 year"}
          - {pt: "100 dias", en: "100 days"}
        correctAnswer: {pt: "28 dias (varia)", en: "28 days (varies)"}
        rationale: {pt: "Como hormônios oscilam ciclicamente, então o útero alterna entre preparação e descamação ~mensalmente.", en: "Because hormones oscillate cyclically, the uterus alternates between preparation and shedding ~monthly."}
        objectives: [biology.reproductive]
        difficulty: 2
      - type: choice
        question: {pt: "Ovulação é a liberação do:", en: "Ovulation is the release of:"}
        choices:
          - {pt: "Óvulo do ovário", en: "Egg from the ovary"}
          - {pt: "Espermatozoide", en: "Sperm"}
          - {pt: "Hormônio do crescimento", en: "Growth hormone"}
          - {pt: "Leite materno", en: "Breast milk"}
        correctAnswer: {pt: "Óvulo do ovário", en: "Egg from the ovary"}
        rationale: {pt: "Quando LH atinge pico, então o folículo se rompe e o óvulo entra na trompa para possível fertilização.", en: "When LH peaks, the follicle ruptures and the egg enters the tube for potential fertilization."}
        objectives: [biology.reproductive]
        difficulty: 2
      - type: choice
        question: {pt: "Se o óvulo não é fertilizado, o que acontece?", en: "If the egg isn't fertilized, what happens?"}
        choices:
          - {pt: "Endométrio descama (menstruação)", en: "Endometrium sheds (menstruation)"}
          - {pt: "Cresce mais", en: "Grows more"}
          - {pt: "Vira espermatozoide", en: "Becomes sperm"}
          - {pt: "Sai como urina", en: "Leaves as urine"}
        correctAnswer: {pt: "Endométrio descama (menstruação)", en: "Endometrium sheds (menstruation)"}
        rationale: {pt: "Como hormônios caem sem gestação, então a parede uterina preparada se desfaz e elimina via menstruação.", en: "Because hormones drop without pregnancy, the prepared uterine wall breaks down and is shed as menses."}
        objectives: [biology.reproductive]
        difficulty: 2
      - type: choice
        question: {pt: "Embrião é o estágio antes do(a):", en: "An embryo is the stage before:"}
        choices:
          - {pt: "Feto (depois de ~8 semanas)", en: "Fetus (after ~8 weeks)"}
          - {pt: "Espermatozoide", en: "Sperm"}
          - {pt: "Óvulo", en: "Egg"}
          - {pt: "Adulto direto", en: "Adult directly"}
        correctAnswer: {pt: "Feto (depois de ~8 semanas)", en: "Fetus (after ~8 weeks)"}
        rationale: {pt: "Quando órgãos básicos se formam, então passamos a chamar de feto — antes disso é embrião.", en: "When basic organs form, we call it a fetus — before that, embryo."}
        objectives: [biology.reproductive]
        difficulty: 2
      - type: choice
        question: {pt: "Reprodução sexuada gera variabilidade porque:", en: "Sexual reproduction generates variability because:"}
        choices:
          - {pt: "Combina genes de dois pais (recombinação na meiose)", en: "Combines genes from two parents (meiotic recombination)"}
          - {pt: "Cópia exata do pai", en: "Exact copy of the father"}
          - {pt: "Cópia exata da mãe", en: "Exact copy of the mother"}
          - {pt: "Cresce mais rápido", en: "Grows faster"}
        correctAnswer: {pt: "Combina genes de dois pais (recombinação na meiose)", en: "Combines genes from two parents (meiotic recombination)"}
        rationale: {pt: "Como meiose embaralha alelos e fertilização junta dois conjuntos, então cada filho é único.", en: "Because meiosis shuffles alleles and fertilization joins two sets, each offspring is unique."}
        objectives: [biology.reproductive]
        difficulty: 2
      - type: choice
        question: {pt: "Gêmeos idênticos vêm de:", en: "Identical twins come from:"}
        choices:
          - {pt: "Um zigoto que se divide em dois", en: "One zygote that splits in two"}
          - {pt: "Dois óvulos diferentes", en: "Two different eggs"}
          - {pt: "Cópia genética artificial", en: "Artificial genetic copy"}
          - {pt: "Adoção", en: "Adoption"}
        correctAnswer: {pt: "Um zigoto que se divide em dois", en: "One zygote that splits in two"}
        rationale: {pt: "Quando o zigoto se divide cedo, primeiro forma dois embriões, então ambos têm o mesmo DNA.", en: "When the zygote splits early, it first forms two embryos, then both have the same DNA."}
        objectives: [biology.reproductive]
        difficulty: 2
      - type: choice
        question: {pt: "Gêmeos fraternos vêm de:", en: "Fraternal twins come from:"}
        choices:
          - {pt: "Dois óvulos fertilizados por dois espermatozoides", en: "Two eggs fertilized by two sperm"}
          - {pt: "Um zigoto dividido", en: "One split zygote"}
          - {pt: "Mitose", en: "Mitosis"}
          - {pt: "Clonagem", en: "Cloning"}
        correctAnswer: {pt: "Dois óvulos fertilizados por dois espermatozoides", en: "Two eggs fertilized by two sperm"}
        rationale: {pt: "Como vêm de fertilizações distintas, então têm DNA diferente — como irmãos comuns nascidos juntos.", en: "Because they come from distinct fertilizations, they have different DNA — like ordinary siblings born together."}
        objectives: [biology.reproductive]
        difficulty: 2
      - type: choice
        question: {pt: "Métodos contraceptivos servem para:", en: "Contraceptive methods serve to:"}
        choices:
          - {pt: "Prevenir gravidez", en: "Prevent pregnancy"}
          - {pt: "Aumentar fertilidade", en: "Increase fertility"}
          - {pt: "Curar doenças", en: "Cure diseases"}
          - {pt: "Fazer crescer", en: "To grow"}
        correctAnswer: {pt: "Prevenir gravidez", en: "Prevent pregnancy"}
        rationale: {pt: "Como métodos atuam em diferentes etapas (gameta, fertilização, implantação), então previnem o início da gestação.", en: "Because methods act at different stages (gamete, fertilization, implantation), they prevent pregnancy onset."}
        objectives: [biology.reproductive]
        difficulty: 2
      - type: choice
        question: {pt: "Resumo: o sistema reprodutor:", en: "Summary: the reproductive system:"}
        choices:
          - {pt: "Produz gametas e permite gerar descendentes", en: "Produces gametes and allows producing offspring"}
          - {pt: "Apenas digere", en: "Only digests"}
          - {pt: "Apenas filtra urina", en: "Only filters urine"}
          - {pt: "Apenas trocas gases", en: "Only exchanges gases"}
        correctAnswer: {pt: "Produz gametas e permite gerar descendentes", en: "Produces gametes and allows producing offspring"}
        rationale: {pt: "Sem reprodução, espécies se extinguiriam — então é a função única que continua a vida.", en: "Without reproduction, species would go extinct — it's the unique function that continues life."}
        objectives: [biology.reproductive]
        difficulty: 2
target: 20
