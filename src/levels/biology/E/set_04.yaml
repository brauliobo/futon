title:
  pt: "🤒 Long COVID e síndromes pós-agudas"
  en: "🤒 Long COVID and post-acute syndromes"
level: 'E'
subject: biology
objectives: [biology.long_covid]
difficulty: 5
authorNotes: "Persistência viral, autoimunidade, disfunção mitocondrial, microclots, dysautonomia."
example:
  pt: "Ex.: infecção aguda → reservatório → disfunção mitocondrial + autoimunidade → sintomas crônicos."
  en: "Ex.: acute infection → reservoir → mitochondrial dysfunction + autoimmunity → chronic symptoms."
passCriteria:
  minAccuracyPercent: 85
  maxAvgSecondsPerExercise: 14
pages:
