level: 'E'
subject: biology
objectives: [biology.rare_disease]
difficulty: 5
authorNotes: "Diagnóstico WES/WGS, n=1, terapias gênicas personalizadas, ASOs."
example:
  pt: "Ex.: criança com fenótipo único → trio WGS → variante candidata → função → terapia n=1."
  en: "Ex.: child with unique phenotype → trio WGS → candidate variant → function → n=1 therapy."
